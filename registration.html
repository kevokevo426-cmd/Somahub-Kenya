<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account - SomaHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),createUserWithEmailAndPassword,updateProfile,doc,runTransaction,serverTimestamp};
</script>
</head>
<body class="bg-[#f6f7f9] flex justify-center p-4">
<div class="w-full max-w-[400px] mt-6">
<div class="flex justify-between"><p class="font-black">SomaHub</p><a href="/" class="text-xs border bg-white px-3 py-1 rounded-full">Home</a></div>

<h1 class="text-[26px] font-black mt-8">Create account</h1>
<p class="text-xs text-gray-500 mt-1">CBC / CBE • Grade 1-9 • International coming soon</p>

<div class="flex gap-2 mt-5">
<button id="bS" onclick="role='student';render()" class="flex-1 bg-black text-white rounded-full py-3 text-xs font-bold">Student</button>
<button id="bP" onclick="role='parent';render()" class="flex-1 bg-white border rounded-full py-3 text-xs font-bold">Parent</button>
<button id="bT" onclick="role='teacher';render()" class="flex-1 bg-white border rounded-full py-3 text-xs font-bold">Teacher</button>
</div>

<div class="bg-white rounded-2xl p-5 mt-4 border">
<div class="space-y-3">
<input id="name" placeholder="Full name" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">
<input id="phone" placeholder="Phone" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">
<input id="email" placeholder="Email" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">
<input id="email2" placeholder="Confirm email" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">
<input id="pass" type="password" placeholder="Password" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">
<input id="pass2" type="password" placeholder="Confirm password" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">

<div id="fs" class="space-y-3 pt-3 border-t">
<select id="grade" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none"><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option selected>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option></select>
<div class="grid grid-cols-2 gap-2"><input id="county" placeholder="County" class="bg-gray-50 rounded-xl p-3 text-sm outline-none"><input id="town" placeholder="Town" class="bg-gray-50 rounded-xl p-3 text-sm outline-none"></div>
</div>

<div id="fp" class="hidden space-y-3 pt-3 border-t">
<input id="childIndex" placeholder="Child admission number *" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none uppercase">
<p class="text-[10px] text-gray-400">Enter the number given to your child after registration.</p>
</div>

<div id="ft" class="hidden space-y-3 pt-3 border-t">
<select id="level" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none"><option>Lower Primary</option><option>Upper Primary</option><option>Junior Secondary</option></select>
<input id="school" placeholder="School" class="w-full bg-gray-50 rounded-xl p-3 text-sm outline-none">
</div>

<button id="btn" onclick="reg()" class="w-full bg-black text-white py-3.5 rounded-full font-bold text-sm mt-2">Create account</button>
<p id="msg" class="text-xs text-center text-gray-500 mt-2"></p>
</div>
</div>
<p class="text-[10px] text-center text-gray-400 mt-4">After registration you'll get your admission number and full details inside.</p>
</div>

<script>
let role='student';
function render(){
 bS.className=role==='student'?'flex-1 bg-black text-white rounded-full py-3 text-xs font-bold':'flex-1 bg-white border rounded-full py-3 text-xs font-bold';
 bP.className=role==='parent'?'flex-1 bg-black text-white rounded-full py-3 text-xs font-bold':'flex-1 bg-white border rounded-full py-3 text-xs font-bold';
 bT.className=role==='teacher'?'flex-1 bg-black text-white rounded-full py-3 text-xs font-bold':'flex-1 bg-white border rounded-full py-3 text-xs font-bold';
 fs.classList.toggle('hidden',role!=='student'); fp.classList.toggle('hidden',role!=='parent'); ft.classList.toggle('hidden',role!=='teacher');
}
async function reg(){
 const FB=window.FB, m=msg, b=btn;
 const name=document.getElementById('name').value.trim(), phone=document.getElementById('phone').value.trim();
 const email=document.getElementById('email').value.trim(), email2=document.getElementById('email2').value.trim();
 const pass=document.getElementById('pass').value.trim(), pass2=document.getElementById('pass2').value.trim();
 if(!name||!email||!pass) return m.innerText="Fill required fields";
 if(email!==email2) return m.innerText="Emails don't match";
 if(pass!==pass2) return m.innerText="Passwords don't match";
 let ex={}, pre="SHKE", ctr="students", col="student_index", from=500;
 if(role==='parent'){ const c=childIndex.value.trim().toUpperCase(); if(!c) return m.innerText="Child admission number required"; ex={childIndex:c}; pre="SHKEP"; ctr="parents"; col="parent_index"; from=100; }
 else if(role==='teacher'){ ex={level:level.value,school:school.value.trim()}; pre="SHKET"; ctr="teachers"; col="teacher_index"; from=100; }
 else{ ex={grade:grade.value,county:county.value.trim(),town:town.value.trim()}; }
 b.innerText="Creating..."; b.disabled=true;
 try{
  const cr=await FB.createUserWithEmailAndPassword(FB.auth,email,pass);
  await FB.updateProfile(cr.user,{displayName:name});
  let finalId=pre+String(from).padStart(5,'0');
  await FB.runTransaction(FB.db, async(t)=>{
   const r=FB.doc(FB.db,"counters",ctr); const s=await t.get(r); let n=from; if(s.exists()) n=s.data().count||from;
   finalId=pre+String(n).padStart(5,'0'); t.set(r,{count:n+1},{merge:true});
   t.set(FB.doc(FB.db,"users",cr.user.uid),{uid:cr.user.uid,email,name,phone,role:role==='student'?'learner':role,indexNumber:finalId,...ex,createdAt:FB.serverTimestamp()});
   t.set(FB.doc(FB.db,col,finalId),{indexNumber:finalId,userId:cr.user.uid,email,name,...ex,createdAt:FB.serverTimestamp()});
  });
  m.innerText="Done. Redirecting..."; setTimeout(()=>location.href="/dashboard.html",900);
 }catch(e){ m.innerText=e.message; b.innerText="Create account"; b.disabled=false; }
}
window.render=render; window.reg=reg; render();
</script>
</body>
</html>
