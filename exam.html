const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),doc,getDoc,collection,getDocs,query,where,onAuthStateChanged};

<body class="flex justify-center"><div class="w-full max-w-[460px] bg-[#f6f6f7] min-h-screen pb-10">
<div class="h-2 flex"><div class="flex-1 bg-[#ff8a2a]"></div><div class="flex-1 bg-[#2ac5a0]"></div><div class="flex-1 bg-[#4a86ff]"></div><div class="flex-1 bg-[#ffcc1a]"></div></div>
<div class="bg-white border-b-2 border-black p-3 flex justify-between items-center sticky top-0 z-40">
<a href="student.html" class="bg-black text-white px-4 py-2 rounded-full font-black text-[11px]">← Back</a>

<span id="indexB" class="bg-blue-600 text-white px-2 py-1 rounded-full text-[9px] font-black">SHKE...</span>
</div>
<div class="p-3 space-y-3">
<div class="bg-black text-white rounded-[1.3rem] p-4 border-2 border-black">
<p class="font-black text-[15px]">Weekly Exam - Sat & Sun ONLY • 100 Marks + Colored Diagrams</p>
<p class="text-[10px] mt-2 leading-5 opacity-80">✅ Sat 00:00 → Sun 23:59 • Sec A 20 + B 30 + C 50 • 60 min • 🌸 Flower parts • 🗺️ Map work • Type OR 📷 Photo • Correction + Twist next week</p>

<select id="subSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>All Subjects</option><option>Mathematics</option><option>English</option><option>Kiswahili</option><option>Science</option><option>SST</option><option>CRE</option><option>ICT & Coding</option><option>Foreign Language - French</option><option>Foreign Language - German</option><option>Foreign Language - Chinese</option></select>

<div class="mt-2 flex gap-2"><button onclick="document.getElementById('photoInput').click()" class="bg-[#ffcc1a] border-2 border-black rounded-full px-3 py-2 font-black text-[9px]">📷 Photo Written Exam</button><button onclick="generateAIExam()" class="bg-black text-white border-2 border-black rounded-full px-3 py-2 font-black text-[9px]">🤖 AI 100 Marks + Diagrams</button></div>
<input type="file" id="photoInput" accept="image/*" hidden><img id="photoPreview" class="hidden mt-3 w-full rounded-xl border-2 border-black"><p id="photoStatus" class="hidden text-[10px] font-bold mt-2 text-center"></p>

<div id="onlineModal" class="hidden fixed inset-0 bg-black/80 z-[100] p-3 overflow-auto"><div class="bg-white rounded-[1.5rem] max-w-[460px] mx-auto mt-2 border-2 border-black overflow-hidden"><div class="bg-black text-white p-3 flex justify-between"><p class="font-black text-[12px]">Exam 100 Marks - Sat-Sun</p><span id="timer" class="bg-red-600 px-3 py-1 rounded-full text-[11px] font-black">60:00</span></div><div id="onlineQs" class="p-3 space-y-3 max-h-[70vh] overflow-auto"></div><div class="p-3"><button onclick="submitOnline()" class="w-full bg-green-600 text-white py-3 rounded-full font-black text-[11px] border-2 border-black">✅ Submit</button><button onclick="document.getElementById('onlineModal').classList.add('hidden')" class="w-full mt-2 bg-[#f6f6f7] border-2 border-black py-2 rounded-full text-[10px] font-black">Close</button></div></div></div>
<script>
let currentUser=null,currentSHKE="SHKE",timerInt=null,timeLeft=3600;
let currentQs=[], currentWrong=[], wrongBank=JSON.parse(localStorage.getItem('soma_wrong_exam')||'[]');
function getDiagramHTML(q){
 let l=(q||"").toLowerCase();
 if(l.includes('flower')||l.includes('petal')||l.includes('stamen')||l.includes('sepal')){
  return `<div class="bg-[#fff0f5] border-2 border-black rounded-xl p-2 mt-2"><p class="font-black text-[9px] text-center">🌸 Parts of a Flower - Colored</p><svg viewBox="0 0 200 150" class="w-full h-28"><ellipse cx="100" cy="80" rx="50" ry="35" fill="#ffcc1a" stroke="black" stroke-width="2"/><ellipse cx="100" cy="80" rx="20" ry="15" fill="#ff8a2a" stroke="black" stroke-width="1.5"/><ellipse cx="100" cy="40" rx="12" ry="25" fill="#ff4d9e" stroke="black" stroke-width="1.5"/><ellipse cx="140" cy="70" rx="25" ry="12" fill="#ff4d9e" stroke="black" stroke-width="1.5"/><ellipse cx="60" cy="70" rx="25" ry="12" fill="#ff4d9e" stroke="black" stroke-width="1.5"/><line x1="100" y1="115" x2="100" y2="145" stroke="#2ac5a0" stroke-width="4"/></svg></div>`;
 }
 if(l.includes('map')||l.includes('kenya')||l.includes('compass')||l.includes('continen')||l.includes('rift valley')){
  return `<div class="bg-[#e0f2ff] border-2 border-black rounded-xl p-2 mt-2"><p class="font-black text-[9px] text-center">🗺️ Map Work - Colored</p><svg viewBox="0 0 200 150" class="w-full h-28"><rect x="60" y="20" width="80" height="90" fill="#a3d977" stroke="black" stroke-width="2" rx="10"/><circle cx="100" cy="50" r="6" fill="red" stroke="black" stroke-width="1"/><path d="M70 100 Q100 120 130 100" fill="#4a86ff" stroke="black" stroke-width="1"/><text x="108" y="52" font-size="7" font-weight="900">Nairobi</text></svg></div>`;
 }
 if(l.includes('water cycle')||l.includes('evaporation')){ return `<div class="bg-[#e0f7ff] border-2 border-black rounded-xl p-2 mt-2"><p class="font-black text-[9px] text-center">💧 Water Cycle</p><svg viewBox="0 0 200 100" class="w-full h-20"><ellipse cx="40" cy="20" rx="30" ry="12" fill="white" stroke="black" stroke-width="1"/><rect x="10" y="70" width="180" height="20" fill="#4a86ff" stroke="black" stroke-width="1"/></svg></div>`; }
 return "";
}
function getSatSun(){let t=new Date(),d=t.getDay(),sat=new Date(t);sat.setDate(t.getDate()+(6-d));sat.setHours(0,0,0,0);let sun=new Date(sat);sun.setDate(sat.getDate()+1);sun.setHours(23,59,59,0);return{sat,sun,isIn:sat<=t&&t<=sun};}
function updInfo(){let{sat,sun,isIn}=getSatSun(),now=new Date(),diff=sun-now,h=Math.floor(diff/3600000);document.getElementById('weeklyInfo').innerHTML=`📅 ${sat.toDateString()} Sat → ${sun.toDateString()} Sun • ${isIn?`✅ OPEN NOW ${h}h left`:`⏰ Opens Saturday`} • SHKE ${currentSHKE} • Diagrams included`;}
async function loadExams(){let FB=window.FB,grade=gradeSel.value,sub=subSel.value,list=document.getElementById('examsList'),banner=document.getElementById('pendingBanner'),{sat,sun,isIn}=getSatSun(); list.innerHTML="<p class='text-center py-4 text-[11px]'>Loading...</p>"; banner.innerHTML=""; let done=false; if(currentUser){try{let q=FB.query(FB.collection(FB.db,"exam_submissions"),FB.where("userId","==",currentUser.uid));let s=await FB.getDocs(q);s.forEach(d=>{let dd=new Date(d.data().date); if(dd>=sat&&dd<=sun) done=true;});}catch(e){}} if(!isIn) banner.innerHTML=`<div class="bg-orange-100 border-2 border-black rounded-xl p-3 text-center font-black text-[11px]">⏰ Opens Saturday - Mon-Fri do Daily HW</div>`; else if(!done) banner.innerHTML=`<div class="bg-red-600 text-white border-2 border-black rounded-xl p-3 font-black text-[11px]">⚠️ PENDING WEEKLY EXAM - ${currentSHKE} - 0/100</div>`; else banner.innerHTML=`<div class="bg-green-600 text-white border-2 border-black rounded-xl p-3 text-center font-black text-[11px]">✅ DONE</div>`; try{let q; if(sub==="All Subjects") q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("type","==","Exam")); else q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("subject","==",sub),FB.where("type","==","Exam")); let snap=await FB.getDocs(q); list.innerHTML=""; if(snap.empty){list.innerHTML=`<div class="bg-white border-2 border-dashed border-black rounded-xl p-4 text-center"><p class="font-black text-[11px]">No Exam Yet for ${grade} ${sub}</p><p class="text-[9px] mt-1">Includes colored diagrams 🌸🗺️</p><button onclick="generateAIExam()" class="mt-3 bg-black text-white px-4 py-2 rounded-full text-[10px] font-black">🤖 Generate AI 100 Marks + Diagrams</button></div>`;return;} snap.forEach(d=>{let ex=d.data(); list.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-3 shadow-[2px_2px_0_0_#000]"><p class="font-black text-[12px]">${ex.subject||sub} - ${grade} ${getDiagramHTML(ex.subject||sub)!=""?'🎨':''}</p><p class="text-[9px] text-gray-500">100 Marks • Sec A B C • Diagrams included</p>${getDiagramHTML(ex.subject||'')} <button onclick="startExam('${ex.subject||sub}')" class="mt-2 w-full bg-[#4a86ff] text-white rounded-full py-2 font-black text-[10px] border-2 border-black">${isIn&&!done?'Start 100 Marks →':'View + Type/Photo'}</button></div>`;});}catch(e){list.innerHTML="<p class='text-center text-[10px] text-red-500'>Error</p>";}}
function startExam(sub){document.getElementById('workArea').classList.remove('hidden'); document.getElementById('workTitle').innerText=sub+" - 100 Marks"; window.scrollTo(0,300); generateAIExam();}
async function generateAIExam(){
 let sub=document.getElementById('subSel').value; if(sub==="All Subjects") sub="Science";
 let twist=wrongBank.length? `Twist wrong: ${wrongBank.slice(-3).map(w=>w.q).join(' | ')}` : "";
 document.getElementById('questions').innerHTML="⏳ Generating 100 Marks with colored diagrams...";
 try{
  const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:`Generate Weekly Exam 100 marks ${sub} Grade ${gradeSel.value} Kenya CBC. Sec A 10 Qs 2 marks each, Sec B 5 Qs 6 marks each, Sec C 5 Qs 10 marks each. MUST include 3 diagram Qs: 1 flower parts labeled, 1 map work Kenya, 1 water cycle or heart. ${twist}. Return ONLY JSON [{"q":"...","marks":10,"answer":"short","diagram":"flower or map or watercycle"}]`,grade:gradeSel.value, shke:currentSHKE, brainContext:"Exam Diagrams", photo:""})});
  const d=await r.json(); let txt=d.answer||"[]"; let m=txt.match(/\[[\s\S]*\]/); if(m) currentQs=JSON.parse(m[0]); else currentQs=[{q:txt,marks:100,answer:""}];
  renderExamQs();
 }catch{ document.getElementById('questions').innerHTML="Network slow - tap again"; }
}
function renderExamQs(){
 document.getElementById('questions').innerHTML = currentQs.map((c,i)=>{
  let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||''))||"";
  return `<div class="border-2 border-black rounded-xl p-3 bg-white"><p class="font-black text-[10px]">Q${i+1} (${c.marks} mks) ${c.diagram?'🎨':''}</p><p class="text-[11px] mt-1 font-bold">${c.q}</p>${diag}<input id="ans${i}" type="text" placeholder="Type answer..." class="w-full mt-2 border-2 border-black rounded-full p-2.5 text-[11px] font-bold"><p class="text-[7px] mt-1 opacity-60">OR 📷 photo above for handwritten</p></div>`;
 }).join('');
 document.getElementById('result').classList.add('hidden'); document.getElementById('corrBtn').classList.add('hidden'); document.getElementById('saveWrongBtn').classList.add('hidden');
}
function checkExam(){let score=0,total=0, wrongNow=[]; let html=`<p class="font-black text-[11px]">Result 100 Marks</p>`; currentQs.forEach((c,i)=>{let user=(document.getElementById('ans'+i)?.value||"").trim(); let m=c.marks||10; total+=m; let corr=(c.answer||"").toLowerCase(); let ok=user && (corr.includes(user.toLowerCase())||user.toLowerCase()===corr); let got=ok?m:0; score+=got; if(!ok) wrongNow.push({q:c.q, answer:c.answer, userAns:user}); html+=`<div class="border-2 border-black rounded-xl p-2 mt-2 text-[9px] font-bold ${ok?'bg-[#dcfce7]':'bg-[#ffeaea]'}">${ok?'✅':'❌'} Q${i+1}: ${got}/${m}</div>`;}); html+=`<p class="font-black mt-2 text-[14px]">Total ${score}/${total}</p>`; document.getElementById('result').innerHTML=html; document.getElementById('result').classList.remove('hidden'); document.getElementById('corrBtn').classList.remove('hidden'); document.getElementById('saveWrongBtn').classList.remove('hidden'); document.getElementById('scoreBadge').innerText=score+"/"+total; currentWrong=wrongNow;}
function showCorrection(){let html=`<p class="font-black text-[11px]">Correction with Colored Diagrams</p>`; currentQs.forEach((c,i)=>{let user=document.getElementById('ans'+i)?.value||""; let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||'')); html+=`<div class="border-2 border-black rounded-xl p-2 mt-2 bg-white text-[10px]"><b>Q${i+1}:</b> ${c.q}${diag}<br>Your: <b>${user||'empty'}</b><br><span class="text-green-700 font-black">✔ ${c.answer}</span></div>`;}); document.getElementById('result').innerHTML=html;}
function saveWrong(){if(currentWrong.length==0){alert("No wrong - perfect!"); return;} let all=JSON.parse(localStorage.getItem('soma_wrong_exam')||'[]'); all=all.concat(currentWrong); if(all.length>15) all=all.slice(-15); localStorage.setItem('soma_wrong_exam', JSON.stringify(all)); wrongBank=all; alert("Saved "+currentWrong.length+" wrong → will twist next week");}
function submitOnline(){document.getElementById('onlineModal').classList.add('hidden'); alert('Submitted! 100 Marks');}
document.getElementById('photoInput').addEventListener('change', async e=>{
 let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=async()=>{let b64=reader.result.split(',')[1]; document.getElementById('photoPreview').src=reader.result; document.getElementById('photoPreview').classList.remove('hidden'); document.getElementById('photoStatus').classList.remove('hidden'); document.getElementById('photoStatus').innerText="📷 Marking exam with diagrams..."; document.getElementById('workArea').classList.remove('hidden'); document.getElementById('questions').innerHTML="AI reading handwriting + diagrams..."; try{const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:`Mark photo handwritten weekly exam 100 marks ${subSel.value} Grade ${gradeSel.value}. Include diagram marks. Give score, corrections with diagrams, twisted versions for next week.`,grade:gradeSel.value, shke:currentSHKE, brainContext:"Exam Handwritten + Diagrams", photo:b64})}); let d=await r.json(); let ans=d.answer||"Could not read"; document.getElementById('questions').innerHTML=`<div class="border-2 border-black rounded-xl p-3 bg-white text-[10px] font-bold" style="white-space:pre-wrap">${ans}</div>`; document.getElementById('result').innerHTML=`<div class="bg-[#dcfce7] border-2 border-black rounded-xl p-3 text-[10px] font-bold" style="white-space:pre-wrap">${ans}</div>`; document.getElementById('result').classList.remove('hidden'); document.getElementById('photoStatus').innerText="✅ Marked with diagrams";}catch{ document.getElementById('photoStatus').innerText="❌ Error"; }}; reader.readAsDataURL(file);
});
setTimeout(()=>{let FB=window.FB; FB.onAuthStateChanged(FB.auth, async(u)=>{if(u){currentUser=u;let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid));if(s.exists()){currentSHKE=s.data().indexNumber||"SHKE";indexB.innerText=currentSHKE;gradeSel.value=s.data().grade||"Grade 6";}updInfo();loadExams();}});},600); setInterval(updInfo,60000); updInfo();
</script>
