function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function escForJS(v){return String(v||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g," ");}
function normalizeAnswer(v){return String(v||"").toLowerCase().trim().replace(/[.,!?;:()[\]{}]/g," ").replace(/\s+/g," ");}
function answerIsCorrect(q,user){if(!user)return false;const u=normalizeAnswer(user);if(q.options&&q.options.length)return normalizeAnswer(q.answer)===u;const acc=[q.answer,...(Array.isArray(q.acceptedAnswers)?q.acceptedAnswers:[])].filter(Boolean).map(normalizeAnswer);if(!acc.length)return false;if(acc.some(a=>a===u))return true;return acc.some(a=>(user.length>=4&&a.includes(u))||(a.length>=4&&u.includes(a)));}
function fixSpacing(t){if(!t)return"";let s=String(t);s=s.replace(/Socie\s+ty/g,"Society").replace(/\bb\s+y\b/g,"by").replace(/Develop\s+ment/g,"Development").replace(/Activi\s+ties/g,"Activities").replace(/Learn\s+ing/g,"Learning");return s;}
function isJunk(t){if(!t)return true;t=String(t).trim();if(t.length<300)return true;if(t.includes("uc?export")||t.includes("drive.google.com"))return true;return false;}
function normSubject(s){s=String(s||"").toLowerCase().trim();if(s==="agriculture and nutrition"||s==="agriculture")return"agriculture";if(s.includes("language activities"))return"language activities";if(s.includes("mathematical"))return"mathematical activities";if(s.includes("environmental"))return"environmental activities";if(s.includes("psychomotor")||s.includes("creative"))return"creative";if(s.includes("movement"))return"movement activities";if(s.includes("religious")||s==="cre"||s==="ire"||s==="hre")return"religious";if(s.includes("kiswahili"))return"kiswahili";if(s.includes("english"))return"english";if(s.includes("mathematics"))return"mathematics";if(s.includes("integrated"))return"integrated science";if(s.includes("social"))return"social";if(s.includes("pre-technical"))return"pre-technical";if(s.includes("science"))return"science";return s;}
function cleanLine(s){return String(s||"").replace(/^#{1,6}\s*/g,"").replace(/#{1,6}\s*/g,"").replace(/\*\*/g,"").trim();}
function isCoverOrBoilerplate(s){let u=cleanLine(s).toUpperCase();if(!u)return true;let bad=["KENYA INSTITUTE OF CURRICULUM","CURRICULUM DEVELOPMENT","KICD","A SKILLED AND ETHICAL SOCIETY","JUNIOR SCHOOL CURRICULUM DESIGN","PRIMARY SCHOOL CURRICULUM DESIGN","SENIOR SCHOOL CURRICULUM DESIGN","PRE-PRIMARY","NATIONAL GOALS OF EDUCATION","TABLE OF CONTENTS","FOREWORD","ACKNOWLEDGEMENT","ACKNOWLEDGMENTS","COPYRIGHT","ALL RIGHTS RESERVED","PUBLISHED BY","PRINTED BY","ISBN","KENYA NATIONAL","MINISTRY OF EDUCATION","REPUBLIC OF KENYA","VISION 2030","ESSENCE STATEMENT","GENERAL LEARNING OUTCOMES FOR","LEVEL LEARNING OUTCOMES"];if(bad.some(b=>u.includes(b)))return true;if(u.length<12)return true;if(u===u.toUpperCase()&&u.split(" ").length<=6&&!u.includes(".")&&!u.includes("?"))return true;return false;}
function getNoteTextFor(design){let out=[];ALL_NOTES.forEach(n=>{let match=false;if(design&&(n.resourceId===design.id||n.designId===design.id||n.resource_id===design.id))match=true;if(!match&&design&&String(n.grade||"").trim()===String(design.grade||"").trim()&&normSubject(n.subject)===normSubject(design.subject))match=true;if(!match&&!design&&String(n.grade||"").trim()===String(document.getElementById("gradeSel").value||"").trim()&&normSubject(n.subject)===normSubject(currentExamSubject))match=true;if(match){let t=n.text||n.content||n.fullText||n.notes||n.body||n.description||"";if(t&&!isJunk(t))out.push(fixSpacing(t));}});return out.join("\n\n--- NOTES ---\n\n");}
function getDesignText(r){if(!r)return"";let parts=[];if(r.fullText&&!isJunk(r.fullText))parts.push(fixSpacing(r.fullText));let m=AI_BRAIN.find(x=>x.resourceId===r.id);if(m&&m.text&&!isJunk(m.text))parts.push(fixSpacing(m.text));let m2=AI_BRAIN.find(x=>x.title===r.title&&x.grade===r.grade&&x.subject===r.subject);if(m2&&m2.text&&!isJunk(m2.text)&&!parts.includes(fixSpacing(m2.text)))parts.push(fixSpacing(m2.text));return parts.join("\n\n--- DESIGN ---\n\n");}
function getCombinedSourceText(){let designText=CURRENT_DESIGN?getDesignText(CURRENT_DESIGN):"";let noteText=getNoteTextFor(CURRENT_DESIGN);if(!CURRENT_DESIGN&&!noteText){let byGS=ALL_NOTES.filter(n=>String(n.grade||"").trim()===String(document.getElementById("gradeSel").value||"").trim()&&normSubject(n.subject)===normSubject(currentExamSubject));if(byGS.length){noteText=byGS.map(n=>fixSpacing(n.text||n.content||n.fullText||n.notes||"")).filter(t=>t&&!isJunk(t)).join("\n\n--- NOTES ---\n\n");if(noteText)CURRENT_SOURCE="notes-only";}}else if(designText&&noteText)CURRENT_SOURCE="design+notes";else if(designText)CURRENT_SOURCE="design-only";else if(noteText)CURRENT_SOURCE="notes-only";else CURRENT_SOURCE="none";let combined="";if(designText)combined+=`=== DESIGN ===\n${designText}\n\n`;if(noteText)combined+=`=== NOTES ===\n${noteText}\n\n`;return combined;}
function describeSource(){let info=document.getElementById("sourceInfo");if(!info)return;let designText=CURRENT_DESIGN?getDesignText(CURRENT_DESIGN):"";let noteText=getNoteTextFor(CURRENT_DESIGN);if(CURRENT_SOURCE==="design+notes")info.innerHTML=`📚 Design + Notes • ${designText.length}+${noteText.length} chars`;else if(CURRENT_SOURCE==="design-only")info.innerHTML=`📘 Design only • ${designText.length} chars`;else if(CURRENT_SOURCE==="notes-only")info.innerHTML=`📝 Notes only • ${noteText.length} chars`;else info.innerHTML=`⚠️ None — CBC standard only.`;info.classList.remove("hidden");}
async function loadDesignsFromFirestore(){let FB=window.FB;try{let s=await FB.getDocs(FB.collection(FB.db,'resources'));ALL_DESIGNS=[];s.forEach(d=>ALL_DESIGNS.push({id:d.id,...d.data()}));}catch(e){ALL_DESIGNS=[];}try{let b=await FB.getDocs(FB.collection(FB.db,'ai_brain'));AI_BRAIN=[];b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()}));}catch(e){AI_BRAIN=[];}ALL_NOTES=[];let noteCols=["notes","curriculum_notes","design_notes","student_notes","lesson_notes","study_notes"];for(let col of noteCols){try{let s=await FB.getDocs(FB.collection(FB.db,col));s.forEach(d=>{let data=d.data();ALL_NOTES.push({id:d.id,_col:col,...data});});}catch(e){}}ALL_DESIGNS.forEach(r=>{if(String(r.type||"").toLowerCase().includes("note")){ALL_NOTES.push({id:r.id,_col:"resources-notes",grade:r.grade,subject:r.subject,title:r.title,text:r.fullText||r.description||"",resourceId:r.id});}});onGradeSubjectChange();}
function matchDesign(grade,subject){let g=String(grade||"").trim();let want=normSubject(subject);let list=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g&&normSubject(r.subject)===want);if(list.length)return list[0];let list2=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g&&String(r.subject||"").toLowerCase().trim()===String(subject||"").toLowerCase().trim());if(list2.length)return list2[0];return null;}

function speakText(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let clean=String(t||"").replace(/[*_`]/g,"").slice(0,900);let ut=new SpeechSynthesisUtterance(clean);const isSw=/Kiswahili|Nomino|Wingi|Sarufi|Methali|sentensi|kitenzi|kiwakilishi/i.test(clean)||currentExamSubject==="Kiswahili";const vs=speechSynthesis.getVoices();if(!vs.length){setTimeout(()=>speakText(t),300);return;}const eng=vs.find(v=>v.name.includes("Google UK English Female"))||vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en"))||vs[0];const sw=vs.find(v=>v.lang.toLowerCase().includes("sw"));ut.voice=isSw&&sw?sw:eng;ut.lang=isSw?"sw-KE":"en-GB";ut.rate=blindMode?0.75:0.82;ut.pitch=1;ut.volume=1;speechSynthesis.speak(ut);}

function startVoiceAnswer(i){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Voice input is not supported here. Try Google Chrome.");return;}if(isRecording&&recognition){recognition.stop();return;}recognition=new SR();recognition.lang=currentExamSubject==="Kiswahili"?"sw-KE":"en-KE";recognition.interimResults=false;const btn=document.getElementById("mic"+i),txt=document.getElementById("ansText"+i),hidden=document.getElementById("ans"+i),stat=document.getElementById("micStatus"+i);if(!btn||!txt||!hidden||!stat)return;btn.classList.add("pulse","bg-red-500");btn.innerText="🔴";stat.innerText="🎤 Listening...";stat.classList.remove("hidden");isRecording=true;recognition.onresult=e=>{let tr=e.results[0][0].transcript.trim();const q=currentQs[i];if(q&&q.options&&q.options.length){const sp=tr.toLowerCase();const m=q.options.find(o=>{const oo=o.toLowerCase();return oo.includes(sp)||sp.includes(oo.slice(0,Math.min(4,oo.length)));});if(m){tr=m;document.querySelectorAll(`input[name="ans${i}"]`).forEach(r=>{r.checked=r.value.toLowerCase()===m.toLowerCase();});document.querySelectorAll(".opt").forEach(el=>el.classList.toggle("sel",el.textContent.includes(m)));}}if(txt)txt.value=tr;if(hidden)hidden.value=tr;stat.innerHTML=`✅ Heard: <b>${esc(tr)}</b>`;stat.className="mt-1.5 text-[9px] font-black text-center bg-[#dcfce7] border border-black rounded-full py-1";};recognition.onend=()=>{btn.classList.remove("pulse","bg-red-500");btn.innerText="🎤";isRecording=false;if(navigator.vibrate)navigator.vibrate(40);};recognition.onerror=()=>{btn.classList.remove("pulse","bg-red-500");btn.innerText="🎤";isRecording=false;stat.innerText="❌ Not recognised. Try again.";};try{recognition.start();}catch(e){}}

async function loadExams(){const grade=gradeSel.value,sub=subSel.value;currentExamGrade=grade;currentExamSubject=sub;onGradeSubjectChange();const list=document.getElementById("examsList"),banner=document.getElementById("pendingBanner");list.innerHTML=`<p class="text-center py-3 font-black text-[11px]">⏳ Loading weekly exam...</p>`;banner.innerHTML="";const{isIn}=getSatSun();const done=await hasSubmittedThisWeek();if(!isIn)banner.innerHTML=`<div class="bg-orange-100 border-2 border-black rounded-xl p-2 text-center font-black text-[11px]">⏰ Opens Saturday. Mon-Fri use Daily Homework.</div>`;else if(!done)banner.innerHTML=`<div class="bg-red-600 text-white border-2 border-black rounded-xl p-2 font-black text-[11px]">⚠️ WEEKLY EXAM PENDING • ${esc(currentSHKE)} • 0/100</div>`;else banner.innerHTML=`<div class="bg-green-600 text-white border-2 border-black rounded-xl p-2 text-center font-black text-[11px]">✅ Completed this week's exam.</div>`;try{let q=window.FB.query(window.FB.collection(window.FB.db,"resources"),window.FB.where("grade","==",grade),window.FB.where("subject","==",sub),window.FB.where("type","==","Exam"));const snap=await window.FB.getDocs(q);list.innerHTML="";if(snap.empty){list.innerHTML=`<div class="bg-white border-2 border-dashed border-black rounded-xl p-3 text-center"><p class="font-black text-[11px]">No stored exam yet for ${esc(grade)} ${esc(sub)} • Source: ${CURRENT_SOURCE}</p><p class="text-[9px] mt-1">Generate a fresh 100-mark AI exam from YOUR Design + Notes + AI Brain.</p><button onclick="generateAIExam()" class="mt-2 bg-black text-white px-5 py-2 rounded-full text-[11px] font-black border-2 border-black">🤖 Generate AI 100 Marks</button></div>`;return;}snap.forEach(d=>{const ex=d.data(),subject=ex.subject||sub;list.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-2.5"><p class="font-black text-[12px]">${esc(subject)} - ${esc(grade)}</p><p class="text-[9px] text-gray-500">100 Marks • AI/Stored Exam • ${CURRENT_SOURCE}</p><button onclick="startStoredExam('${esc(subject)}')" class="mt-2 w-full bg-[#4a86ff] text-white rounded-full py-2 font-black text-[11px] border-2 border-black">${isIn&&!done?"Start 100 Marks →":"View Exam →"}</button></div>`;});}catch(e){list.innerHTML=`<div class="bg-white border-2 border-black rounded-xl p-3 text-center"><p class="font-black text-[11px]">Could not load stored exams.</p><button onclick="generateAIExam()" class="mt-2 bg-black text-white px-4 py-2 rounded-full text-[10px] font-black">🤖 Generate AI Exam</button></div>`;}}

function getDesignKeywords(){let combined=getCombinedSourceText();let title=(CURRENT_DESIGN?(CURRENT_DESIGN.title||""):"")+" "+currentExamSubject+" "+(document.getElementById("strandSel").value||"");let all=(combined+" "+title).toLowerCase();let stop=new Set(["grade","learning","area","topic","design","curriculum","kenya","learner","should","strand","focuses","using","practicing","exploring","planning","notes","institute","development","skilled","ethical","society","junior","school"]);let words=all.split(/[^a-z]+/).filter(w=>w.length>=4&&!stop.has(w));let freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,40);}
function questionsAreFromDesign(qs){let combined=getCombinedSourceText();if(!combined)return true;let joined=qs.map(q=>(q.q+" "+q.answer)).join(" ");if(joined.includes("##")||joined.includes("KENYA INSTITUTE")||joined.includes("CURRICULUM DEVELOPMENT")||joined.includes("A Skilled and Ethical Society")||joined.includes("JUNIOR SCHOOL CURRICULUM DESIGN"))return false;let keys=getDesignKeywords();let joinedLow=joined.toLowerCase();let hits=keys.filter(k=>joinedLow.includes(k)).length;return hits>=3;}
function gradeBand(grade){let g=String(grade||"");if(g==="Playgroup"||g==="PP1"||g==="PP2"||g==="Grade 1"||g==="Grade 2"||g==="Grade 3")return"early";if(g==="Grade 4"||g==="Grade 5"||g==="Grade 6")return"middle";return"upper";}
function extractContentSentences(){let combined=getCombinedSourceText();if(!combined)return[];let rawLines=combined.split("\n").map(s=>cleanLine(s)).filter(s=>s.length>0);let startIdx=0;for(let i=0;i<rawLines.length;i++){let u=rawLines[i].toUpperCase();if(u.includes("STRAND")||u.includes("SUB-STRAND")||u.includes("SPECIFIC LEARNING OUTCOMES")||u.includes("KEY INQUIRY")||u.includes("SUGGESTED LEARNING EXPERIENCES")||u.includes("CONSERVING")||u.includes("CROP PRODUCTION")||u.includes("ANIMAL PRODUCTION")){startIdx=i;break;}if(i>60){startIdx=60;break;}}let sentences=[];rawLines.slice(startIdx).forEach(line=>{if(isCoverOrBoilerplate(line))return;line.split(/[\.\n]+/).forEach(part=>{let s=cleanLine(part);if(s.length<30||s.length>220)return;if(isCoverOrBoilerplate(s))return;if(!/[a-z]/.test(s))return;if(!/\b(is|are|was|were|should|can|will|helps|uses|means|includes|involves|requires|protect|conserve|produce|grow|keep|make|use|learn)\b/i.test(s))return;sentences.push(s);});});return [...new Set(sentences)];}
function makeExactly100(list){if(!Array.isArray(list))return[];let res=[],total=0;for(const item of list){if(!item)continue;const q={...item};q.marks=Number(q.marks)||1;if(total+q.marks<=100){res.push(q);total+=q.marks;}if(total===100)break;}if(total<100&&res.length){res[res.length-1].marks+=100-total;total=100;}if(total>100){let run=0,fixed=[];for(const q of res){if(run>=100)break;let m=Math.min(Number(q.marks)||1,100-run);fixed.push({...q,marks:m});run+=m;}res=fixed;}return res;}
function buildLocalExamFromDesign(){
  let sentences=extractContentSentences(); if(sentences.length<4) return null;
  let strand=document.getElementById("strandSel").value||currentExamSubject; let band=gradeBand(document.getElementById("gradeSel").value);
  let strandWords=(strand||"").toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3);
  let scored=sentences.map(s=>{let low=s.toLowerCase();let sc=0;strandWords.forEach(w=>{if(low.includes(w))sc++;});return{s,sc};}).sort((a,b)=>b.sc-a.sc);
  let picked=scored.slice(0,12).map(x=>x.s);
  let qs=[];
  // 6 MCQ (5-10 marks each) + 4 Open (10 marks) + 2 Essay (10 marks) = 100 in makeExactly100
  for(let i=0;i<6;i++){ qs.push({q:`Which of the following is a main idea in YOUR Design / Notes on ${strand}?`,options:[picked[i].slice(0,55),"A topic not in this Design / Notes","A topic from another subject","A topic from another grade"],answer:picked[i].slice(0,55),acceptedAnswers:[picked[i].slice(0,55)],marks:band==="early"?5:10,strand,explanation:picked[i]}); }
  for(let i=6;i<10;i++){ qs.push({q:`A learner in Ruiru is learning about: ${picked[i].slice(0,100)}. State three things the learner should do.`,options:[],answer:picked[i],acceptedAnswers:[picked[i]],marks:10,strand,explanation:picked[i]}); }
  qs.push({q:`Essay: Discuss the importance of ${strand.toLowerCase()} to a learner / farmer in Ruiru. Explain (i) what it is, (ii) three ways it helps, (iii) one challenge and how to solve it. Write 6-8 sentences.`,options:[],answer:picked[10]||picked[0],acceptedAnswers:[picked[10]||picked[0]],marks:10,strand,explanation:picked[10]||picked[0]});
  qs.push({q:`After heavy rainfall, a farmer in Ruiru noticed a problem related to: ${picked[11].slice(0,100)}. Suggest three measures the farmer / learner can use.`,options:[],answer:picked[11],acceptedAnswers:[picked[11]],marks:10,strand,explanation:picked[11]});
  return makeExactly100(qs);
}

function normalizeAIQuestions(raw){if(!Array.isArray(raw))return[];const list=raw.map(item=>{if(!item)return null;const q=item.q||item.question||item.text||"";if(!q)return null;let opts=Array.isArray(item.options)?item.options:[];opts=opts.map(x=>String(x)).filter(Boolean).slice(0,4);const ans=item.answer||item.correctAnswer||item.correct||"";let acc=Array.isArray(item.acceptedAnswers)?item.acceptedAnswers:[];if(ans&&!acc.includes(ans))acc.unshift(ans);return{q:String(q),options:opts,answer:String(ans),acceptedAnswers:acc,marks:Number(item.marks)||1,strand:item.strand||item.topic||"",explanation:item.explanation||"",diagram:item.diagram||""};}).filter(Boolean);return makeExactly100(list);}
async function generateAIExam(){
  const grade=gradeSel.value; let subject=subSel.value; let strand=document.getElementById("strandSel").value||"";
  currentExamGrade=grade; currentExamSubject=subject; onGradeSubjectChange();
  let combined=getCombinedSourceText(); let keys=getDesignKeywords().slice(0,30).join(", "); let designTitle=CURRENT_DESIGN?(CURRENT_DESIGN.title||CURRENT_DESIGN.subject||""):"(No Design)";
  workArea.classList.remove("hidden"); workTitle.innerText=`${subject} - ${grade} • 100 Marks • ${strand}`; examSource.innerText=`🤖 Generating from ${CURRENT_SOURCE}...`; aiBadge.innerText="⏳ AI WORKING"; curIdx=0;
  questions.innerHTML=`<div class="text-center py-6"><p class="font-black text-[13px]">🤖 Creating your 100-mark exam...</p><p class="text-[10px] opacity-60 mt-1">Grade ${esc(grade)} • ${esc(subject)} • ${esc(strand)} • Source: ${CURRENT_SOURCE}</p></div>`;
  result.classList.add("hidden"); corrBtn.classList.add("hidden"); saveWrongBtn.classList.add("hidden"); currentQs=[];
  try{
    const resp=await fetch("/api/gemini",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({task:"exam_generation",mode:"exam",question:`Generate a fresh weekly 100-mark ${subject} examination for ${grade} - Strand: ${strand}. Use ONLY the Design + Notes + AI Brain content below. Create original exam-style questions: MCQ + Open-Ended (State three / Suggest three with scenario) + 1 Essay. Twist previous weak areas. Do not copy source questions. Return structured JSON.\nSource: ${CURRENT_SOURCE}\nDesign Title: ${designTitle}\nKEY WORDS: ${keys}\n=== DESIGN + NOTES + AI BRAIN (8000 chars) ===\n${combined?combined.slice(0,8000):`(No Design, no Notes - use Grade + Subject + Strand + Key Words.)`}`,grade,subject,strand,topic:strand,role:"Student",source:"weekly_exam - Design OR Notes + AI Brain",questionCount:20,marks:100,useSomaHubKnowledge:true,useSomaHubFiles:true,provider:"auto",designTitle,designText:combined.slice(0,8000),designSource:CURRENT_SOURCE,wrongQuestions:wrongBank.slice(-5).map(w=>({question:w.q,subject:w.subject,grade:w.grade})),history:[],shke:currentSHKE})});
    const data=await resp.json(); if(!resp.ok||!data.ok) throw new Error(data.error||"AI unavailable");
    let aiQ=Array.isArray(data.questions)?data.questions:[]; if(!aiQ.length&&data.answer){try{let t=String(data.answer).replace(/^```json/i,"").replace(/^```/i,"").replace(/```$/i,"").trim();const p=JSON.parse(t);if(Array.isArray(p))aiQ=p;else if(Array.isArray(p.questions))aiQ=p.questions;}catch(e){const m=String(data.answer||"").match(/\{[\s\S]*\}/);if(m){try{const p=JSON.parse(m[0]);if(Array.isArray(p.questions))aiQ=p.questions;}catch(e){}}}}
    const norm=normalizeAIQuestions(aiQ);
    if(norm.length&&questionsAreFromDesign(norm)){currentQs=norm;examSource.innerText=`🤖 ${data.provider||"AI"} • From ${CURRENT_SOURCE}`;aiBadge.innerText="🤖 AI READY";renderExamQs();speakText(`Your ${grade} ${subject} weekly exam is ready. It is worth 100 marks.`);return;}
    throw new Error("AI off-design / no questions");
  }catch(e){
    console.warn("AI exam failed/off-design:",e);
    let local=buildLocalExamFromDesign();
    if(local){currentQs=local;examSource.innerText=`📚 Built DIRECTLY from YOUR ${CURRENT_SOURCE} (AI off-topic)`;aiBadge.innerText="📚 LOCAL";renderExamQs();speakText("Exam built directly from your Design and Notes.");return;}
    const fb=FALLBACK_100[subject]||FALLBACK_100.Science; currentQs=makeExactly100(fb.map(q=>({...q}))); examSource.innerText="📚 Offline fallback • AI unavailable"; aiBadge.innerText="📚 OFFLINE"; renderExamQs(); speakText("AI is temporarily unavailable. A practice exam has been loaded instead.");
  }
}
function getDiagramHTML(question){const t=String(question||"").toLowerCase();if(t.includes("flower")||t.includes("petal")||t.includes("stamen")||t.includes("pistil"))return `<details class="bg-[#ffe0f0] border border-black rounded-lg p-1.5 mt-2"><summary class="font-black text-[9px] cursor-pointer">🌸 Flower diagram — tap to show</summary><div class="text-center text-[18px] mt-1">🌸 🌼 🌻<p class="text-[8px] font-black">Petal • Stamen • Pistil • Sepal</p></div></details>`;if(t.includes("map")||t.includes("kenya")||t.includes("rift valley")||t.includes("compass"))return `<details class="bg-[#d0e8ff] border border-black rounded-lg p-1.5 mt-2"><summary class="font-black text-[9px] cursor-pointer">🗺️ Map / direction — tap to show</summary><div class="flex justify-center gap-3 mt-1"><span class="border border-black rounded p-1 bg-white font-black text-[11px]">N</span><span class="text-[16px]">🧭</span><span class="border border-black rounded p-1 bg-white font-black text-[11px]">E</span></div></details>`;if(t.includes("water cycle")||t.includes("evaporation")||t.includes("condensation"))return `<details class="bg-[#e0f7ff] border border-black rounded-lg p-1.5 mt-2"><summary class="font-black text-[9px] cursor-pointer">💧 Water Cycle — tap to show</summary><div class="text-center text-[16px] mt-1">☀️ → 💧 → ☁️ → 🌧️<p class="text-[8px] font-black">Evaporation → Condensation → Precipitation</p></div></details>`;return "";}
function prevQ(){if(curIdx>0){curIdx--;renderExamQs();}}
function nextQ(){if(curIdx<currentQs.length-1){curIdx++;renderExamQs();}}
function renderExamQs(){if(!currentQs.length){questions.innerHTML=`<p class="text-center py-6 font-black">No questions available.</p>`;return;}document.getElementById("qProgress").innerText=`Q${curIdx+1} of ${currentQs.length} • ${currentQs[curIdx].marks} mks`;document.getElementById("dots").innerHTML=currentQs.map((_,i)=>`<button onclick="curIdx=${i};renderExamQs()" class="dot ${i===curIdx?'on':''} ${getAns(i)?'done':''}"></button>`).join("");document.getElementById("prevBtn").disabled=curIdx===0;document.getElementById("nextBtn2").innerText=curIdx===currentQs.length-1?"✓ Done":"Next →";const c=currentQs[curIdx],i=curIdx;const bg=["#e0f2ff","#ffe0f0","#fff7e0","#dcfce7"][i%4];const diagram=getDiagramHTML(`${c.diagram||""} ${c.q||""}`);const isMCQ=c.options&&c.options.length>0;let answerHTML="";const saved=getAns(i);if(isMCQ){answerHTML=`<div class="mt-2 space-y-1.5">${c.options.map((opt,oi)=>`<label class="opt ${saved===opt?'sel':''} flex items-center gap-2 bg-white border-2 border-black rounded-full px-3 py-2 cursor-pointer"><input type="radio" name="ans${i}" value="${esc(opt)}" ${saved===opt?'checked':''} onchange="chooseOption(${i},${oi})" class="w-4 h-4 accent-black shrink-0"><span class="font-black text-[12px]">${String.fromCharCode(65+oi)}. ${esc(opt)}</span></label>`).join("")}</div><input id="ans${i}" type="hidden" value="${esc(saved)}"><input id="ansText${i}" type="hidden" value="${esc(saved)}">`;}else{answerHTML=`<textarea id="ansText${i}" rows="2" placeholder="Type or 🎤..." class="w-full mt-2 border-2 border-black rounded-xl p-2 text-[12px] font-bold bg-white" oninput="syncAnswer(${i},this.value)">${esc(saved)}</textarea><input id="ans${i}" type="hidden" value="${esc(saved)}">`;}
questions.innerHTML=`<div class="border-2 border-black rounded-xl p-2.5" style="background:${bg}"><div class="flex justify-between items-center gap-2"><span class="bg-black text-white px-2 py-0.5 rounded-full text-[9px] font-black">Q${i+1} • ${c.marks} mks</span>${c.strand?`<span class="text-[9px] font-black opacity-50 truncate">${esc(c.strand)}</span>`:""}</div><p class="font-black text-[13px] mt-2 leading-snug">${esc(c.q)}</p>${diagram}${answerHTML}<div class="flex gap-1.5 mt-1.5"><button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border border-black rounded-full px-3 py-1.5 text-[11px] font-black">🎤 Speak</button><span class="text-[9px] font-bold self-center">${isMCQ?"Tap A B C D, or speak.":"Speak or type."}</span></div><p id="micStatus${i}" class="hidden mt-1.5 text-[9px] font-black text-center border border-black rounded-full py-1 bg-[#ffcc1a]"></p></div>`;result.classList.add("hidden");corrBtn.classList.add("hidden");saveWrongBtn.classList.add("hidden");scoreBadge.innerText="0/100";examSubmitted=false;}
function chooseOption(qi,oi){const q=currentQs[qi];if(!q)return;const opt=q.options[oi];if(!opt)return;const t=document.getElementById("ansText"+qi),h=document.getElementById("ans"+qi);if(t)t.value=opt;if(h)h.value=opt;document.querySelectorAll(".opt").forEach(el=>el.classList.remove("sel"));event?.target?.closest("label")?.classList.add("sel");speakText(opt);}
function syncAnswer(idx,v){const h=document.getElementById("ans"+idx);if(h)h.value=v;}
async function checkExam(){if(!currentQs.length){alert("Generate or load an exam first.");return;}let score=0,total=0,wrongNow=[];currentQs.forEach((c,i)=>{const user=getAns(i);const marks=Number(c.marks)||1;total+=marks;const ok=answerIsCorrect(c,user);if(ok)score+=marks;else wrongNow.push({...c,userAnswer:user,subject:currentExamSubject,grade:currentExamGrade,date:new Date().toISOString()});});currentWrong=wrongNow;const pct=total?Math.round((score/total)*100):0;let msg=pct>=80?"🌟 Excellent work!":pct>=60?"👏 Good work! Keep improving.":pct>=40?"💪 Fair effort. More practice will help.":"📚 Keep practising. You can improve!";result.innerHTML=`<p class="font-black text-[12px]">🎉 Exam Result</p><p class="text-[11px] mt-1">${esc(currentExamGrade)} • ${esc(currentExamSubject)}</p><div class="mt-2 text-center"><p class="text-[24px] font-black">${score}/${total}</p><p class="font-black text-[12px]">${pct}%</p><p class="font-black text-[11px] mt-1">${msg}</p></div><div class="mt-2 bg-[#e0f2ff] border border-black rounded-lg p-2 text-center"><p class="font-black text-[10px]">❌ To practise: ${wrongNow.length}</p></div>`;result.classList.remove("hidden");result.scrollIntoView({behavior:"smooth",block:"center"});corrBtn.classList.remove("hidden");if(wrongNow.length)saveWrongBtn.classList.remove("hidden");scoreBadge.innerText=`${score}/${total}`;examSubmitted=true;speakText(`You scored ${score} out of ${total}. ${msg}`);if(navigator.vibrate)navigator.vibrate(pct>=50?[100,50,100]:[200,80,200]);await saveSubmission(score,total,pct);}
async function saveSubmission(score,total,pct){if(!currentUser)return;try{await window.FB.addDoc(window.FB.collection(window.FB.db,"exam_submissions"),{userId:currentUser.uid,indexNumber:currentSHKE,grade:currentExamGrade,subject:currentExamSubject,score,total,percentage:pct,wrongCount:currentWrong.length,date:window.FB.serverTimestamp(),createdAt:new Date().toISOString()});}catch(e){console.warn("Submission could not be saved:",e);}}
function showCorrection(){if(!currentQs.length)return;let html=`<p class="font-black text-[12px]">📖 Correction</p>`;currentQs.forEach((c,i)=>{const user=getAns(i)||"No answer";const ok=answerIsCorrect(c,user);html+=`<div class="border border-black rounded-lg p-2 mt-1.5 ${ok?"bg-[#dcfce7]":"bg-[#ffeaea]"}"><p class="font-black text-[10px]">Q${i+1} • ${c.marks} marks</p><p class="font-black text-[11px] mt-1">${esc(c.q)}</p><p class="text-[10px] mt-1">You: <b>${esc(user)}</b></p><p class="text-[10px] mt-0.5 text-green-700 font-black">✔ Correct: ${esc(c.answer)}</p>${c.explanation?`<p class="text-[9px] mt-1">💡 ${esc(c.explanation)}</p>`:""}<button onclick="speakText('${escForJS(c.answer)}')" class="mt-1 bg-black text-white px-2 py-1 rounded-full text-[9px] font-black">🔊 Hear</button></div>`;});result.innerHTML=html;result.classList.remove("hidden");result.scrollIntoView({behavior:"smooth",block:"center"});}
function saveWrong(){if(!currentWrong.length){speakText("There are no wrong questions to save.");return;}const ex=Array.isArray(wrongBank)?wrongBank:[];currentWrong.forEach(w=>{ex.push({q:w.q,answer:w.answer,acceptedAnswers:w.acceptedAnswers||[],subject:w.subject,grade:w.grade,strand:w.strand,userAnswer:w.userAnswer,savedAt:new Date().toISOString()});});const trimmed=ex.slice(-200);wrongBank=trimmed;localStorage.setItem("soma_wrong_exam",JSON.stringify(trimmed));saveWrongBtn.innerText="✅ Saved — Twist Next Week 🔁";speakText(`${currentWrong.length} wrong questions have been saved for future practice.`);}
setTimeout(()=>{const FB=window.FB;if(!FB)return;FB.onAuthStateChanged(FB.auth,async user=>{currentUser=user||null;if(user){try{const snap=await FB.getDoc(FB.doc(FB.db,"users",user.uid));if(snap.exists()){const data=snap.data();currentSHKE=data.indexNumber||data.admissionNumber||"SHKE";indexB.innerText=currentSHKE;if(data.grade&&GRADES.includes(data.grade)){gradeSel.value=data.grade;onGradeChange();}}}catch(e){}}buildGradeSelect();onGradeChange();loadDesignsFromFirestore();});},500);
gradeSel.addEventListener("change",updInfo);subSel.addEventListener("change",updInfo);
