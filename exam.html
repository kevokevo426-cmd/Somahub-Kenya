<script>
let currentUser=null,currentSHKE="SHKE",currentQs=[],currentWrong=[],wrongBank=JSON.parse(localStorage.getItem('soma_wrong_exam')||'[]'), blindMode=false, recognition=null, isRecording=false;

// OXFORD VOICE - FIXED
function loadVoices(){}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); speechSynthesis.getVoices();}
function speakText(t){
 if(!('speechSynthesis' in window)) return;
 speechSynthesis.cancel();
 let clean=t.replace(/[*_`]/g,'').slice(0,650);
 let utt=new SpeechSynthesisUtterance(clean);
 let isSw=/Kiswahili|Nomino|Wingi|Sarufi/i.test(clean);
 let vs=speechSynthesis.getVoices();
 if(vs.length===0){setTimeout(()=>speakText(t),300); return;}
 let eng=vs.find(v=>v.name.includes('Google UK English Female'))||vs.find(v=>v.lang==='en-GB')||vs.find(v=>v.lang.startsWith('en'))||vs[0];
 let sw=vs.find(v=>v.lang.includes('sw'));
 utt.voice=isSw&&sw?sw:eng; utt.lang=isSw?'sw-KE':'en-GB'; utt.rate=blindMode?0.75:0.82;
 speechSynthesis.speak(utt);
}
function speakQuestion(i){
 let c=currentQs[i]; if(!c) return;
 let txt=`Question ${i+1}, ${c.marks} marks. ${c.q}. `;
 if(c.options&&c.options.length) txt+=`Options. ${c.options.map((o,idx)=>`Option ${String.fromCharCode(65+idx)}: ${o}`).join('. ')}. `;
 speakText(txt);
}
function speakAll(){if(!currentQs.length) return speakText("Load exam first"); speakText(currentQs.map((c,i)=>`Question ${i+1}. ${c.q}`).join(' '));}
function toggleBlindMode(){blindMode=!blindMode; blindBtn.innerText=blindMode?"♿ BIG ON":"♿ Visual OFF"; document.documentElement.style.fontSize=blindMode?"120%":"100%"; if(blindMode) speakText("Big mode ON. Tap Oxford Listen to hear.");}

// OPTIONAL DIAGRAMS - NOT ALL MUST HAVE
function getDiagramHTML(q){
 let l=(q||"").toLowerCase();
 let show = l.includes('flower')||l.includes('petal')||l.includes('map')||l.includes('kenya')||l.includes('compass')||l.includes('water cycle')||l.includes('rift');
 if(!show) return ""; // Playground - light, not all need diagram
 if(l.includes('flower')||l.includes('petal')) return `<div class="bg-[#ffe0f0] border-[2.5px] border-black rounded-xl p-2 mt-3 text-center shadow-[2px_2px_0_0_#000]"><p class="font-black text-[9px]">🌸 Flower - Colored (Optional)</p><svg viewBox="0 0 200 80" class="w-full h-14"><ellipse cx="100" cy="35" rx="22" ry="12" fill="#ffcc1a" stroke="black" stroke-width="2"/></svg></div>`;
 if(l.includes('map')||l.includes('kenya')||l.includes('rift')||l.includes('compass')) return `<div class="bg-[#d0e8ff] border-[2.5px] border-black rounded-xl p-2 mt-3 text-center shadow-[2px_2px_0_0_#000]"><p class="font-black text-[9px]">🗺️ Map - Colored (Optional)</p><svg viewBox="0 0 200 50" class="w-full h-10"><rect x="70" y="5" width="60" height="30" fill="#a3d977" stroke="black" stroke-width="2" rx="6"/></svg></div>`;
 if(l.includes('water cycle')) return `<div class="bg-[#e0f7ff] border-[2.5px] border-black rounded-xl p-2 mt-3 text-center"><p class="font-black text-[9px]">💧 Water Cycle (Optional)</p></div>`;
 return "";
}

function getSatSun(){let t=new Date(),d=t.getDay(),sat=new Date(t);sat.setDate(t.getDate()+(6-d));sat.setHours(0,0,0,0);let sun=new Date(sat);sun.setDate(sat.getDate()+1);sun.setHours(23,59,59,0);return{sat,sun,isIn:sat<=t&&t<=sun};}
function updInfo(){let{sat,sun,isIn}=getSatSun(),now=new Date(),diff=sun-now,h=Math.floor(diff/3600000); weeklyInfo.innerHTML=`📅 ${sat.toDateString()} Sat → ${sun.toDateString()} Sun • ${isIn?`✅ OPEN NOW ${h}h left`:`⏰ Opens Sat`} • SHKE ${currentSHKE} • 🎨 Diagrams optional • 🔊🎤 Ready`;}

// MIC EDITABLE
function startVoiceAnswer(i){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Use Chrome"); return;}
 if(isRecording&&recognition){recognition.stop(); return;}
 recognition=new SR(); recognition.lang='en-KE'; recognition.interimResults=false;
 let btn=document.getElementById('mic'+i), txt=document.getElementById('ansText'+i), hidden=document.getElementById('ans'+i), stat=document.getElementById('micStatus'+i);
 btn.classList.add('pulse','bg-red-500'); btn.innerText="🔴"; stat.innerText="🎤 Listening..."; stat.classList.remove('hidden'); isRecording=true;
 recognition.onresult=e=>{
   let tr=e.results[0][0].transcript.trim();
   let q=currentQs[i];
   if(q.options){
     let match=q.options.find(o=> o.toLowerCase().includes(tr.toLowerCase()) || tr.toLowerCase().includes(o.toLowerCase().slice(0,3)));
     if(match){ tr=match; document.querySelectorAll(`input[name="ans${i}"]`).forEach(r=>{if(r.value.toLowerCase()===match.toLowerCase()) r.checked=true;}); }
   }
   if(txt) txt.value=tr;
   if(hidden) hidden.value=tr;
   stat.innerHTML=`✅ Heard: <b>${tr}</b> - EDIT if needed`;
   stat.className="mt-2 text-[10px] font-black text-center bg-[#dcfce7] border-2 border-black rounded-full py-2";
 };
 recognition.onend=()=>{btn.classList.remove('pulse','bg-red-500'); btn.innerText="🎤"; isRecording=false; if(navigator.vibrate) navigator.vibrate(40);};
 recognition.start();
}

async function loadExams(){let FB=window.FB,grade=gradeSel.value,sub=subSel.value,list=document.getElementById('examsList'),banner=document.getElementById('pendingBanner'),{sat,sun,isIn}=getSatSun(); list.innerHTML="<p class='text-center py-4 font-black text-[11px]'>Loading 100 Marks...</p>"; banner.innerHTML=""; let done=false; if(currentUser){try{let q=FB.query(FB.collection(FB.db,"exam_submissions"),FB.where("userId","==",currentUser.uid));let s=await FB.getDocs(q);s.forEach(d=>{let dd=new Date(d.data().date); if(dd>=sat&&dd<=sun) done=true;});}catch(e){}} if(!isIn) banner.innerHTML=`<div class="bg-orange-100 border-[2.5px] border-black rounded-xl p-3 text-center font-black text-[11px]">⏰ Opens Saturday - Mon-Fri do Daily HW</div>`; else if(!done) banner.innerHTML=`<div class="bg-red-600 text-white border-[2.5px] border-black rounded-xl p-3 font-black text-[11px] shadow-[2px_2px_0_0_#000]">⚠️ PENDING WEEKLY EXAM - ${currentSHKE} - 0/100 • 🔊🎤 Ready</div>`; else banner.innerHTML=`<div class="bg-green-600 text-white border-[2.5px] border-black rounded-xl p-3 text-center font-black text-[11px]">✅ DONE This Week</div>`; try{let q; if(sub==="All Subjects") q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("type","==","Exam")); else q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("subject","==",sub),FB.where("type","==","Exam")); let snap=await FB.getDocs(q); list.innerHTML=""; if(snap.empty){list.innerHTML=`<div class="bg-white border-[2.5px] border-dashed border-black rounded-xl p-4 text-center"><p class="font-black text-[11px]">No Exam Yet for ${grade} ${sub}</p><p class="text-[9px] mt-2">Tap AI to generate 100 Marks with optional diagrams</p><button onclick="generateAIExam()" class="mt-3 bg-black text-white px-6 py-3 rounded-full text-[11px] font-black border-2 border-black shadow-[2px_2px_0_0_#000] fun-btn">🤖 Generate AI 100 Marks + 🔊🎤</button></div>`;return;} snap.forEach(d=>{let ex=d.data(); list.innerHTML+=`<div class="bg-white border-[2.5px] border-black rounded-xl p-3 shadow-[2px_2px_0_0_#000]"><p class="font-black text-[12px]">${ex.subject||sub} - ${grade}</p><p class="text-[9px] text-gray-500">100 Marks • Sec A B C • Diagrams optional</p><button onclick="startExam('${ex.subject||sub}')" class="mt-3 w-full bg-[#4a86ff] text-white rounded-full py-3 font-black text-[11px] border-2 border-black shadow-[1px_1px_0_0_#000] fun-btn">${isIn&&!done?'Start 100 Marks → 🔊🎤':'View + Type/Photo + 🔊'}</button></div>`;});}catch(e){list.innerHTML="<p class='text-center text-[10px] text-red-500'>Error - check connection</p>";}}
function startExam(sub){workArea.classList.remove('hidden'); workTitle.innerText=sub+" - 100 Marks"; window.scrollTo(0,300); generateAIExam();}

// FALLBACK 100 Marks with MCQ + Editable
const FALLBACK_100 = {
 "Science": [
  {q:"Which part makes pollen?", opts:["Petal","Stamen","Sepal","Root"], a:"Stamen", m:5, s:"Flower"},
  {q:"What is photosynthesis?", opts:["Plant makes food","Plant drinks","Plant sleeps","Plant walks"], a:"Plant makes food", m:5, s:"Photo"},
  {q:"Name 2 parts of flower", opts:[], a:"Petal Sepal", m:10, s:"Flower"},
  {q:"Explain water cycle with diagram", opts:[], a:"Evaporation condensation", m:10, s:"Water"},
  {q:"States of matter?", opts:["Solid liquid gas","Hot cold","Big small","Red blue"], a:"Solid liquid gas", m:5, s:"Matter"},
  {q:"Which part holds ovary?", opts:["Petal","Pistil","Stamen","Sepal"], a:"Pistil", m:5, s:"Flower"},
  {q:"Define pollination", opts:[], a:"Transfer of pollen", m:10, s:"Flower"},
  {q:"Draw and label flower (optional diagram)", opts:[], a:"Petal Stamen Pistil Sepal", m:10, s:"Flower"},
  {q:"Why do plants need sunlight?", opts:["Make food","Drink","Sleep","Walk"], a:"Make food", m:5, s:"Photo"},
  {q:"List 4 uses of water", opts:[], a:"Drinking washing cooking farming", m:10, s:"Water"},
  {q:"What is germination?", opts:[], a:"Seed grows to plant", m:10, s:"Plant"},
  {q:"Name 3 types of soil", opts:["Clay sand loam","Red blue green","Hot cold warm","Big small"], a:"Clay sand loam", m:5, s:"Soil"},
  {q:"Explain importance of map work", opts:[], a:"Navigation location", m:10, s:"Map"}
 ],
 "SST": [
  {q:"Capital of Kenya on map?", opts:["Nairobi","Mombasa","Kisumu","Nakuru"], a:"Nairobi", m:5, s:"Map"},
  {q:"What shows direction on map?", opts:["Compass","Ruler","Pencil","Eraser"], a:"Compass", m:5, s:"Compass"},
  {q:"Define map and give 2 uses", opts:[], a:"Map representation navigation", m:10, s:"Map"},
  {q:"Name 2 lakes in Rift Valley", opts:["Turkana Baringo","Victoria only","Tanganyika","Naivasha only"], a:"Turkana Baringo", m:10, s:"Rift"},
  {q:"2 physical features of Kenya?", opts:[], a:"Mountains Rift Valley", m:10, s:"Features"}
 ]
};

async function generateAIExam(){
 let sub=subSel.value; if(sub==="All Subjects") sub="Science";
 questions.innerHTML=`<p class='text-center py-8 font-black'>⏳ Loading 100 Marks ${sub}...<br><span class='text-[10px] opacity-60'>A B C D + 🔊 Oxford + 🎤 Editable</span></p>`;
 workArea.classList.remove('hidden');
 setTimeout(()=>{
  let base=FALLBACK_100[sub]||FALLBACK_100["Science"];
  currentQs=base.map(x=>({q:x.q, options:x.opts, answer:x.a, marks:x.m, strand:x.s, diagram:""}));
  renderExamQs();
 },400);
 // Try API background
 try{
  let twist=wrongBank.length? `Twist: ${wrongBank.slice(-2).map(w=>w.q).join(' | ')}` : "";
  const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:`Generate Weekly Exam 100 marks ${sub} Grade ${gradeSel.value} Sec A 10 Qs 2mks, Sec B 5 Qs 6mks, Sec C 5 Qs 10mks. Include MCQ with options. ${twist}. Return JSON [{"q":"...","marks":10,"answer":"...","options":["A","B","C","D"],"diagram":"flower or map"}]`,grade:gradeSel.value, shke:currentSHKE})});
  const d=await r.json(); let m=(d.answer||"").match(/\[[\s\S]*\]/); if(m){ let p=JSON.parse(m[0]); if(p.length>=5){ /* keep fallback to avoid empty */ } }
 }catch(e){}
}

function renderExamQs(){
 questions.innerHTML = currentQs.map((c,i)=>{
  let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||''))||"";
  let isMCQ=c.options&&c.options.length>0;
  let bg = i%4===0?"#e0f2ff":i%4===1?"#ffe0f0":i%4===2?"#fff7e0":"#dcfce7";
  let optsHTML=isMCQ? `
    <div class="mt-3 space-y-2">
      ${c.options.map((opt,oi)=>`
        <label class="flex items-center gap-3 bg-white border-[2.5px] border-black rounded-full px-4 py-3 cursor-pointer shadow-[2px_2px_0_0_#000] hover:bg-[#ffcc1a] fun-btn">
          <input type="radio" name="ans${i}" value="${opt}" onchange="document.getElementById('ans${i}').value=this.value; document.getElementById('ansText${i}').value=this.value; speakText('${opt.replace(/'/g,'')}')" class="w-6 h-6 accent-black">
          <span class="font-black text-[12px]">${String.fromCharCode(65+oi)}. ${opt}</span>
        </label>`).join('')}
    </div>
    <div class="mt-3">
      <p class="text-[8px] font-black opacity-60">✏️ EDIT answer here (after 🎤):</p>
      <div class="flex gap-2 mt-1">
        <input id="ansText${i}" type="text" placeholder="Answer - EDITABLE" class="flex-1 border-[2.5px] border-black rounded-full p-3 text-[12px] font-bold bg-[#fff7e0]" oninput="document.getElementById('ans${i}').value=this.value">
        <button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center">🎤</button>
      </div>
      <input id="ans${i}" type="hidden">
    </div>` : `
    <div class="mt-3 flex gap-2">
      <input id="ansText${i}" type="text" placeholder="Type or 🎤 - EDITABLE" class="flex-1 border-[2.5px] border-black rounded-full p-3 text-[12px] font-bold bg-white" oninput="document.getElementById('ans${i}').value=this.value">
      <button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center">🎤</button>
    </div>
    <input id="ans${i}" type="hidden">`;

  return `<div class="border-[3px] border-black rounded-[1.3rem] p-4 shadow-[4px_4px_0_0_#000]" style="background:${bg}">
    <div class="flex justify-between items-center"><span class="bg-black text-white px-3 py-1 rounded-full text-[9px] font-black">Q${i+1} (${c.marks} mks) ${c.strand||''}</span><button onclick="speakQuestion(${i})" class="bg-[#4a86ff] text-white border-2 border-black rounded-full px-3 py-1.5 text-[9px] font-black fun-btn">🔊 Oxford Listen</button></div>
    <p class="font-black text-[13px] mt-2">${c.q}</p>${diag}
    ${optsHTML}
    <p id="micStatus${i}" class="hidden mt-2 text-[9px] font-black text-center border-2 border-black rounded-full py-2 bg-[#ffcc1a]"></p>
  </div>`;
 }).join('');
 result.classList.add('hidden'); corrBtn.classList.add('hidden'); saveWrongBtn.classList.add('hidden');
}

function checkExam(){
 let score=0,total=0,wrongNow=[]; let html=`<p class="font-black text-[12px]">🎉 Result 100 Marks - ${subSel.value}</p>`;
 currentQs.forEach((c,i)=>{
   let user=(document.getElementById('ans'+i)?.value||document.getElementById('ansText'+i)?.value||"").trim();
   let m=c.marks||10; total+=m;
   let ok=user && c.answer.toLowerCase().includes(user.toLowerCase().slice(0,4));
   let got=ok?m:0; score+=got; if(!ok) wrongNow.push({q:c.q, answer:c.answer});
   html+=`<div class="border-2 border-black rounded-xl p-2 mt-2 text-[9px] font-black ${ok?'bg-[#dcfce7]':'bg-[#ffeaea]'}">${ok?'✅':'❌'} Q${i+1}: ${got}/${m}</div>`;
 });
 html+=`<p class="font-black mt-3 text-[16px] text-center">${score>=70?'🌟':score>=50?'👏':'💪'} Total ${score}/${total}</p>`;
 result.innerHTML=html; result.classList.remove('hidden'); corrBtn.classList.remove('hidden'); saveWrongBtn.classList.remove('hidden'); scoreBadge.innerText=score+"/"+total; currentWrong=wrongNow;
 let msg=score>=70?`Congratulations! Excellent! You completed Weekly Exam ${subSel.value}. You scored ${score} out of ${total}. You are a star!`:score>=50?`Good job! Weekly Exam ${subSel.value}. You scored ${score} out of ${total}. Keep it up!`:`You completed Weekly Exam ${subSel.value}. You scored ${score} out of ${total}. We will do twist next week!`;
 speakText(msg); if(navigator.vibrate) navigator.vibrate([100,50,100]);
}
function showCorrection(){let html=`<p class="font-black text-[12px]">📖 Correction with Optional Diagrams</p>`; currentQs.forEach((c,i)=>{let user=document.getElementById('ansText'+i)?.value||document.getElementById('ans'+i)?.value||""; let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||'')); html+=`<div class="border-[2.5px] border-black rounded-xl p-3 mt-3 bg-white text-[11px]"><b>Q${i+1} (${c.marks}mks):</b> ${c.q}${diag}<br>Your: <b>${user||'empty'}</b><br><span class="text-green-700 font-black">✔ ${c.answer}</span> <button onclick="speakText('${c.answer.replace(/'/g,'')}')" class="ml-2 bg-black text-white px-2 py-0.5 rounded-full text-[8px]">🔊</button></div>`;}); result.innerHTML=html; speakText("Correction shown with diagrams");}
function saveWrong(){if(currentWrong.length==0){alert("Perfect! No wrong"); return;} let all=JSON.parse(localStorage.getItem('soma_wrong_exam')||'[]'); all=all.concat(currentWrong); if(all.length>20) all=all.slice(-20); localStorage.setItem('soma_wrong_exam', JSON.stringify(all)); wrongBank=all; alert("Saved "+currentWrong.length+" wrong → twist next week");}

document.getElementById('photoInput').addEventListener('change', async e=>{
 let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=async()=>{let b64=reader.result.split(',')[1]; photoPreview.src=reader.result; photoPreview.classList.remove('hidden'); photoStatus.innerText="📷 Marking exam..."; workArea.classList.remove('hidden'); questions.innerHTML="AI reading handwriting..."; try{const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:`Mark photo handwritten weekly exam 100 marks ${subSel.value} Grade ${gradeSel.value}. Give score and corrections.`,grade:gradeSel.value, shke:currentSHKE, photo:b64})}); let d=await r.json(); let ans=d.answer||"Could not read"; questions.innerHTML=`<div class="border-2 border-black rounded-xl p-3 bg-white text-[11px] font-bold" style="white-space:pre-wrap">${ans}</div>`; result.innerHTML=`<div class="bg-[#dcfce7] border-2 border-black rounded-xl p-3 text-[11px] font-bold" style="white-space:pre-wrap">${ans}</div>`; result.classList.remove('hidden'); photoStatus.innerText="✅ Marked"; speakText(ans.slice(0,300));}catch{ photoStatus.innerText="❌ Error"; }}; reader.readAsDataURL(file);
});

setTimeout(()=>{let FB=window.FB; FB.onAuthStateChanged(FB.auth, async(u)=>{if(u){currentUser=u;let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid));if(s.exists()){currentSHKE=s.data().indexNumber||"SHKE";indexB.innerText=currentSHKE;gradeSel.value=s.data().grade||"Grade 6";}updInfo();loadExams();}});},600); setInterval(updInfo,60000); updInfo();
