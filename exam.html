// ============================================================

let currentWrong=[];

let blindMode=false;

let recognition=null;

let isRecording=false;

let currentExamSubject="";

let currentExamGrade="";

let examSubmitted=false;

// ============================================================
// SAFE HTML
// ============================================================

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


// ============================================================
// NORMALIZE ANSWER
// ============================================================

function normalizeAnswer(value){

  return String(value || "")
    .toLowerCase()
    .trim()
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ");
}


// ============================================================
// CHECK ANSWER
// ============================================================

function answerIsCorrect(question,userAnswer){

  if(!userAnswer) return false;

  const user=
    normalizeAnswer(userAnswer);


  // MCQ
  if(
    question.options &&
    question.options.length
  ){

    return normalizeAnswer(
      question.answer
    ) === user;
  }


  const accepted=[
    question.answer,
    ...(Array.isArray(question.acceptedAnswers)
      ? question.acceptedAnswers
      : [])
  ]
  .filter(Boolean)
  .map(normalizeAnswer);


  if(!accepted.length)
    return false;


  // Exact match
  if(
    accepted.some(
      a=>a===user
    )
  ){
    return true;
  }


  // Short-answer flexible matching
  return accepted.some(a=>{

    if(
      user.length >= 4 &&
      a.includes(user)
    ){
      return true;
    }

    if(
      a.length >= 4 &&
      user.includes(a)
    ){
      return true;
    }

    return false;
  });
}


// ============================================================
// OXFORD VOICE
// ============================================================

if(
  "speechSynthesis" in window
){

  speechSynthesis.onvoiceschanged=
    ()=>speechSynthesis.getVoices();

  speechSynthesis.getVoices();
}


function speakText(text){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }


  speechSynthesis.cancel();


  let clean=
    String(text || "")
      .replace(/[*_`]/g,"")
      .slice(0,900);


  let utter=
    new SpeechSynthesisUtterance(
      clean
    );


  const isSw=
    /Kiswahili|Nomino|Wingi|Sarufi|Methali|sentensi|kitenzi|kiwakilishi/i
      .test(clean);


  const voices=
    speechSynthesis.getVoices();


  if(!voices.length){

    setTimeout(
      ()=>speakText(text),
      300
    );

    return;
  }


  const eng=
    voices.find(
      v=>v.name.includes(
        "Google UK English Female"
      )
    ) ||

    voices.find(
      v=>v.lang==="en-GB"
    ) ||

    voices.find(
      v=>v.lang.startsWith("en")
    ) ||

    voices[0];


  const sw=
    voices.find(
      v=>v.lang.toLowerCase().includes("sw")
    );


  utter.voice=
    isSw && sw
      ? sw
      : eng;


  utter.lang=
    isSw
      ? "sw-KE"
      : "en-GB";


  utter.rate=
    blindMode
      ? 0.75
      : 0.82;


  utter.pitch=1;

  utter.volume=1;


  speechSynthesis.speak(
    utter
  );
}


function speakQuestion(i){

  const q=
    currentQs[i];

  if(!q) return;


  let text=
    `Question ${i+1}, ${q.marks} marks. ${q.q}.`;


  if(
    q.options &&
    q.options.length
  ){

    text+=
      " Options. " +

      q.options
        .map(
          (o,index)=>
            `Option ${
              String.fromCharCode(65+index)
            }: ${o}`
        )
        .join(". ") +

      ".";
  }


  speakText(text);
}


function speakAll(){

  if(!currentQs.length){

    speakText(
      "Generate or load the weekly exam first."
    );

    return;
  }


  let text=
    currentQs
      .map(
        (q,i)=>
          `Question ${i+1}. ${q.q}.`
      )
      .join(" ");


  speakText(text);
}


// ============================================================
// BLIND / BIG MODE
// ============================================================

function toggleBlindMode(){

  blindMode=
    !blindMode;


  blindBtn.innerText=
    blindMode
      ? "♿ BIG Mode ON"
      : "♿ Visual Mode OFF - BIG + Voice";


  document.documentElement.style.fontSize=

  if(blindMode){

    speakText(
      "Big mode is on. Tap Oxford Listen to hear questions."
    );
  }
}


// ============================================================
// SATURDAY / SUNDAY
// ============================================================

function getSatSun(){

  const now=
    new Date();

  const day=
    now.getDay();


  const sat=
    new Date(now);


  sat.setDate(
    now.getDate()+
    (6-day)
  );


  sat.setHours(
    0,0,0,0
  );


  const sun=
    new Date(sat);


  sun.setDate(
    sat.getDate()+1
  );


  sun.setHours(
    23,59,59,999
  );


  return{
    sat,
    sun,
    isIn:
      sat<=now &&
      now<=sun
  };
}


function updInfo(){

  const {
    sat,
    sun,
    isIn
  }=
    getSatSun();


  const now=
    new Date();


  const diff=
    sun-now;


  const h=
    Math.max(
      0,
      Math.floor(
        diff/3600000
      )
    );


  weeklyInfo.innerHTML=
    `📅 ${sat.toDateString()} Sat → ${sun.toDateString()} Sun • ` +

    `${
      isIn
        ? `✅ OPEN NOW • ${h}h left`
        : `⏰ Opens Saturday`
    } • ` +

    `SHKE ${esc(currentSHKE)} • ` +

    `🌸 Diagrams optional • 🔊🎤 Ready`;
}


// ============================================================
// PHOTO
// ============================================================

photoInput.addEventListener(

// ============================================================
// MICROPHONE
// ============================================================

function startVoiceAnswer(i){

  const SR=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    alert(
      "Voice input is not supported here. Try Google Chrome."
    );

    return;
  }


  if(
    isRecording &&
    recognition
  ){

    recognition.stop();

    return;
  }


  recognition=
    new SR();


  const subject=
    currentExamSubject;


  recognition.lang=
    subject==="Kiswahili"
      ? "sw-KE"
      : "en-KE";


  recognition.interimResults=
    false;


  const btn=
    document.getElementById(
      "mic"+i
    );


  const txt=
    document.getElementById(
      "ansText"+i
    );


  const hidden=
    document.getElementById(
      "ans"+i
    );


  const stat=
    document.getElementById(
      "micStatus"+i
    );


  btn.classList.add(
    "pulse",
    "bg-red-500"
  );


  btn.innerText="🔴";


  stat.innerText=
    "🎤 Listening...";


  stat.classList.remove(
    "hidden"
  );


  isRecording=true;


  recognition.onresult=
    function(e){

      let transcript=
        e.results[0][0]
          .transcript
          .trim();


      const q=
        currentQs[i];


      if(
        q &&
        q.options &&
        q.options.length
      ){

        const spoken=
          transcript.toLowerCase();


        const match=
          q.options.find(
            option=>{

              const o=
                option.toLowerCase();

              return(
                o.includes(spoken) ||
                spoken.includes(
                  o.slice(
                    0,
                    Math.min(
                      4,
                      o.length
                    )
                  )
                )
              );
            }
          );


        if(match){

          transcript=
            match;


          document
            .querySelectorAll(
              `input[name="ans${i}"]`
            )
            .forEach(
              radio=>{

                radio.checked=
                  radio.value.toLowerCase()===
                  match.toLowerCase();

              }
            );
        }
      }


      if(txt)
        txt.value=
          transcript;


      if(hidden)
        hidden.value=
          transcript;


      stat.innerHTML=
        `✅ Heard: <b>${esc(transcript)}</b> — EDIT if needed`;


      stat.className=
        "mt-2 text-[9px] font-black text-center bg-[#dcfce7] border-2 border-black rounded-full py-2";
    };


  recognition.onend=
    function(){

      btn.classList.remove(
        "pulse",
        "bg-red-500"
      );

      btn.innerText="🎤";

      isRecording=false;

      if(
        navigator.vibrate
      ){
        navigator.vibrate(40);
      }
    };


  recognition.onerror=
    function(){

      btn.classList.remove(
        "pulse",
        "bg-red-500"
      );

      btn.innerText="🎤";

      isRecording=false;

      stat.innerText=
        "❌ Voice not recognised. Try again.";
    };


  try{

    recognition.start();

  }catch(e){}

}


// ============================================================
// FIREBASE EXAM STATUS
// ============================================================

async function hasSubmittedThisWeek(){

  if(!currentUser)
    return false;


  try{

    const {
      sat,
      sun
    }=
      getSatSun();


    const q=
      window.FB.query(
        window.FB.collection(
          window.FB.db,
          "exam_submissions"
        ),

        window.FB.where(
          "userId",
          "==",
          currentUser.uid
        )
      );


    const snap=
      await window.FB.getDocs(q);


    let done=false;


    snap.forEach(
      d=>{

        const data=
          d.data();


        const date=
          data.date?.toDate
            ? data.date.toDate()
            : new Date(
                data.date ||
                0
              );


        if(
          date>=sat &&
          date<=sun
        ){

          done=true;
        }
      }
    );


    return done;

  }catch(e){

    return false;
  }
}

  try{

    let q;

          window.FB.collection(
            window.FB.db,
            "resources"
          ),

          window.FB.where(
            "grade",

    }


    const snap=

    if(

          <p class="font-black text-[11px]">
            No stored exam yet for ${esc(grade)} ${esc(sub)}

// ============================================================
// MAKE SURE TOTAL IS 100
// ============================================================

function makeExactly100(list){

  if(!Array.isArray(list))
    return [];


  let result=[];

  let total=0;


  for(
    const item of list
  ){

    if(!item)
      continue;


    const q={
      ...item
    };


    q.marks=
      Number(q.marks) || 1;


    if(
      total + q.marks <= 100
    ){

      result.push(q);

      total+=
        q.marks;
    }


    if(total===100)
      break;
  }


  // If AI produced less than 100 marks,
  // adjust the final question.

  if(
    total<100 &&
    result.length
  ){

    result[
      result.length-1
    ].marks +=
      100-total;

    total=100;
  }


  // If AI went over 100, trim final question.

  if(total>100){

    let running=0;

    const fixed=[];


    for(
      const q of result
    ){

      if(
        running>=100
      )
        break;


      let marks=
        Math.min(
          Number(q.marks)||1,
          100-running
        );


      fixed.push({
        ...q,
        marks
      });


      running+=marks;
    }


    result=
      fixed;
  }


  return result;
}


// ============================================================
// NORMALIZE AI QUESTIONS
// ============================================================

function normalizeAIQuestions(raw){

  if(
    !Array.isArray(raw)
  )
    return [];


  const list=
    raw
      .map(
        (item,index)=>{

          if(!item)
            return null;


          const q=
            item.q ||
            item.question ||
            item.text ||
            "";


          if(!q)
            return null;


          let options=
            Array.isArray(
              item.options
            )
              ? item.options
              : [];


          options=
            options
              .map(
                x=>String(x)
              )
              .filter(Boolean)
              .slice(0,4);


          const answer=
            item.answer ||
            item.correctAnswer ||
            item.correct ||
            "";


          let accepted=
            Array.isArray(
              item.acceptedAnswers
            )
              ? item.acceptedAnswers
              : [];


          if(
            answer &&
            !accepted.includes(
              answer
            )
          ){

            accepted.unshift(
              answer
            );
          }


          return{

            q:String(q),

            options,

            answer:String(
              answer
            ),

            acceptedAnswers:
              accepted,

            marks:
              Number(
                item.marks
              ) || 1,

            strand:
              item.strand ||
              item.topic ||
              "",

            explanation:
              item.explanation ||
              "",

            diagram:
              item.diagram ||
              ""
          };
        }
      )
      .filter(Boolean);


  return makeExactly100(
    list
  );
}

      "📚 OFFLINE";


    renderExamQs();


    speakText(
      "AI is temporarily unavailable. A practice exam has been loaded instead."
    );
  }
}

// ============================================================
// RENDER QUESTIONS
// ============================================================

function renderExamQs(){

  if(
    !currentQs.length
  ){

    questions.innerHTML=
      `<p class="text-center py-8 font-black">
        No questions available.
      </p>`;

    return;
  }


  questions.innerHTML=
    currentQs
      .map(
        (c,i)=>{

          const bg=
            [
              "#e0f2ff",
              "#ffe0f0",
              "#fff7e0",
              "#dcfce7"
            ][
              i%4
            ];


          const diagram=
            getDiagramHTML(
              `${c.diagram || ""} ${c.q || ""}`
            );


          const isMCQ=
            c.options &&
            c.options.length>0;


          let answerHTML;


          if(isMCQ){

            answerHTML=`

              <div class="mt-3 space-y-2">

                ${c.options
                  .map(
                    (opt,oi)=>`

                      <label
                        class="flex items-center gap-3 bg-white border-[2.5px] border-black rounded-full px-4 py-3 cursor-pointer shadow-[2px_2px_0_0_#000] fun-btn"
                      >

                        <input
                          type="radio"
                          name="ans${i}"
                          value="${esc(opt)}"
                          onchange="chooseOption(${i},${oi})"
                          class="w-6 h-6 accent-black shrink-0"
                        >

                        <span class="font-black text-[12px]">
                          ${String.fromCharCode(65+oi)}.
                          ${esc(opt)}
                        </span>

                      </label>
                    `
                  )
                  .join("")}

              </div>

              <div class="mt-3">

                <p class="text-[8px] font-black opacity-60">
                  ✏️ Edit answer after 🎤 if needed
                </p>

                <div class="flex gap-2 mt-1">

                  <input
                    id="ansText${i}"
                    type="text"
                    placeholder="Answer - EDITABLE"
                    class="flex-1 border-[2.5px] border-black rounded-full p-3 text-[12px] font-bold bg-[#fff7e0]"
                    oninput="syncAnswer(${i},this.value)"
                  >

                  <button
                    id="mic${i}"
                    onclick="startVoiceAnswer(${i})"
                    class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center"
                  >
                    🎤
                  </button>

                </div>

                <input
                  id="ans${i}"
                  type="hidden"
                >

              </div>
            `;

          }else{

            answerHTML=`

              <div class="mt-3 flex gap-2">

                <input
                  id="ansText${i}"
                  type="text"
                  placeholder="Type or 🎤 - EDITABLE"
                  class="flex-1 border-[2.5px] border-black rounded-full p-3 text-[12px] font-bold bg-white"
                  oninput="syncAnswer(${i},this.value)"
                >

                <button
                  id="mic${i}"
                  onclick="startVoiceAnswer(${i})"
                  class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center"
                >
                  🎤
                </button>

              </div>

              <input
                id="ans${i}"
                type="hidden"
              >

            `;
          }


          return `

            <div
              class="border-[3px] border-black rounded-[1.3rem] p-4 shadow-[4px_4px_0_0_#000]"
              style="background:${bg}"
            >

              <div class="flex justify-between items-center gap-2">

                <span class="bg-black text-white px-3 py-1 rounded-full text-[9px] font-black">
                  Q${i+1} • ${c.marks} mks
                </span>

                <button
                  onclick="speakQuestion(${i})"
                  class="bg-[#4a86ff] text-white border-2 border-black rounded-full px-3 py-1.5 text-[9px] font-black fun-btn"
                >
                  🔊 Listen
                </button>

              </div>


              <p class="font-black text-[13px] mt-3">
                ${esc(c.q)}
              </p>


              ${
                c.strand
                  ? `<p class="text-[8px] font-black opacity-50 mt-1">
                       ${esc(c.strand)}
                     </p>`
                  : ""
              }


              ${diagram}


              ${answerHTML}


              <p

              ></p>

            </div>

          `;
        }
      )
      .join("");


  result.classList.add(
    "hidden"
  );

  corrBtn.classList.add(
    "hidden"
  );

  saveWrongBtn.classList.add(
    "hidden"
  );


  scoreBadge.innerText=
    "0/100";


  examSubmitted=false;
}


// ============================================================
// OPTION SELECTION
// ============================================================

function chooseOption(
  questionIndex,
  optionIndex
){

  const q=
    currentQs[
      questionIndex
    ];


  if(!q)
    return;


  const option=
    q.options[
      optionIndex
    ];


  if(!option)
    return;


  const text=
    document.getElementById(
      "ansText"+
      questionIndex
    );


  const hidden=
    document.getElementById(
      "ans"+
      questionIndex
    );


  if(text)
    text.value=
      option;


  if(hidden)
    hidden.value=
      option;


  speakText(
    option
  );
}


// ============================================================
// SYNC ANSWER
// ============================================================

function syncAnswer(
  index,
  value
){

  const hidden=
    document.getElementById(
      "ans"+index
    );


  if(hidden)
    hidden.value=
      value;
}


// ============================================================
// CHECK EXAM
// ============================================================

async function checkExam(){

  if(
    !currentQs.length
  ){

    alert(
      "Generate or load an exam first."
    );

    return;
  }


  let score=0;

  let total=0;

  let wrongNow=[];


  currentQs.forEach(
    (c,i)=>{

      const user=
        document.getElementById(
          "ans"+i
        )?.value ||

        document.getElementById(
          "ansText"+i
        )?.value ||

        "";


      const marks=
        Number(
          c.marks
        ) || 1;


      total+=
        marks;


      const correct=
        answerIsCorrect(
          c,
          user
        );


      if(correct){

        score+=
          marks;

      }else{

        wrongNow.push({

          ...c,

          userAnswer:
            user,

          subject:
            currentExamSubject,

          grade:
            currentExamGrade,

          date:
            new Date().toISOString()
        });
      }
    }
  );


  currentWrong=
    wrongNow;


  const percent=
    total
      ? Math.round(
          (score/total)*100
        )
      : 0;


  let message;


  if(percent>=80){

    message=
      "🌟 Excellent work!";

  }else if(percent>=60){

    message=
      "👏 Good work! Keep improving.";

  }else if(percent>=40){

    message=
      "💪 Fair effort. More practice will help.";

  }else{

    message=
      "📚 Keep practising. You can improve!";
  }


  result.innerHTML=
    `

      <p class="font-black text-[13px]">
        🎉 Exam Result
      </p>

      <p class="text-[11px] mt-2">
        ${esc(currentExamGrade)}
        •
        ${esc(currentExamSubject)}
      </p>

      <div class="mt-4 text-center">

        <p class="text-[28px] font-black">
          ${score}/${total}
        </p>

        <p class="font-black text-[13px]">
          ${percent}%
        </p>

        <p class="font-black text-[12px] mt-2">
          ${message}
        </p>

      </div>

      <div class="mt-4 bg-[#e0f2ff] border-2 border-black rounded-xl p-3 text-center">

        <p class="font-black text-[10px]">
          ❌ Questions to practise:
          ${wrongNow.length}
        </p>

      </div>

    `;


  result.classList.remove(
    "hidden"
  );


  result.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });


  corrBtn.classList.remove(
    "hidden"
  );


  if(
    wrongNow.length
  ){

    saveWrongBtn.classList.remove(
      "hidden"
    );
  }


  scoreBadge.innerText=
    `${score}/${total}`;


  examSubmitted=true;


  const voice=
    `You scored ${score} out of ${total}. ${message}`;


  speakText(
    voice
  );


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      percent>=50
        ? [100,50,100]
        : [200,80,200]
    );
  }


  // ==========================================================
  // SAVE SUBMISSION
  // ==========================================================

  await saveSubmission(
    score,
    total,
    percent
  );
}


// ============================================================
// SAVE EXAM SUBMISSION
// ============================================================

async function saveSubmission(
  score,
  total,
  percent
){

  if(!currentUser)
    return;


  try{

    await window.FB.addDoc(
      window.FB.collection(
        window.FB.db,
        "exam_submissions"
      ),
      {

        userId:
          currentUser.uid,

        indexNumber:
          currentSHKE,

        grade:
          currentExamGrade,

        subject:
          currentExamSubject,

        score,

        total,

        percentage:
          percent,

        wrongCount:
          currentWrong.length,

        date:
          window.FB.serverTimestamp(),

        createdAt:
          new Date().toISOString()

      }
    );

  }catch(error){

    console.warn(
      "Submission could not be saved:",
      error
    );
  }
}


// ============================================================
// CORRECTION

  )

  let html=
    `<p class="font-black text-[13px]">

    </p>`;

    (c,i)=>{

      const user=
        document.getElementById(
          "ansText"+i

        )?.value ||

}


// ============================================================
// SAFE JS STRING
// ============================================================

function escForJS(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g," ");
}


// ============================================================
// SAVE WRONG QUESTIONS
// ============================================================

function saveWrong(){

  if(
    !currentWrong.length
  ){

    speakText(
      "There are no wrong questions to save."
    );

    return;
  }


  const existing=
    Array.isArray(
      wrongBank
    )
      ? wrongBank
      : [];


  currentWrong.forEach(
    wrong=>{

      existing.push({

        q:
          wrong.q,

        answer:
          wrong.answer,

        acceptedAnswers:
          wrong.acceptedAnswers ||
          [],

        subject:
          wrong.subject,

        grade:
          wrong.grade,

        strand:
          wrong.strand,

        userAnswer:
          wrong.userAnswer,

        savedAt:
          new Date().toISOString()
      });
    }
  );


  // Keep the latest 200
  const trimmed=
    existing.slice(-200);


  wrongBank=
    trimmed;


  localStorage.setItem(
    "soma_wrong_exam",
    JSON.stringify(
      trimmed
    )
  );


  saveWrongBtn.innerText=
    "✅ Saved — Twist Next Week 🔁";


  speakText(
    `${currentWrong.length} wrong questions have been saved for future practice.`
  );
}


// ============================================================
// FIREBASE USER
// ============================================================

setTimeout(
  ()=>{

    const FB=
      window.FB;


    if(!FB)
      return;


    FB.onAuthStateChanged(
      FB.auth,
      async user=>{

        currentUser=
          user ||
          null;


        if(user){

          try{

            const snap=
              await FB.getDoc(
                FB.doc(
                  FB.db,
                  "users",
                  user.uid
                )
              );


            if(
              snap.exists()
            ){

              const data=
                snap.data();


              currentSHKE=
                data.indexNumber ||
                data.admissionNumber ||
                "SHKE";


              indexB.innerText=
                currentSHKE;


              if(
                data.grade
              ){

                const options=
                  Array.from(
                    gradeSel.options
                  );


                const found=
                  options.find(
                    o=>
                      o.value===
                      data.grade
                  );


                if(found){

                  gradeSel.value=
                    data.grade;
                }
              }
            }

          }catch(error){

            console.warn(
              "Could not load user:",
              error
            );
          }

        }


        updInfo();

      }
    );

  },
  500
);
