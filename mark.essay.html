<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARK ESSAY - Mode Switch - Bold [Correction]</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Nunito',sans-serif; background:#fcf8ee;}
.card{background:white; border:3px solid #000; border-radius:16px; padding:14px; box-shadow:4px 4px 0 0 #000; margin-top:12px;}
.btn{border:3px solid #000; border-radius:999px; padding:12px; font-weight:900; font-size:12px; width:100%; cursor:pointer;}
.btn-black{background:#000; color:white;} .btn-white{background:white;}
textarea{width:100%; border:3px solid #000; border-radius:12px; padding:10px; font-size:12px; min-height:160px;}
.marked{font-size:13px; line-height:2; background:white; border:3px solid #000; border-radius:12px; padding:14px; white-space:pre-wrap;}
.marked b{background:#fecaca; border-bottom:2px solid #dc2626; padding:1px 4px; border-radius:4px;}
.marked i{color:#16a34a; font-style:normal; font-weight:900; background:#dcfce7; padding:1px 4px; border-radius:4px; margin-left:2px;}
.sumBox{border:3px solid #000; border-radius:12px; padding:10px; text-align:center; background:white; box-shadow:3px 3px 0 0 #000;}
.mode-btn{border:3px solid #000; border-radius:999px; padding:8px 14px; font-weight:900; font-size:11px; cursor:pointer; background:white;}
.mode-btn.active{background:#000; color:white;}
.dir{background:#fffbe6; border:2px dashed #000; padding:10px; border-radius:12px; font-size:11px;}
@media print{body *{visibility:hidden;}#fineCopyPrint,#fineCopyPrint *{visibility:visible;}#fineCopyPrint{position:absolute;left:0;top:0;width:100%;border:none;} .no-print{display:none;}}
</style>
</head>
<body class="p-3">
<div class="max-w-[620px] mx-auto">

<div class="bg-[#ff4444] text-white border-3 border-black rounded-2xl p-3 text-center">
<p class="font-black">MARK ESSAY - Teacher Sets Mode</p>
<p class="text-[11px]">Bold Mistake [Correction] + Fine Copy</p>
</div>

<div class="card no-print">
<div class="dir">
<b>TEACHER:</b> Choose mode before marking - Easy tap<br>
<b>STRICT</b>=6/15 AE (Your Human Skin) | <b>FAIR</b>=9/15 | <b>MEDIUM</b>=11/15 | <b>LENIENT</b>=13/15
</div>

<!-- MODE SWITCH - EASY MANEUVER -->
<div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; justify-content:center;">
<button id="m-strict" class="mode-btn active" onclick="setMode('strict')">🔴 STRICT 6/15</button>
<button id="m-fair" class="mode-btn" onclick="setMode('fair')">🟡 FAIR 9/15</button>
<button id="m-medium" class="mode-btn" onclick="setMode('medium')">🔵 MEDIUM 11/15</button>
<button id="m-lenient" class="mode-btn" onclick="setMode('lenient')">🟢 LENIENT 13/15</button>
</div>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;">
<input id="title" value="Teamwork - Human Skin Project" style="border:3px solid #000; border-radius:10px; padding:8px; font-size:12px; font-weight:800;">
<input id="klass" value="Grade 7" style="border:3px solid #000; border-radius:10px; padding:8px; font-size:12px; font-weight:800;">
</div>

<div style="display:flex; gap:6px; margin-top:8px;">
<button class="btn btn-white" style="font-size:10px;" onclick="document.getElementById('loadFile').click()">📁 LOAD FILE</button>
<button class="btn btn-white" style="font-size:10px;" onclick="document.getElementById('photo').click()">📸 PHOTO</button>
</div>
<input type="file" id="loadFile" accept=".txt" style="display:none;" onchange="loadFile(event)">
<input type="file" id="photo" accept="image/*" style="display:none;" onchange="preview(event)">

<textarea id="essay" style="margin-top:8px;">The task seemed difficult until we decided to work together. We were all given a task by our class teacher to make the human skin using our local materials. Each group was clueless. We were placed in groups of four.

My group and I started making a sketch on a piece of paper on how we would make the human skin. One of the members was drawing while we were finding ways of making the skin. Some of the learners did research in the online or textbook.

After the research we went outside to look for any material which we could use for the project. I found a box and others found a thread and paint. We went under a tree and we started making. It was interesting because we all had chances to share our ideas and creativity.

We had a lot of fun. We were all left to decorate it and name it so we can finish. I was sticking the thread on the box while others were painting. We all worked together and we were glad to finish because in the beginning we thought that the task was so difficult.

The time of presentation reached and our group was first to present. We went and presented and we finished. When we finished our presentation, we were waiting to know who won the presentation. Luckily we found ourselves at position one. That is why teamwork works.</textarea>
<img id="prev" style="max-width:100%; margin-top:6px; border-radius:12px; border:3px solid #000; display:none;">
<button class="btn btn-black" style="margin-top:10px;" onclick="markEssay()">🔍 MARK WITH <span id="modeLabel">STRICT</span> MODE</button>
</div>

<div id="result" style="display:none;">
<div class="card" style="background:#000; color:white; text-align:center;">
<div id="summary" style="font-weight:900; font-size:18px;"></div>
<div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-top:10px;" id="breakdown"></div>
</div>

<div class="card">
<p class="font-black text-[13px]">📝 MARKED COPY - <b>bold mistake</b> <i>[correction]</i></p>
<div id="marked" class="marked"></div>
</div>

<div class="card" style="background:#fffbe6;">
<p class="font-black">💬 TEACHER COMMENT - <span id="modeCommentLabel">STRICT</span></p>
<div id="comment" style="font-size:12px; line-height:1.6; margin-top:6px;"></div>
</div>

<div class="card" id="fineCopyPrint">
<p class="font-black text-center uppercase" id="outTitle">TEAMWORK</p>
<p class="text-[10px] text-center font-bold" id="outMeta">Fine Copy</p>
<hr class="my-2 border-2 border-black">
<div id="fine" class="text-[12px] leading-7 whitespace-pre-wrap"></div>
<div class="flex gap-2 mt-4 no-print">
<button onclick="navigator.clipboard.writeText(document.getElementById('fine').innerText); alert('Copied!')" class="flex-1 btn btn-white">📋 Copy</button>
<button onclick="window.print()" class="flex-1 btn btn-black">🖨️ Print</button>
</div>
</div>
</div>
</div>

<script>
let currentMode='strict';
function setMode(m){
  currentMode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('m-'+m).classList.add('active');
  document.getElementById('modeLabel').innerText=m.toUpperCase();
  document.getElementById('modeCommentLabel').innerText=m.toUpperCase();
  // Auto re-mark if already marked
  if(document.getElementById('result').style.display==='block') markEssay();
}
function loadFile(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=()=>{document.getElementById('essay').value=r.result}; r.readAsText(f); }
function preview(e){ let f=e.target.files[0]; if(!f) return; let url=URL.createObjectURL(f); let img=document.getElementById('prev'); img.src=url; img.style.display='block'; }

function markEssay(){
  let text=document.getElementById('essay').value.trim();
  if(!text) return;
  
  let corrections=[
    {w:"in the online or textbook", c:"online or in textbooks"},
    {w:"in the online", c:"online"},
    {w:"so we can finish", c:"so that we could finish"},
    {w:"The time of presentation reached", c:"When it was time for presentation"},
    {w:"We went and presented and we finished", c:"We presented and finished"},
    {w:"When we finished our presentation, we were waiting to know who won the presentation", c:"After presenting, we waited for the results"},
    {w:"we all had chances", c:"we all had a chance"},
    {w:"We were all left to decorate it and name it so we can finish", c:"We were left to decorate and name it"},
    {w:"I was sticking the thread on the box while others were painting", c:"I stuck the thread on the box as others painted"},
    {w:"That is why teamwork works", c:"That is why teamwork is important"},
    {w:"I found a box and others found a thread and paint", c:"I found a box while others found thread and paint"}
  ];

  let markedText=text;
  let fineText=text;
  let found=[];
  corrections.forEach(cor=>{
    let esc=cor.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let re=new RegExp(esc,'gi');
    if(re.test(markedText.toLowerCase())){
      markedText=markedText.replace(re, `<b>${cor.w}</b> <i>[${cor.c}]</i>`);
      fineText=fineText.replace(re, cor.c);
      found.push(cor);
    }
  });

  // MODE BASED MARKS - Teacher sets
  let marksConfig={
    strict: {content:2, language:1, organization:2, creativity:1, total:6, grade:'AE'},
    fair: {content:3, language:2, organization:2, creativity:2, total:9, grade:'ME'},
    medium: {content:3, language:3, organization:3, creativity:2, total:11, grade:'ME'},
    lenient: {content:4, language:4, organization:3, creativity:2, total:13, grade:'EE'}
  };
  let m=marksConfig[currentMode];

  document.getElementById('result').style.display='block';
  document.getElementById('summary').innerHTML=`${currentMode.toUpperCase()} MARKING ${m.total}/15 ${m.grade}<br><span style="font-size:11px;">${text.split(/\s+/).length} words - ${found.length} errors highlighted</span>`;
  document.getElementById('breakdown').innerHTML=`
    <div class="sumBox" style="color:black;"><b>${m.content}/5</b><br>Content</div>
    <div class="sumBox" style="color:black;"><b>${m.language}/5</b><br>Language</div>
    <div class="sumBox" style="color:black;"><b>${m.organization}/3</b><br>Org</div>
    <div class="sumBox" style="color:black;"><b>${m.creativity}/2</b><br>Creat</div>
  `;
  document.getElementById('marked').innerHTML=markedText;
  document.getElementById('comment').innerHTML=`
    <b>Mode:</b> ${currentMode.toUpperCase()} - Teacher set ${m.total}/15<br>
    <b>Content ${m.content}/5:</b> ${currentMode==='strict'?'Basic idea only, needs details':'Good teamwork description'}<br>
    <b>Language ${m.language}/5:</b> ${found.length} mistakes highlighted above<br>
    <b>Comment:</b> ${currentMode==='strict'?'Needs major revision - fix bold errors':'Good effort, minor errors only'}<br>
    <b>Next:</b> Use fine copy below for correction.
  `;
  document.getElementById('fine').innerText=fineText;
  document.getElementById('outTitle').innerText=document.getElementById('title').value.toUpperCase();
  document.getElementById('outMeta').innerText=`${document.getElementById('klass').value} | Fine Copy | ${fineText.split(/\s+/).length} words | ${m.total}/15 ${m.grade} ${currentMode.toUpperCase()}`;
  window.scrollTo(0, document.getElementById('result').offsetTop);
}
</script>
</body>
</html>
