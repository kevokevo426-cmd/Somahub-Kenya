function fixSpacing(t){if(!t)return"";let s=String(t);s=s.replace(/Socie\s+ty/g,"Society").replace(/\bb\s+y\b/g,"by").replace(/Develop\s+ment/g,"Development").replace(/Activi\s+ties/g,"Activities").replace(/Learn\s+ing/g,"Learning");return s;}
function isJunk(t){if(!t)return true;t=String(t).trim();if(t.length<300)return true;if(t.includes("uc?export")||t.includes("drive.google.com"))return true;return false;}
function normSubject(s){s=String(s||"").toLowerCase().trim();if(s==="agriculture and nutrition"||s==="agriculture")return"agriculture";if(s.includes("language activities"))return"language activities";if(s.includes("mathematical"))return"mathematical activities";if(s.includes("environmental"))return"environmental activities";if(s.includes("psychomotor")||s.includes("creative"))return"creative";if(s.includes("movement"))return"movement activities";if(s.includes("religious")||s==="cre"||s==="ire"||s==="hre")return"religious";if(s.includes("kiswahili"))return"kiswahili";if(s.includes("english"))return"english";if(s.includes("mathematics"))return"mathematics";if(s.includes("integrated"))return"integrated science";if(s.includes("social"))return"social";if(s.includes("pre-technical"))return"pre-technical";if(s.includes("science"))return"science";return s;}
function cleanLine(s){return String(s||"").replace(/^#{1,6}\s*/g,"").replace(/#{1,6}\s*/g,"").replace(/\*\*/g,"").trim();}
function isCoverOrBoilerplate(s){let u=cleanLine(s).toUpperCase();if(!u)return true;let bad=["KENYA INSTITUTE OF CURRICULUM","CURRICULUM DEVELOPMENT","KICD","A SKILLED AND ETHICAL SOCIETY","JUNIOR SCHOOL CURRICULUM DESIGN","PRIMARY SCHOOL CURRICULUM DESIGN","SENIOR SCHOOL CURRICULUM DESIGN","PRE-PRIMARY","NATIONAL GOALS OF EDUCATION","TABLE OF CONTENTS","FOREWORD","ACKNOWLEDGEMENT","ACKNOWLEDGMENTS","COPYRIGHT","ALL RIGHTS RESERVED","PUBLISHED BY","PRINTED BY","ISBN","KENYA NATIONAL","MINISTRY OF EDUCATION","REPUBLIC OF KENYA","VISION 2030","ESSENCE STATEMENT","GENERAL LEARNING OUTCOMES FOR","LEVEL LEARNING OUTCOMES"];if(bad.some(b=>u.includes(b)))return true;if(u==="AGRICULTURE AND NUTRITION"||u==="AGRICULTURE"||u==="CREATIVE ACTIVITIES"||u==="ENGLISH"||u==="MATHEMATICS")return true;if(u.length<12)return true;if(u===u.toUpperCase()&&u.split(" ").length<=6&&!u.includes(".")&&!u.includes("?"))return true;return false;}
function getNoteTextFor(design){let out=[];ALL_NOTES.forEach(n=>{let match=false;if(design&&(n.resourceId===design.id||n.designId===design.id||n.resource_id===design.id))match=true;if(!match&&design&&String(n.grade||"").trim()===String(design.grade||"").trim()&&normSubject(n.subject)===normSubject(design.subject))match=true;if(!match&&!design&&String(n.grade||"").trim()===String(document.getElementById("gradeSel").value||"").trim()&&normSubject(n.subject)===normSubject(currentSubject))match=true;if(match){let t=n.text||n.content||n.fullText||n.notes||n.body||n.description||"";if(t&&!isJunk(t))out.push(fixSpacing(t));}});return out.join("\n\n--- NOTES ---\n\n");}
function getDesignText(r){if(!r)return"";let parts=[];if(r.fullText&&!isJunk(r.fullText))parts.push(fixSpacing(r.fullText));let m=AI_BRAIN.find(x=>x.resourceId===r.id);if(m&&m.text&&!isJunk(m.text))parts.push(fixSpacing(m.text));let m2=AI_BRAIN.find(x=>x.title===r.title&&x.grade===r.grade&&x.subject===r.subject);if(m2&&m2.text&&!isJunk(m2.text)&&!parts.includes(fixSpacing(m2.text)))parts.push(fixSpacing(m2.text));return parts.join("\n\n--- DESIGN ---\n\n");}
function getCombinedSourceText(){let designText=CURRENT_DESIGN?getDesignText(CURRENT_DESIGN):"";let noteText=getNoteTextFor(CURRENT_DESIGN);if(!CURRENT_DESIGN&&!noteText){let byGS=ALL_NOTES.filter(n=>String(n.grade||"").trim()===String(document.getElementById("gradeSel").value||"").trim()&&normSubject(n.subject)===normSubject(currentSubject));if(byGS.length){noteText=byGS.map(n=>fixSpacing(n.text||n.content||n.fullText||n.notes||"")).filter(t=>t&&!isJunk(t)).join("\n\n--- NOTES ---\n\n");if(noteText)CURRENT_SOURCE="notes-only";}}else if(designText&&noteText)CURRENT_SOURCE="design+notes";else if(designText)CURRENT_SOURCE="design-only";else if(noteText)CURRENT_SOURCE="notes-only";else CURRENT_SOURCE="none";let combined="";if(designText)combined+=`=== DESIGN ===\n${designText}\n\n`;if(noteText)combined+=`=== NOTES ===\n${noteText}\n\n`;return combined;}
function describeSource(){let info=document.getElementById("sourceInfo");if(!info)return;let designText=CURRENT_DESIGN?getDesignText(CURRENT_DESIGN):"";let noteText=getNoteTextFor(CURRENT_DESIGN);if(CURRENT_SOURCE==="design+notes")info.innerHTML=`📚 Design + Notes • ${designText.length}+${noteText.length} chars`;else if(CURRENT_SOURCE==="design-only")info.innerHTML=`📘 Design only • ${designText.length} chars`;else if(CURRENT_SOURCE==="notes-only")info.innerHTML=`📝 Notes only • ${noteText.length} chars`;else info.innerHTML=`⚠️ None — CBC standard only.`;info.classList.remove("hidden");}
async function loadDesignsFromFirestore(){let FB=window.FB;try{let s=await FB.getDocs(FB.collection(FB.db,'resources'));ALL_DESIGNS=[];s.forEach(d=>ALL_DESIGNS.push({id:d.id,...d.data()}));}catch(e){ALL_DESIGNS=[];}try{let b=await FB.getDocs(FB.collection(FB.db,'ai_brain'));AI_BRAIN=[];b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()}));}catch(e){AI_BRAIN=[];}ALL_NOTES=[];let noteCols=["notes","curriculum_notes","design_notes","student_notes","lesson_notes","study_notes"];for(let col of noteCols){try{let s=await FB.getDocs(FB.collection(FB.db,col));s.forEach(d=>{let data=d.data();ALL_NOTES.push({id:d.id,_col:col,...data});});}catch(e){}}ALL_DESIGNS.forEach(r=>{if(String(r.type||"").toLowerCase().includes("note")){ALL_NOTES.push({id:r.id,_col:"resources-notes",grade:r.grade,subject:r.subject,title:r.title,text:r.fullText||r.description||"",resourceId:r.id});}});onGradeSubjectChange();}
function matchDesign(grade,subject){let g=String(grade||"").trim();let want=normSubject(subject);let list=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g&&normSubject(r.subject)===want);if(list.length)return list[0];let list2=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g&&String(r.subject||"").toLowerCase().trim()===String(subject||"").toLowerCase().trim());if(list2.length)return list2[0];return null;}
function buildGradeSelect(){let sel=document.getElementById("gradeSel");sel.innerHTML=GRADES.map(g=>`<option ${g==="Grade 8"?"selected":""}>${g}</option>`).join("");}
function onGradeChange(){let grade=document.getElementById("gradeSel").value;let subSel=document.getElementById("subSel");let subjects=GRADE_SUBJECTS[grade]||["English"];subSel.innerHTML=subjects.map(s=>`<option>${escapeHTML(s)}</option>`).join("");updateSub();}
function onGradeSubjectChange(){updateSub();let grade=document.getElementById("gradeSel").value;let subj=document.getElementById("subSel").value;let d=matchDesign(grade,subj);CURRENT_DESIGN=d;getCombinedSourceText();describeSource();let info=document.getElementById("designInfo");if(!info)return;if(d){let txt=getDesignText(d);info.innerHTML=`✅ ${escapeHTML(d.title||d.subject||"")} • ${escapeHTML(d.grade||"")} • Design ${txt.length} • Notes ${getNoteTextFor(d).length}`;}else{let nt=getNoteTextFor(null);if(nt)info.innerHTML=`📝 No Design, Notes ${nt.length} chars`;else info.innerHTML=`⚠️ No Design, no Notes for ${escapeHTML(grade)} — ${escapeHTML(subj)}.`;}updDay();}
function cleanSub(s){return (s||"").trim();}

    inputHTML=`<textarea id="ansText${i}" rows="3" placeholder="i)&#10;ii)&#10;iii)" class="w-full mt-2 border-2 border-black rounded-xl p-2 text-[12px] font-bold bg-white" oninput="syncAnswer(${i},this.value)">${escapeHTML(saved)}</textarea><input id="ans${i}" type="hidden" value="${escapeHTML(saved)}">`;
  }
  let micHTML=`<div class="flex gap-1.5 mt-1.5"><button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border border-black rounded-full px-3 py-1.5 text-[11px] font-black">🎤 Speak</button><span class="text-[9px] font-bold self-center">${c.type==="MCQ"?"Tap A B C D, or speak.":"Speak or type."}</span></div>`;
  document.getElementById("questions").innerHTML=`<div class="border-2 border-black rounded-xl p-2.5" style="background:${escapeHTML(c.color||"#fff")}"><div class="flex flex-wrap gap-1"><span class="bg-black text-white px-2 py-0.5 rounded-full text-[10px] font-black">Q${i+1} • ${escapeHTML(c.strand||"")}</span><span class="bg-white px-2 py-0.5 rounded-full text-[10px] font-black border border-black">${typeLabel} • ${c.marks} mks</span></div><p class="font-black text-[13px] mt-2 leading-snug">${escapeHTML(c.q)}</p>${inputHTML}${micHTML}<p id="micStatus${i}" class="hidden mt-1.5 text-[10px] font-black text-center border border-black rounded-full py-1 bg-[#ffcc1a]"></p></div>`;
  document.getElementById("result").classList.add("hidden");document.getElementById("corrBtn").classList.add("hidden");document.getElementById("nextBtn").classList.add("hidden");
  window.scrollTo({top:200,behavior:"smooth"});
}
function selectOption(i,value){saveAns(i,value);let hidden2=document.getElementById("ansText"+i);if(hidden2)hidden2.value=value;document.querySelectorAll(".opt").forEach(el=>el.classList.remove("sel"));event?.target?.closest("label")?.classList.add("sel");speakText(value);}
function syncAnswer(i,value){saveAns(i,value);}
function saveToHistory(score,total){let h=JSON.parse(localStorage.getItem("soma_hw_history")||"[]");h.push({date:new Date().toISOString(),dateStr:new Date().toLocaleDateString("en-KE",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),grade:document.getElementById("gradeSel").value,subject:currentSubject,strand:document.getElementById("strandSel").value,score,total,questions:currentQs,answers:currentQs.map((_,j)=>document.getElementById("ans"+j)?.value||document.getElementById("ansText"+j)?.value||""),shke:currentSHKE});if(h.length>100)h=h.slice(-100);localStorage.setItem("soma_hw_history",JSON.stringify(h));}
function showHistory(type){let h=JSON.parse(localStorage.getItem("soma_hw_history")||"[]");const list=document.getElementById("historyList");list.classList.remove("hidden");if(!h.length){list.innerHTML="<p class='text-[11px] text-center py-2'>No history yet.</p>";return;}let f=[...h];if(type==="yesterday"){let y=new Date();y.setDate(y.getDate()-1);f=h.filter(x=>new Date(x.date).toDateString()===y.toDateString());}else if(type==="week"){let w=new Date();w.setDate(w.getDate()-7);f=h.filter(x=>new Date(x.date)>=w);}if(!f.length){list.innerHTML=`<p class="text-[10px] text-center">No work for ${escapeHTML(type)}.</p>`;return;}list.innerHTML=f.reverse().map(x=>{const idx=h.indexOf(x);return `<div class="border border-black rounded-lg p-2 bg-[#f9f9f9]"><div class="flex justify-between gap-2"><p class="font-black text-[11px] truncate">${escapeHTML(x.dateStr)} - ${escapeHTML(x.grade||"")} ${escapeHTML(x.subject)}</p><span class="bg-black text-white px-2 py-0.5 rounded-full text-[9px] shrink-0">${x.score}/${x.total}</span></div><div class="grid grid-cols-2 gap-1.5 mt-1.5"><button onclick="viewOldWork(${idx})" class="bg-white border border-black rounded-full py-1 text-[10px] font-black">View</button><button onclick="deleteWork(${idx})" class="bg-red-500 text-white border border-black rounded-full py-1 text-[10px] font-black">Delete</button></div></div>`;}).join("");}
function viewOldWork(i){const h=JSON.parse(localStorage.getItem("soma_hw_history")||"[]")[i];if(!h)return;currentQs=h.questions||[];curIdx=0;document.getElementById("workArea").classList.remove("hidden");document.getElementById("workTitle").innerText=`Past • ${h.dateStr} • ${h.score}/${h.total}`;document.getElementById("scoreBadge").innerText=`${h.score}/${h.total}`;document.getElementById("questions").innerHTML=currentQs.map((c,j)=>`<div class="border border-black rounded-lg p-2 bg-white mb-1.5"><p class="font-black text-[11px]">Q${j+1} • ${escapeHTML(c.type||"")}</p><p class="font-bold text-[11px] mt-1">${escapeHTML(c.q)}</p><p class="text-[10px] mt-1">You: <b>${escapeHTML(h.answers?.[j]||"")}</b></p><p class="text-[10px] mt-0.5 text-green-700 font-black">✔ ${escapeHTML(c.answer)}</p></div>`).join("");window.scrollTo({top:200,behavior:"smooth"});}
function deleteWork(i){if(!confirm("Delete this homework record?"))return;let h=JSON.parse(localStorage.getItem("soma_hw_history")||"[]");h.splice(i,1);localStorage.setItem("soma_hw_history",JSON.stringify(h));showHistory("all");}
function normalizeAnswer(v){return String(v||"").toLowerCase().replace(/[.,!?;:'"()]/g," ").replace(/\s+/g," ").trim();}
function answerMatches(user,correct){const u=normalizeAnswer(user);const a=normalizeAnswer(correct);if(!u||!a)return false;if(u===a)return true;if(a.includes(u)&&u.length>=3)return true;if(u.includes(a)&&a.length>=3)return true;const un=u.split(" ");const an=a.split(" ");const overlap=un.filter(w=>an.includes(w)&&w.length>2).length;return overlap>=Math.max(1,Math.ceil(Math.min(un.length,an.length)*.6));}
function checkAnswers(){let empty=0;currentQs.forEach((_,j)=>{const v=document.getElementById("ans"+j)?.value||document.getElementById("ansText"+j)?.value||"";if(!v.trim())empty++;});if(empty===currentQs.length){speakText("Please answer the questions first.");alert("Please answer the questions first.");return;}let score=0;let total=0;let html=`<p class="font-black text-[12px]">🎉 Result - ${escapeHTML(currentSubject)}</p>`;currentQs.forEach((c,j)=>{const user=(document.getElementById("ans"+j)?.value||document.getElementById("ansText"+j)?.value||"").trim();const m=Number(c.marks)||2;total+=m;let ok=false;if(c.type==="ESSAY"){let words=user.split(/\s+/).filter(w=>w.length>0).length;ok=words>=20;if(ok)score+=m;else if(words>=5)score+=Math.ceil(m/2);}else{ok=answerMatches(user,c.answer);if(ok)score+=m;}let got=ok?m:(c.type==="ESSAY"&&user.split(/\s+/).filter(w=>w.length>0).length>=5?Math.ceil(m/2):0);html+=`<div class="border border-black rounded-lg p-1.5 mt-1.5 text-[11px] font-black ${got>0?"bg-[#dcfce7]":"bg-[#ffeaea]"}">${got>0?"✅":"❌"} Q${j+1} (${escapeHTML(c.type||"")}) ${got}/${m}</div>`;});html+=`<p class="font-black mt-2 text-[15px] text-center">${score>=8?"🌟":score>=5?"👏":"💪"} ${score}/${total}</p>`;const result=document.getElementById("result");result.innerHTML=html;result.classList.remove("hidden");result.className="mx-2 mb-2 p-2 border-2 border-black rounded-xl bg-white text-[11px] break-words";document.getElementById("corrBtn").classList.remove("hidden");document.getElementById("nextBtn").classList.remove("hidden");document.getElementById("scoreBadge").innerText=`${score}/${total}`;saveToHistory(score,total);let msg=score>=8?`Congratulations! You scored ${score} out of ${total}.`:score>=5?`Good job! You scored ${score} out of ${total}.`:`You scored ${score} out of ${total}. Review and try again.`;speakText(msg);if(navigator.vibrate)navigator.vibrate([100,50,100]);}
function showCorrection(){let html=`<p class="font-black text-[12px]">📖 Correction</p>`;currentQs.forEach((c,j)=>{const user=document.getElementById("ansText"+j)?.value||document.getElementById("ans"+j)?.value||"Not answered";const ok=c.type==="ESSAY"?user.split(/\s+/).filter(w=>w.length>0).length>=20:answerMatches(user,c.answer);html+=`<div class="border border-black rounded-lg p-2 mt-1.5 bg-white"><p class="font-black text-[11px]">Q${j+1} (${escapeHTML(c.type||"")}): ${escapeHTML(c.q)}</p><p class="text-[11px] mt-1">You: <b>${escapeHTML(user)}</b></p><p class="text-[11px] mt-0.5 ${ok?"text-green-700":"text-red-600"} font-black">${ok?"✔ Correct":"✘ Correct"}: ${escapeHTML(c.answer)}</p><button onclick="speakText(${JSON.stringify(String(c.answer))})" class="mt-1 bg-black text-white px-2 py-1 rounded-full text-[9px] font-black">🔊 Hear</button></div>`;});const result=document.getElementById("result");result.innerHTML=html;result.classList.remove("hidden");}
function nextHomework(){onGradeChange();generateMyHomework();window.scrollTo({top:0,behavior:"smooth"});}
function printPDF(){if(!currentQs.length)return;const area=document.getElementById("printArea");const printQs=document.getElementById("printQs");printQs.innerHTML=`<h1 style="font-size:18px;font-weight:900">SomaHub Kenya - Homework</h1><p style="font-size:11px;font-weight:700">${escapeHTML(document.getElementById("gradeSel").value)} • ${escapeHTML(currentSubject)} • ${escapeHTML(document.getElementById("strandSel").value)} • Source: ${CURRENT_SOURCE}</p>`+currentQs.map((c,j)=>`<div style="border:1.5px solid #000;border-radius:10px;padding:10px;margin-top:8px"><p style="font-weight:900">Q${j+1} [${escapeHTML(c.type||"")}] ${escapeHTML(c.q)}</p>${c.options?.length?`<p>${c.options.map((o,k)=>`${String.fromCharCode(65+k)}. ${escapeHTML(o)}`).join(" &nbsp; ")}</p>`:""}<div style="height:${c.type==="ESSAY"?"100px":"50px"};border-bottom:1px dashed #777;margin-top:6px"></div></div>`).join("");area.classList.remove("hidden");html2canvas(area,{scale:2,backgroundColor:"#fff"}).then(can=>{const img=can.toDataURL("image/png");const {jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");const pageW=pdf.internal.pageSize.getWidth();const pageH=pdf.internal.pageSize.getHeight();const imgH=can.height*pageW/can.width;let y=0;let remaining=imgH;while(remaining>0){pdf.addImage(img,"PNG",0,y,pageW,imgH);remaining-=pageH;if(remaining>0){y-=pageH;pdf.addPage();}}pdf.save(`SomaHub-${currentSubject}-Homework.pdf`);setTimeout(()=>area.classList.add("hidden"),500);}).catch(()=>{area.classList.add("hidden");alert("PDF could not be created.");});}
document.getElementById("photoInput").addEventListener("change",e=>{const file=e.target.files?.[0];if(!file)return;const img=document.getElementById("photoPreview");img.src=URL.createObjectURL(file);img.classList.remove("hidden");});
setTimeout(()=>{const FB=window.FB;FB.onAuthStateChanged(FB.auth,async u=>{if(u){try{const s=await FB.getDoc(FB.doc(FB.db,"users",u.uid));if(s.exists()){const d=s.data();currentSHKE=d.indexNumber||"SHKE";document.getElementById("indexB").innerText=currentSHKE;if(d.grade&&GRADES.includes(d.grade)){document.getElementById("gradeSel").value=d.grade;onGradeChange();}}}catch(e){}}});buildGradeSelect();onGradeChange();loadDesignsFromFirestore();},600);
window.addEventListener("online",updDay);window.addEventListener("offline",updDay);
</script>
