<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Homework - SomaHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Nunito',sans-serif;background:#f6f6f7}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),doc,getDoc,onAuthStateChanged};
</script>
</head>
<body class="flex justify-center"><div class="w-full max-w-[460px] bg-[#f6f6f7] min-h-screen pb-10">
<div class="h-2 flex"><div class="flex-1 bg-[#ff8a2a]"></div><div class="flex-1 bg-[#2ac5a0]"></div><div class="flex-1 bg-[#4a86ff]"></div><div class="flex-1 bg-[#ffcc1a]"></div></div>
<div class="bg-white border-b-2 border-black p-3 flex justify-between items-center sticky top-0 z-40">
<a href="student.html" class="bg-black text-white px-4 py-2 rounded-full font-black text-[11px]">← Back</a>
<p class="font-black text-[13px]">📝 My Homework</p>
<span id="indexB" class="bg-blue-600 text-white px-2 py-1 rounded-full text-[9px] font-black">SHKE00502</span>
</div>
<div class="p-3 space-y-3">
<div class="bg-gradient-to-br from-green-600 to-emerald-700 text-white rounded-[1.5rem] p-5 border-2 border-black shadow-[3px_3px_0_0_#000]">
<p class="font-black text-[16px]">📚 My Homework - Daily 10 Marks</p>
<p class="text-[11px] mt-2">🌸 Flower parts • 🗺️ Map work • Colored diagrams • Type OR 📷 Photo • Correction • Twist Tomorrow</p>
</div>
<div class="bg-white rounded-xl p-3 border-2 border-black shadow-[2px_2px_0_0_#000] space-y-2">
<div class="grid grid-cols-2 gap-2">
<select id="gradeSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>Grade 7</option><option>Grade 6</option><option>Grade 4</option><option>Grade 5</option><option>Grade 8</option><option>Grade 9</option></select>
<select id="subSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>SST</option><option>Science</option><option>Mathematics</option><option>English</option><option>Kiswahili</option><option>CRE</option><option>ICT & Coding</option></select>
</div>
<!-- FIXED BUTTON - NOW WORKS -->
<button id="myHwBtn" onclick="generateMyHomework()" class="w-full bg-black text-white border-2 border-black rounded-full py-4 font-black text-[13px] shadow-[2px_2px_0_0_#000]">📚 My Homework - Click Here</button>
</div>
<div id="dayInfo" class="bg-white border-2 border-black rounded-xl p-3 text-[11px] font-bold text-center"></div>

<div id="workArea" class="hidden bg-white rounded-[1.3rem] p-4 border-2 border-black shadow-[3px_3px_0_0_#000]">
<div class="flex justify-between"><p id="workTitle" class="font-black text-[12px]">My Homework</p><span id="scoreBadge" class="bg-black text-white px-2 py-1 rounded-full text-[9px] font-black">0/10</span></div>
<div class="mt-2 flex gap-2"><button onclick="document.getElementById('photoInput').click()" class="flex-1 bg-[#ffcc1a] border-2 border-black rounded-full py-2.5 font-black text-[10px]">📷 Photo Written Work</button><button onclick="printPDF()" class="flex-1 bg-white border-2 border-black rounded-full py-2.5 font-black text-[10px]">🖨️ Print PDF</button></div>
<input type="file" id="photoInput" accept="image/*" hidden><img id="photoPreview" class="hidden mt-3 w-full rounded-xl border-2 border-black"><p id="photoStatus" class="hidden text-[10px] font-bold mt-2 text-center"></p>
<div id="questions" class="mt-4 space-y-4"></div>
<button onclick="checkAnswers()" class="w-full mt-4 bg-black text-white border-2 border-black rounded-full py-3 font-black text-[12px]">Check Now ✅</button>
<div id="result" class="hidden mt-3"></div>
<button id="corrBtn" onclick="showCorrection()" class="hidden w-full mt-2 bg-[#4a86ff] text-white border-2 border-black rounded-full py-2.5 font-black text-[10px]">View Correction with Diagrams 👁️</button>
<button id="saveWrongBtn" onclick="saveWrongForTomorrow()" class="hidden w-full mt-2 bg-[#ffcc1a] text-black border-2 border-black rounded-full py-2.5 font-black text-[10px]">Save Wrong → Twist Tomorrow 🔁</button>
</div>
</div>
<div id="printArea" class="hidden bg-white p-6"><div class="flex items-center gap-3 border-b-2 border-black pb-3"><img src="logo.png" class="w-14 h-14 rounded-full border-2 border-black"><div><p class="font-black text-[18px]">SomaHub - My Homework</p><p id="printDate" class="text-[10px] font-bold"></p><p id="printSHKE" class="text-[9px]"></p></div></div><div id="printQs" class="mt-4 space-y-4"></div></div>
</div>
<script>
let currentSHKE="SHKE00502"; let currentQs=[], currentWrong=[], wrongBank=JSON.parse(localStorage.getItem('soma_wrong')||'[]');
let todayName = new Date().toLocaleDateString('en-KE',{weekday:'long'}); let ttKey='soma_tt_'+new Date().toISOString().slice(0,10);
let currentSubject="SST";
function getDiagramHTML(q){let l=(q||"").toLowerCase(); if(l.includes('flower')||l.includes('petal')||l.includes('stamen')||l.includes('pistil')||l.includes('sepal')){return `<div class="bg-[#fff0f5] border-2 border-black rounded-xl p-2 mt-2"><p class="font-black text-[9px] text-center">🌸 Parts of a Flower - Colored Diagram</p><svg viewBox="0 0 200 150" class="w-full h-32"><ellipse cx="100" cy="80" rx="50" ry="35" fill="#ffcc1a" stroke="black" stroke-width="2"/><ellipse cx="100" cy="80" rx="20" ry="15" fill="#ff8a2a" stroke="black" stroke-width="1.5"/><ellipse cx="100" cy="40" rx="12" ry="25" fill="#ff4d9e" stroke="black" stroke-width="1.5"/><ellipse cx="140" cy="70" rx="25" ry="12" fill="#ff4d9e" stroke="black" stroke-width="1.5"/><ellipse cx="60" cy="70" rx="25" ry="12" fill="#ff4d9e" stroke="black" stroke-width="1.5"/><line x1="100" y1="115" x2="100" y2="145" stroke="#2ac5a0" stroke-width="4"/><text x="118" y="45" font-size="7" font-weight="900">Petal</text><text x="118" y="85" font-size="7" font-weight="900">Ovary</text></svg></div>`;} if(l.includes('map')||l.includes('kenya')||l.includes('compass')||l.includes('rift')||l.includes('lake')||l.includes('mount')){return `<div class="bg-[#e0f2ff] border-2 border-black rounded-xl p-2 mt-2"><p class="font-black text-[9px] text-center">🗺️ Map Work - Kenya - Colored</p><svg viewBox="0 0 200 150" class="w-full h-28"><rect x="60" y="20" width="80" height="90" fill="#a3d977" stroke="black" stroke-width="2" rx="10"/><circle cx="100" cy="50" r="6" fill="red" stroke="black" stroke-width="1"/><text x="108" y="52" font-size="7" font-weight="900">Nairobi</text><path d="M70 100 Q100 120 130 100" fill="#4a86ff" stroke="black" stroke-width="1"/><text x="70" y="135" font-size="6" font-weight="900">Lake Victoria</text></svg></div>`;} if(l.includes('water cycle')){return `<div class="bg-[#e0f7ff] border-2 border-black rounded-xl p-2 mt-2"><p class="font-black text-[9px] text-center">💧 Water Cycle</p><svg viewBox="0 0 200 100" class="w-full h-20"><ellipse cx="40" cy="20" rx="30" ry="12" fill="white" stroke="black" stroke-width="1"/><rect x="10" y="70" width="180" height="20" fill="#4a86ff" stroke="black" stroke-width="1"/></svg></div>`;} return "";}
function updDay(){document.getElementById('dayInfo').innerHTML=`✅ Today ${todayName} - HW 10 Marks • SomaHub Homework ${todayName}`;}

async function generateMyHomework(){
 currentSubject=document.getElementById('subSel').value; let grade=document.getElementById('gradeSel').value;
 let btn=document.getElementById('myHwBtn'); btn.innerText="⏳ Generating My Homework..."; btn.disabled=true;
 document.getElementById('workArea').classList.remove('hidden');
 document.getElementById('questions').innerHTML="<p class='text-center py-6 font-black text-[11px]'>⏳ Generating colored diagrams + 10 Marks for "+currentSubject+"...</p>";
 let twist=wrongBank.length? `Include twisted versions of these previous wrong: ${wrongBank.slice(-3).map(w=>w.q).join(' | ')}` : "";
 try{
  const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:`Generate My Homework 10 marks ${currentSubject} ${grade} Kenya CBC. 5 questions 2 marks each. MUST include 1 colored diagram question: if SST include map work Kenya with compass/rift valley/lakes, if Science include parts of a flower. ${twist}. Return ONLY JSON [{"q":"...","marks":2,"answer":"short","diagram":"flower or map"}] no extra text.`,grade:grade, shke:currentSHKE, brainContext:"My Homework + Diagrams", photo:""})});
  const d=await r.json(); let txt=d.answer||d.error||"[]"; let m=txt.match(/\[[\s\S]*\]/); if(m){ currentQs=JSON.parse(m[0]); } else { throw "no json"; }
  renderQs();
 }catch(e){
  // Fallback if API fails - still shows diagrams
  currentQs=[
   {q:`${currentSubject} Q1: Define the term map and give 2 uses of maps.`,marks:2,answer:"Map representation uses",diagram:"map"},
   {q:`${currentSubject} Q2: On the colored Kenya map below, identify the capital city marked red.`,marks:2,answer:"Nairobi",diagram:"map"},
   {q:`${currentSubject} Q3: Label the parts of a flower shown in diagram - Petal, Sepal, Stamen.`,marks:2,answer:"Petal Sepal Stamen",diagram:"flower"},
   {q:`${currentSubject} Q4: Name 2 lakes found in Rift Valley region of Kenya.`,marks:2,answer:"Turkana Victoria Baringo",diagram:"map"},
   {q:`${currentSubject} Q5: What is the importance of compass direction in map work?`,marks:2,answer:"Shows direction",diagram:"map"}
  ];
  renderQs();
 }
 btn.innerText="📚 My Homework - Click Here"; btn.disabled=false;
}
function renderQs(){
 document.getElementById('workTitle').innerText=currentSubject+" - My Homework 10 Marks";
 document.getElementById('questions').innerHTML = currentQs.map((c,i)=>{let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||'')); return `<div class="border-2 border-black rounded-xl p-3 bg-[#f9f9f9]"><p class="font-black text-[10px]">Q${i+1} (${c.marks||2} mks) ${c.diagram?'🎨':''}</p><p class="text-[11px] mt-1 font-bold">${c.q}</p>${diag}<input id="ans${i}" type="text" placeholder="Type answer with keyboard..." class="w-full mt-2 border-2 border-black rounded-full p-2.5 text-[11px] font-bold bg-white"><p class="text-[7px] mt-1 opacity-60">OR use 📷 Photo above</p></div>`;}).join('');
 document.getElementById('result').classList.add('hidden'); document.getElementById('corrBtn').classList.add('hidden'); document.getElementById('saveWrongBtn').classList.add('hidden');
 buildPrint(); window.scrollTo(0,300);
}
function buildPrint(){document.getElementById('printDate').innerText=new Date().toLocaleDateString('en-KE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+" • My Homework"; document.getElementById('printSHKE').innerText=currentSHKE+" • "+currentSubject+" • 10 Marks • Mon-Fri"; document.getElementById('printQs').innerHTML=currentQs.map((c,i)=>{let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||'')); return `<div class="border-2 border-black rounded-xl p-3"><p class="font-black text-[12px]">Q${i+1} (${c.marks||2} Marks)</p><p class="text-[12px] mt-2">${c.q}</p>${diag}<div class="mt-3 border border-dashed border-black h-12 rounded-xl"></div></div>`;}).join('');}
function printPDF(){buildPrint(); let area=document.getElementById('printArea'); area.classList.remove('hidden'); window.print(); html2canvas(area,{scale:2}).then(canvas=>{let img=canvas.toDataURL('image/png'); let {jsPDF}=window.jspdf; let pdf=new jsPDF('p','mm','a4'); let w=pdf.internal.pageSize.getWidth(); let h=canvas.height*w/canvas.width; pdf.addImage(img,'PNG',0,0,w,h); pdf.save(`My-Homework-${currentSubject}-${currentSHKE}.pdf`); setTimeout(()=>area.classList.add('hidden'),1000);});}
function checkAnswers(){let score=0,total=0, wrongNow=[]; let html=`<p class="font-black text-[11px]">Result</p>`; currentQs.forEach((c,i)=>{let user=(document.getElementById('ans'+i)?.value||"").trim(); let m=c.marks||2; total+=m; let corr=(c.answer||"").toLowerCase(); let ok=user && (corr.includes(user.toLowerCase())||user.toLowerCase()===corr); let got=ok?m:0; score+=got; if(!ok) wrongNow.push({q:c.q, answer:c.answer, userAns:user}); html+=`<div class="border-2 border-black rounded-xl p-2 mt-2 text-[9px] font-bold ${ok?'bg-[#dcfce7]':'bg-[#ffeaea]'}">${ok?'✅':'❌'} Q${i+1}: ${got}/${m}</div>`;}); html+=`<p class="font-black mt-2">Score ${score}/${total}</p>`; document.getElementById('result').innerHTML=html; document.getElementById('result').classList.remove('hidden'); document.getElementById('corrBtn').classList.remove('hidden'); document.getElementById('saveWrongBtn').classList.remove('hidden'); document.getElementById('scoreBadge').innerText=score+"/"+total; currentWrong=wrongNow; let tt=JSON.parse(localStorage.getItem(ttKey)||'{}'); tt[todayName+'_'+currentSubject]=true; localStorage.setItem(ttKey, JSON.stringify(tt));}
function showCorrection(){let html=`<p class="font-black text-[11px]">Correction with Diagrams</p>`; currentQs.forEach((c,i)=>{let user=document.getElementById('ans'+i)?.value||""; let diag=getDiagramHTML((c.diagram||'')+' '+(c.q||'')); html+=`<div class="border-2 border-black rounded-xl p-2 mt-2 bg-white text-[10px]"><b>Q${i+1}:</b> ${c.q}${diag}<br>Your: <b>${user||'empty'}</b><br><span class="text-green-700 font-black">✔ ${c.answer}</span></div>`;}); document.getElementById('result').innerHTML=html;}
function saveWrongForTomorrow(){if(currentWrong.length==0){alert("Perfect! No wrong"); return;} let all=JSON.parse(localStorage.getItem('soma_wrong')||'[]'); all=all.concat(currentWrong); if(all.length>15) all=all.slice(-15); localStorage.setItem('soma_wrong', JSON.stringify(all)); wrongBank=all; alert("Saved "+currentWrong.length+" wrong → will twist tomorrow");}
document.getElementById('photoInput').addEventListener('change', async e=>{let file=e.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=async()=>{let b64=reader.result.split(',')[1]; document.getElementById('photoPreview').src=reader.result; document.getElementById('photoPreview').classList.remove('hidden'); document.getElementById('photoStatus').classList.remove('hidden'); document.getElementById('photoStatus').innerText="📷 Marking handwritten..."; document.getElementById('workArea').classList.remove('hidden'); document.getElementById('questions').innerHTML="AI reading handwriting + diagrams..."; try{const r=await fetch('/api/gemini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:`Mark photo handwritten homework ${currentSubject} ${gradeSel.value}. Include diagram marks flower/map. Give score /10 corrections twisted next.`,grade:gradeSel.value, shke:currentSHKE, brainContext:"Handwritten", photo:b64})}); let d=await r.json(); let ans=d.answer||"Could not read"; document.getElementById('questions').innerHTML=`<div class="border-2 border-black rounded-xl p-3 bg-white text-[10px] font-bold" style="white-space:pre-wrap">${ans}</div>`; document.getElementById('result').innerHTML=`<div class="bg-[#dcfce7] border-2 border-black rounded-xl p-3 text-[10px] font-bold" style="white-space:pre-wrap">${ans}</div>`; document.getElementById('result').classList.remove('hidden'); document.getElementById('photoStatus').innerText="✅ Marked";}catch{ document.getElementById('photoStatus').innerText="❌ Error"; }}; reader.readAsDataURL(file);});
setTimeout(()=>{let FB=window.FB; FB.onAuthStateChanged(FB.auth, async(u)=>{if(u){let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){currentSHKE=s.data().indexNumber||"SHKE"; indexB.innerText=currentSHKE; gradeSel.value=s.data().grade||"Grade 7";} updDay();}});},600); updDay();
</script>
</body></html>
