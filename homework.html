function cleanSub(s){
 return (s||"").split(" ")[0];
}

function escapeHTML(v){

 return String(v??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function updateSub(){

 currentSubject=cleanSub(
  document.getElementById("subSel").value
 );

 const strand=document.getElementById("strandSel");

 strand.innerHTML=
  (STRANDS[currentSubject]||["General"])
  .map(s=>`<option>${escapeHTML(s)}</option>`)
  .join("");

 updDay();

}

function updDay(){

 const strand=
  document.getElementById("strandSel").value||"";

 document.getElementById("dayInfo").innerHTML=
 `✅ Today ${todayName} •
 ${escapeHTML(currentSubject)} •
 ${escapeHTML(strand)} • AI Homework`;

 document.getElementById("offlineBadge").innerText=
 navigator.onLine?"● Online":"● Offline";

}

let oxVoices=[];

function loadVoices(){

 if("speechSynthesis" in window)
  oxVoices=speechSynthesis.getVoices();

}

if("speechSynthesis" in window){

 loadVoices();

 speechSynthesis.onvoiceschanged=loadVoices;

}

function speakText(t){

 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 let clean=String(t||"")
  .replace(/[*_`#]/g,"")
  .replace(/\n+/g,". ")
  .slice(0,900);

 let utt=new SpeechSynthesisUtterance(clean);

 let isSw=
  /Nomino|Wingi|Sarufi|Hongera|Chagua|Kinyume|Kiswahili|Mtoto|Anaenda/i
  .test(clean)
  ||currentSubject==="Kiswahili";

 let vs=speechSynthesis.getVoices();

 if(!vs.length){

  setTimeout(()=>speakText(t),300);

  return;
 }

 let eng=
  vs.find(v=>v.name.includes("Google UK English Female"))
  ||vs.find(v=>v.lang==="en-GB")
  ||vs.find(v=>v.lang.startsWith("en"))
  ||vs[0];

 let sw=
  vs.find(v=>v.lang.toLowerCase().startsWith("sw"));

 utt.voice=isSw&&sw?sw:eng;

 utt.lang=isSw?"sw-KE":"en-GB";

 utt.rate=blindMode?.75:.82;
 utt.pitch=1;
 utt.volume=1;

 speechSynthesis.speak(utt);

}

function speakQuestion(i){

 const c=currentQs[i];

 if(!c)return;

 let txt=`Question ${i+1}. ${c.q}. `;

 if(c.options?.length){

  txt+=
   `Options. ${
    c.options.map((o,idx)=>
     `Option ${String.fromCharCode(65+idx)}: ${o}`
    ).join(". ")
   }.`;

 }

 speakText(txt);

}

function speakAll(){

 if(!currentQs.length){

  speakText(
   "Tap Generate My Homework first."
  );

  return;
 }

 speakText(
  currentQs
  .map((c,i)=>`Question ${i+1}. ${c.q}.`)
  .join(" ")
 );

}

function toggleBlindMode(){

 blindMode=!blindMode;

 document.getElementById("blindBtn").innerText=
  blindMode
   ?"♿ BIG Mode ON"
   :"♿ Visual Mode OFF - BIG + Voice";

 document.documentElement.style.fontSize=
  blindMode?"120%":"100%";

 if(blindMode)
  speakText(
   "Big mode is on. Tap Oxford Listen to hear the questions."
  );

 updDay();

}

function startVoiceAnswer(i){

 const SR=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

 if(!SR){

  alert(
   "Voice typing is not supported here. Please use Chrome."
  );

  return;
 }

 if(isRecording&&recognition){

  recognition.stop();

  return;

 }

 recognition=new SR();

 recognition.lang=
  currentSubject==="Kiswahili"
   ?"sw-KE"
   :"en-KE";

 recognition.interimResults=false;
 recognition.continuous=false;

 const btn=
  document.getElementById("mic"+i);

 const txtInput=
  document.getElementById("ansText"+i);

 const hidden=
  document.getElementById("ans"+i);

 const stat=
  document.getElementById("micStatus"+i);

 if(!btn||!txtInput||!hidden||!stat)return;

 btn.classList.add(
  "pulse",
  "bg-red-500"
 );

 btn.innerText="🔴";

 stat.innerText=
  "🎤 Listening... speak your answer.";

 stat.classList.remove("hidden");

 isRecording=true;

 recognition.onresult=e=>{

  let tr=
   e.results[0][0]
   .transcript
   .trim();

  const q=currentQs[i];

  if(q.options?.length){

   const lower=tr.toLowerCase();

   const match=q.options.find(o=>

    o.toLowerCase()===lower
    ||
    o.toLowerCase().includes(lower)
    ||
    lower.includes(
     o.toLowerCase().slice(0,3)
    )

   );

   if(match){

    tr=match;

    document
     .querySelectorAll(
      `input[name="ans${i}"]`
     )
     .forEach(r=>{

      r.checked=
       r.value.toLowerCase()
       ===match.toLowerCase();

     });

   }

  }

  txtInput.value=tr;
  hidden.value=tr;

  stat.innerHTML=
   `✅ Heard:
   <b>${escapeHTML(tr)}</b>
   — edit your answer if needed.`;

  stat.className=
   "mt-2 text-[10px] font-black text-center " +
   "bg-[#dcfce7] border-2 border-black " +
   "rounded-full py-2";

 };

 recognition.onend=()=>{

  btn.classList.remove(
   "pulse",
   "bg-red-500"
  );

  btn.innerText="🎤";

  isRecording=false;

  if(navigator.vibrate)
   navigator.vibrate(40);

 };

 recognition.onerror=()=>{

  stat.innerText=
   "❌ Voice not heard. Tap the microphone and try again.";

  btn.classList.remove(
   "pulse",
   "bg-red-500"
  );

  btn.innerText="🎤";

  isRecording=false;

 };

 try{

  recognition.start();

 }catch(e){}

}

function normalizeQuestions(data){

 let raw=
  data?.questions||
  data?.homework||
  data?.items||
  data?.result;

 if(typeof raw==="string"){

  try{
   raw=JSON.parse(raw);
  }catch(e){
   raw=null;
  }

 }

 if(!Array.isArray(raw))
  return [];

 return raw.map((x,i)=>({

  q:String(
   x.question||
   x.q||
   x.text||
   ""
  ).trim(),

  options:
   Array.isArray(x.options)
    ?x.options.map(String)
    :Array.isArray(x.opts)
     ?x.opts.map(String)
     :[],

  answer:String(
   x.answer||
   x.a||
   x.correctAnswer||
   ""
  ).trim(),

  marks:Number(
   x.marks||
   x.mark||
   2
  ),

  strand:String(
   x.strand||
   x.topic||
   x.s||
   document.getElementById("strandSel").value||
   ""
  ).trim(),

  color:
   x.color||
   [
    "#e0f2ff",
    "#fff7e0",
    "#dcfce7",
    "#ffe0f0",
    "#fff"
   ][i%5]

 })).filter(x=>x.q&&x.answer);

}

async function requestAIHomework(){

 const grade=
  document.getElementById("gradeSel").value;

 const subject=currentSubject;

 const strand=
  document.getElementById("strandSel").value;

 const prompt=

`Create a fresh original homework exercise for SomaHub Kenya.

Learner grade: ${grade}
Learning area: ${subject}
Strand/topic: ${strand}

Requirements:

- Match the learner's grade level exactly.
- Create 5 questions worth 2 marks each, total 10 marks.
- Mix multiple-choice and short-answer questions where suitable.
- Make the questions original; do not copy textbook or exam questions.
- Cover the selected strand.
- Use clear Kenyan English, or Kiswahili when the subject is Kiswahili.
- Give one correct answer for each question.
- For MCQs give exactly 4 options.
- For written questions, options should be an empty array.
- Return ONLY valid JSON in this exact shape:

{"questions":[
 {
  "question":"...",
  "options":["A","B","C","D"],
  "answer":"...",
  "marks":2,
  "strand":"..."
 }
]}`;

 const body={

  question:prompt,

  originalQuestion:prompt,

  grade,

  role:"learner",

  task:"homework_generation",

  mode:"homework_generation",

  subject,

  topic:strand,

  strand,

  source:"SomaHub Homework",

  useSomaHubFiles:true,

  provider:"auto"

 };

 const res=await fetch(
  PROXY,
  {
   method:"POST",
   headers:{
    "Content-Type":"application/json"
   },
   body:JSON.stringify(body)
  }
 );

 const text=await res.text();

 let data={};

 try{
  data=JSON.parse(text);
 }catch(e){
  throw new Error(
   "AI returned an invalid response."
  );
 }

 if(!res.ok||data.ok===false){

  throw new Error(
   data.error||
   "AI homework generation failed."
  );

 }

 const qs=normalizeQuestions(data);

 if(qs.length<1)
  throw new Error(
   "AI did not return usable questions."
  );

 return qs.slice(0,10);

}

function normalizeAnswer(v){

 return String(v||"")
  .toLowerCase()
  .replace(/[.,!?;:'"()]/g," ")
  .replace(/\s+/g," ")
  .trim();

}

function answerMatches(user,correct){

 const u=normalizeAnswer(user);
 const a=normalizeAnswer(correct);

 if(!u||!a)return false;

 if(u===a)return true;

 if(a.includes(u)&&u.length>=3)
  return true;

 if(u.includes(a)&&a.length>=3)
  return true;

 const un=u.split(" ");
 const an=a.split(" ");

 const overlap=
  un.filter(
   w=>an.includes(w)&&w.length>2
  ).length;

 return overlap>=
  Math.max(
   1,
   Math.ceil(
    Math.min(
     un.length,
     an.length
    )*.6
   )
  );

}

    document.getElementById(
     "photoPreview"
    );

   img.src=
    URL.createObjectURL(
     file
    );

   img.classList.remove(
    "hidden"
   );

  }
 );

setTimeout(()=>{

 const FB=window.FB;

 FB.onAuthStateChanged(
  FB.auth,
  async u=>{

   if(u){

    try{

     const s=
      await FB.getDoc(
       FB.doc(
        FB.db,
        "users",
        u.uid
       )
      );

     if(s.exists()){

      const d=s.data();

      currentSHKE=
       d.indexNumber||
       "SHKE";

      document.getElementById(
       "indexB"
      ).innerText=
       currentSHKE;

      if(d.grade){

       const allowed=[
        "Grade 4",
        "Grade 5",
        "Grade 6",
        "Grade 7",
        "Grade 8",
        "Grade 9",
        "Grade 10"
       ];

       if(
        allowed.includes(
         d.grade
        )
       ){

        document.getElementById(
         "gradeSel"
        ).value=
         d.grade;

       }

      }

     }

    }catch(e){

     console.warn(
      "User profile could not be loaded.",
      e
     );

    }

   }

   updateSub();

  }
 );

 updateSub();

},600);

window.addEventListener(
 "online",
 updDay
);

window.addEventListener(
 "offline",
 updDay
);

</script>
</body>
</html>
