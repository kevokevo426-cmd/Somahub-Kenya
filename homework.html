<script>
let currentSHKE="SHKE00502", currentQs=[], blindMode=false, recognition=null, isRecording=false;
let todayName=new Date().toLocaleDateString('en-KE',{weekday:'long'});
let currentSubject="SST";
const STRANDS={"English 📖":["Grammar - Tenses 📝","Comprehension 📚","Vocabulary 🌈","Punctuation ✏️","Nouns & Verbs 🎯"],"Mathematics 🔢":["Fractions 🍕","Percentages %","Geometry - Area 📐","Algebra x+y","Number Patterns 🔢"],"Science 🌸":["Flower Parts 🌸","Photosynthesis ☀️","States of Matter 💧","Human Body 🧍","Water Cycle 🌧️"],"SST 🌍":["Map Work - Kenya 🗺️","Rift Valley Lakes 🌊","Compass Direction 🧭","Physical Features ⛰️","People & Population 👨‍👩‍👧"],"Kiswahili 🌾":["Sarufi - Nomino 📝","Wingi & Umoja 🔢","Sentensi 📖","Kinyume ↔️","Methali 🎭"],"CRE 🙏":["Creation 🌍","Commandments 📜","Fruit of Spirit 🍎","Life of Jesus ✝️","Old Testament 📖"]};
function cleanSub(s){return s.split(' ')[0];}
function updateSub(){let raw=subSel.value; currentSubject=cleanSub(raw); let key=Object.keys(STRANDS).find(k=>k.startsWith(currentSubject))||"SST 🌍"; strandSel.innerHTML=(STRANDS[key]||["General"]).map(s=>`<option>${s}</option>`).join(''); updDay();}
function updDay(){let strand=strandSel.value? strandSel.value.split(' ')[0] : ''; dayInfo.innerHTML=`✅ Today ${todayName} • ${currentSubject} ${strand} • 10 Marks`; offlineBadge.innerText=navigator.onLine?'● Online':'● Offline';}

// OXFORD VOICE - FIXED
let oxVoices=[];
function loadVoices(){oxVoices=speechSynthesis.getVoices();}
if('speechSynthesis' in window){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
function speakText(t){
 if(!('speechSynthesis' in window)) return;
 speechSynthesis.cancel();
 let clean=t.replace(/[*_`]/g,'').replace(/\n/g,'. ').slice(0,600);
 let utt=new SpeechSynthesisUtterance(clean);
 let isSw=/Nomino|Wingi|Sarufi|Hongera|Chagua|Kinyume|Kiswahili|Mtoto|Anaenda/i.test(clean)||currentSubject==="Kiswahili";
 let vs=speechSynthesis.getVoices();
 if(vs.length===0){setTimeout(()=>speakText(t),300); return;}
 let eng = vs.find(v=>v.name.includes('Google UK English Female')) || vs.find(v=>v.lang==='en-GB') || vs.find(v=>v.lang.startsWith('en')) || vs[0];
 let sw = vs.find(v=>v.lang.includes('sw'));
 utt.voice = isSw && sw? sw : eng;
 utt.lang = isSw? 'sw-KE' : 'en-GB';
 utt.rate = blindMode? 0.75 : 0.82;
 utt.pitch=1; utt.volume=1;
 speechSynthesis.speak(utt);
}
function speakQuestion(i){
 let c=currentQs[i]; if(!c) return;
 let txt=`Question ${i+1}. ${c.q}. `;
 if(c.options&&c.options.length) txt+=`Options. ${c.options.map((o,idx)=>`Option ${String.fromCharCode(65+idx)}: ${o}`).join('. ')}. `;
 speakText(txt);
}
function speakAll(){if(!currentQs.length) return speakText("Tap My Homework first"); speakText(currentQs.map((c,i)=>`Question ${i+1}. ${c.q}.`).join(' '));}
function toggleBlindMode(){blindMode=!blindMode; blindBtn.innerText=blindMode?"♿ BIG Mode ON":"♿ Visual Mode OFF"; document.documentElement.style.fontSize=blindMode?"120%":"100%"; if(blindMode) speakText("Big mode ON. Tap Listen Oxford to hear."); updDay();}

// MIC EDITABLE
function startVoiceAnswer(i){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){alert("Use Chrome"); return;}
 if(isRecording&&recognition){recognition.stop(); return;}
 recognition=new SR(); recognition.lang=currentSubject==="Kiswahili"?'sw-KE':'en-KE'; recognition.interimResults=false;
 let btn=document.getElementById('mic'+i), txtInput=document.getElementById('ansText'+i), hidden=document.getElementById('ans'+i), stat=document.getElementById('micStatus'+i);
 btn.classList.add('pulse','bg-red-500'); btn.innerText="🔴"; stat.innerText="🎤 Listening..."; stat.classList.remove('hidden'); isRecording=true;
 recognition.onresult=e=>{
   let tr=e.results[0][0].transcript.trim();
   let q=currentQs[i];
   if(q.options){
     let match=q.options.find(o=> o.toLowerCase().includes(tr.toLowerCase()) || tr.toLowerCase().includes(o.toLowerCase().slice(0,3)));
     if(match){ tr=match; document.querySelectorAll(`input[name="ans${i}"]`).forEach(r=>{if(r.value.toLowerCase()===match.toLowerCase()) r.checked=true;}); }
   }
   if(txtInput){ txtInput.value=tr; }
   if(hidden){ hidden.value=tr; }
   stat.innerHTML=`✅ Heard: <b>${tr}</b> - EDIT below if needed`;
   stat.className="mt-2 text-[10px] font-black text-center bg-[#dcfce7] border-2 border-black rounded-full py-2";
 };
 recognition.onend=()=>{btn.classList.remove('pulse','bg-red-500'); btn.innerText="🎤"; isRecording=false; if(navigator.vibrate) navigator.vibrate(40);};
 recognition.onerror=()=>{stat.innerText="❌ Try again"; btn.classList.remove('pulse','bg-red-500'); btn.innerText="🎤"; isRecording=false;};
 recognition.start();
}

const FALLBACK={
 "English": [{q:"She ___ to school every day.", opts:["go","goes","going","gone"], a:"goes", m:2, s:"Tenses", color:"#e0f2ff"},{q:"Find noun: The beautiful flower is blooming", opts:["beautiful","flower","is","blooming"], a:"flower", m:2, s:"Nouns", color:"#ffe0f0"},{q:"Past tense of write?", opts:["writed","wrote","written","writing"], a:"wrote", m:2, s:"Tenses", color:"#fff7e0"},{q:"Synonym for happy?", opts:["sad","joyful","angry","tired"], a:"joyful", m:2, s:"Vocab", color:"#dcfce7"},{q:"I ___ my homework yesterday", opts:[], a:"did", m:2, s:"Grammar", color:"#fff"}],
 "Mathematics": [{q:"Solve: 3/4 + 1/4 =?", opts:["1/2","1","2","3/4"], a:"1", m:2, s:"Fractions", color:"#fff7e0"},{q:"25% of 200?", opts:["25","50","75","100"], a:"50", m:2, s:"Percentages", color:"#e0f2ff"},{q:"Area triangle base 10 height 6?", opts:["30","60","15","30cm²"], a:"30", m:2, s:"Geometry", color:"#ffe0f0"},{q:"x+5=12, x=?", opts:["5","7","12","17"], a:"7", m:2, s:"Algebra", color:"#dcfce7"},{q:"Next: 2,4,6,8,?", opts:["10","12","9","11"], a:"10", m:2, s:"Patterns", color:"#fff"}],
 "Science": [{q:"Which part makes pollen?", opts:["Petal","Stamen","Sepal","Root"], a:"Stamen", m:2, s:"Flower", color:"#ffe0f0"},{q:"Name 2 parts of flower", opts:["Petal Sepal","Root Leaf","Stem Bark","Soil Water"], a:"Petal Sepal", m:2, s:"Flower", color:"#ffe0f0"},{q:"What is photosynthesis?", opts:["Plant makes food","Plant drinks","Plant sleeps","Plant walks"], a:"Plant makes food", m:2, s:"Photo", color:"#dcfce7"},{q:"States of matter?", opts:["Solid liquid gas","Hot cold","Big small","Red blue"], a:"Solid liquid gas", m:2, s:"Matter", color:"#e0f2ff"},{q:"Which part holds ovary?", opts:[], a:"Pistil", m:2, s:"Flower", color:"#fff"}],
 "SST": [{q:"Define map and give 2 uses", opts:[], a:"Map representation", m:2, s:"Map Work", color:"#d0e8ff"},{q:"Capital of Kenya on map?", opts:["Nairobi","Mombasa","Kisumu","Nakuru"], a:"Nairobi", m:2, s:"Map Work", color:"#d0e8ff"},{q:"Name 2 lakes in Rift Valley", opts:["Turkana Baringo","Victoria","Naivasha only","Tanganyika"], a:"Turkana Baringo", m:2, s:"Rift", color:"#d0e8ff"},{q:"What shows direction on map?", opts:["Compass","Ruler","Pencil","Eraser"], a:"Compass", m:2, s:"Compass", color:"#d0e8ff"},{q:"2 physical features of Kenya?", opts:[], a:"Mountains Rift", m:2, s:"Features", color:"#fff"}],
 "Kiswahili": [{q:"Chagua: Mtoto ___ shuleni", opts:["anaenda","wanaenda","tunaenda","ninaenda"], a:"anaenda", m:2, s:"Sarufi", color:"#dcfce7"},{q:"Kinyume cha kubwa ni?", opts:["ndogo","kubwa","dogo","kubwa sana"], a:"ndogo", m:2, s:"Kinyume", color:"#fff7e0"},{q:"Nomino ni nini?", opts:["jina la kitu","tendo","kielezi","kiwakilishi"], a:"jina la kitu", m:2, s:"Nomino", color:"#e0f2ff"},{q:"Wingi wa kitabu?", opts:["vitabu","kitabu","mavitabu","ma-"], a:"vitabu", m:2, s:"Wingi", color:"#ffe0f0"},{q:"Andika sentensi na mwalimu", opts:[], a:"Mwalimu anafundisha", m:2, s:"Sentensi", color:"#fff"}],
 "CRE": [{q:"Who created world?", opts:["God","Man","Angel","Devil"], a:"God", m:2, s:"Creation", color:"#fff7e0"},{q:"2 fruits of Holy Spirit", opts:["Love joy","Hate anger","Fear worry","Sadness"], a:"Love joy", m:2, s:"Spirit", color:"#dcfce7"},{q:"First man?", opts:["Adam","Moses","Jesus","Noah"], a:"Adam", m:2, s:"Old", color:"#e0f2ff"},{q:"How many commandments?", opts:["5","10","12","7"], a:"10", m:2, s:"Commandments", color:"#fff"},{q:"Jesus born in?", opts:["Bethlehem","Nazareth","Jerusalem","Cairo"], a:"Bethlehem", m:2, s:"Jesus", color:"#fff7e0"}]
};

function generateMyHomework(){
 currentSubject=cleanSub(subSel.value); updateSub();
 myHwBtn.innerText="⏳ Loading..."; myHwBtn.disabled=true;
 workArea.classList.remove('hidden');
 questions.innerHTML=`<p class='text-center py-8 font-black'>⏳ Loading ${currentSubject}...</p>`;
 setTimeout(()=>{
  let base=FALLBACK[currentSubject]||FALLBACK["Kiswahili"];
  currentQs=base.map(x=>({q:x.q, options:x.opts, answer:x.a, marks:x.m, strand:x.s, color:x.color}));
  renderQs();
 },300);
}

function renderQs(){
 myHwBtn.innerText="📚 TAP HERE - My Homework! 🚀"; myHwBtn.disabled=false;
 workTitle.innerText=`${currentSubject} - ${strandSel.value||''}`; headerTitle.innerText=`🌈 ${currentSubject}`;
 updDay();
 questions.innerHTML=currentQs.map((c,i)=>{
   let isMCQ=c.options&&c.options.length>0;
   let bg=c.color||"#fff";
   let optsHTML=isMCQ? `
     <div class="mt-4 space-y-3">
       ${c.options.map((opt,oi)=>`
         <label class="flex items-center gap-3 bg-white border-[2.5px] border-black rounded-full px-4 py-4 cursor-pointer shadow-[2px_2px_0_0_#000] hover:bg-[#ffcc1a]">
           <input type="radio" name="ans${i}" value="${opt}" onchange="document.getElementById('ans${i}').value=this.value; document.getElementById('ansText${i}').value=this.value; speakText('${opt.replace(/'/g,'')}')" class="w-6 h-6 accent-black shrink-0">
           <span class="font-black text-[13px]">${String.fromCharCode(65+oi)}. ${opt}</span>
         </label>`).join('')}
     </div>
     <div class="mt-3">
       <p class="text-[9px] font-black opacity-60">✏️ EDIT answer (after 🎤 or A B C D):</p>
       <div class="flex gap-2 mt-1">
         <input id="ansText${i}" type="text" placeholder="Your answer appears here - EDITABLE" class="flex-1 border-[2.5px] border-black rounded-full p-3 text-[13px] font-bold bg-[#fff7e0] shadow-[1px_1px_0_0_#000]" oninput="document.getElementById('ans${i}').value=this.value">
         <button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center text-[18px]">🎤</button>
       </div>
       <input id="ans${i}" type="hidden">
     </div>` : `
     <div class="mt-3 flex gap-2">
       <input id="ansText${i}" type="text" placeholder="Type or tap 🎤 - EDITABLE" class="flex-1 border-[2.5px] border-black rounded-full p-4 text-[13px] font-bold bg-white shadow-[1px_1px_0_0_#000]" oninput="document.getElementById('ans${i}').value=this.value">
       <button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center">🎤</button>
     </div>
     <input id="ans${i}" type="hidden">`;

   return `<div class="border-[3px] border-black rounded-[1.3rem] p-4 shadow-[4px_4px_0_0_#000]" style="background:${bg}">
     <div class="flex justify-between items-center"><span class="bg-black text-white px-3 py-1 rounded-full text-[10px] font-black">Q${i+1} • ${c.strand||''}</span><button onclick="speakQuestion(${i})" class="bg-[#4a86ff] text-white border-2 border-black rounded-full px-4 py-2 text-[11px] font-black shadow-[1px_1px_0_0_#000]">🔊 Oxford Listen</button></div>
     <p class="font-black text-[15px] mt-3">${c.q}</p>
     ${optsHTML}
     <p id="micStatus${i}" class="hidden mt-2 text-[10px] font-black text-center border-2 border-black rounded-full py-2 bg-[#ffcc1a]"></p>
   </div>`;
 }).join('');
 result.classList.add('hidden'); corrBtn.classList.add('hidden'); nextBtn.classList.add('hidden');
 window.scrollTo(0,280);
}

function saveToHistory(s,t){let h=JSON.parse(localStorage.getItem('soma_hw_history')||'[]'); h.push({date:new Date().toISOString(), dateStr:new Date().toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}), subject:currentSubject, strand:strandSel.value, score:s, total:t, questions:currentQs, answers:currentQs.map((_,i)=>document.getElementById('ans'+i)?.value||document.getElementById('ansText'+i)?.value||""), shke:currentSHKE}); if(h.length>100)h=h.slice(-100); localStorage.setItem('soma_hw_history',JSON.stringify(h));}
function showHistory(type){let h=JSON.parse(localStorage.getItem('soma_hw_history')||'[]'), list=historyList; list.classList.remove('hidden'); if(!h.length){list.innerHTML="<p class='text-[11px] text-center py-3'>No history yet</p>"; return;} let f=h; if(type==='yesterday'){let y=new Date(); y.setDate(y.getDate()-1); f=h.filter(x=>new Date(x.date).toDateString()===y.toDateString());} else if(type==='week'){let w=new Date(); w.setDate(w.getDate()-7); f=h.filter(x=>new Date(x.date)>=w);} if(!f.length){list.innerHTML=`<p class='text-[10px] text-center'>No work for ${type}</p>`; return;} list.innerHTML=f.reverse().map((x)=>{let idx=h.indexOf(x); return `<div class="border-[2.5px] border-black rounded-xl p-3 bg-[#f9f9f9]"><div class="flex justify-between"><p class="font-black text-[11px]">${x.dateStr} - ${x.subject}</p><span class="bg-black text-white px-2 py-0.5 rounded-full text-[9px]">${x.score}/${x.total}</span></div><div class="grid grid-cols-2 gap-2 mt-2"><button onclick="viewOldWork(${idx})" class="bg-white border-2 border-black rounded-full py-2 text-[10px] font-black">View</button><button onclick="deleteWork(${idx})" class="bg-red-500 text-white border-2 border-black rounded-full py-2 text-[10px] font-black">Delete</button></div></div>`;}).join('');}
function viewOldWork(i){let h=JSON.parse(localStorage.getItem('soma_hw_history')||'[]')[i]; if(!h)return; currentQs=h.questions; workArea.classList.remove('hidden'); workTitle.innerText=`Past ${h.dateStr} ${h.score}/${h.total}`; scoreBadge.innerText=h.score+"/"+h.total; questions.innerHTML=h.questions.map((c,j)=>`<div class="border-[2.5px] border-black rounded-xl p-3 bg-white"><p class="font-black text-[11px]">Q${j+1}</p><p class="font-bold text-[12px]">${c.q}</p><p class="text-[10px] mt-1">Your: <b>${h.answers[j]||''}</b></p><p class="text-[10px] text-green-700 font-black">✔ ${c.answer}</p></div>`).join('');}
function deleteWork(i){if(!confirm("Delete?"))return; let h=JSON.parse(localStorage.getItem('soma_hw_history')||'[]'); h.splice(i,1); localStorage.setItem('soma_hw_history',JSON.stringify(h)); showHistory('all');}
function checkAnswers(){
 let empty=0; currentQs.forEach((_,i)=>{let v=document.getElementById('ans'+i)?.value||document.getElementById('ansText'+i)?.value; if(!v?.trim()) empty++;});
 if(empty===currentQs.length){speakText("Please answer. Tap A B C D or microphone."); return alert("Tap A B C D or 🎤"); }
 let score=0,total=0; let html=`<p class="font-black text-[13px]">🎉 Result - ${currentSubject}</p>`;
 currentQs.forEach((c,i)=>{let user=(document.getElementById('ans'+i)?.value||document.getElementById('ansText'+i)?.value||"").trim(); let m=c.marks||2; total+=m; let ok=user&&c.answer.toLowerCase().includes(user.toLowerCase().slice(0,4)); let got=ok?m:0; score+=got; html+=`<div class="border-[2.5px] border-black rounded-xl p-3 mt-2 text-[11px] font-black ${ok?'bg-[#dcfce7]':'bg-[#ffeaea]'}">${ok?'✅':'❌'} Q${i+1} ${got}/${m}</div>`;});
 html+=`<p class="font-black mt-4 text-[18px] text-center">${score>=8?'🌟':score>=5?'👏':'💪'} Score ${score}/${total}</p>`; result.innerHTML=html; result.classList.remove('hidden'); result.className="mt-4 p-4 border-[3px] border-black rounded-[1.2rem] bg-white shadow-[3px_3px_0_0_#000]"; corrBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden'); scoreBadge.innerText=score+"/"+total; saveToHistory(score,total);
 let msg=score>=8?`Congratulations! Excellent! You completed ${currentSubject} ${strandSel.value}. You scored ${score} out of ${total}. You are a star!`:score>=5?`Good job! You completed ${currentSubject} ${strandSel.value}. You scored ${score} out of ${total}. Keep it up!`:`You completed ${currentSubject} ${strandSel.value}. You scored ${score} out of ${total}. Don't worry, we will practice tomorrow!`;
 speakText(msg); if(navigator.vibrate) navigator.vibrate([100,50,100]);
}
function showCorrection(){let html=`<p class="font-black text-[12px]">📖 Correction</p>`; currentQs.forEach((c,i)=>{let user=document.getElementById('ansText'+i)?.value||document.getElementById('ans'+i)?.value||"empty"; html+=`<div class="border-[2.5px] border-black rounded-xl p-3 mt-3 bg-white"><p class="font-black text-[11px]">Q${i+1}: ${c.q}</p><p class="text-[11px] mt-1">Your: <b>${user}</b></p><p class="text-[11px] text-green-700 font-black">✔ ${c.answer}</p><button onclick="speakText('${c.answer.replace(/'/g,'')}')" class="mt-2 bg-black text-white px-3 py-1 rounded-full text-[9px] font-black">🔊 Hear Answer</button></div>`;}); result.innerHTML=html;}
function nextHomework(){let subs=["SST","Science","Mathematics","English","Kiswahili","CRE"], idx=subs.indexOf(currentSubject), nxt=subs[(idx+1)%subs.length]; subSel.value=nxt+" 🌍"; updateSub(); generateMyHomework(); window.scrollTo(0,0);}
function printPDF(){let area=document.getElementById('printArea'); printQs.innerHTML=currentQs.map((c,i)=>`<div class="border-2 border-black rounded-xl p-3 mt-2"><p class="font-black">Q${i+1} ${c.q}</p><div class="h-10 border border-dashed mt-2"></div></div>`).join(''); area.classList.remove('hidden'); html2canvas(area,{scale:2}).then(can=>{let img=can.toDataURL('image/png'); let {jsPDF}=window.jspdf; let pdf=new jsPDF('p','mm','a4'); let w=pdf.internal.pageSize.getWidth(); let h=can.height*w/can.width; pdf.addImage(img,'PNG',0,0,w,h); pdf.save(`Homework-${currentSubject}.pdf`); setTimeout(()=>area.classList.add('hidden'),1000);});}
setTimeout(()=>{let FB=window.FB; FB.onAuthStateChanged(FB.auth,async u=>{if(u){let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){currentSHKE=s.data().indexNumber||"SHKE"; indexB.innerText=currentSHKE; gradeSel.value=s.data().grade||"Grade 7";} updateSub();}}); updateSub();},600); updateSub();
</script>
</body></html>
