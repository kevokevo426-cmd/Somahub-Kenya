<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily HW - Mon-Fri 10 Marks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Nunito',sans-serif;background:#f6f6f7}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),doc,getDoc,collection,getDocs,query,where,onAuthStateChanged};
</script>
</head>
<body class="flex justify-center"><div class="w-full max-w-[460px] bg-[#f6f6f7] min-h-screen pb-10">
<div class="h-2 flex"><div class="flex-1 bg-[#ff8a2a]"></div><div class="flex-1 bg-[#2ac5a0]"></div><div class="flex-1 bg-[#4a86ff]"></div><div class="flex-1 bg-[#ffcc1a]"></div></div>
<div class="bg-white border-b-2 border-black p-3 flex justify-between items-center sticky top-0 z-40">
<a href="student.html" class="bg-black text-white px-4 py-2 rounded-full font-black text-[11px]">← Back</a>
<p class="font-black text-[13px]">📝 Daily HW</p>
<span id="indexB" class="bg-blue-600 text-white px-2 py-1 rounded-full text-[9px] font-black">SHKE...</span>
</div>
<div class="p-3 space-y-3">
<div class="bg-gradient-to-br from-green-600 to-emerald-700 text-white rounded-[1.5rem] p-5 border-2 border-black shadow-[3px_3px_0_0_#000]">
<p class="font-black text-[16px]">📅 Daily HW - Mon to Fri ONLY - 10 Marks</p>
<p class="text-[11px] mt-2">✅ Mon-Fri 10 Marks • ❌ Sat No HW • ❌ Sun Rest Day - Do Exam / Notes / ICT / Foreign Lang • If miss Mon → Tue 20 Marks</p>
</div>
<div class="bg-white rounded-xl p-3 border-2 border-black shadow-[2px_2px_0_0_#000] space-y-2">
<div class="grid grid-cols-2 gap-2">
<select id="gradeSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>Grade 6</option><option>Grade 4</option><option>Grade 5</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option></select>
<select id="subSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>All Subjects</option><option>Mathematics</option><option>English</option><option>Kiswahili</option><option>Science</option><option>SST</option><option>CRE</option><option>ICT & Coding</option><option>Foreign Language - French</option><option>Foreign Language - German</option><option>Foreign Language - Chinese</option></select>
</div>
<button onclick="loadHW()" class="w-full bg-black text-white border-2 border-black rounded-full py-3 font-black text-[11px]">🔍 Show Today's HW - Mon-Fri</button>
</div>
<div id="dayInfo" class="bg-white border-2 border-black rounded-xl p-3 text-[11px] font-bold text-center"></div>
<div id="hwList" class="space-y-3"></div>
</div>
</div>
<script>
let currentSHKE="SHKE";
function getDay(){let d=new Date().getDay(); if(d===0) return{can:false,msg:"😴 Sunday Rest Day - No HW - Do Weekly Exam Sat-Sun or ICT / Foreign Lang Notes"}; if(d===6) return{can:false,msg:"😴 Saturday - No HW - Weekly Exam Sat-Sun available"}; return{can:true,msg:`✅ Today ${new Date().toLocaleDateString('en-US',{weekday:'long'})} - Daily HW 10 Marks Available`};}
function updDay(){let s=getDay(); document.getElementById('dayInfo').innerHTML=`${s.msg}<br><span class="text-[9px] text-gray-500">SHKE ${currentSHKE} • Mon-Fri 10 Marks</span>`;}
async function loadHW(){let FB=window.FB,grade=gradeSel.value,sub=subSel.value,list=document.getElementById('hwList'),day=getDay(); if(!day.can){list.innerHTML=`<div class="bg-white border-2 border-dashed border-black rounded-xl p-4 text-center"><p class="font-black text-[11px]">${day.msg}</p><a href="exam.html" class="mt-3 inline-block bg-[#4a86ff] text-white px-4 py-2 rounded-full text-[10px] font-black border-2 border-black">Go to Weekly Exam Sat-Sun →</a><div class="mt-2 flex gap-2 justify-center"><a href="ict.html" class="bg-black text-white px-3 py-1.5 rounded-full text-[9px] font-black">💻 ICT</a><a href="foreign-language.html" class="bg-black text-white px-3 py-1.5 rounded-full text-[9px] font-black">🌐 Foreign</a></div></div>`;return;} list.innerHTML="<p class='text-center py-4 text-[11px]'>Loading...</p>"; try{let q; if(sub==="All Subjects") q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("type","==","Homework")); else q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("subject","==",sub),FB.where("type","==","Homework")); let snap=await FB.getDocs(q); list.innerHTML=""; if(snap.empty){list.innerHTML=`<div class="bg-white border-2 border-black rounded-xl p-4 text-center shadow-[2px_2px_0_0_#000]"><p class="font-black text-[11px]">No HW Yet for ${grade} - ${sub}</p><button onclick="location.href='ai.assistant.html?type=homework&subject=${encodeURIComponent(sub)}&grade=${grade}'" class="mt-3 bg-black text-white px-4 py-2 rounded-full text-[10px] font-black">Generate AI 10 Marks</button></div>`;return;} snap.forEach(d=>{let hw=d.data(); list.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-3 shadow-[2px_2px_0_0_#000]"><div class="flex justify-between"><p class="font-black text-[12px]">${hw.subject||sub}</p><span class="bg-[#ffcc1a] px-2 py-0.5 rounded-full text-[8px] font-black border border-black">10 Marks</span></div><p class="text-[10px] text-gray-600 mt-1">${hw.title||'Daily HW Mon-Fri'}</p><button class="mt-2 w-full bg-black text-white rounded-full py-2 font-black text-[10px]">Do HW →</button></div>`;});}catch(e){list.innerHTML="<p class='text-center text-[10px] text-red-500'>Error</p>";}}
setTimeout(()=>{let FB=window.FB; FB.onAuthStateChanged(FB.auth, async(u)=>{if(u){let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){currentSHKE=s.data().indexNumber||"SHKE"; indexB.innerText=currentSHKE; gradeSel.value=s.data().grade||"Grade 6";} updDay(); loadHW();}});},600); updDay();
</script>
</body></html>
