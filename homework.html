function fixSpacing(t){ if(!t) return ""; let s=String(t); s=s.replace(/Socie\s+ty/g,"Society").replace(/\bb\s+y\b/g,"by").replace(/Develop\s+ment/g,"Development").replace(/Activi\s+ties/g,"Activities").replace(/Learn\s+ing/g,"Learning"); return s; }
function isJunk(t){ if(!t) return true; t=String(t).trim(); if(t.length<300) return true; if(t.includes("uc?export")||t.includes("drive.google.com")) return true; return false; }
function normSubject(s){ s=String(s||"").toLowerCase().trim(); if(s==="agriculture and nutrition"||s==="agriculture") return "agriculture"; if(s.includes("language activities")) return "language activities"; if(s.includes("mathematical")) return "mathematical activities"; if(s.includes("environmental")) return "environmental activities"; if(s.includes("psychomotor")||s.includes("creative")) return "creative"; if(s.includes("movement")) return "movement activities"; if(s.includes("religious")||s==="cre"||s==="ire"||s==="hre") return "religious"; if(s.includes("kiswahili")) return "kiswahili"; if(s.includes("english")) return "english"; if(s.includes("mathematics")) return "mathematics"; if(s.includes("integrated")) return "integrated science"; if(s.includes("social")) return "social"; if(s.includes("pre-technical")) return "pre-technical"; if(s.includes("science")) return "science"; return s; }
/* ===== DESIGN OR NOTES - EITHER - BOTH COMBINED ===== */
function getNoteTextFor(design){
  let out=[];
  ALL_NOTES.forEach(n=>{
    let match=false;
    if(design && (n.resourceId===design.id || n.designId===design.id || n.resource_id===design.id)) match=true;
    if(!match && design && String(n.grade||"").trim()===String(design.grade||"").trim() && normSubject(n.subject)===normSubject(design.subject)) match=true;
    if(!match && !design && String(n.grade||"").trim()===String(document.getElementById("gradeSel").value||"").trim() && normSubject(n.subject)===normSubject(currentSubject)) match=true;
    if(match){
      let t=n.text||n.content||n.fullText||n.notes||n.body||n.description||"";
      if(t && !isJunk(t)) out.push(fixSpacing(t));
    }
  });
  return out.join("\n\n--- NOTES ---\n\n");
}
function getDesignText(r){
  if(!r) return "";
  let parts=[];
  if(r.fullText && !isJunk(r.fullText)) parts.push(fixSpacing(r.fullText));
  let m=AI_BRAIN.find(x=>x.resourceId===r.id);
  if(m && m.text && !isJunk(m.text)) parts.push(fixSpacing(m.text));
  let m2=AI_BRAIN.find(x=>x.title===r.title && x.grade===r.grade && x.subject===r.subject);
  if(m2 && m2.text && !isJunk(m2.text) && !parts.includes(fixSpacing(m2.text))) parts.push(fixSpacing(m2.text));
  return parts.join("\n\n--- DESIGN ---\n\n");
}
/* Combined source: Design + Notes, either or both */
function getCombinedSourceText(){
  let designText = CURRENT_DESIGN ? getDesignText(CURRENT_DESIGN) : "";
  let noteText = getNoteTextFor(CURRENT_DESIGN);
  if(!CURRENT_DESIGN && !noteText){
    // No design at all - try notes by grade+subject alone
    let byGS = ALL_NOTES.filter(n=>String(n.grade||"").trim()===String(document.getElementById("gradeSel").value||"").trim() && normSubject(n.subject)===normSubject(currentSubject));
    if(byGS.length){
      noteText = byGS.map(n=>fixSpacing(n.text||n.content||n.fullText||n.notes||"")).filter(t=>t && !isJunk(t)).join("\n\n--- NOTES ---\n\n");
      if(noteText) CURRENT_SOURCE="notes-only";
    }
  } else if(designText && noteText) CURRENT_SOURCE="design+notes";
  else if(designText) CURRENT_SOURCE="design-only";
  else if(noteText) CURRENT_SOURCE="notes-only";
  else CURRENT_SOURCE="none";
  let combined="";
  if(designText) combined+=`=== DESIGN (KICD Curriculum Design) ===\n${designText}\n\n`;
  if(noteText) combined+=`=== NOTES (Teacher / Learner Notes) ===\n${noteText}\n\n`;
  return combined;
}
function describeSource(){
  let info=document.getElementById("sourceInfo"); if(!info) return;
  let designText = CURRENT_DESIGN ? getDesignText(CURRENT_DESIGN) : "";
  let noteText = getNoteTextFor(CURRENT_DESIGN);
  if(CURRENT_SOURCE==="design+notes") info.innerHTML=`📚 <b>Source: Design + Notes</b> • Design: ${designText.length} chars + Notes: ${noteText.length} chars — Homework will use BOTH together.`;
  else if(CURRENT_SOURCE==="design-only") info.innerHTML=`📘 <b>Source: Design only</b> • ${designText.length} chars — No Notes found for this Grade + Subject. Homework from Design.`;
  else if(CURRENT_SOURCE==="notes-only") info.innerHTML=`📝 <b>Source: Notes only</b> • ${noteText.length} chars — No Design found. Homework from Notes.`;
  else info.innerHTML=`⚠️ <b>Source: None</b> — No Design, no Notes for this Grade + Subject. Homework will use CBC standard for this subject only.`;
  info.classList.remove("hidden");
}
async function loadDesignsFromFirestore(){
  let FB=window.FB;
  try{ let s=await FB.getDocs(FB.collection(FB.db,'resources')); ALL_DESIGNS=[]; s.forEach(d=>ALL_DESIGNS.push({id:d.id,...d.data()})); }catch(e){ ALL_DESIGNS=[]; }
  try{ let b=await FB.getDocs(FB.collection(FB.db,'ai_brain')); AI_BRAIN=[]; b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()})); }catch(e){ AI_BRAIN=[]; }
  // NOTES: try every collection name Admin might use - first one that exists wins, then merge rest
  ALL_NOTES=[];
  let noteCols=["notes","curriculum_notes","design_notes","student_notes","lesson_notes","study_notes"];
  for(let col of noteCols){
    try{ let s=await FB.getDocs(FB.collection(FB.db,col)); s.forEach(d=>{ let data=d.data(); ALL_NOTES.push({id:d.id, _col:col, ...data}); }); }catch(e){}
  }
  // Also: notes stored inside resources with type=Notes
  ALL_DESIGNS.forEach(r=>{ if(String(r.type||"").toLowerCase().includes("note")){ ALL_NOTES.push({id:r.id, _col:"resources-notes", grade:r.grade, subject:r.subject, title:r.title, text:r.fullText||r.description||"", resourceId:r.id}); } });
  onGradeSubjectChange();
}
function matchDesign(grade, subject){
  let g=String(grade||"").trim(); let want=normSubject(subject);
  let list=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g && normSubject(r.subject)===want);
  if(list.length) return list[0];
  let list2=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g && String(r.subject||"").toLowerCase().trim()===String(subject||"").toLowerCase().trim());
  if(list2.length) return list2[0];
  return null;
}
function buildGradeSelect(){ let sel=document.getElementById("gradeSel"); sel.innerHTML=GRADES.map(g=>`<option ${g==="Grade 8"?"selected":""}>${g}</option>`).join(""); }
function onGradeChange(){ let grade=document.getElementById("gradeSel").value; let subSel=document.getElementById("subSel"); let subjects=GRADE_SUBJECTS[grade]||["English"]; subSel.innerHTML=subjects.map(s=>`<option>${escapeHTML(s)}</option>`).join(""); updateSub(); }
function onGradeSubjectChange(){ updateSub(); let grade=document.getElementById("gradeSel").value; let subj=document.getElementById("subSel").value; let d=matchDesign(grade, subj); CURRENT_DESIGN=d; getCombinedSourceText(); describeSource(); let info=document.getElementById("designInfo"); if(!info) return; if(d){ let txt=getDesignText(d); info.innerHTML=`✅ <b>Using:</b> ${escapeHTML(d.title||d.subject||"")} • ${escapeHTML(d.grade||"")} ${escapeHTML(d.subject||"")} • ${txt?`Design: ${txt.length} chars`:`No Design text`} • Notes: ${getNoteTextFor(d).length} chars`; } else { let nt=getNoteTextFor(null); if(nt) info.innerHTML=`📝 <b>No Design, but Notes found</b> for ${escapeHTML(grade)} — ${escapeHTML(subj)} • Notes: ${nt.length} chars — Homework from Notes.`; else info.innerHTML=`⚠️ <b>No Design, no Notes</b> for ${escapeHTML(grade)} — ${escapeHTML(subj)}. Upload Design or Notes in Admin with EXACT Grade + Subject.`; } updDay(); }
function cleanSub(s){ return (s||"").trim(); }
function escapeHTML(v){ return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function updateSub(){ currentSubject=cleanSub(document.getElementById("subSel").value); const strand=document.getElementById("strandSel"); let list=STRANDS[currentSubject]||["General"]; strand.innerHTML=list.map(s=>`<option>${escapeHTML(s)}</option>`).join(""); let grade=document.getElementById("gradeSel").value; let d=matchDesign(grade, currentSubject); CURRENT_DESIGN=d; getCombinedSourceText(); describeSource(); let info=document.getElementById("designInfo"); if(info){ if(d){ let txt=getDesignText(d); info.innerHTML=`✅ <b>Using:</b> ${escapeHTML(d.title||d.subject||"")} • ${escapeHTML(d.grade||"")} ${escapeHTML(d.subject||"")} • Design: ${txt.length} chars • Notes: ${getNoteTextFor(d).length} chars`; } else { let nt=getNoteTextFor(null); if(nt) info.innerHTML=`📝 <b>No Design, but Notes found</b> • Notes: ${nt.length} chars — Homework from Notes.`; else info.innerHTML=`⚠️ <b>No Design, no Notes</b> for ${escapeHTML(grade)} — ${escapeHTML(currentSubject)}.`; } } updDay(); }

function getDesignKeywords(){
  let combined=getCombinedSourceText();
  let title=(CURRENT_DESIGN ? (CURRENT_DESIGN.title||"") : "") + " " + currentSubject + " " + (document.getElementById("strandSel").value||"");
  let all=(combined+" "+title).toLowerCase();
  let stop=new Set(["grade","learning","area","topic","design","curriculum","kenya","learner","should","strand","focuses","using","practicing","exploring","planning","notes"]);
  let words=all.split(/[^a-z]+/).filter(w=>w.length>=4 && !stop.has(w));
  let freq={}; words.forEach(w=>freq[w]=(freq[w]||0)+1);
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,60);
}
function questionsAreFromDesign(qs){
  let combined=getCombinedSourceText(); if(!combined) return true;
  let keys=getDesignKeywords();
  let joined=qs.map(q=>(q.q+" "+q.answer).toLowerCase()).join(" ");
  let hits=keys.filter(k=>joined.includes(k)).length;
  let generic=["which one is a crop","maize / stone","which tool do we use to dig","plants need ___ to grow"];
  if(generic.some(g=>joined.includes(g)) && !combined.toLowerCase().includes("maize")) return false;
  return hits>=3;
}

function getFallbackFor(subject, grade){

  else if(s.includes("movement")) key="Movement Activities";
  else if(s.includes("religious")||s==="cre"||s.includes("cre ")) key="CRE";
  else if(s.includes("kiswahili")) key="Kiswahili";

function normalizeQuestions(data){ let raw=data?.questions||data?.homework||data?.items||data?.result; if(typeof raw==="string"){ try{ raw=JSON.parse(raw); }catch(e){ raw=null; } } if(!Array.isArray(raw)) return []; return raw.map((x,i)=>({ q:String(x.question||x.q||x.text||"").trim(), options:Array.isArray(x.options)?x.options.map(String):Array.isArray(x.opts)?x.opts.map(String):[], answer:String(x.answer||x.a||x.correctAnswer||"").trim(), marks:Number(x.marks||x.mark||2), strand:String(x.strand||x.topic||x.s||document.getElementById("strandSel").value||"").trim(), color:x.color||["#e0f2ff","#fff7e0","#dcfce7","#ffe0f0","#fff"][i%5] })).filter(x=>x.q&&x.answer); }
async function requestAIHomework(){ const grade=document.getElementById("gradeSel").value; const subject=currentSubject; const strand=document.getElementById("strandSel").value; let combined=getCombinedSourceText(); let designTitle=CURRENT_DESIGN ? (CURRENT_DESIGN.title||CURRENT_DESIGN.subject||"") : "(No Design - Notes only or CBC standard)"; let keys=getDesignKeywords().slice(0,25).join(", "); const prompt=`Create homework ONLY from Design and/or Notes below. If you use any word not in them, you FAIL.\nGrade: ${grade}\nLearning Area: ${subject}\nStrand: ${strand}\nSource: ${CURRENT_SOURCE} (Design OR Notes - either is allowed, both together is best)\nDesign Title: ${designTitle}\nKEY WORDS THAT MUST APPEAR IN QUESTIONS (from Design / Notes): ${keys}\n=== DESIGN + NOTES COMBINED (use ONLY this, 8000 chars) ===\n${combined ? combined.slice(0,8000) : `(No Design, no Notes - use Design Title + Grade + Subject + Key Words above. Do NOT invent another topic.)`}\nRULES:\n- Every question MUST contain at least one Key Word above OR a phrase from DESIGN / NOTES.\n- If Source is design+notes, use BOTH - some questions from Design, some from Notes.\n- If Source is notes-only, use Notes only. If design-only, use Design only.\n- Do NOT use generic baby questions like "Which one is a crop? Maize/Stone" unless those exact words are in DESIGN / NOTES.\n- Match grade: Grade 7-10 = explain, give example, apply. Grade 1-3 = simple.\n- 5 questions, 2 marks each. Mix MCQ + short answer.\n- Return ONLY JSON: {"questions":[{"question":"...","options":["A","B","C","D"],"answer":"...","marks":2,"strand":"..."}]}`; const body={ question:prompt, originalQuestion:prompt, grade, role:"learner", task:"homework_generation", mode:"homework_generation", subject, topic:strand, strand, source:"SomaHub Homework - Design OR Notes", useSomaHubFiles:true, provider:"auto", designTitle, designText: combined.slice(0,8000), designSource:CURRENT_SOURCE }; const res=await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); const text=await res.text(); let data={}; try{ data=JSON.parse(text); }catch(e){ throw new Error("AI returned an invalid response."); } if(!res.ok||data.ok===false){ throw new Error(data.error||"AI homework generation failed."); } const qs=normalizeQuestions(data); if(qs.length<1) throw new Error("AI did not return usable questions."); return qs.slice(0,10); }

sing grade-matched ${document.getElementById("gradeSel").value} ${currentSubject} practice. Tap GENERATE again for Design / Notes questions.`; } } renderQs(); }
function renderQs(){ const grade=document.getElementById("gradeSel").value; const strand=document.getElementById("strandSel").value; document.getElementById("myHwBtn").innerText="📚 GENERATE MY HOMEWORK 🚀"; document.getElementById("myHwBtn").disabled=false; document.getElementById("workTitle").innerText=`${grade} • ${currentSubject} • ${strand}`; document.getElementById("headerTitle").innerText=`🌈 ${grade} ${currentSubject}`; document.getElementById("scoreBadge").innerText=`0/${currentQs.reduce((a,c)=>a+(Number(c.marks)||2),0)}`; updDay(); document.getElementById("questions").innerHTML=currentQs.map((c,i)=>{ const isMCQ=Array.isArray(c.options)&&c.options.length>0; const bg=c.color||"#fff"; const optsHTML=isMCQ?`<div class="mt-4 space-y-3">${c.options.map((opt,oi)=>`<label class="flex items-center gap-3 bg-white border-[2.5px] border-black rounded-full px-4 py-4 cursor-pointer shadow-[2px_2px_0_0_#000] hover:bg-[#ffcc1a]"><input type="radio" name="ans${i}" value="${escapeHTML(opt)}" onchange="selectOption(${i},this.value)" class="w-6 h-6 accent-black shrink-0"><span class="font-black text-[13px]">${String.fromCharCode(65+oi)}. ${escapeHTML(opt)}</span></label>`).join("")}</div><div class="mt-3"><p class="text-[9px] font-black opacity-60">✏️ Edit your answer after 🎤 or A B C D:</p><div class="flex gap-2 mt-1"><input id="ansText${i}" type="text" placeholder="Your answer — editable" class="flex-1 border-[2.5px] border-black rounded-full p-3 text-[13px] font-bold bg-[#fff7e0] shadow-[1px_1px_0_0_#000]" oninput="syncAnswer(${i},this.value)"><button id="mic${i}" onclick="startVoiceAnswer(${i})" class="bg-black text-white border-2 border-black rounded-full w-12 h-12 flex items-center justify-center text-[18px]">🎤</button></div><input id="ans${i}" type="hidden"></div>`:`<div class="mt-3 flex gap-2"><input id="ansText${i}" type="text" placeholder="Type or tap 🎤 — editable" class="flex-1 border-[2.5px] border-black rounded-full p-4 text-[13px] font-bold bg-white shadow-[1px_1p function normalizeAnswer(v){ return String(v||"").toLowerCase().replace(/[.,!?;:'"()]/g," ").replace(/\s+/g," ").trim(); }
function answerMatches(user,correct){ const u=normalizeAnswer(user); const a=normalizeAnswer(correct); if(!u||!a)return false; if(u===a)return true; if(a.includes(u)&&u.length>=3) return true; if(u.includes(a)&&a.length>=3) return true; const un=u.split(" "); const an=a.split(" "); const overlap=un.filter(w=>an.includes(w)&&w.length>2).length; return overlap>=Math.max(1,Math.ceil(Math.min(un.length,an.length)*.6)); }
function checkAnswers(){ let empty=0; currentQs.forEach((_,i)=>{ const v=document.getElementById("ans"+i)?.value||document.getElementById("ansText"+i)?.value||""; if(!v.trim()) empty++; }); if(empty===currentQs.length){ speakText("Please answer the questions first. You can choose an option, type, or use the microphone."); alert("Please answer the questions first."); return; } let score=0; let total=0; let html=`<p class="font-black text-[13px]">🎉 Result - ${escapeHTML(currentSubject)}</p>`; currentQs.forEach((c,i)=>{ const user=(document.getElementById("ans"+i)?.value||document.getElementById("ansText"+i)?.value||"").trim(); const m=Number(c.marks)||2; total+=m; const ok=answerMatches(user,c.answer); const got=ok?m:0; score+=got; html+=`<div class="border-[2.5px] border-black rounded-xl p-3 mt-2 text-[11px] font-black ${ok?"bg-[#dcfce7]":"bg-[#ffeaea]"}">${ok?"✅":"❌"} Q${i+1} ${got}/${m}</div>`; }); html+=`<p class="font-black mt-4 text-[18px] text-center">${score>=8?"🌟":score>=5?"👏":"💪"} Score ${score}/${total}</p>`; const result=document.getElementById("result"); result.innerHTML=html; result.classList.remove("hidden"); result.className="mt-4 p-4 border-[3px] border-black rounded-[1.2rem] bg-white shadow-[3px_3px_0_0_#000]"; document.getElementById("corrBtn").classList.remove("hidden"); document.getElementById("nextBtn").classList.remove("hidden"); document.getElementById("scoreBadge").innerText=`${score}/${total}`; saveToHistory(score,total); let msg=score>=8?`Congratulations! Excellent work. You scored ${score} out of ${total}.`:score>=5?`Good job! You scored ${score} out of ${total}. Keep practising.`:`You scored ${score} out of ${total}. Do not give up. Review the corrections and try again.`; speakText(msg); if(navigator.vibrate) navigator.vibrate([100,50,100]); }
function showCorrection(){ let html=`<p class="font-black text-[12px]">📖 Correction and Learning</p>`; currentQs.forEach((c,i)=>{ const user=document.getElementById("ansText"+i)?.value||document.getElementById("ans"+i)?.value||"Not answered"; const ok=answerMatches(user,c.answer); html+=`<div class="border-[2.5px] border-black rounded-xl p-3 mt-3 bg-white"><p class="font-black text-[11px]">Q${i+1}: ${escapeHTML(c.q)}</p><p class="text-[11px] mt-1">Your answer: <b>${escapeHTML(user)}</b></p><p class="text-[11px] mt-1 ${ok?"text-green-700":"text-red-600"} font-black">${ok?"✔ Correct":"✘ Correct answer"}: ${escapeHTML(c.answer)}</p><button onclick="speakText(${JSON.stringify(String(c.answer))})" class="mt-2 bg-black text-white px-3 py-1 rounded-full text-[9px] font-black">🔊 Hear Answer</button></div>`; }); const result=document.getElementById("result"); result.innerHTML=html; result.classList.remove("hidden"); }
function nextHomework(){ onGradeChange(); generateMyHomework(); window.scrollTo({top:0,behavior:"smooth"}); }
function printPDF(){ if(!currentQs.length)return; const area=document.getElementById("printArea"); const printQs=document.getElementById("printQs"); printQs.innerHTML=`<h1 style="font-size:20px;font-weight:900">SomaHub Kenya - Homework</h1><p style="font-size:12px;font-weight:700">${escapeHTML(document.getElementById("gradeSel").value)} • ${escapeHTML(currentSubject)} • ${escapeHTML(document.getElementById("strandSel").value)} ${CURRENT_DESIGN?`• From: ${escapeHTML(CURRENT_DESIGN.title||"")}`:""} • Source: ${CURRENT_SOURCE}</p>`+currentQs.map((c,i)=>`<div style="border:2px solid #000;border-radius:12px;padding:12px;margin-top:10px"><p style="font-weight:900">Q${i+1}. ${escapeHTML(c.q)}</p>${c.options?.length?`<p>${c.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${escapeHTML(o)}`).join(" &nbsp; ")}</p>`:""}<div style="height:45px;border-bottom:1px dashed #777;margin-top:8px"></div></div>`).join(""); area.classList.remove("hidden"); html2canvas(area,{scale:2,backgroundColor:"#fff"}).then(can=>{ const img=can.toDataURL("image/png"); const {jsPDF}=window.jspdf; const pdf=new jsPDF("p","mm","a4"); const pageW=pdf.internal.pageSize.getWidth(); const pageH=pdf.internal.pageSize.getHeight(); const imgH=can.height*pageW/can.width; let y=0; let remaining=imgH; while(remaining>0){ pdf.addImage(img,"PNG",0,y,pageW,imgH); remaining-=pageH; if(remaining>0){ y-=pageH; pdf.addPage(); } } pdf.save(`SomaHub-${currentSubject}-Homework.pdf`); setTimeout(()=>area.classList.add("hidden"),500); }).catch(()=>{ area.classList.add("hidden"); alert("PDF could not be created. Please try again."); }); }
document.getElementById("photoInput").addEventListener("change",e=>{ const file=e.target.files?.[0]; if(!file)return; const img=document.getElementById("photoPreview"); img.src=URL.createObjectURL(file); img.classList.remove("hidden"); });
setTimeout(()=>{ const FB=window.FB; FB.onAuthStateChanged(FB.auth, async u=>{ if(u){ try{ const s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){ const d=s.data(); currentSHKE=d.indexNumber||"SHKE"; document.getElementById("indexB").innerText=currentSHKE; if(d.grade && GRADES.includes(d.grade)){ document.getElementById("gradeSel").value=d.grade; onGradeChange(); } } }catch(e){ console.warn("User profile could not be loaded.",e); } } }); buildGradeSelect(); onGradeChange(); loadDesignsFromFirestore(); },600);
window.addEventListener("online",updDay); window.addEventListener("offline",updDay);
</script>
