function fixSpacing(t){ if(!t) return ""; let s=String(t); s=s.replace(/Socie\s+ty/g,"Society").replace(/\bb\s+y\b/g,"by").replace(/Develop\s+ment/g,"Development").replace(/Activi\s+ties/g,"Activities").replace(/Learn\s+ing/g,"Learning"); return s; }
function isJunk(t){ if(!t) return true; t=String(t).trim(); if(t.length<300) return true; if(t.includes("uc?export")||t.includes("drive.google.com")) return true; return false; }
function getDesignText(r){ if(!r) return ""; if(r.fullText && !isJunk(r.fullText)) return fixSpacing(r.fullText); let m=AI_BRAIN.find(x=>x.resourceId===r.id); if(m&&m.text&&!isJunk(m.text)) return fixSpacing(m.text); let m2=AI_BRAIN.find(x=>x.title===r.title&&x.grade===r.grade&&x.subject===r.subject); if(m2&&m2.text&&!isJunk(m2.text)) return fixSpacing(m2.text); return ""; }
async function loadDesignsFromFirestore(){ try{ let FB=window.FB; let s=await FB.getDocs(FB.collection(FB.db,'resources')); ALL_DESIGNS=[]; s.forEach(d=>ALL_DESIGNS.push({id:d.id,...d.data()})); }catch(e){ ALL_DESIGNS=[]; } try{ let FB=window.FB; let b=await FB.getDocs(FB.collection(FB.db,'ai_brain')); AI_BRAIN=[]; b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()})); }catch(e){} onGradeSubjectChange(); }
function normSubject(s){ s=String(s||"").toLowerCase(); if(s.includes("language activities")) return "language activities"; if(s.includes("mathematical")) return "mathematical activities"; if(s.includes("environmental")) return "environmental activities"; if(s.includes("psychomotor")||s.includes("creative")) return "creative"; if(s.includes("movement")) return "movement activities"; if(s.includes("religious")||s.includes("cre")||s.includes("ire")||s.includes("hre")) return "religious"; if(s.includes("kiswahili")) return "kiswahili"; if(s.includes("english")) return "english"; if(s.includes("mathematics")) return "mathematics"; if(s.includes("integrated")) return "integrated science"; if(s.includes("social")) return "social"; if(s.includes("pre-technical")) return "pre-technical"; if(s.includes("agriculture")) return "agriculture"; if(s.includes("science")) return "science"; return s.trim(); }
function matchDesign(grade, subject){ let g=String(grade||"").trim(); let want=normSubject(subject); let list=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g && normSubject(r.subject)===want); if(!list.length) list=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g && String(r.subject||"").toLowerCase().includes(want)); if(!list.length) list=ALL_DESIGNS.filter(r=>String(r.grade||"").trim()===g); return list[0]||null; }

function onGradeSubjectChange(){ updateSub(); let grade=document.getElementById("gradeSel").value; let subj=document.getElementById("subSel").value; let d=matchDesign(grade, subj); CURRENT_DESIGN=d; let info=document.getElementById("designInfo"); if(!info) return; if(d){ let txt=getDesignText(d); info.innerHTML=`✅ <b>Using Design:</b> ${escapeHTML(d.title||d.subject||"")} • ${escapeHTML(d.grade||"")} ${escapeHTML(d.subject||"")} • ${txt?`Notes: ${txt.length} chars — Homework will use THIS design`:`No notes yet — Homework will use Design Title + Grade + Subject (still works)`}`; } else { info.innerHTML=`ℹ️ No Design uploaded yet for ${escapeHTML(grade)} ${escapeHTML(subj)}. Homework will use CBC standard for that grade. Upload a Design in Admin to make it exact.`; } updDay(); }

let oxVoices=[]; function loadVoices(){ if("speechSynthesis" in window) oxVoices=speechSynthesis.getVoices(); } if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speakText(t){ if(!("speechSynthesis" in window))return; speechSynthesis.cancel(); let clean=String(t||"").replace(/[*_`#]/g,"").replace(/\n+/g,". ").slice(0,900); let utt=new SpeechSynthesisUtterance(clean); let isSw=/Nomino|Wingi|Sarufi|Hongera|Chagua|Kinyume|Kiswahili|Mtoto|Anaenda/i.test(clean)||currentSubject==="Kiswahili"; let vs=speechSynthesis.getVoices(); if(!vs.length){ setTimeout(()=>speakText(t),300); return; } let eng=vs.find(v=>v.name.includes("Google UK English Female"))||vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en"))||vs[0]; let sw=vs.find(v=>v.lang.toLowerCase().startsWith("sw")); utt.voice=isSw&&sw?sw:eng; utt.lang=isSw?"sw-KE":"en-GB"; utt.rate=blindMode?.75:.82; utt.pitch=1; utt.volume=1; speechSynthesis.speak(utt); }
function speakQuestion(i){ const c=currentQs[i]; if(!c)return; let txt=`Question ${i+1}. ${c.q}. `; if(c.options?.length){ txt+=`Options. ${c.options.map((o,idx)=>`Option ${String.fromCharCode(65+idx)}: ${o}`).join(". ")}.`; } speakText(txt); }

function startVoiceAnswer(i){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ alert("Voice typing is not supported here. Please use Chrome."); return; } if(isRecording&&recognition){ recognition.stop(); return; } recognition=new SR(); recognition.lang=currentSubject==="Kiswahili"?"sw-KE":"en-KE"; recognition.interimResults=false; recognition.continuous=false; const btn=document.getElementById("mic"+i); const txtInput=document.getElementById("ansText"+i); const hidden=document.getElementById("ans"+i); const stat=document.getElementById("micStatus"+i); if(!btn||!txtInput||!hidden||!stat)return; btn.classList.add("pulse","bg-red-500"); btn.innerText="🔴"; stat.innerText="🎤 Listening... speak your answer."; stat.classList.remove("hidden"); isRecording=true; recognition.onresult=e=>{ let tr=e.results[0][0].transcript.trim(); const q=currentQs[i]; if(q.options?.length){ const lower=tr.toLowerCase(); const match=q.options.find(o=>o.toLowerCase()===lower||o.toLowerCase().includes(lower)||lower.includes(o.toLowerCase().slice(0,3))); if(match){ tr=match; document.querySelectorAll(`input[name="ans${i}"]`).forEach(r=>{ r.checked=r.value.toLowerCase()===match.toLowerCase(); }); } } txtInput.value=tr; hidden.value=tr; stat.innerHTML=`✅ Heard: <b>${escapeHTML(tr)}</b> — edit your answer if needed.`; stat.className="mt-2 text-[10px] font-black text-center bg-[#dcfce7] border-2 border-black rounded-full py-2"; }; recognition.onend=()=>{ btn.classList.remove("pulse","bg-red-500"); btn.innerText="🎤"; isRecording=false; if(navigator.vibrate) navigator.vibrate(40); }; recognition.onerror=()=>{ stat.innerText="❌ Voice not heard. Tap the microphone and try again."; btn.classList.remove("pulse","bg-red-500"); btn.innerText="🎤"; isRecording=false; }; try{ recognition.start(); }catch(e){} }
/* ===== FIX: FALLBACK PER SUBJECT - NEVER default to English ===== */
function getFallbackFor(subject){
  let s=String(subject||"").toLowerCase();
  if(s.includes("creative")||s.includes("art")) return FALLBACK["Creative Activities"];
  if(s.includes("language activities")) return FALLBACK["Language Activities"];
  if(s.includes("mathematical")||s.includes("mathematics")) return FALLBACK["Mathematics"];
  if(s.includes("environmental")) return FALLBACK["Environmental Activities"];
  if(s.includes("movement")) return FALLBACK["Movement Activities"];
  if(s.includes("religious")||s==="cre"||s.includes("cre ")) return FALLBACK["CRE"];
  if(s.includes("kiswahili")) return FALLBACK["Kiswahili"];
  if(s.includes("english")) return FALLBACK["English"];

async function requestAIHomework(){ const grade=document.getElementById("gradeSel").value; const subject=currentSubject; const strand=document.getElementById("strandSel").value; let designText=""; let designTitle="(No Design uploaded yet)"; if(CURRENT_DESIGN){ designTitle=CURRENT_DESIGN.title||CURRENT_DESIGN.subject||""; designText=getDesignText(CURRENT_DESIGN); } const prompt=`Create a fresh original homework exercise for SomaHub Kenya.\nLearner grade: ${grade}\nLearning area: ${subject}\nStrand/topic: ${strand}\nDESIGN FROM ADMIN (use THIS first):\nTitle: ${designTitle}\nGrade: ${grade} | Learning Area: ${subject}\n${designText ? `DESIGN TEXT (up to 8000 chars - use ONLY this design):\n${designText.slice(0,8000)}` : `(No full text saved yet - make homework from DESIGN TITLE + GRADE + LEARNING AREA using standard CBC for that grade. Do NOT say "No homework".)`}\nRequirements:\n- Match grade exactly. Playgroup-PP2 & Grade 1-3 = very simple words, 1 short sentence per question. Grade 4-6 = simple. Grade 7-10 = a bit harder.\n- Create 5 questions worth 2 marks each, total 10 marks. Mix MCQ + short answer.\n- Cover ONLY the selected strand / design. Do NOT mix other Learning Areas.\n- Use Kenya examples. Kiswahili when subject is Kiswahili.\n- For MCQs give exactly 4 options. For written, options = [].\n- Return ONLY valid JSON: {"questions":[{"question":"...","options":["A","B","C","D"],"answer":"...","marks":2,"strand":"..."}]}`; const body={ question:prompt, originalQuestion:prompt, grade, role:"learner", task:"homework_generation", mode:"homework_generation", subject, topic:strand, strand, source:"SomaHub Homework", useSomaHubFiles:true, provider:"auto", designTitle, designText: designText.slice(0,8000) }; const res=await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); const text=await res.text(); let data={}; try{ data=JSON.parse(text); }catch(e){ throw new Error("AI returned an invalid response."); } if(!res.ok| function answerMatches(user,correct){ const u=normalizeAnswer(user); const a=normalizeAnswer(correct); if(!u||!a)return false; if(u===a)return true; if(a.includes(u)&&u.length>=3) return true; if(u.includes(a)&&a.length>=3) return true; const un=u.split(" "); const an=a.split(" "); const overlap=un.filter(w=>an.includes(w)&&w.length>2).length; return overlap>=Math.max(1,Math.ceil(Math.min(un.length,an.length)*.6)); }

function showCorrection(){ let html=`<p class="font-black text-[12px]">📖 Correction and Learning</p>`; currentQs.forEach((c,i)=>{ const user=document.getElementById("ansText"+i)?.value||document.getElementById("ans"+i)?.value||"Not answered"; const ok=answerMatches(user,c.answer); html+=`<div class="border-[2.5px] border-black rounded-xl p-3 mt-3 bg-white"><p class="font-black text-[11px]">Q${i+1}: ${escapeHTML(c.q)}</p><p class="text-[11px] mt-1">Your answer: <b>${escapeHTML(user)}</b></p><p class="text-[11px] mt-1 ${ok?"text-green-700":"text-red-600"} font-black">${ok?"✔ Correct":"✘ Correct answer"}: ${escapeHTML(c.answer)}</p><button onclick="speakText(${JSON.stringify(String(c.answer))})" class="mt-2 bg-black text-white px-3 py-1 rounded-full text-[9px] font-black">🔊 Hear Answer</button></div>`; }); const result=document.getElementById("result"); result.innerHTML=html; result.classList.remove("hidden"); }
function nextHomework(){ onGradeChange(); generateMyHomework(); window.scrollTo({top:0,behavior:"smooth"}); }
function printPDF(){ if(!currentQs.length)return; const area=document.getElementById("printArea"); const printQs=document.getElementById("printQs"); printQs.innerHTML=`<h1 style="font-size:20px;font-weight:900">SomaHub Kenya - Homework</h1><p style="font-size:12px;font-weight:700">${escapeHTML(document.getElementById("gradeSel").value)} • ${escapeHTML(currentSubject)} • ${escapeHTML(document.getElementById("strandSel").value)} ${CURRENT_DESIGN?`• From: ${escapeHTML(CURRENT_DESIGN.title||"")}`:""}</p>`+currentQs.map((c,i)=>`<div style="border:2px solid #000;border-radius:12px;padding:12px;margin-top:10px"><p style="font-weight:900">Q${i+1}. ${escapeHTML(c.q)}</p>${c.options?.length?`<p>${c.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${escapeHTML(o)}`).join(" &nbsp; ")}</p>`:""}<div style="height:45px;border-bottom:1px dashed #777;margin-top:8px"></div></div>`).join(""); area.classList.remove("hidden"); html2canvas(area,{scale:2,backgroundColor:"#fff"}).then(can=>{ const img=can.toDataURL("image/png"); const {jsPDF}=window.jspdf; const pdf=new jsPDF("p","mm","a4"); const pageW=pdf.internal.pageSize.getWidth(); const pageH=pdf.internal.pageSize.getHeight(); const imgH=can.height*pageW/can.width; let y=0; let remaining=imgH; while(remaining>0){ pdf.addImage(img,"PNG",0,y,pageW,imgH); remaining-=pageH; if(remaining>0){ y-=pageH; pdf.addPage(); } } pdf.save(`SomaHub-${currentSubject}-Homework.pdf`); setTimeout(()=>area.classList.add("hidden"),500); }).catch(()=>{ area.classList.add("hidden"); alert("PDF could not be created. Please try again."); }); }
document.getElementById("photoInput").addEventListener("change",e=>{ const file=e.target.files?.[0]; if(!file)return; const img=document.getElementById("photoPreview"); img.src=URL.createObjectURL(file); img.classList.remove("hidden"); });
setTimeout(()=>{ const FB=window.FB; FB.onAuthStateChanged(FB.auth, async u=>{ if(u){ try{ const s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){ const d=s.data(); currentSHKE=d.indexNumber||"SHKE"; document.getElementById("indexB").innerText=currentSHKE; if(d.grade && GRADES.includes(d.grade)){ document.getElementById("gradeSel").value=d.grade; onGradeChange(); } } }catch(e){ console.warn("User profile could not be loaded.",e); } } }); buildGradeSelect(); onGradeChange(); loadDesignsFromFirestore(); },600);
window.addEventListener("online",updDay); window.addEventListener("offline",updDay);
</script>
