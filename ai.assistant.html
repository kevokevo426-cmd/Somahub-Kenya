<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SomaHub AI Teacher</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f8}
body{overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
#chat{scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:6px}
#chat::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:20px}
textarea{resize:none}
.message-in{animation:in .2s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing-dot{width:6px;height:6px;background:#555;border-radius:50%;animation:typing 1.2s infinite ease-in-out}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
.safe-bottom{padding-bottom:max(10px,env(safe-area-inset-bottom))}
.photo-message{max-width:min(380px,78vw);max-height:430px;object-fit:contain}
.ai-response{font-size:14px;line-height:1.7;color:#171717}
.ai-response strong{font-weight:800}
.ai-response .highlight{background:#fff1a8;padding:1px 5px;border-radius:5px;font-weight:800}
.answer-box{background:#ecfdf3;border:1px solid #a7f3d0;border-radius:14px;padding:12px 14px;margin:12px 0}
.key-box{background:#fffbea;border:1px solid #fde68a;border-radius:14px;padding:12px 14px;margin:12px 0}
.wrong-box{background:#fff5f5;border:1px solid #fecaca;border-radius:12px;padding:10px 12px;margin:7px 0}
.choice-box{border:1px solid #e5e7eb;background:#fafafa;border-radius:12px;padding:10px 12px;margin:7px 0}
.section-title{font-weight:800;font-size:15px;margin-top:15px;margin-bottom:5px}
.ai-response ul{padding-left:20px;margin:8px 0}
.ai-response li{margin:4px 0}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block}
.chip{border:1px solid #e5e7eb;background:white;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:600}
@media(max-width:500px){.ai-response{font-size:13.5px}}
</style>
</head>

<script>

const PROXY="/api/gemini";

/* SomaHub public GitHub repository */
const GITHUB_OWNER="kevokevo426-cmd";
const GITHUB_REPO="Somahub-Kenya";
const GITHUB_BRANCH="main";

let grade="Grade 7";
let mode="student";
let uploadedPhoto="";
let uploadedMimeType="image/jpeg";
let isThinking=false;
let mediaRecorder=null;
let audioChunks=[];

const chat=document.getElementById("chat");
const messages=document.getElementById("messages");
const msg=document.getElementById("msg");
const sendBtn=document.getElementById("sendBtn");
const welcome=document.getElementById("welcome");
const options=document.getElementById("options");


/* =========================
   GRADE
========================= */

document.getElementById("grade").addEventListener("change",e=>{
grade=e.target.value;
});


/* =========================
   MODE
========================= */

function setMode(value){

mode=value;

if(value==="homework"||value==="exam"||value==="mark"){
options.classList.remove("hidden");
}else{
options.classList.add("hidden");
}

const prompts={
student:"Ask me a question and explain it at my grade level.",
teacher:"Help me prepare a lesson, homework, assessment or teaching resource.",
homework:"Set homework using the selected grade, subject and topic.",
exam:"Create an examination paper using the selected grade, subject and topic.",
mark:"Mark the uploaded learner's work using KNEC-style mark allocation."
};

msg.value=prompts[value]||"";
autoResize();
msg.focus();

}


/* =========================
   QUICK PROMPT
========================= */

function quickPrompt(text){
msg.value=text;
autoResize();
msg.focus();
}


/* =========================
   ERROR
========================= */

function showError(message){

const box=document.getElementById("errorBox");
box.textContent=message;
box.classList.remove("hidden");

setTimeout(()=>{
box.classList.add("hidden");
},7000);

}


/* =========================
   PHOTO
========================= */

function handlePhoto(input){

const file=input.files&&input.files[0];
if(!file)return;

if(!file.type.startsWith("image/")){
showError("Please select an image.");
return;
}

const url=URL.createObjectURL(file);
const img=new Image();

img.onload=()=>{

try{

let width=img.width;
let height=img.height;
const max=1400;

if(width>max||height>max){

const ratio=Math.min(max/width,max/height);

width=Math.round(width*ratio);
height=Math.round(height*ratio);

}

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,width,height);

uploadedMimeType="image/jpeg";

uploadedPhoto=canvas.toDataURL("image/jpeg",.72);

document.getElementById("photoPreview").src=uploadedPhoto;
document.getElementById("photoPreviewBox").classList.remove("hidden");
document.getElementById("photoStatus").classList.remove("hidden");

URL.revokeObjectURL(url);
scrollToBottom();

}catch(e){

URL.revokeObjectURL(url);
showError("Could not prepare the photo.");

}

};

img.onerror=()=>{
URL.revokeObjectURL(url);
showError("The photo could not be opened.");
};

img.src=url;
input.value="";

}


function removeSelectedPhoto(){

uploadedPhoto="";
uploadedMimeType="image/jpeg";

document.getElementById("photoPreviewBox").classList.add("hidden");
document.getElementById("photoStatus").classList.add("hidden");

}


/* =========================
   VOICE NOTE
========================= */

async function toggleVoice(){

if(mediaRecorder&&mediaRecorder.state==="recording"){

mediaRecorder.stop();
return;

}

try{

const stream=await navigator.mediaDevices.getUserMedia({audio:true});

audioChunks=[];

mediaRecorder=new MediaRecorder(stream);

mediaRecorder.ondataavailable=e=>{
if(e.data.size)audioChunks.push(e.data);
};

mediaRecorder.onstop=()=>{

stream.getTracks().forEach(t=>t.stop());

const blob=new Blob(audioChunks,{type:"audio/webm"});

const reader=new FileReader();

reader.onloadend=()=>{

/*
 Voice is sent as a data URL.
 Your /api/gemini endpoint should accept
 voice/audio if you want server-side
 transcription.
 */

msg.value="[Voice note attached. Please process the voice note.]";
autoResize();

};

reader.readAsDataURL(blob);

document.getElementById("voiceBtn").innerHTML=
'<i class="fa-solid fa-microphone"></i>';

};

mediaRecorder.start();

document.getElementById("voiceBtn").innerHTML=
'<i class="fa-solid fa-stop"></i>';

}catch(e){

showError("Microphone permission is required for voice notes.");

}

}


/* =========================
   USER MESSAGE
========================= */

function addUserText(text){

const wrapper=document.createElement("div");

wrapper.className="flex justify-end mb-5 message-in";

const bubble=document.createElement("div");

bubble.className="max-w-[85%] sm:max-w-[75%] bg-black text-white rounded-3xl rounded-br-lg px-4 py-3";

p.textContent=text;

bubble.appendChild(p);

/* =========================
   THINKING
========================= */

function addThinking(){

const wrapper=document.createElement("div");

wrapper.id="thinking";
wrapper.className="flex justify-start mb-5 message-in";

wrapper.innerHTML=`
<div class="flex items-start gap-3 max-w-[90%]">
<div class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center shrink-0">
<i class="fa-solid fa-graduation-cap text-[12px]"></i>
</div>
<div class="bg-white border border-[#e5e5e5] rounded-3xl rounded-tl-lg px-4 py-3 shadow-sm">
<div class="flex items-center gap-1.5">
<span class="typing-dot"></span>
<span class="typing-dot"></span>
<span class="typing-dot"></span>
</div>
</div>
</div>`;

messages.appendChild(wrapper);
scrollToBottom();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   FORMAT AI RESPONSE
========================= */

function formatAIResponse(raw){

let text=escapeHTML(raw);

text=text.replace(/==(.*?)==/g,
'<span class="highlight">$1</span>');

text=text.replace(/\*\*(.*?)\*\*/g,
"<strong>$1</strong>");

text=text.replace(/^### (.*?)$/gm,
'<div class="section-title">$1</div>');

text=text.replace(/^## (.*?)$/gm,
'<div class="section-title">$1</div>');

text=text.replace(/^# (.*?)$/gm,
'<div class="section-title">$1</div>');

text=text.replace(
/FINAL ANSWER:\s*(.*)/gi,
'<div class="answer-box"><strong>🟨 Final Answer</strong><br>$1</div>'
);

text=text.replace(
/KEY POINT:\s*(.*)/gi,
'<div class="key-box"><strong>⭐ Key Point</strong><br>$1</div>'
);

text=text.replace(
/TOPIC\s*\/?\s*STRAND:\s*(.*)/gi,
'<div class="key-box"><strong>📚 Topic / Strand</strong><br>$1</div>'
);

text=text.replace(
/CORRECT CHOICE:\s*(.*)/gi,
'<div class="answer-box"><strong>✅ Correct Choice</strong><br>$1</div>'
);

text=text.replace(
/WRONG CHOICE:\s*(.*)/gi,
'<div class="wrong-box"><strong>❌</strong> $1</div>'
);

text=text.replace(
/^(A\)|B\)|C\)|D\))\s*(.*)$/gm,
'<div class="choice-box"><strong>$1</strong> $2</div>'
);

text=text.replace(
/^[-•]\s+(.*)$/gm,
'<li>$1</li>'
);

text=text.replace(
/^(\d+)\.\s+(.*)$/gm,
'<div class="numbered"><strong>$1.</strong> $2</div>'
);

text=text.replace(/\n/g,"<br>");

return text;

}


/* =========================
   AI MESSAGE
========================= */

function addAIMessage(text){

const wrapper=document.createElement("div");

wrapper.className="flex justify-start mb-7 message-in";

const row=document.createElement("div");

row.className="flex items-start gap-3 max-w-[94%]";

const icon=document.createElement("div");

icon.className="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center shrink-0 mt-1";

icon.innerHTML='<i class="fa-solid fa-graduation-cap text-[12px]"></i>';

const area=document.createElement("div");
area.className="min-w-0";

const bubble=document.createElement("div");

bubble.className="bg-white border border-[#e5e5e5] rounded-3xl rounded-tl-lg px-4 py-3 shadow-sm";

const content=document.createElement("div");

content.className="ai-response";
content.innerHTML=formatAIResponse(text);

bubble.appendChild(content);


const actions=document.createElement("div");

actions.className="mt-2 flex items-center gap-2";

const copyBtn=document.createElement("button");

copyBtn.className="text-[10px] text-gray-500 hover:text-black px-2 py-1";

copyBtn.innerHTML='<i class="fa-regular fa-copy mr-1"></i>Copy';

copyBtn.onclick=async()=>{

try{

await navigator.clipboard.writeText(text);

copyBtn.innerHTML=
'<i class="fa-solid fa-check mr-1"></i>Copied';

setTimeout(()=>{
copyBtn.innerHTML=
'<i class="fa-regular fa-copy mr-1"></i>Copy';
},2000);

}catch{

showError("Copy is not available.");

}

};


const speakBtn=document.createElement("button");

speakBtn.className="text-[10px] text-gray-500 hover:text-black px-2 py-1";

speakBtn.innerHTML=
'<i class="fa-solid fa-volume-high mr-1"></i>Listen';

speakBtn.onclick=()=>{

if("speechSynthesis"in window){

speechSynthesis.cancel();

speechSynthesis.speak(
new SpeechSynthesisUtterance(text)
);

}else{

showError("Text-to-speech is not available.");

}

};


actions.appendChild(copyBtn);
actions.appendChild(speakBtn);

area.appendChild(bubble);
area.appendChild(actions);

row.appendChild(icon);
row.appendChild(area);

wrapper.appendChild(row);

messages.appendChild(wrapper);

}


/* ============================================================
   SOMAHUB GITHUB KNOWLEDGE
   ============================================================ */

const TEXT_EXTENSIONS=[
".html",".htm",".js",".css",".json",".txt",".md",
".csv",".xml",".yaml",".yml"
];

function isTextFile(path){

const p=path.toLowerCase();

return TEXT_EXTENSIONS.some(ext=>p.endsWith(ext));

}


function githubTreeURL(){

return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

}


async function getGitHubFiles(){

const cached=localStorage.getItem("somahub_tree");

if(cached){

try{

const parsed=JSON.parse(cached);

if(parsed&&Array.isArray(parsed.tree))return parsed.tree;

}catch{}

}

const response=await fetch(githubTreeURL(),{
headers:{
"Accept":"application/vnd.github+json"
}
});

if(!response.ok)throw new Error("Could not read SomaHub repository.");

const data=await response.json();

if(Array.isArray(data.tree)){

try{
localStorage.setItem(
"somahub_tree",
JSON.stringify(data)
);
}catch{}

}

return data.tree||[];

}


/*
 Fetch relevant text files from the public repository.

 The repository is public, so no GitHub token is placed
 inside this HTML file.
*/

async function getSomaHubContext(question){

try{

document.getElementById("knowledgeStatus").textContent=
"Checking SomaHub resources...";

const tree=await getGitHubFiles();

const files=tree.filter(x=>
x.type==="blob"&&
isTextFile(x.path)&&
Number(x.size||0)<=500000
);

const q=question.toLowerCase();

const words=q
.replace(/[^a-z0-9\s]/g," ")
.split(/\s+/)
.filter(x=>x.length>2);

function score(file){

const path=file.path.toLowerCase();

let score=0;

words.forEach(word=>{
if(path.includes(word))score+=5;
});

const important=[
"notes","curriculum","scheme","lesson",
"exam","homework","student","teacher",
"grade","english","mathematics","science",
"social","agriculture","home","ict"
];

important.forEach(word=>{
if(path.includes(word))score+=2;
});

return score;

}

const ranked=[...files]
.sort((a,b)=>score(b)-score(a));

/*
 Use relevant files first.
 If the question is broad, include a wider selection.
 */

const selected=ranked.slice(
0,
Math.min(35,ranked.length)
);

const results=await Promise.all(
selected.map(async file=>{

try{

const rawURL=
`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${file.path}`;

const response=await fetch(rawURL);

if(!response.ok)return null;

const content=await response.text();

return{
path:file.path,
content:content.slice(0,30000)
};

}catch{

return null;

}

})
);

const usable=results.filter(Boolean);

document.getElementById("knowledgeStatus").textContent=
`SomaHub resources connected (${usable.length})`;

return usable;

}catch(error){

document.getElementById("knowledgeStatus").textContent=
"SomaHub resources unavailable — using AI knowledge";

return[];

}

}


/* ============================================================
   BUILD AI INSTRUCTIONS
   ============================================================ */

function buildInstructions(){

const subject=document.getElementById("subject").value;
const topic=document.getElementById("topic").value.trim();
const count=document.getElementById("questionCount").value;
const marks=document.getElementById("totalMarks").value;
const wide=document.getElementById("wideSpread").checked;

let instruction=`

You are SomaHub AI Teacher for Kenyan learners and teachers.

GRADE: ${grade}
MODE: ${mode}
SUBJECT: ${subject}
TOPIC/STRAND: ${topic||"Identify from the question"}

Use the Kenyan CBC/CBE learning level appropriate to the selected grade.

IMPORTANT RESPONSE STYLE:

1. TOPIC / STRAND
Identify the topic, strand and sub-strand where reasonably possible.

2. EXPLANATION
Explain the concept clearly at the learner's grade level.
Keep it simple but academically correct.

3. BRIEF QUESTION
Restate the question briefly before answering when useful.

4. ANSWER
Give the correct answer clearly.

5. CHOICES
For multiple-choice questions:
Explain EVERY choice:
A - say whether it is correct or wrong and why.
B - say whether it is correct or wrong and why.
C - say whether it is correct or wrong and why.
D - say whether it is correct or wrong and why.

Do not merely state the correct letter.

6. MARKING
When marking learner work:
Use clear mark allocation.
Award marks only for demonstrated correct work.
Show:
MARK: x/y
Then briefly explain why each mark was awarded or lost.

Use a Kenyan/KNEC-style marking approach where appropriate.
Do not claim that a generated scheme is an official KNEC document.

7. HOMEWORK
If asked to create homework:
Create clear numbered questions suitable for ${grade}.
Include marks where useful.
Include a marking scheme when requested or when the teacher asks for homework with answers.

8. EXAM
If asked to create an exam:
Create a properly structured paper suitable for ${grade}.
Include sections, instructions, marks and a separate marking scheme when requested.

9. INCREASE SPREAD
${wide?"Cover a wider range of related subtopics, skills and question types instead of repeating the same pattern.":"Stay focused on the requested topic and skill."}

10. SOMAHUB PRIORITY
SomaHub resources supplied in the context below are the first reference.
Use them when relevant.
If the SomaHub material does not contain enough information, use your general AI knowledge and clearly avoid pretending that unsupported material came from SomaHub.

11. ACCURACY
Do not invent information from a SomaHub file.
If the source material is insufficient, answer from general knowledge.

12. STYLE
Use:
TOPIC / STRAND:
EXPLANATION:
BRIEF QUESTION:
FINAL ANSWER:
KEY POINT:
and, where appropriate, choice-by-choice explanations and marking.

For normal learner questions, do not make the response unnecessarily long.
`;

if(mode==="homework"){

instruction+=`

HOMEWORK SETTINGS:
Number of questions: ${count}
Total marks: ${marks}

Create homework, not an explanation of homework.
`;

}

if(mode==="exam"){

instruction+=`

EXAM SETTINGS:
Number of questions: ${count}
Total marks: ${marks}

Create an examination paper with suitable instructions and mark allocation.
Avoid giving answers immediately before the paper.
`;

}

if(mode==="mark"){

instruction+=`

MARKING MODE:
Read the uploaded learner work carefully.
Award marks using the stated total or the visible question marks.
Correct errors and provide a concise teacher comment.
`;

}

return instruction;

}


/* ============================================================
   SEND
   ============================================================ */

async function sendMsg(){

if(isThinking)return;

const text=msg.value.trim();
const hasPhoto=Boolean(uploadedPhoto);

if(!text&&!hasPhoto)return;

welcome.classList.add("hidden");

const photoToSend=uploadedPhoto;
const mimeToSend=uploadedMimeType;

if(text)addUserText(text);

if(photoToSend)addUserPhoto(photoToSend);

msg.value="";
autoResize();

removeSelectedPhoto();

scrollToBottom();

isThinking=true;

sendBtn.disabled=true;

sendBtn.innerHTML=
'<i class="fa-solid fa-spinner fa-spin"></i>';

addThinking();


try{

let base64="";

if(photoToSend){

base64=photoToSend.includes(",")
?photoToSend.split(",")[1]
:photoToSend;

}

if(base64.length>3000000){

throw new Error(
"Photo is too large. Please take a clearer photo closer to the paper."
);

}

const question=
text||
"Read the question in the uploaded photo, identify the subject, topic and strand, solve it step by step, explain every answer choice, and provide the appropriate marking."

/*
 Get relevant SomaHub files before asking the AI.
 */

const somaHubFiles=
await getSomaHubContext(question);


/*
 Only send a reasonable amount of context.
 */

const context=somaHubFiles.map(file=>`

--- SOMAHUB FILE: ${file.path} ---

${file.content}

--- END FILE ---

`).join("\n");

const prompt=buildInstructions()+`

USER REQUEST:
${question}

SOMAHUB REPOSITORY CONTEXT:
${context||"No relevant SomaHub repository content was available."}

If SomaHub context is insufficient, continue using your general AI knowledge.
`;


const response=await fetch(PROXY,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

question:prompt,

originalQuestion:question,

grade:grade,

shke:"SHKE",

mode:mode,

subject:document.getElementById("subject").value,

topic:document.getElementById("topic").value.trim(),

questionCount:Number(
document.getElementById("questionCount").value||10
),

totalMarks:Number(
document.getElementById("totalMarks").value||20
),

wideSpread:
document.getElementById("wideSpread").checked,

photo:base64,

mimeType:mimeToSend,

repository:`${GITHUB_OWNER}/${GITHUB_REPO}`,

useSomaHubFiles:true,

provider:"auto"

})

});


const raw=await response.text();

let data;

try{
data=JSON.parse(raw);
}catch{
data={answer:raw};
}

document.getElementById("thinking")?.remove();

if(!response.ok){

throw new Error(
data?.answer||
data?.error||
`Server error (${response.status})`
);

}

let answer=String(
data?.answer||
"I couldn't generate an answer."
).trim();

if(!answer){

answer="I couldn't generate an answer. Please try again.";

}

addAIMessage(answer.slice(0,15000));


}catch(error){

document.getElementById("thinking")?.remove();

addAIMessage(
"I couldn't complete the request.\n\n"+
"**Error:** "+error.message
);

showError(error.message);

}


isThinking=false;

sendBtn.disabled=false;

sendBtn.innerHTML=
'<i class="fa-solid fa-arrow-up"></i>';

scrollToBottom();

}


/* ============================================================
   ENTER / SEND
============================================================ */

msg.addEventListener("keydown",event=>{

if(event.key==="Enter"&&(event.ctrlKey||event.metaKey)){

event.preventDefault();
sendMsg();

}

/* Normal Enter creates a new line */

});


/* ============================================================
   AUTO RESIZE
============================================================ */

msg.addEventListener("input",autoResize);

function autoResize(){

msg.style.height="auto";

msg.style.height=
Math.min(msg.scrollHeight,140)+"px";

}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom(){

setTimeout(()=>{

chat.scrollTo({
top:chat.scrollHeight,
behavior:"smooth"
});

},50);

}


/* ============================================================
   INITIAL STATUS
============================================================ */

(async function(){

try{

const tree=await getGitHubFiles();

const count=tree.filter(x=>
x.type==="blob"&&isTextFile(x.path)
).length;

document.getElementById("knowledgeStatus").textContent=
`SomaHub knowledge connected · ${count} files`;

}catch{

document.getElementById("knowledgeStatus").textContent=
"SomaHub AI learning assistant";

}

})();

</script>
