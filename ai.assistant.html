<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SomaHub Tutor</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<link
  href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
  rel="stylesheet"
>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Nunito',sans-serif;
  background:#f5f8ff;
}

body{
  overflow:hidden;
}

/* =========================================================
   MAIN APP
========================================================= */

#app{
  width:100%;
  height:100dvh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

#topHeader{
  flex:0 0 auto;
  height:64px;
  min-height:64px;
  background:white;
  border-bottom:1px solid #e7ebf2;
  z-index:20;
}

/* =========================================================
   CHAT
========================================================= */

#chat{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  padding-bottom:10px;
}

#chat::-webkit-scrollbar{
  width:5px;
}

#chat::-webkit-scrollbar-thumb{
  background:#d4d9e4;
  border-radius:20px;
}

.chat-inner{
  width:100%;
  max-width:980px;
  margin:0 auto;
  padding:18px 14px 24px;
}

/* =========================================================
   WELCOME
========================================================= */

#welcome{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:38px 10px 25px;
  text-align:center;
}

.welcome-logo{
  width:88px;
  height:88px;
  margin:auto;
  border-radius:28px;
  background:linear-gradient(145deg,#3349b8,#5368dc);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 12px 30px rgba(51,73,184,.18);
}

.welcome-title{
  margin-top:18px;
  color:#263b99;
  font-size:clamp(25px,4vw,40px);
  font-weight:900;
  line-height:1.15;
}

.welcome-text{
  margin:12px auto 0;
  max-width:560px;
  color:#68738a;
  font-size:clamp(14px,2vw,17px);
  line-height:1.6;
}

/* =========================================================
   MESSAGE
========================================================= */

.message-in{
  animation:messageIn .16s ease-out;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================================================
   AI CARD
========================================================= */

.ai-card{
  background:#ffffff;
  border:1px solid #e4e8f0;
  border-radius:18px;
  padding:16px 18px;
  line-height:1.7;
  font-size:14px;
  color:#111827;
  box-shadow:0 3px 12px rgba(30,50,90,.04);
  overflow-wrap:anywhere;
}

.ai-card p{
  margin:7px 0;
}

.ai-card ul{
  margin:7px 0 7px 20px;
  list-style:disc;
}

.ai-card ol{
  margin:7px 0 7px 20px;
  list-style:decimal;
}

/* Topic / Strand = RED */
.ai-topic{
  color:#dc2626;
  font-size:13px;
  font-weight:900;
  margin:2px 0 8px;
}

/* Explanation = BLUE */
.ai-explanation{
  color:#2563eb;
  font-size:15px;
  font-weight:800;
  margin:10px 0 5px;
}

/* Detailed text = BLACK */
.ai-detail{
  color:#111827;
  font-weight:600;
}

/* =========================================================
   INPUT AREA
========================================================= */

#inputFooter{
  flex:0 0 auto;
  width:100%;
  background:#f1f4fa;
  border-top:1px solid #dfe5ef;
  padding:8px 10px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
  z-index:30;
}

.input-inner{
  width:100%;
  max-width:980px;
  margin:auto;
}

#previewBox{
  margin-bottom:7px;
}

.input-row{
  width:100%;
  display:flex;
  align-items:flex-end;
  gap:7px;
}

/* Text container */

.message-box{
  flex:1 1 auto;
  min-width:0;
  min-height:48px;
  max-height:125px;
  background:#ffffff;
  border:1px solid #dce2eb;
  border-radius:26px;
  display:flex;
  align-items:flex-end;
  padding:4px 7px;
  box-shadow:0 2px 8px rgba(20,40,80,.05);
}

.message-box:focus-within{
  border-color:#7184d8;
  box-shadow:0 0 0 3px rgba(81,102,210,.08);
}

.tool-btn{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  border:0;
  background:transparent;
  color:#667085;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s;
}

.tool-btn:hover{
  background:#eef1f6;
}

.tool-btn:active{
  transform:scale(.94);
}

#msg{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  background:transparent;
  resize:none;
  font-family:'Nunito',sans-serif;
  font-size:15px;
  line-height:21px;
  color:#182033;
  padding:9px 6px;
  min-height:40px;
  max-height:105px;
  overflow-y:auto;
}

#msg::placeholder{
  color:#98a2b3;
}

/* Action buttons */

.action-btn{
  width:48px;
  height:48px;
  min-width:48px;
  border:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(30,45,100,.18);
  transition:.15s;
}

.action-btn:active{
  transform:scale(.92);
}

#voiceBtn{
  background:#263b99;
}

#sendBtn{
  background:#20c56b;
}

#voiceBtn.recording{
  background:#dc2626;
  animation:pulseRecord 1s infinite;
}

@keyframes pulseRecord{
  0%,100%{
    box-shadow:0 0 0 0 rgba(220,38,38,.25);
  }
  50%{
    box-shadow:0 0 0 9px rgba(220,38,38,0);
  }
}

#listenTxt{
  height:15px;
  line-height:15px;
}

/* =========================================================
   THINKING
========================================================= */

.thinking-bubble{
  display:flex;
  align-items:center;
  gap:8px;
  color:#7b8496;
  font-size:12px;
}

.thinking-dots{
  display:flex;
  gap:3px;
}

.thinking-dots span{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#6574c5;
  animation:dot .8s infinite;
}

.thinking-dots span:nth-child(2){
  animation-delay:.15s;
}

.thinking-dots span:nth-child(3){
  animation-delay:.3s;
}

@keyframes dot{
  0%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-2px);
  }
}

/* =========================================================
   HISTORY
========================================================= */

#historyDrawer{
  position:fixed;
  inset:0;
  z-index:100;
  background:#f8faff;
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:480px){

  #topHeader{
    height:60px;
    min-height:60px;
  }

  .header-title{
    font-size:13px !important;
  }

  .header-status{
    font-size:9px !important;
  }

  #grade{
    max-width:105px;
    font-size:11px !important;
    padding-left:10px;
    padding-right:10px;
  }

  .chat-inner{
    padding:12px 9px 16px;
  }

  #welcome{
    padding:25px 8px 20px;
  }

  .welcome-logo{
    width:72px;
    height:72px;
    border-radius:24px;
    font-size:34px;
  }

  .welcome-title{
    font-size:24px;
  }

  .welcome-text{
    font-size:13px;
  }

  .ai-card{
    font-size:13.5px;
    padding:14px;
    border-radius:16px;
  }

  .message-box{
    min-height:46px;
  }

  .tool-btn{
    width:34px;
    min-width:34px;
    height:36px;
  }

  #msg{
    font-size:14px;
    padding-left:4px;
    padding-right:4px;
  }

  .action-btn{
    width:45px;
    height:45px;
    min-width:45px;
  }

}

/* =========================================================
   TABLETS
========================================================= */

@media(min-width:600px){

  #topHeader{
    height:70px;
    min-height:70px;
  }

  .chat-inner{
    padding-left:24px;
    padding-right:24px;
  }

  #inputFooter{
    padding-left:20px;
    padding-right:20px;
  }

  .message-box{
    min-height:52px;
  }

  #msg{
    font-size:16px;
  }

}

/* =========================================================
   LAPTOP / DESKTOP
========================================================= */

@media(min-width:1024px){

  #topHeader{
    height:74px;
    min-height:74px;
  }

  .chat-inner{
    padding-top:24px;
  }

  #inputFooter{
    padding:12px 24px 14px;
  }

  .message-box{
    min-height:54px;
  }

  .action-btn{
    width:52px;
    height:52px;
    min-width:52px;
  }

}

/* Prevent iOS/Android weird selection */
button,
select{
  -webkit-tap-highlight-color:transparent;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="app">

<!-- =======================================================
     HEADER
======================================================= -->

<header id="topHeader" class="flex items-center justify-between px-3 md:px-5">

  <div class="flex items-center gap-2.5 min-w-0">

    <img
      src="/logo.png"
      onerror="this.onerror=null;this.src='https://i.pravatar.cc/100'"
      class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-white border object-cover shrink-0"
      alt="SomaHub"
    >

    <div class="leading-tight min-w-0">
      <p class="header-title font-black text-[15px] md:text-[17px] text-[#263b99] truncate">
        SomaHub Tutor
      </p>

      <p class="header-status text-[10px] md:text-[11px] text-green-600 font-bold flex items-center gap-1">
        <span class="w-2 h-2 bg-green-500 rounded-full inline-block"></span>
        Online • Auto EN/SW
      </p>
    </div>

  </div>

  <div class="flex items-center gap-2">

    <select
      id="grade"
      class="h-9 md:h-10 bg-[#f3f5fa] rounded-full px-3 md:px-4 text-[11px] md:text-[12px] font-bold outline-none border border-[#e1e5ed]"
    >
      <option>Playground</option>
      <option>PP1</option>
      <option>PP2</option>
      <option>Grade 1</option>
      <option>Grade 2</option>
      <option>Grade 3</option>
      <option>Grade 4</option>
      <option>Grade 5</option>
      <option>Grade 6</option>
      <option selected>Grade 7</option>
      <option>Grade 8</option>
      <option>Grade 9</option>
      <option>Grade 10</option>
    </select>

    <button
      onclick="openHistory()"
      class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-[#263b99] text-white flex items-center justify-center text-[12px] shadow-sm"
      aria-label="History"
    >
      <i class="fa-regular fa-clock"></i>
    </button>

  </div>

</header>


<!-- =======================================================
     CHAT AREA
======================================================= -->

<main id="chat">

  <div class="chat-inner">

    <!-- WELCOME -->

    <div id="welcome">

      <div class="welcome-logo">
        🎓
      </div>

      <h2 class="welcome-title">
        How can I help you learn?
      </h2>

      <p class="welcome-text">
        Ask a question, upload homework, or say Habari.
        SomaHub Tutor understands English and Kiswahili.
      </p>

    </div>

    <!-- MESSAGES -->

    <div id="messages"></div>

  </div>

</main>


<!-- =======================================================
     INPUT FOOTER
======================================================= -->

<footer id="inputFooter">

  <div class="input-inner">

    <!-- ATTACHMENT PREVIEW -->

    <div
      id="previewBox"
      class="hidden bg-white rounded-xl p-2 flex items-center gap-2 border border-gray-200"
    >

      <img
        id="previewImg"
        class="w-10 h-10 rounded-lg object-cover hidden"
        alt=""
      >

      <i
        id="previewDocIcon"
        class="fa-solid fa-file text-gray-400 text-lg hidden"
      ></i>

      <span
        id="previewName"
        class="text-[11px] flex-1 truncate font-semibold text-gray-700"
      ></span>

      <button
        onclick="clearAttach()"
        class="w-7 h-7 bg-gray-900 text-white rounded-full text-[10px]"
      >
        ✕
      </button>

    </div>


    <!-- ERROR -->

    <div
      id="errorBox"
      class="hidden bg-red-50 text-red-600 text-[11px] px-3 py-1.5 rounded-xl mb-2 text-center"
    ></div>


    <!-- INPUT ROW -->

    <div class="input-row">

      <!-- TEXT + TOOLS -->

      <div class="message-box">

        <!-- DOCUMENT -->

        <button
          onclick="document.getElementById('docInput').click()"
          class="tool-btn"
          aria-label="Attach document"
        >
          <i class="fa-solid fa-paperclip"></i>
        </button>

        <!-- IMAGE -->

        <button
          onclick="document.getElementById('imgInput').click()"
          class="tool-btn"
          aria-label="Choose image"
        >
          <i class="fa-solid fa-image"></i>
        </button>

        <!-- CAMERA -->

        <button
          onclick="document.getElementById('camInput').click()"
          class="tool-btn"
          aria-label="Take photo"
        >
          <i class="fa-solid fa-camera"></i>
        </button>


        <!-- MESSAGE -->

        <textarea
          id="msg"
          rows="1"
          placeholder="Ask SomaHub..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

      </div>


      <!-- VOICE -->

      <button
        id="voiceBtn"
        class="action-btn"
        aria-label="Hold to speak"
        title="Hold to speak"
      >
        <i class="fa-solid fa-microphone"></i>
      </button>


      <!-- SEND -->

      <button
        id="sendBtn"
        class="action-btn"
        onclick="sendMsg()"
        aria-label="Send"
      >
        <i class="fa-solid fa-paper-plane text-[15px]"></i>
      </button>

    </div>


    <!-- RECORDING STATUS -->

    <p
      id="listenTxt"
      class="hidden text-[10px] text-red-500 text-center mt-1 font-bold animate-pulse"
    >
      ● Listening... release to stop
    </p>

  </div>

</footer>

</div>


<!-- =======================================================
     HISTORY
======================================================= -->

<div
  id="historyDrawer"
  class="hidden flex-col"
>

  <div class="h-14 border-b bg-white flex items-center justify-between px-4 shrink-0">

    <button
      onclick="closeHistory()"
      class="font-bold text-sm text-[#263b99]"
    >
      ← Back
    </button>

    <b class="text-[14px]">
      History
    </b>

    <button
      onclick="clearHistory()"
      class="text-[11px] text-gray-500"
    >
      Delete All
    </button>

  </div>

  <div
    id="historyList"
    class="flex-1 overflow-auto p-3"
  ></div>

</div>


<!-- =======================================================
     FILE INPUTS
======================================================= -->

<input
  id="docInput"
  type="file"
  class="hidden"
  accept=".pdf,.doc,.docx,.txt"
  onchange="handleDoc(this)"
>

<input
  id="imgInput"
  type="file"
  class="hidden"
  accept="image/*"
  onchange="handlePhoto(this)"
>

<input
  id="camInput"
  type="file"
  class="hidden"
  accept="image/*"
  capture="environment"
  onchange="handlePhoto(this)"
>


<script>

/* =========================================================
   CONFIG
========================================================= */

const PROXY = "/api/gemini";

let grade = "Grade 7";

let uploadedPhoto = "";
let uploadedMime = "";
let uploadedDocName = "";

let isThinking = false;

let recognition = null;
let listening = false;

let chatHistory = [];


/* =========================================================
   DOM
========================================================= */

const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const msg = document.getElementById("msg");
const welcome = document.getElementById("welcome");
const voiceBtn = document.getElementById("voiceBtn");
const listenTxt = document.getElementById("listenTxt");


/* =========================================================
   LANGUAGE
========================================================= */

const SW = [
  "habari",
  "mambo",
  "nisaidie",
  "hesabu",
  "hisabati",
  "sayansi",
  "kiswahili",
  "shule",
  "mwalimu",
  "asante",
  "eleza",
  "soma",
  "darasa",
  "mtihani",
  "kwa nini",
  "ni nini"
];

function detectLang(t){

  if(!t) return "EN";

  const l = String(t).toLowerCase();

  return SW.some(k => l.includes(k))
    ? "SW"
    : "EN";
}


/* =========================================================
   GRADE
========================================================= */

document
  .getElementById("grade")
  .addEventListener("change", e => {

    grade = e.target.value;

  });


/* =========================================================
   TEXTAREA AUTO RESIZE
========================================================= */

function resizeTextarea(){

  msg.style.height = "auto";

  const h = Math.min(
    Math.max(msg.scrollHeight,40),
    105
  );

  msg.style.height = h + "px";
}

msg.addEventListener("input", resizeTextarea);


/* =========================================================
   KEYBOARD SEND
========================================================= */

msg.addEventListener("keydown", e => {

  if(
    e.key === "Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    sendMsg();

  }

});


/* =========================================================
   KEEP INPUT VISIBLE WHEN KEYBOARD OPENS
========================================================= */

if(window.visualViewport){

  const adjustForKeyboard = () => {

    requestAnimationFrame(() => {

      chat.scrollTop = chat.scrollHeight;

    });

  };

  window.visualViewport.addEventListener(
    "resize",
    adjustForKeyboard
  );

  window.visualViewport.addEventListener(
    "scroll",
    adjustForKeyboard
  );
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

(function(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    recognition = null;

    return;
  }

  recognition = new SR();

  recognition.continuous = false;

  recognition.interimResults = true;

  recognition.maxAlternatives = 1;


  recognition.onstart = () => {

    listening = true;

    voiceBtn.classList.add("recording");

    voiceBtn.innerHTML =
      '<i class="fa-solid fa-stop"></i>';

    listenTxt.classList.remove("hidden");

  };


  recognition.onend = () => {

    listening = false;

    voiceBtn.classList.remove("recording");

    voiceBtn.innerHTML =
      '<i class="fa-solid fa-microphone"></i>';

    listenTxt.classList.add("hidden");

    resizeTextarea();

    msg.focus();

  };


  recognition.onerror = e => {

    listening = false;

    voiceBtn.classList.remove("recording");

    voiceBtn.innerHTML =
      '<i class="fa-solid fa-microphone"></i>';

    listenTxt.classList.add("hidden");

    if(e.error !== "no-speech"){
      showError("Voice input: " + e.error);
    }

  };


  recognition.onresult = e => {

    let finalText = "";
    let interimText = "";

    for(
      let i = e.resultIndex;
      i < e.results.length;
      i++
    ){

      const text =
        e.results[i][0].transcript;

      if(e.results[i].isFinal){

        finalText += text;

      }else{

        interimText += text;

      }

    }

    /*
      IMPORTANT:
      Voice goes into the text box.
      It does NOT send automatically.
      User can edit before sending.
    */

    if(finalText){

      const existing =
        msg.dataset.voiceBase || "";

      msg.value =
        (existing ? existing + " " : "") +
        finalText.trim();

      msg.dataset.voiceBase =
        msg.value;

    }else if(interimText){

      const existing =
        msg.dataset.voiceBase || "";

      msg.value =
        (existing ? existing + " " : "") +
        interimText.trim();

    }

    resizeTextarea();

  };

})();


/* =========================================================
   HOLD TO RECORD
========================================================= */

function startVoice(e){

  if(e){

    e.preventDefault();

  }

  if(!recognition){

    showError(
      "Voice typing is not supported here. Try Chrome."
    );

    return;
  }

  if(listening) return;

  /*
    Save current text so voice can be added
    without destroying what the learner typed.
  */

  msg.dataset.voiceBase =
    msg.value.trim();

  recognition.lang =
    detectLang(msg.value) === "SW"
      ? "sw-KE"
      : "en-KE";

  try{

    recognition.start();

  }catch(err){

    /* Browser may say recognition is already active */

  }

}


function stopVoice(e){

  if(e){

    e.preventDefault();

  }

  if(
    recognition &&
    listening
  ){

    recognition.stop();

  }

}


/*
  Mobile
*/

voiceBtn.addEventListener(
  "touchstart",
  startVoice,
  {passive:false}
);

voiceBtn.addEventListener(
  "touchend",
  stopVoice,
  {passive:false}
);

voiceBtn.addEventListener(
  "touchcancel",
  stopVoice,
  {passive:false}
);


/*
  Desktop
*/

voiceBtn.addEventListener(
  "mousedown",
  startVoice
);

voiceBtn.addEventListener(
  "mouseup",
  stopVoice
);

voiceBtn.addEventListener(
  "mouseleave",
  stopVoice
);


/* =========================================================
   PHOTO
========================================================= */

function handlePhoto(input){

  const f = input.files[0];

  if(!f) return;

  const reader = new FileReader();

  reader.onload = () => {

    const img = new Image();

    img.onload = () => {

      const canvas =
        document.createElement("canvas");

      let w = img.width;
      let h = img.height;

      /*
        Keep images reasonably small for
        fast API requests.
      */

      const max = 1200;

      if(w > max || h > max){

        const scale =
          Math.min(
            max / w,
            max / h
          );

        w = Math.round(w * scale);
        h = Math.round(h * scale);

      }

      canvas.width = w;
      canvas.height = h;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        w,
        h
      );

      uploadedPhoto =
        canvas.toDataURL(
          "image/jpeg",
          0.72
        );

      uploadedMime =
        "image/jpeg";

      document
        .getElementById("previewImg")
        .src = uploadedPhoto;

      document
        .getElementById("previewImg")
        .classList
        .remove("hidden");

      document
        .getElementById("previewDocIcon")
        .classList
        .add("hidden");

      document
        .getElementById("previewName")
        .textContent = f.name;

      document
        .getElementById("previewBox")
        .classList
        .remove("hidden");

    };

    img.src = reader.result;

  };

  reader.readAsDataURL(f);

  input.value = "";

}


/* =========================================================
   DOCUMENT
========================================================= */

function handleDoc(input){

  const f = input.files[0];

  if(!f) return;

  uploadedDocName =
    f.name;

  uploadedPhoto = "";

  document
    .getElementById("previewImg")
    .classList
    .add("hidden");

  document
    .getElementById("previewDocIcon")
    .classList
    .remove("hidden");

  document
    .getElementById("previewName")
    .textContent =
    f.name;

  document
    .getElementById("previewBox")
    .classList
    .remove("hidden");

  input.value = "";

}

   CLEAR ATTACHMENT
========================================================= */

function clearAttach(){

  uploadedPhoto = "";

  uploadedMime = "";

  uploadedDocName = "";

  document
    .getElementById("previewBox")

    .add("hidden");

/* =========================================================
   CLEAN AI RESPONSE
========================================================= */

function cleanAIText(text){

  let t =
    String(text || "");

  /*
    Remove square bracket labels.
  */

  t = t.replace(
    /\[(topic|strand|explanation|answer|details?|detailed explanation|reason|correct answer)\]\s*/gi,
    ""
  );

  /*
    Remove accidental markdown heading markers.
  */

  t = t.replace(
    /^#{1,6}\s*/gm,
    ""
  );

  /*
    Remove empty brackets.
  */

  t = t.replace(
    /\[\s*\]/g,
    ""
  );

  return t.trim();

}


/* =========================================================
   FORMAT AI RESPONSE
========================================================= */

function formatResponse(text){

  let t =
    cleanAIText(text);

  /*
    Escape unsafe HTML first.
  */

  t = t
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");


  /*
    Bold markdown.
  */

  t = t.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );


  /*
    Topic / Strand lines.
  */

  t = t.replace(
    /^(Topic|Strand)\s*[:\-]\s*(.*?)$/gim,
    '<div class="ai-topic">$1: $2</div>'
  );


  /*
    Explanation heading.
  */

  t = t.replace(
    /^(Explanation|Answer|Correct Answer)\s*[:\-]?\s*$/gim,
    '<div class="ai-explanation">$1</div>'
  );


  /*
    Why other choices are wrong.
  */

  t = t.replace(
    /^(Why the other choices are wrong|Why other choices are wrong)\s*[:\-]?\s*$/gim,
    '<div class="ai-explanation">Why the other choices are wrong</div>'
  );


  const lines =
    t.split("\n");


  let html = "";

  for(let line of lines){

    line = line.trim();

    if(!line) continue;


    if(
      line.includes('class="ai-topic"') ||
      line.includes('class="ai-explanation"')
    ){

      html += line;

      continue;

    }


    /*
      Numbered points.
    */

    if(/^\d+\.\s/.test(line)){

      html +=
        `<p class="ai-detail">${line}</p>`;

      continue;

    }


    /*
      Bullet points.
    */

    if(
      line.startsWith("- ") ||
      line.startsWith("• ")
    ){

      html +=
        `<p class="ai-detail">• ${line.slice(2)}</p>`;

      continue;

    }


    /*
      Normal detailed text.
    */

    html +=
      `<p class="ai-detail">${line}</p>`;

  }


  return html;

}

/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* =========================================================
   COPY
========================================================= */

async function copyCard(id){

  const el =
    document.getElementById(id);

  if(!el) return;

  const text =
    el.innerText;

  try{

    await navigator.clipboard.writeText(text);

  }catch{

    const ta =
      document.createElement("textarea");

    ta.value = text;

    document.body.appendChild(ta);

    ta.select();

    document.execCommand("copy");

    ta.remove();

  }

}


/* =========================================================
   LISTEN
========================================================= */

function listenCard(id){

  if(!("speechSynthesis" in window)){

    showError("Speech playback is not supported.");

    return;

  }

  speechSynthesis.cancel();

  const el =
    document.getElementById(id);

  if(!el) return;

  const text =
    el.innerText.slice(0,3000);

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    detectLang(text) === "SW"
      ? "sw-KE"
      : "en-KE";

  utterance.rate = 1.05;

  utterance.pitch = 1;

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadCard(id){

  const el =
    document.getElementById(id);

  if(!el) return;

  const text =
    el.innerText;

  const blob =
    new Blob(
      [text],
      {type:"text/plain"}
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "SomaHub-" +
    Date.now() +
    ".txt";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );

}


/* =========================================================
   PRINT
========================================================= */

function printCard(id){

  const el =
    document.getElementById(id);

  if(!el) return;

  const content =
    el.innerHTML;

  const w =
    window.open(
      "",
      "_blank"
    );

  if(!w){

    showError(
      "Please allow pop-ups to print."
    );

    return;

  }

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>SomaHub Tutor</title>

      <style>

        body{
          font-family:Arial,sans-serif;
          padding:25px;
          line-height:1.7;
          font-size:14px;
          color:#111;
        }

        .ai-topic{
          color:#dc2626;
          font-weight:bold;
        }

        .ai-explanation{
          color:#2563eb;
          font-weight:bold;
          margin-top:15px;
        }

        .ai-detail{
          color:#111;
        }

      </style>

    </head>

    <body>

      ${content}

      <script>
        window.onload=function(){
          window.print();
        };
      <\/script>

    </body>
    </html>
  `);

  w.document.close();

}


/* =========================================================
   SAVE HISTORY
========================================================= */

function saveH(text){

  const h =
    JSON.parse(
      localStorage.getItem("sh") || "[]"
    );

  h.unshift({
    id:Date.now(),
    title:String(text).slice(0,60),
    time:new Date().toISOString(),
    grade:grade
  });

  localStorage.setItem(
    "sh",
    JSON.stringify(
      h.slice(0,100)
    )
  );

}


/* =========================================================
   OPEN HISTORY
========================================================= */

function openHistory(){

  const drawer =
    document.getElementById(
      "historyDrawer"
    );

  drawer.classList.remove("hidden");

  drawer.classList.add("flex");

  const h =
    JSON.parse(
      localStorage.getItem("sh") || "[]"
    );

  const list =
    document.getElementById(
      "historyList"
    );

  if(!h.length){

    list.innerHTML = `
      <p
        class="text-center text-gray-400
        mt-20 text-xs"
      >
        No history yet
      </p>
    `;

    return;

  }

  list.innerHTML = "";

  h.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "py-3 border-b flex justify-between gap-3";

    const safeTitle =
      String(item.title)
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

    div.innerHTML = `

      <div class="min-w-0">

        <p
          class="text-[12px] font-bold
          truncate"
        >
          ${safeTitle}
        </p>

        <p
          class="text-[9px] text-gray-500 mt-1"
        >
          ${item.grade || "Learner"}
        </p>

      </div>

      <button
        onclick="delH('${item.id}')"
        class="text-[16px] text-gray-400 shrink-0"
      >
        ×
      </button>

    `;

    list.appendChild(div);

  });

}


/* =========================================================
   CLOSE HISTORY
========================================================= */

function closeHistory(){

  const drawer =
    document.getElementById(
      "historyDrawer"
    );

  drawer.classList.add("hidden");

  drawer.classList.remove("flex");

}


/* =========================================================
   DELETE HISTORY ITEM
========================================================= */

function delH(id){

  let h =
    JSON.parse(
      localStorage.getItem("sh") || "[]"
    );

  h =
    h.filter(
      x => String(x.id) !== String(id)
    );

  localStorage.setItem(
    "sh",
    JSON.stringify(h)
  );

  openHistory();

}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory(){

  if(
    confirm(
      "Delete all history?"
    )
  ){

    localStorage.removeItem("sh");

    openHistory();

  }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMsg(){

  const text =
    msg.value.trim();

  if(
    !text &&
    !uploadedPhoto
  ){

    return;

  }

  if(isThinking){

    return;

  }


  /*
    Stop voice if active.
  */

  if(
    recognition &&
    listening
  ){

    recognition.stop();

  }


  if(text){

    addUser(text);

  }


  if(uploadedPhoto){

    addUserPhoto(
      uploadedPhoto
    );

  }


  saveH(
    text ||
    uploadedDocName ||
    "Photo"
  );


  const originalQuestion =
    text ||
    "Explain this image";


  const lang =
    detectLang(text);


  /*
    Clear input immediately.
    This makes the interface feel faster.
  */

  msg.value = "";

  msg.dataset.voiceBase = "";

  resizeTextarea();


  const keepPhoto =
    uploadedPhoto;

  const keepMime =
    uploadedMime ||
    "image/jpeg";


  clearAttach();


  /*
    THINKING UI appears immediately.
  */

  addThinking();

  isThinking = true;


  /*
    IMPORTANT:
    These instructions tell the API how the
    learner wants the answer formatted.

    They are not shown to the learner.
  */

  const formattingInstruction = `

SomaHub Tutor response style:

Use a friendly, human and age-appropriate teaching style.

If relevant, begin with:
Topic: [topic]
or
Strand: [strand]

Then give:
Explanation:

Then give the detailed explanation in clear black-text-friendly paragraphs.

Do not use square brackets in the final answer.

For multiple-choice questions:
- clearly identify the correct answer
- explain why it is correct
- explain briefly why each of the other choices is wrong

For mathematics, show clear working.

Keep the explanation suitable for ${grade}.

Do not unnecessarily repeat the question.
Do not use long introductions.
Do not add unnecessary headings.
`;


  const apiQuestion =
    originalQuestion +
    "\n\n" +
    formattingInstruction;


  const payload = {

    question:apiQuestion,

    originalQuestion:originalQuestion,

    grade:grade,

    role:"Student",

    task:lang,

    mode:"student",

    history:
      chatHistory.slice(-6),

    photo:keepPhoto,

    mimeType:keepMime,

    provider:"auto"

  };


  /*
    Use a controller so a stalled request
    does not leave the learner waiting forever.
  */

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      45000
    );


  try{

    const res =
      await fetch(
        PROXY,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload),

          signal:
            controller.signal
        }
      );


    const textRes =
      await res.text();


    let data;


    try{

      data =
        JSON.parse(textRes);

    }catch{

      throw new Error(
        textRes.slice(0,250) ||
        "Invalid server response"
      );

    }


    document
      .getElementById("thinking")
      ?.remove();


    if(!res.ok){

      throw new Error(
        data.error ||
        "Server error"
      );

    }


    const reply =
      data.answer ||
      data.reply ||
      "";


    if(!reply){

      throw new Error(
        "SomaHub returned an empty answer."
      );

    }


    /*
      Show answer immediately.
    */

    addAI(reply);


  }catch(error){

    document
      .getElementById("thinking")
      ?.remove();


    let errorMessage =
      error.message;


    if(
      error.name === "AbortError"
    ){

      errorMessage =
        "The response is taking too long. Please try again.";

    }


    showError(
      errorMessage
    );


    /*
      Keep error friendly rather than
      displaying raw technical information
      inside a normal AI card.
    */

    addAI(
      lang === "SW"
        ? "Samahani, sijapata jibu kwa sasa. Tafadhali jaribu tena."
        : "Sorry, I couldn't get an answer right now. Please try again."
    );

  }finally{

    clearTimeout(timeout);

    isThinking = false;

    setTimeout(
      scrollBottom,
      30
    );

  }

}

   INITIAL TEXTAREA SIZE
========================================================= */

resizeTextarea();


/* =========================================================
   KEEP CHAT AT BOTTOM WHEN APP RESIZES
========================================================= */

window.addEventListener(
  "resize",
  () => {

    setTimeout(
      scrollBottom,
      80
    );

  }
);
