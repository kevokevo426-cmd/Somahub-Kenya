<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:'Nunito',sans-serif;background:#f5f8ff}
body{overflow:hidden}
#app{width:100%;height:100dvh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden}
#topHeader{flex:0 0 auto;height:64px;min-height:64px;background:#fff;border-bottom:1px solid #e7ebf2;z-index:20}
#chat{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:10px}
#chat::-webkit-scrollbar{width:4px}
#chat::-webkit-scrollbar-thumb{background:#d4d9e4;border-radius:20px}
.chat-inner{width:100%;max-width:980px;margin:auto;padding:18px 14px 25px}
#welcome{width:100%;max-width:760px;margin:auto;padding:38px 10px 25px;text-align:center}
.welcome-logo{width:88px;height:88px;margin:auto;border-radius:28px;background:linear-gradient(145deg,#3349b8,#5368dc);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 12px 30px rgba(51,73,184,.18)}
.welcome-title{margin-top:18px;color:#263b99;font-size:clamp(25px,4vw,40px);font-weight:900;line-height:1.15}
.welcome-text{margin:12px auto 0;max-width:560px;color:#68738a;font-size:clamp(14px,2vw,17px);line-height:1.6}
.message-in{animation:messageIn .16s ease-out}
@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.user-bubble{background:#d9f7c5;color:#111827;padding:12px 18px;border-radius:20px;border-bottom-right-radius:6px;max-width:85%;font-size:15px;line-height:1.6;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.ai-row{display:flex;gap:10px;align-items:flex-start}
.ai-avatar{width:40px;height:40px;min-width:40px;border-radius:50%;background:#263b99;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(38,59,153,.25)}
.ai-card{background:#fff;border:1px solid #e4e8f0;border-radius:18px;border-top-left-radius:6px;padding:16px 18px;line-height:1.7;font-size:14px;color:#111827;box-shadow:0 3px 12px rgba(30,50,90,.04);overflow-wrap:anywhere;flex:1}
.ai-card p{margin:7px 0}
.ai-topic{color:#dc2626;font-size:13px;font-weight:900;margin:2px 0 8px}
.ai-explanation{color:#2563eb;font-size:15px;font-weight:900;margin:11px 0 5px}
.ai-detail{color:#111827;font-weight:600}
.ai-card ul{margin:7px 0 7px 20px;list-style:disc}
.ai-card ol{margin:7px 0 7px 20px;list-style:decimal}
.ai-card b{color:#2563eb}
.ai-card .ai-key{color:#dc2626;font-weight:900}
.ai-card .ai-answer{color:#16a34a;font-weight:900}
.ai-card .ai-note{color:#ea580c;font-weight:900}
.ai-actions{display:flex;gap:5px;flex-wrap:nowrap;margin:10px 0 0 50px}
.ai-actions button{flex:1;min-width:0;white-space:nowrap;border:0;padding:7px 4px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.ai-actions button:active{transform:scale(.96)}
.ai-actions .copy-btn{background:#2563eb}
.ai-actions .listen-btn{background:#16a34a}
.ai-actions .download-btn{background:#ea580c}
.ai-actions .print-btn{background:#263b99}
#inputFooter{flex:0 0 auto;width:100%;background:#f1f4fa;border-top:1px solid #dfe5ef;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:30}
.input-inner{width:100%;max-width:980px;margin:auto}
.input-row{width:100%;display:flex;align-items:flex-end;gap:7px}
.message-box{flex:1 1 auto;min-width:0;min-height:48px;max-height:125px;background:#fff;border:1px solid #dce2eb;border-radius:26px;display:flex;align-items:flex-end;padding:4px 7px;box-shadow:0 2px 8px rgba(20,40,80,.05)}
.message-box:focus-within{border-color:#7184d8;box-shadow:0 0 0 3px rgba(81,102,210,.08)}
.tool-btn{width:38px;height:38px;min-width:38px;border:0;border-radius:50%;background:transparent;color:#667085;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tool-btn:active{transform:scale(.94)}
#msg{flex:1;min-width:0;border:0;outline:none;background:transparent;resize:none;font-family:'Nunito',sans-serif;font-size:15px;line-height:21px;color:#182033;padding:9px 6px;min-height:40px;max-height:105px;overflow-y:auto}
#msg::placeholder{color:#98a2b3}
.action-btn{width:48px;height:48px;min-width:48px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(30,45,100,.18)}
.action-btn:active{transform:scale(.92)}
#voiceBtn{background:#263b99}
#sendBtn{background:#20c56b}
#voiceBtn.recording{background:#dc2626;animation:pulseRecord 1s infinite}
@keyframes pulseRecord{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.25)}50%{box-shadow:0 0 0 9px rgba(220,38,38,0)}}
.thinking-bubble{display:flex;align-items:center;gap:8px;color:#7b8496;font-size:12px}
.thinking-dots{display:flex;gap:3px}
.thinking-dots span{width:5px;height:5px;border-radius:50%;background:#6574c5;animation:dot .8s infinite}
.thinking-dots span:nth-child(2){animation-delay:.15s}
.thinking-dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
#historyDrawer{position:fixed;inset:0;z-index:100;background:#f8faff}
button,select{-webkit-tap-highlight-color:transparent;font-family:inherit}
.hidden{display:none!important}
@media(max-width:480px){
  #topHeader{height:60px;min-height:60px}
  .header-title{font-size:13px!important}
  .header-status{font-size:9px!important}
  #grade{max-width:105px;font-size:11px!important;padding-left:9px;padding-right:9px}
  .chat-inner{padding:12px 9px 18px}
  #welcome{padding:25px 8px 20px}
  .welcome-logo{width:72px;height:72px;border-radius:24px;font-size:34px}
  .welcome-title{font-size:24px}
  .welcome-text{font-size:13px}
  .ai-card{font-size:13.5px;padding:14px;border-radius:16px}
  .tool-btn{width:34px;min-width:34px;height:36px}
  #msg{font-size:14px;padding-left:3px;padding-right:3px}
  .action-btn{width:45px;height:45px;min-width:45px}
  .ai-avatar{width:36px;height:36px;min-width:36px;font-size:16px}
  .ai-actions{margin-left:46px;gap:4px}
  .ai-actions button{font-size:10px;padding:6px 2px;gap:3px}
}
@media(min-width:600px){
  #topHeader{height:70px;min-height:70px}
  .chat-inner{padding-left:24px;padding-right:24px}
  #inputFooter{padding-left:20px;padding-right:20px}
  .message-box{min-height:52px}
  #msg{font-size:16px}
}
@media(min-width:1024px){
  #topHeader{height:74px;min-height:74px}
  .chat-inner{padding-top:24px}
  #inputFooter{padding:12px 24px 14px}
  .message-box{min-height:54px}
  .action-btn{width:52px;height:52px;min-width:52px}
}
</style>

<script>
const PROXY = "/api/gemini";
let grade = "Grade 7";
let uploadedPhoto = "";
let uploadedMime = "";
let uploadedDocName = "";
let isThinking = false;
let recognition = null;
let listening = false;
let chatHistory = [];
let ALL_RESOURCES = [];
let AI_BRAIN = [];
let GEMINI_KEY = "";
let resourcesLoaded = false;
async function getGeminiKey(){
  if(GEMINI_KEY) return GEMINI_KEY;
  try{
    let FB = window.FB;
    let d = await FB.getDoc(FB.doc(FB.db,'settings','gemini'));
    if(d.exists() && d.data().key){ GEMINI_KEY = d.data().key; return GEMINI_KEY; }
    let d2 = await FB.getDoc(FB.doc(FB.db,'settings','ai'));
    if(d2.exists() && d2.data().geminiKey){ GEMINI_KEY = d2.data().geminiKey; return GEMINI_KEY; }
  }catch(e){}
  return localStorage.getItem('somahub_gemini_key') || "";
}
async function reloadResources(){
  try{
    let FB = window.FB;
    let s = await FB.getDocs(FB.collection(FB.db,'resources'));
    ALL_RESOURCES = []; s.forEach(d=>ALL_RESOURCES.push({id:d.id,...d.data()}));
    let s2 = await FB.getDocs(FB.collection(FB.db,'ai_brain'));
    AI_BRAIN = []; s2.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()}));
    resourcesLoaded = true;
  }catch(e){}
}
function findRelevantResources(userText){
  let t = (userText||"").toLowerCase();
  let sameGrade = ALL_RESOURCES.filter(r=>r.grade==grade);
  let words = t.split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let scored = sameGrade.map(r=>{
    let hay = (r.title+' '+r.subject+' '+r.description).toLowerCase();
    let score = 0; words.forEach(w=>{ if(hay.includes(w)) score++; });
    if(r.type=='Curriculum Design' || r.type=='Design') score+=2;
    if(r.type=='Notes') score+=2;
    if(r.type=='Scheme') score+=1;
    return {...r, score};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);
  if(scored.length) return scored.slice(0,5);
  return sameGrade.filter(r=>['Curriculum Design','Design','Notes','Scheme','LessonPlan'].includes(r.type)).slice(0,5);
}
function buildContext(userText, hasPhoto){
  let t = (userText||"").toLowerCase();
  let isExam = /set.*exam|give.*exam|create.*exam|make.*exam|set.*test|set.*mtihani/i.test(t);
  let isHW = /set.*homework|give.*homework|create.*homework|make.*homework|set.*assignment|set.*kazi/i.test(t);
  let rel = findRelevantResources(userText);
  let ctx = `You are SomaHub Tutor, CBC Kenya tutor for ${grade}. Answer in ${detectLang(userText)=='SW'?'Kiswahili + English mix':'English'}.\n`;
  ctx += `RULE: Use the Designs/Notes below if they match. If not, just answer from CBC / KICD knowledge. Never mention Admin, Designs, resources, or missing anything. Just give the answer. Use **bold** for key points, and start key lines with Key Point:, Answer:, Note: or Important:\n\n`;
  if(rel.length){
    ctx += `Designs/Notes for ${grade}:\n`;
    rel.forEach((r,i)=>{ ctx += `${i+1}. [${r.type}] ${r.title} | ${r.grade} ${r.subject} | ${r.description||''}\n`; });
    ctx += `\nUse these first, then add what is missing from KICD.\n\n`;
  } else {
    ctx += `Use CBC / KICD ${grade} curriculum.\n\n`;
  }
  if(AI_BRAIN.length){
    let brain = AI_BRAIN.filter(b=>b.grade==grade).slice(0,3);
    if(brain.length){ ctx += `Textbook context:\n`; brain.forEach(b=>{ ctx += `- ${b.title||''} | ${b.subject||''} | ${b.text||''}\n`; }); ctx += `\n`; }
  }
  if(isExam) ctx += `TASK: Set Exam. 10 questions: 5 MCQ, 3 Short Answer, 2 Structured. Give Marking Scheme at end.\n`;
  else if(isHW) ctx += `TASK: Set Homework. 5 questions easy to hard, 1 real-life Kenya example, Answers at end.\n`;
  else if(hasPhoto) ctx += `TASK: PHOTO ATTACHED - This is a question paper / homework photo. DO NOT create new homework. READ the photo, TRANSCRIBE each question, then ANSWER / SOLVE each question one by one with clear steps and final answers. If photo is blurry, answer what you can see.\n`;
  else ctx += `Explain clearly.\n`;
  ctx += `\nUser question: ${userText || "Answer the questions in the attached photo"}`;
  return ctx;
}
const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const msg = document.getElementById("msg");
const welcome = document.getElementById("welcome");
const voiceBtn = document.getElementById("voiceBtn");
const listenTxt = document.getElementById("listenTxt");
const SW = ["habari","mambo","nisaidie","hesabu","hisabati","sayansi","kiswahili","shule","mwalimu","asante","eleza","soma","darasa","mtihani","kwa nini","ni nini"];
function detectLang(text){
  if(!text) return "EN";
  const t = String(text).toLowerCase();
  return SW.some(word => t.includes(word)) ? "SW" : "EN";
}
document.getElementById("grade").addEventListener("change",e => { grade = e.target.value; reloadResources(); });
function resizeTextarea(){ msg.style.height = "auto"; msg.style.height = Math.min(Math.max(msg.scrollHeight,40),105) + "px"; }
msg.addEventListener("input", resizeTextarea);
msg.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
function showError(t){ let b = document.getElementById("errorBox"); b.innerText = t; b.classList.remove("hidden"); setTimeout(()=>b.classList.add("hidden"),4000); }
let msgId = 0;
function addUserMsg(text){
  welcome.style.display = "none";
  let d = document.createElement("div");
  d.className = "message-in flex justify-end my-2";
  d.innerHTML = `<div class="user-bubble"></div>`;
  d.querySelector(".user-bubble").innerText = text;
  messages.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function addAiMsg(html, plainText){
  let id = ++msgId;
  let d = document.createElement("div");
  d.className = "message-in my-3";
  d.innerHTML = `<div class="ai-row"><div class="ai-avatar">🎓</div><div class="ai-card"></div></div><div class="ai-actions"><button class="copy-btn" onclick="copyMsg(${id})"><i class="fa-regular fa-copy"></i> Copy</button><button class="listen-btn" onclick="listenMsg(${id})"><i class="fa-solid fa-volume-high"></i> Listen</button><button class="download-btn" onclick="downloadMsg(${id})"><i class="fa-solid fa-download"></i> Download</button><button class="print-btn" onclick="printMsg(${id})"><i class="fa-solid fa-print"></i> Print</button></div>`;
  d.querySelector(".ai-card").innerHTML = html;
  d.querySelector(".ai-card").dataset.plain = plainText || d.querySelector(".ai-card").innerText;
  d.querySelector(".ai-card").id = "aiMsg-" + id;
  messages.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return d.querySelector(".ai-card");
}
function getMsgText(id){ let el = document.getElementById("aiMsg-" + id); return el ? (el.dataset.plain || el.innerText) : ""; }
function copyMsg(id){ let t = getMsgText(id); if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>showError("Copied ✓")); else showError("Copy not supported"); }
function listenMsg(id){ let t = getMsgText(id); try{ speechSynthesis.cancel(); let u = new SpeechSynthesisUtterance(t); u.lang = "en-KE"; speechSynthesis.speak(u); }catch(e){ showError("Listen not supported"); } }
function downloadMsg(id){ let t = getMsgText(id); let blob = new Blob([t], {type:"text/plain"}); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "SomaHub-Answer.txt"; a.click(); }
function printMsg(id){ let t = getMsgText(id); let w = window.open("", "_blank"); w.document.write("<html><head><title>SomaHub Tutor</title></head><body style='font-family:sans-serif;padding:20px;line-height:1.7;white-space:pre-wrap'>"+t.replace(/</g,"&lt;")+"</body></html>"); w.document.close(); w.print(); }
function addThinking(){ let d = document.createElement("div"); d.id = "thinkingRow"; d.className = "my-2"; d.innerHTML = `<div class="thinking-bubble"><div class="thinking-dots"><span></span><span></span><span></span></div> Thinking...</div>`; messages.appendChild(d); chat.scrollTop = chat.scrollHeight; }
function removeThinking(){ let t = document.getElementById("thinkingRow"); if(t) t.remove(); }
function formatAI(text){
  let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc = esc.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>");
  esc = esc.replace(/\*(.*?)\*/g,"<i>$1</i>");
  esc = esc.replace(/^### (.*)$/gm,"<div class='ai-explanation'>$1</div>");
  esc = esc.replace(/^## (.*)$/gm,"<div class='ai-explanation'>$1</div>");
  let lines = esc.split("\n"); let out = ""; let inList = false;
  lines.forEach(l=>{
    let t = l.trim();
    if(/^(Key Point|Key Points|Important|Remember|Note|Answer|Final Answer|Marking Scheme|Solution)[:：]/i.test(t)){
      if(inList){ out += "</ul>"; inList = false; }
      let cls = /^(Answer|Final Answer|Solution|Marking Scheme)/i.test(t) ? "ai-answer" : /^(Note|Important|Remember)/i.test(t) ? "ai-note" : "ai-key";
      out += `<p><span class="${cls}">${l}</span></p>`;
    }
    else if(/^\d+\.\s/.test(l)){ out += `<p><b>${l}</b></p>`; }
    else if(/^[-*]\s/.test(l)){ if(!inList){ out += "<ul>"; inList = true; } out += `<li>${l.replace(/^[-*]\s/,"")}</li>`; }
    else { if(inList){ out += "</ul>"; inList = false; } if(t) out += `<p>${l}</p>`; }
  });
  if(inList) out += "</ul>";
  return out;
}
async function sendMsg(){
  let text = msg.value.trim();
  if(!text && !uploadedPhoto) return;
  if(isThinking) return;
  if(!resourcesLoaded) await reloadResources();
  let hasPhoto = !!uploadedPhoto;
  let photoToSend = uploadedPhoto;
  let displayText = text || "📷 Photo";
  addUserMsg(displayText);
  msg.value = ""; resizeTextarea(); clearAttach(false);
  isThinking = true; addThinking();
  try{
    let contextPrompt = buildContext(text, hasPhoto);
    // ALIGNED TO api/gemini.js: sends BOTH prompt + question, BOTH image + photo, history with content
    let body = {
      prompt: contextPrompt,
      question: text || "Answer the questions in the attached photo",
      grade: grade,
      lang: detectLang(text),
      task: detectLang(text),
      history: chatHistory.slice(-4).map(h=>({role:h.role, content:h.text})),
      image: photoToSend,
      photo: photoToSend,
      mimeType: uploadedMime || "image/jpeg",
      mime: uploadedMime || "image/jpeg"
    };
    let res = await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let data = {};
    try{ data = await res.json(); }catch(e){ data = {}; }
    let aiText = data.answer || data.text || data.reply || "";
    if(!aiText) throw new Error(data.error || data.details || "No answer from AI");
    removeThinking();
    addAiMsg(formatAI(aiText), aiText);
    chatHistory.push({role:"user",text:text});
    chatHistory.push({role:"ai",text:aiText});
    saveHistory(text || "📷 Photo", aiText);
    uploadedPhoto = "";
  }catch(e){ removeThinking(); addAiMsg(`<p>${e.message}</p>`, e.message); showError(e.message); }
  isThinking = false;
}
(function(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){ recognition = null; return; }
  recognition = new SpeechRecognition();
  recognition.continuous = false; recognition.interimResults = false; recognition.maxAlternatives = 1;
  recognition.onstart = function(){ listening = true; voiceBtn.classList.add("recording"); voiceBtn.innerHTML = '<i class="fa-solid fa-stop"></i>'; listenTxt.classList.remove("hidden"); };
  recognition.onresult = function(event){ let spoken = ""; for(let i = event.resultIndex; i < event.results.length; i++){ if(event.results[i].isFinal) spoken += event.results[i][0].transcript; } spoken = spoken.trim(); if(spoken){ const existing = msg.value.trim(); msg.value = existing ? existing + " " + spoken : spoken; resizeTextarea(); msg.focus(); } };
  recognition.onerror = function(event){ listening = false; voiceBtn.classList.remove("recording"); voiceBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>'; listenTxt.classList.add("hidden"); if(event.error !== "no-speech" && event.error !== "aborted"){ showError("Voice input: " + event.error); } };
  recognition.onend = function(){ listening = false; voiceBtn.classList.remove("recording"); voiceBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>'; listenTxt.classList.add("hidden"); resizeTextarea(); };
})();
function startVoice(event){ if(event){ event.preventDefault(); } if(!recognition){ showError("Voice typing is not supported here. Try Chrome."); return; } if(listening) return; recognition.lang = detectLang(msg.value) === "SW" ? "sw-KE" : "en-KE"; try{ recognition.start(); }catch(error){ console.log("Speech start:", error); } }
function stopVoice(event){ if(event){ event.preventDefault(); } if(recognition && listening){ recognition.stop(); } }
voiceBtn.addEventListener("touchstart", startVoice, {passive:false});
voiceBtn.addEventListener("touchend", stopVoice, {passive:false});
voiceBtn.addEventListener("touchcancel", stopVoice, {passive:false});
voiceBtn.addEventListener("mousedown", startVoice);
voiceBtn.addEventListener("mouseup", stopVoice);
voiceBtn.addEventListener("mouseleave", stopVoice);
function handlePhoto(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement("canvas");
      let width = img.width; let height = img.height; const max = 1200;
      if(width > max || height > max){ const scale = Math.min(max / width, max / height); width = Math.round(width * scale); height = Math.round(height * scale); }
      canvas.width = width; canvas.height = height; canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      uploadedPhoto = canvas.toDataURL("image/jpeg", .72); uploadedMime = "image/jpeg";
      document.getElementById("previewImg").src = uploadedPhoto;
      document.getElementById("previewImg").classList.remove("hidden");
      document.getElementById("previewDocIcon").classList.add("hidden");
      document.getElementById("previewName").textContent = file.name;
      document.getElementById("previewBox").classList.remove("hidden");
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file); input.value = "";
}
function handleDoc(input){
  const file = input.files[0]; if(!file) return;
  uploadedDocName = file.name;
  document.getElementById("previewImg").classList.add("hidden");
  document.getElementById("previewDocIcon").classList.remove("hidden");
  document.getElementById("previewName").textContent = file.name;
  document.getElementById("previewBox").classList.remove("hidden");
  const reader = new FileReader();
  reader.onload = e => { msg.value = (msg.value ? msg.value + " " : "") + "File: " + file.name + " - Content: " + String(e.target.result).slice(0,2000); resizeTextarea(); };
  reader.readAsText(file); input.value = "";
}
function clearAttach(clearPhoto=true){ if(clearPhoto) uploadedPhoto = ""; document.getElementById("previewBox").classList.add("hidden"); }
function openHistory(){ document.getElementById("historyDrawer").classList.remove("hidden"); document.getElementById("historyDrawer").classList.add("flex"); renderHistory(); }
function closeHistory(){ document.getElementById("historyDrawer").classList.add("hidden"); document.getElementById("historyDrawer").classList.remove("flex"); }
function saveHistory(q,a){ try{ let h = JSON.parse(localStorage.getItem("somahub_history")||"[]"); h.unshift({q,a: a.slice(0,500), grade, time: new Date().toLocaleString()}); localStorage.setItem("somahub_history", JSON.stringify(h.slice(0,50))); }catch(e){} }
function renderHistory(){ let h = []; try{ h = JSON.parse(localStorage.getItem("somahub_history")||"[]"); }catch(e){} let box = document.getElementById("historyList"); if(!h.length){ box.innerHTML = "<p class='text-center text-gray-400 text-[12px] mt-10'>No history yet</p>"; return; } box.innerHTML = h.map((x,i)=>`<div class="bg-white border rounded-xl p-3 mb-2 cursor-pointer" onclick="loadHistoryItem(${i})"><p class="font-bold text-[12px]">${x.q}</p><p class="text-[10px] text-gray-400">${x.grade} • ${x.time}</p></div>`).join(""); }
function loadHistoryItem(i){ let h = JSON.parse(localStorage.getItem("somahub_history")||"[]"); if(h[i]){ msg.value = h[i].q; closeHistory(); msg.focus(); } }
function clearHistory(){ localStorage.removeItem("somahub_history"); renderHistory(); }
setTimeout(reloadResources, 800);
setTimeout(getGeminiKey, 800);
</script>
