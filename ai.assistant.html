<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SomaHub AI - Smart Marker</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Nunito',sans-serif;background:#f8f6f1}.fun-btn:active{transform:scale(0.96)}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),doc,getDoc,collection,getDocs,onAuthStateChanged};
</script>
</head>
<body class="flex justify-center"><div class="w-full max-w-[460px] bg-[#f8f6f1] min-h-screen flex flex-col">

<div class="bg-white border-b-2 border-black p-3 flex items-center gap-3 sticky top-0 z-50">
<button onclick="location.href='teachers.html'" class="w-8 h-8 bg-[#f6f6f7] rounded-full grid place-items-center border-2 border-black"><i class="fa-solid fa-arrow-left"></i></button>
<div class="w-10 h-10 rounded-full border-2 border-black bg-[#ffcc1a] overflow-hidden flex items-center justify-center shrink-0">
<img src="logo.png" alt="SomaHub" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" class="w-full h-full object-cover">
<span style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-weight:900;font-size:10px">SH</span>
</div>
<div class="flex-1"><p class="font-black text-[13px] leading-none">SomaHub AI</p><p class="text-[10px] font-bold opacity-60" id="subHeader">Welcome Mwalimu • Ready</p></div>
<span id="shkeBadge" class="bg-black text-white px-3 py-1 rounded-full text-[9px] font-black border-2 border-black">SHKE</span>
</div>

<div id="chat" class="flex-1 p-3 space-y-3 overflow-y-auto pb-[150px]">
<div class="bg-white rounded-[1.2rem] p-4 border-[2.5px] border-black shadow-[3px_3px_0_0_#000] max-w-[92%]">
<p class="font-black text-[13px]">👋 Hi <span id="nameShow">Mwalimu</span>! SomaHub Ready ✅</p>
<p class="text-[11px] mt-2 leading-5 font-bold opacity-80">Snap exam - Bold Answer • Key Points • How to improve</p>
<div class="mt-4 grid grid-cols-2 gap-2">
<button onclick="quick('Mark this exam')" class="bg-[#ffcc1a] border-2 border-black rounded-full py-3.5 font-black text-[11px] shadow-[2px_2px_0_0_#000] fun-btn">📸 Mark Exam</button>
<button onclick="quick('Homework 10 marks')" class="bg-white border-2 border-black rounded-full py-3.5 font-black text-[11px] shadow-[2px_2px_0_0_#000] fun-btn">📝 Homework</button>
<button onclick="quick('Mark composition 40 marks')" class="bg-black text-white border-2 border-black rounded-full py-3.5 font-black text-[11px] shadow-[2px_2px_0_0_#000] fun-btn col-span-2">✍️ Composition - 40 Marks</button>
</div>
<p class="text-[8px] text-gray-400 mt-3 font-bold" id="currentInfo">Loading SomaHub...</p>
</div>
</div>

<div id="photoBox" class="hidden bg-[#fffde7] border-t-2 border-black p-3">
<div id="photoPreview" class="text-center"></div>
<p class="text-[11px] font-black text-center mt-2">📸 Ready - Tap Mark Exam</p>
</div>

<div class="bg-white border-t-[2.5px] border-black p-3 fixed bottom-0 w-full max-w-[460px] z-40">
<div id="errorBox" class="hidden bg-[#ffeaea] border-2 border-black rounded-xl p-2 text-[10px] font-black text-center mb-2"></div>
<div class="flex items-center gap-2">
<button onclick="document.getElementById('fileIn').click()" class="w-11 h-11 bg-[#f6f6f7] rounded-full grid place-items-center border-2 border-black fun-btn"><i class="fa-solid fa-camera"></i></button>
<input id="msg" placeholder="Type your question or snap exam..." class="flex-1 bg-[#f6f6f7] rounded-full px-4 py-3.5 text-[12px] font-bold border-2 border-black outline-none">
<button onclick="sendMsg()" id="sendBtn" class="w-11 h-11 bg-black text-white rounded-full grid place-items-center border-2 border-black fun-btn"><i class="fa-solid fa-paper-plane"></i></button>
</div>
</div>
<input type="file" id="fileIn" hidden accept="image/*" onchange="handlePhoto(this)">

</div>
<script>
const PROXY="/api/gemini";
let shke="SHKE", grade="Grade 7", uploadedPhoto='', isThinking=false;
function quick(t){ msg.value=t; sendMsg(); }
function showError(m){ let e=document.getElementById('errorBox'); e.innerText=m; e.classList.remove('hidden'); setTimeout(()=>e.classList.add('hidden'),5000); }
function handlePhoto(input){
 let f=input.files[0]; if(!f) return;
 let url=URL.createObjectURL(f);
 let img=new Image();
 img.onload=()=>{
  let c=document.createElement('canvas'); let max=700; let w=img.width,h=img.height;
  if(w>h){ if(w>max){ h*=max/w; w=max; } } else { if(h>max){ w*=max/h; h=max; } }
  c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
  uploadedPhoto=c.toDataURL('image/jpeg',0.50);
  document.getElementById('photoPreview').innerHTML='<img src="'+uploadedPhoto+'" class="rounded-xl max-h-[200px] mx-auto border-2 border-black"><p class="text-[8px] font-black mt-1">'+Math.round(uploadedPhoto.length/1024)+'KB</p>';
  document.getElementById('photoBox').classList.remove('hidden');
  URL.revokeObjectURL(url);
  chat.scrollTop=chat.scrollHeight;
 };
 img.onerror=()=>{ showError("Use Gallery - Camera storage blocked"); };
 img.src=url;
}
async function sendMsg(){
 if(isThinking) return;
 let txt=msg.value.trim(); if(!txt &&!uploadedPhoto) return;
 chat.innerHTML+=`<div class="flex justify-end"><div class="bg-black text-white rounded-[16px] rounded-br-[4px] p-3 max-w-[80%] border-2 border-black"><p class="text-[12px] font-bold">${txt||'📸 Mark this exam'}</p></div></div>`;
 msg.value=""; chat.scrollTop=chat.scrollHeight; isThinking=true; sendBtn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
 chat.innerHTML+=`<div id="thinking" class="bg-white rounded-[16px] rounded-bl-[4px] p-3 max-w-[80%] border-2 border-black"><p class="text-[10px] font-black">⏳ Marking ${grade}...</p></div>`;
 chat.scrollTop=chat.scrollHeight;
 try{
  let photo=uploadedPhoto? uploadedPhoto.split(',')[1] : "";
  if(photo && photo.length>900000){ throw new Error("Photo too large - retake closer, paper only, use Gallery"); }
  let q = txt || "Mark this exam - bold answer, key points, score";
  let res=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q, grade, shke, photo})});
  let raw=await res.text(); let data; try{ data=JSON.parse(raw); }catch{ data={answer:raw}; }
  document.getElementById('thinking')?.remove();
  let clean = (data.answer||"No result").replace(/###+/g,"").trim();
  // Hide ugly 503 code
  if(clean.includes("503")||clean.includes("high demand")||clean.includes("UNAVAILABLE")){
    clean = "⏳ **SomaHub busy - Google full**\n\nWait 30 seconds then tap Mark Exam again.\nGoogle Gemini high demand. Try smaller photo, crop paper only.\n\nPole Mwalimu 🙏";
  }
  chat.innerHTML+=`<div class="bg-white rounded-[16px] rounded-bl-[4px] p-4 border-[2.5px] border-black shadow-[2px_2px_0_0_#000] max-w-[92%]"><p class="text-[12px] leading-6 whitespace-pre-wrap font-bold">${clean.slice(0,4000)}</p><div class="mt-3 flex gap-2"><button onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText);this.innerText='✅ Copied!';setTimeout(()=>this.innerText='📋 Copy',2000)" class="bg-[#ffcc1a] border-2 border-black rounded-full px-4 py-2 text-[10px] font-black">📋 Copy</button></div></div>`;
  uploadedPhoto=""; document.getElementById('photoBox').classList.add('hidden');
 }catch(e){
  document.getElementById('thinking')?.remove();
  showError(e.message);
  chat.innerHTML+=`<div class="bg-[#ffeaea] border-2 border-black rounded-xl p-3 max-w-[90%]"><p class="text-[11px] font-bold">❌ ${e.message}</p><p class="text-[9px] mt-1">Tip: Retake closer, paper only, Gallery button</p></div>`;
 }
 chat.scrollTop=chat.scrollHeight; isThinking=false; sendBtn.innerHTML='<i class="fa-solid fa-paper-plane"></i>';
}
window.FB.onAuthStateChanged(window.FB.auth, async(u)=>{
  if(!u) { nameShow.innerText="Mwalimu"; return; }
  try{
    let s=await window.FB.getDoc(window.FB.doc(window.FB.db,"users",u.uid));
    if(s.exists()){
      let d=s.data();
      let firstName = d.firstName || d.name || "Mwalimu";
      // If teacher, greet Mwalimu, not Learner
      if(d.role==="teacher" || d.subjects || d.indexNumber){
        nameShow.innerText = firstName;
        subHeader.innerText = "Welcome Mwalimu • Ready";
        grade = d.grade || d.class || "Grade 7";
      } else {
        nameShow.innerText = firstName;
        subHeader.innerText = "Smart Marker - PP1 to Grade 9";
      }
      shke = d.indexNumber||u.uid.slice(0,8);
      grade = d.grade||grade;
      shkeBadge.innerText=shke;
      currentInfo.innerText = `${grade} • ${shke} • SomaHub PRO`;
    } else {
      nameShow.innerText="Mwalimu";
    }
  }catch(e){ nameShow.innerText="Mwalimu"; }
});
</script>
</body></html>
