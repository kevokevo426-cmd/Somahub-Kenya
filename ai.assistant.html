<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SomaHub Tutor</title>

<script src="https://cdn.tailwindcss.com"></script>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<link
  href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:'Nunito',sans-serif;
  background:#f4f7fc;
  color:#172033;
}

body{
  overflow:hidden;
}

button,
select,
textarea{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

#app{
  height:100dvh;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

.top-header{
  height:68px;
  min-height:68px;
  background:#ffffff;
  border-bottom:1px solid #e8edf5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 clamp(12px,3vw,32px);
  z-index:10;
}

.brand-area{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #e8eef8;
  background:white;
  flex-shrink:0;
}

.brand-text{
  min-width:0;
}

.brand-title{
  margin:0;
  color:#243b8f;
  font-size:clamp(15px,2vw,20px);
  line-height:1.05;
  font-weight:900;
  white-space:nowrap;
}

.online{
  margin-top:3px;
  display:flex;
  align-items:center;
  gap:5px;
  color:#159447;
  font-size:10px;
  font-weight:800;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 0 3px #dcfce7;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.grade-select{
  height:40px;
  min-width:125px;
  padding:0 14px;
  border-radius:22px;
  border:1px solid #e1e7f0;
  background:#f7f9fd;
  color:#263b7d;
  font-size:13px;
  font-weight:800;
  outline:none;
}

.history-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#263d99;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  box-shadow:0 5px 14px rgba(38,61,153,.18);
}


/* =========================================================
   CHAT
========================================================= */

#chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

#chat::-webkit-scrollbar{
  width:5px;
}

#chat::-webkit-scrollbar-thumb{
  background:#d7deea;
  border-radius:20px;
}

.chat-container{
  width:min(100%,1050px);
  margin:auto;
  padding:
    clamp(20px,4vw,45px)
    clamp(12px,3vw,28px)
    150px;
}


/* =========================================================
   WELCOME
========================================================= */

#welcome{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    clamp(20px,5vw,60px)
    10px
    20px;
}

.welcome-icon{
  width:92px;
  height:92px;
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:linear-gradient(145deg,#4058c5,#243a96);
  box-shadow:0 15px 35px rgba(39,61,154,.20);
  margin-bottom:18px;
}

.welcome-title{
  margin:0;
  color:#243b8f;
  font-size:clamp(25px,4vw,38px);
  line-height:1.15;
  font-weight:900;
}

.welcome-text{
  max-width:600px;
  margin:10px auto 0;
  color:#68758a;
  font-size:clamp(13px,1.8vw,16px);
  line-height:1.6;
}


/* =========================================================
   MESSAGES
========================================================= */

.message-in{
  animation:messageIn .18s ease-out;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.user-row{
  display:flex;
  justify-content:flex-end;
  margin-bottom:12px;
}

.user-bubble{
  max-width:min(78%,680px);
  background:#dff8c8;
  color:#17321d;
  border-radius:20px 20px 5px 20px;
  padding:11px 15px;
  font-size:14px;
  line-height:1.5;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.photo-bubble{
  background:#dff8c8;
  border-radius:18px 18px 5px 18px;
  padding:5px;
  max-width:260px;
}

.photo-bubble img{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:13px;
}


/* =========================================================
   AI MESSAGE
========================================================= */

.ai-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
  margin-bottom:18px;
}

.ai-avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:12px;
  background:linear-gradient(145deg,#4058c5,#263b95);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  box-shadow:0 5px 12px rgba(38,59,149,.18);
}

.ai-content{
  min-width:0;
  flex:1;
  max-width:820px;
}

.ai-card{
  background:white;
  border:1px solid #e5eaf2;
  border-radius:5px 20px 20px 20px;
  padding:16px clamp(14px,2.5vw,22px);
  color:#111827;
  font-size:clamp(13.5px,1.7vw,15px);
  line-height:1.7;
  box-shadow:0 5px 18px rgba(29,43,77,.055);
  overflow-wrap:anywhere;
}

.ai-card p{
  margin:7px 0;
}

.ai-card ul{
  margin:7px 0 7px 20px;
  padding:0;
  list-style:disc;
}

.ai-card ol{
  margin:7px 0 7px 20px;
  padding:0;
  list-style:decimal;
}

.ai-card li{
  margin:4px 0;
}


/* Topic / Strand */

.ai-topic{
  color:#dc2626 !important;
  font-weight:900;
  font-size:14px;
  margin-top:0 !important;
  margin-bottom:5px !important;
}

.ai-strand{
  color:#dc2626 !important;
  font-weight:800;
  font-size:13px;
  margin-top:2px !important;
  margin-bottom:10px !important;
}


/* Explanation */

.ai-explanation{
  color:#2563eb !important;
  font-weight:800;
  font-size:14px;
  margin-top:10px !important;
  margin-bottom:5px !important;
}


/* Detailed answer stays black */

.ai-detail{
  color:#111827;
}


/* Formula */

.ai-formula{
  background:#f7f9fc;
  border:1px dashed #cbd5e1;
  border-radius:10px;
  padding:9px 12px;
  margin:10px 0;
  text-align:center;
  font-family:monospace;
  color:#172033;
}


/* MCQ */

.choice-block{
  margin:10px 0;
  padding:10px 12px;
  border-radius:11px;
  background:#f8fafc;
  border:1px solid #e7ebf2;
}

.choice-correct{
  border-left:4px solid #16a34a;
  background:#f0fdf4;
}

.choice-wrong{
  border-left:4px solid #ef4444;
  background:#fff7f7;
}

.choice-label{
  font-weight:900;
}

.correct-label{
  color:#15803d;
}

.wrong-label{
  color:#dc2626;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.ai-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.ai-action{
  height:30px;
  padding:0 11px;
  border:1px solid #e2e7ef;
  border-radius:16px;
  background:white;
  color:#445066;
  font-size:10px;
  font-weight:800;
  cursor:pointer;
}

.ai-action:hover{
  background:#f5f7fb;
}

.ai-action.dark{
  background:#253a91;
  border-color:#253a91;
  color:white;
}


/* =========================================================
   QUICK STATUS
========================================================= */

.answer-status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#778399;
  font-size:10px;
  font-weight:700;
  margin:3px 0 10px 43px;
}

.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#3b82f6;
  animation:pulseDot 1s infinite;
}

@keyframes pulseDot{
  0%,100%{
    opacity:.3;
    transform:scale(.8);
  }
  50%{
    opacity:1;
    transform:scale(1);
  }
}


/* =========================================================
   FOOTER / INPUT
========================================================= */

.input-footer{
  flex-shrink:0;
  background:rgba(247,249,253,.97);
  border-top:1px solid #e2e7ef;
  padding:
    8px
    max(10px,env(safe-area-inset-right))
    max(9px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));
  backdrop-filter:blur(12px);
  z-index:20;
}

.input-container{
  width:min(100%,1050px);
  margin:auto;
}


/* Attachment preview */

.preview-box{
  display:flex;
  align-items:center;
  gap:9px;
  background:white;
  border:1px solid #e1e7ef;
  border-radius:14px;
  padding:7px 9px;
  margin-bottom:7px;
}

.preview-image{
  width:40px;
  height:40px;
  border-radius:9px;
  object-fit:cover;
}

.preview-icon{
  width:40px;
  height:40px;
  border-radius:9px;
  background:#f1f5f9;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
}

.preview-name{
  flex:1;
  min-width:0;
  font-size:11px;
  color:#4b5563;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.preview-close{
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:#f1f5f9;
  color:#64748b;
}


/* Error */

#errorBox{
  background:#fff1f2;
  color:#dc2626;
  border:1px solid #fecdd3;
  border-radius:12px;
  padding:7px 11px;
  font-size:11px;
  margin-bottom:7px;
  text-align:center;
}


/* Input row */

.input-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.message-box{
  flex:1;
  min-width:0;
  min-height:50px;
  max-height:130px;
  display:flex;
  align-items:flex-end;
  gap:2px;
  background:white;
  border:1px solid #dfe5ee;
  border-radius:27px;
  padding:5px 7px;
  box-shadow:0 4px 16px rgba(32,49,87,.06);
}

.attach-button{
  width:39px;
  height:39px;
  min-width:39px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#69778d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.attach-button:hover{
  background:#f1f4f8;
}

#msg{
  flex:1;
  min-width:0;
  min-height:39px;
  max-height:115px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:#172033;
  font-size:14px;
  line-height:1.45;
  padding:9px 6px;
}

#msg::placeholder{
  color:#9aa5b5;
}


/* Voice */

.voice-button,
.send-button{
  width:50px;
  height:50px;
  min-width:50px;
  border:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  box-shadow:0 6px 16px rgba(0,0,0,.13);
  transition:
    transform .12s,
    box-shadow .12s,
    background .12s;
}

.voice-button{
  background:#263c96;
}

.send-button{
  background:#20bd67;
}

.voice-button:active,
.send-button:active{
  transform:scale(.93);
}

.voice-button.recording{
  background:#dc2626;
  animation:recordPulse 1s infinite;
}

@keyframes recordPulse{
  0%,100%{
    box-shadow:0 0 0 0 rgba(220,38,38,.25);
  }
  50%{
    box-shadow:0 0 0 10px rgba(220,38,38,0);
  }
}


/* Listening text */

.listen-text{
  text-align:center;
  color:#dc2626;
  font-size:10px;
  font-weight:800;
  margin-top:3px;
}


/* =========================================================
   HISTORY
========================================================= */

.history-drawer{
  position:fixed;
  inset:0;
  z-index:100;
  background:#f8faff;
  display:none;
  flex-direction:column;
}

.history-drawer.open{
  display:flex;
}

.history-header{
  height:60px;
  flex-shrink:0;
  background:white;
  border-bottom:1px solid #e4e9f1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.history-list{
  flex:1;
  overflow:auto;
  padding:12px;
}

.history-item{
  background:white;
  border:1px solid #e4e9f1;
  border-radius:13px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}


/* =========================================================
   TABLET
========================================================= */

@media (min-width:600px){

  .top-header{
    height:74px;
    min-height:74px;
  }

  .logo{
    width:48px;
    height:48px;
  }

  .welcome-icon{
    width:105px;
    height:105px;
  }

  .message-box{
    min-height:56px;
  }

  .voice-button,
  .send-button{
    width:54px;
    height:54px;
    min-width:54px;
  }
}


/* =========================================================
   LAPTOP / DESKTOP
========================================================= */

@media (min-width:900px){

  .chat-container{
    padding-bottom:170px;
  }

  .input-footer{
    padding-top:10px;
  }

  .message-box{
    min-height:58px;
  }

  .attach-button{
    width:42px;
    height:42px;
  }

  #msg{
    min-height:42px;
  }

  .voice-button,
  .send-button{
    width:56px;
    height:56px;
    min-width:56px;
  }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width:430px){

  .top-header{
    height:64px;
    min-height:64px;
    padding:0 10px;
  }

  .logo{
    width:40px;
    height:40px;
  }

  .brand-title{
    font-size:15px;
  }

  .online{
    font-size:9px;
  }

  .grade-select{
    min-width:102px;
    height:38px;
    padding:0 10px;
    font-size:12px;
  }

  .history-btn{
    width:38px;
    height:38px;
  }

  .welcome-icon{
    width:78px;
    height:78px;
    border-radius:24px;
    font-size:35px;
  }

  .welcome-title{
    font-size:25px;
  }

  .welcome-text{
    font-size:12.5px;
  }

  .ai-card{
    font-size:13.5px;
    padding:13px;
  }

  .ai-avatar{
    width:31px;
    height:31px;
    min-width:31px;
  }

  .user-bubble{
    max-width:84%;
  }

  .attach-button{
    width:35px;
    min-width:35px;
    height:35px;
  }

  #msg{
    font-size:13.5px;
    padding-left:4px;
    padding-right:4px;
  }

  .voice-button,
  .send-button{
    width:47px;
    height:47px;
    min-width:47px;
  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width:360px){

  .brand-title{
    font-size:14px;
  }

  .grade-select{
    min-width:90px;
  }

  .history-btn{
    width:36px;
    height:36px;
  }

  .header-actions{
    gap:5px;
  }

  .message-box{
    gap:0;
  }

  .attach-button{
    width:32px;
    min-width:32px;
    font-size:14px;
  }

  .voice-button,
  .send-button{
    width:43px;
    height:43px;
    min-width:43px;
  }
}

</style>
</head>


<body>

<div id="app">

<!-- =======================================================
     HEADER
======================================================= -->

<header class="top-header">

  <div class="brand-area">

    <img
      src="/logo.png"
      class="logo"
      alt="SomaHub"
      onerror="this.src='https://i.pravatar.cc/100'"
    >

    <div class="brand-text">

      <p class="brand-title">
        SomaHub Tutor
      </p>

      <div class="online">
        <span class="online-dot"></span>
        Online • Auto EN/SW
      </div>

    </div>

  </div>


  <div class="header-actions">

    <select
      id="grade"
      class="grade-select"
      aria-label="Select grade"
    >
      <option>Playground</option>
      <option>PP1</option>
      <option>PP2</option>
      <option>Grade 1</option>
      <option>Grade 2</option>
      <option>Grade 3</option>
      <option>Grade 4</option>
      <option>Grade 5</option>
      <option>Grade 6</option>
      <option selected>Grade 7</option>
      <option>Grade 8</option>
      <option>Grade 9</option>
      <option>Grade 10</option>
    </select>


    <button
      class="history-btn"
      onclick="openHistory()"
      aria-label="History"
    >
      <i class="fa-regular fa-clock"></i>
    </button>

  </div>

</header>


<!-- =======================================================
     CHAT
======================================================= -->

<main id="chat">

  <div class="chat-container">

    <!-- WELCOME -->

    <div id="welcome">

      <div class="welcome-icon">
        🎓
      </div>

      <h1 class="welcome-title">
        How can I help you learn?
      </h1>

      <p class="welcome-text">
        Ask me anything about your school work,
        upload a homework photo, or speak your question.
        SomaHub Tutor understands English and Kiswahili.
      </p>

    </div>


    <!-- MESSAGES -->

    <div id="messages"></div>

  </div>

</main>


<!-- =======================================================
     INPUT FOOTER
======================================================= -->

<footer class="input-footer">

  <div class="input-container">


    <!-- ATTACHMENT PREVIEW -->

    <div
      id="previewBox"
      class="preview-box"
      style="display:none"
    >

      <img
        id="previewImg"
        class="preview-image"
        style="display:none"
        alt="Preview"
      >

      <div
        id="previewDocIcon"
        class="preview-icon"
        style="display:none"
      >
        <i class="fa-solid fa-file-lines"></i>
      </div>

      <span
        id="previewName"
        class="preview-name"
      ></span>

      <button
        class="preview-close"
        onclick="clearAttach()"
        aria-label="Remove attachment"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </div>


    <!-- ERROR -->

    <div
      id="errorBox"
      style="display:none"
    ></div>


    <!-- INPUT -->

    <div class="input-row">


      <div class="message-box">


        <!-- DOCUMENT -->

        <button
          class="attach-button"
          onclick="document.getElementById('docInput').click()"
          aria-label="Attach document"
        >
          <i class="fa-solid fa-paperclip"></i>
        </button>


        <!-- IMAGE -->

        <button
          class="attach-button"
          onclick="document.getElementById('imgInput').click()"
          aria-label="Choose image"
        >
          <i class="fa-solid fa-image"></i>
        </button>


        <!-- CAMERA -->

        <button
          class="attach-button"
          onclick="document.getElementById('camInput').click()"
          aria-label="Take photo"
        >
          <i class="fa-solid fa-camera"></i>
        </button>


        <!-- TEXT -->

        <textarea
          id="msg"
          rows="1"
          placeholder="Ask SomaHub..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>

      </div>


      <!-- HOLD TO SPEAK -->

      <button
        id="voiceBtn"
        class="voice-button"
        aria-label="Hold to speak"
        title="Hold to speak"
      >
        <i class="fa-solid fa-microphone"></i>
      </button>


      <!-- SEND -->

      <button
        id="sendBtn"
        class="send-button"
        onclick="sendMsg()"
        aria-label="Send"
      >
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </div>


    <!-- LISTENING -->

    <div
      id="listenTxt"
      class="listen-text"
      style="display:none"
    >
      ● Listening... release when finished
    </div>

  </div>

</footer>

</div>


<!-- =======================================================
     HISTORY DRAWER
======================================================= -->

<div
  id="historyDrawer"
  class="history-drawer"
>

  <div class="history-header">

    <button
      onclick="closeHistory()"
      class="text-sm font-extrabold text-[#263b8f]"
    >
      <i class="fa-solid fa-arrow-left mr-1"></i>
      Back
    </button>

    <b class="text-sm">
      Learning History
    </b>

    <button
      onclick="clearHistory()"

/* =========================================================

const SW = [
  "habari",

  "hesabu",
  "hisabati",
  "sayansi",
  "kiswahili",
  "shule",

function detectLang(text){

  if(!text){
    return "EN";
  }

  const value =
    String(text).toLowerCase();

  return SW.some(
    word => value.includes(word)
  )
    ? "SW"
    : "EN";
}

/* =========================================================
   HOLD-TO-SPEAK
========================================================= */

(function(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    voiceBtn.title =
      "Speech recognition is not available in this browser";

    return;
  }


  recognition =
    new SR();


  recognition.continuous = true;

  recognition.interimResults = true;

  recognition.maxAlternatives = 1;


  let finalTranscript = "";


  recognition.onstart = function(){

    listening = true;

    recognitionStarted = true;

    voiceBtn.classList.add(
      "recording"
    );

    voiceBtn.innerHTML =
      '<i class="fa-solid fa-stop"></i>';

    listenTxt.style.display =
      "block";
  };


  recognition.onresult =
    function(event){

      let interim = "";


      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        const transcript =
          event.results[i][0].transcript;


        if(
          event.results[i].isFinal
        ){

          finalTranscript +=
            transcript + " ";

        }else{

          interim += transcript;
        }
      }


      const current =
        finalTranscript +
        interim;


      /*
       * Voice text goes into the input.
       * It is NOT sent automatically.
       */

      msg.value =
        current.trim();

      resizeTextarea();
    };


  recognition.onerror =
    function(event){

      if(
        event.error !== "aborted" &&
        event.error !== "no-speech"
      ){

        showError(
          "Voice input: " +
          event.error
        );
      }

      stopListeningUI();
    };


  recognition.onend =
    function(){

      /*
       * Some mobile browsers automatically
       * stop recognition. Do not restart here
       * because the user controls recording.
       */

      stopListeningUI();
    };


  function beginVoice(){

    if(listening){
      return;
    }


    finalTranscript =
      msg.value
        ? msg.value.trim() + " "
        : "";


    recognition.lang =
      detectLang(msg.value) === "SW"
        ? "sw-KE"
        : "en-KE";


    try{

      recognition.start();

    }catch(error){

      /*
       * Browser may report "already started".
       */

      stopListeningUI();
    }
  }


  function endVoice(){

    if(
      recognition &&
      listening
    ){

      try{
        recognition.stop();
      }catch(e){}
    }
  }


  function stopListeningUI(){

    listening = false;

    recognitionStarted = false;

    voiceBtn.classList.remove(
      "recording"
    );

    voiceBtn.innerHTML =
      '<i class="fa-solid fa-microphone"></i>';

    listenTxt.style.display =
      "none";
  }


  /*
   * Pointer events work for both
   * touch screens and mouse.
   */

  voiceBtn.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      beginVoice();
    }
  );


  voiceBtn.addEventListener(
    "pointerup",
    function(e){

      e.preventDefault();

      endVoice();
    }
  );


  voiceBtn.addEventListener(
    "pointercancel",
    function(){

      endVoice();
    }
  );


  voiceBtn.addEventListener(
    "pointerleave",
    function(e){

      /*
       * On desktop, releasing outside
       * the button stops recording.
       */

      if(
        e.pointerType === "mouse" &&
        listening
      ){

        endVoice();
      }
    }
  );

})();


/* =========================================================
   PHOTO
========================================================= */

function handlePhoto(input){

  const file =
    input.files?.[0];

  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(){

      const image =
        new Image();


      image.onload =
        function(){

          const canvas =
            document.createElement(
              "canvas"
            );


          let width =
            image.width;

          let height =
            image.height;


          /*
           * Keep images reasonably small
           * for fast mobile uploads.
           */

          const max =
            1100;


          if(
            width > max ||
            height > max
          ){

            const scale =
              Math.min(
                max / width,
                max / height
              );

            width =
              Math.round(
                width * scale
              );

            height =
              Math.round(
                height * scale
              );
          }


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          uploadedPhoto =
            canvas.toDataURL(
              "image/jpeg",
              0.72
            );


          uploadedMime =
            "image/jpeg";


          document
            .getElementById(
              "previewImg"
            )
            .src =
            uploadedPhoto;


          document
            .getElementById(
              "previewImg"
            )
            .style.display =
            "block";


          document
            .getElementById(
              "previewDocIcon"
            )
            .style.display =
            "none";


          document
            .getElementById(
              "previewName"
            )
            .textContent =
            file.name;


          document
            .getElementById(
              "previewBox"
            )
            .style.display =
            "flex";
        };


      image.src =
        reader.result;
    };


  reader.readAsDataURL(file);

  input.value = "";
}

/* =========================================================
   CLEAN AI TEXT
========================================================= */

function cleanAIText(text){

  let value =
    String(text || "");


  /*
   * Remove common decorative line brackets
   * and box characters.
   */

  value =
    value
      .replace(/【/g,"")
      .replace(/】/g,"")
      .replace(/〔/g,"")
      .replace(/〕/g,"")
      .replace(/^\s*[\[\]]\s*$/gm,"")
      .replace(/^\s*[-_=]{3,}\s*$/gm,"");


  /*
   * Remove markdown heading symbols.
   */

  value =
    value.replace(
      /^#{1,6}\s*/gm,
      ""
    );


  return value.trim();
}


/* =========================================================
   FORMAT AI RESPONSE
========================================================= */

function formatResponse(text){

  let source =
    cleanAIText(text);


  /*
   * Protect formulas first.
   */

  const formulas = [];


  source =
    source.replace(
      /\$\$([\s\S]*?)\$\$/g,
      function(_, formula){

        const id =
          formulas.length;

        formulas.push(
          formula.trim()
        );

        return `@@FORMULA_${id}@@`;
      }
    );


  /*
   * Escape HTML.
   */

  source =
    source
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");


  /*
   * Bold markdown.
   */

  source =
    source.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  /*
   * Process lines.
   */

  const lines =
    source.split(/\r?\n/);


  let html = "";

  let listMode = false;


  function closeList(){

    if(listMode){

      html += "</ul>";

      listMode = false;
    }
  }


  lines.forEach(function(raw){

    let line =
      raw.trim();


    if(!line){

      closeList();

      return;
    }


    /*
     * TOPIC
     */

    let topic =
      line.match(
        /^(topic|subject)\s*:\s*(.*)$/i
      );


    if(topic){

      closeList();

      html +=
        `<p class="ai-topic">Topic: ${topic[2]}</p>`;

      return;
    }


    /*
     * STRAND
     */

    let strand =
      line.match(
        /^(strand|sub[- ]?strand)\s*:\s*(.*)$/i
      );


    if(strand){

      closeList();

      html +=
        `<p class="ai-strand">Strand: ${strand[2]}</p>`;

      return;
    }


    /*
     * EXPLANATION
     */

    let explanation =
      line.match(
        /^(explanation|explain|answer explanation)\s*:\s*(.*)$/i
      );


    if(explanation){

      closeList();

      html +=
        `<p class="ai-explanation">Explanation: ${explanation[2]}</p>`;

      return;
    }


    /*
     * CHOICE CORRECT
     */

    if(
      /^(correct answer|answer)\s*:/i.test(line)
    ){

      closeList();

      html +=
        `<div class="choice-block choice-correct">
          <span class="choice-label correct-label">
            ✓ ${line}
          </span>
        </div>`;

      return;
    }


    /*
     * WHY WRONG
     */

    if(
      /^(why|reason|incorrect|wrong choice|why wrong)/i.test(line) &&
      /(wrong|incorrect|not correct)/i.test(line)
    ){

      closeList();

      html +=
        `<div class="choice-block choice-wrong">
          <span class="choice-label wrong-label">
            ✗ ${line}
          </span>
        </div>`;

      return;
    }


    /*
     * Bullet
     */

    if(
      /^[-•*]\s+/.test(line)
    ){

      if(!listMode){

        html += "<ul>";

        listMode = true;
      }


      html +=
        `<li>${line.replace(
          /^[-•*]\s+/,
          ""
        )}</li>`;

      return;
    }


    /*
     * Numbered item
     */

    if(
      /^\d+[\.\)]\s+/.test(line)
    ){

      closeList();

      html +=
        `<p class="ai-detail">${line}</p>`;

      return;
    }


    /*
     * Multiple-choice choices
     */

    if(
      /^[A-D][\.\)]\s+/i.test(line)
    ){

      closeList();

      const letter =
        line.charAt(0).toUpperCase();


      const isCorrect =
        /✓|correct/i.test(line);


      const isWrong =
        /✗|wrong|incorrect/i.test(line);


      const cls =
        isCorrect
          ? "choice-correct"
          : isWrong
            ? "choice-wrong"
            : "";


      html +=
        `<div class="choice-block ${cls}">
          <span class="choice-label">
            ${letter}.
          </span>
          ${line.slice(2).trim()}
        </div>`;

      return;
    }


    /*
     * Formula placeholder
     */

    if(
      /^@@FORMULA_\d+@@$/.test(line)
    ){

      closeList();

      const index =
        Number(
          line.match(/\d+/)[0]
        );


      html +=
        `<div class="ai-formula">
          ${escapeHTML(formulas[index] || "")}
        </div>`;

      return;
    }


    /*
     * Normal detailed text
     */

    closeList();

    html +=
      `<p class="ai-detail">${line}</p>`;
  });


  closeList();


  /*
   * Remove empty paragraphs.
   */

  html =
    html.replace(
      /<p class="ai-detail"><\/p>/g,
      ""
    );


  /*
   * Restore formulas if they were
   * embedded inside paragraphs.
   */

  formulas.forEach(
    function(formula,index){

      html =
        html.replace(
          `@@FORMULA_${index}@@`,
          `<div class="ai-formula">${escapeHTML(formula)}</div>`
        );
    }
  );


  return html;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   COPY
========================================================= */

async function copyCard(id){

  const element =
    document.getElementById(id);


  if(!element){
    return;
  }


  const text =
    element.innerText;


  try{

    await navigator.clipboard.writeText(
      text
    );

  }catch{

    const area =
      document.createElement(
        "textarea"
      );

    area.value =
      text;

    document.body.appendChild(
      area
    );

    area.select();

    document.execCommand(
      "copy"
    );

    area.remove();
  }
}


/* =========================================================
   FAST SPEAKER
========================================================= */

function listenCard(id){

  const element =
    document.getElementById(id);


  if(!element){
    return;
  }


  /*
   * Stop anything already speaking.
   */

  speechSynthesis.cancel();


  const text =
    element.innerText
      .replace(/\n+/g," ")
      .trim();


  if(!text){
    return;
  }


  /*
   * Break long answers into smaller
   * chunks so speech starts quickly.
   */

  speechQueue =
    text
      .match(
        /[^.!?]+[.!?]+|[^.!?]+$/g
      ) || [text];


  speakNext();
}


function speakNext(){

  if(!speechQueue.length){
    currentSpeech = null;
    return;
  }


  const part =
    speechQueue.shift()
      .trim();


  if(!part){
    speakNext();
    return;
  }


  currentSpeech =
    new SpeechSynthesisUtterance(
      part
    );


  currentSpeech.lang =
    detectLang(part) === "SW"
      ? "sw-KE"
      : "en-KE";


  currentSpeech.rate =
    1.05;


  currentSpeech.pitch =
    1;


  currentSpeech.onend =
    function(){

      speakNext();
    };


  currentSpeech.onerror =
    function(){

      currentSpeech = null;
    };


  speechSynthesis.speak(
    currentSpeech
  );
}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadCard(id){

  const element =
    document.getElementById(id);


  if(!element){
    return;
  }


  const text =
    element.innerText;


  const blob =
    new Blob(
      [text],
      {
        type:"text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    "SomaHub-Tutor-" +
    Date.now() +
    ".txt";


  document.body.appendChild(
    link
  );

  link.click();

  link.remove();


  setTimeout(
    function(){
      URL.revokeObjectURL(url);
    },
    1000
  );
}

  try{

        localStorage.getItem(
          "sh"
        ) || "[]"
      );


    history.unshift({

      id:Date.now(),

      title:
        String(
          title ||
          "Learning session"
        ).slice(0,70),

      time:
        new Date().toISOString(),

      grade

    });


    localStorage.setItem(
      "sh",
      JSON.stringify(
        history.slice(0,100)
      )
    );

  }catch(e){}
}


/* =========================================================
   OPEN HISTORY
========================================================= */

function openHistory(){

  const drawer =
    document.getElementById(
      "historyDrawer"
    );


  drawer.classList.add(
    "open"
  );


  const list =
    document.getElementById(
      "historyList"
    );


  let history = [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "sh"
        ) || "[]"
      );

  }catch(e){

    history = [];
  }


  if(!history.length){

    list.innerHTML =
      `
      <div class="text-center text-gray-400 mt-20 text-sm">
        <i class="fa-regular fa-clock text-3xl mb-3"></i>
        <p>No learning history yet.</p>
      </div>
      `;

    return;
  }


  list.innerHTML = "";


  history.forEach(
    function(item){

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "history-item";


      const left =
        document.createElement(
          "div"
        );


      left.innerHTML =
        `
        <p class="font-extrabold text-sm text-gray-800">
          ${escapeHTML(item.title)}
        </p>

        <p class="text-[10px] text-gray-500 mt-1">
          ${escapeHTML(item.grade || "")}
        </p>
        `;


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "text-gray-400 px-2";


      button.innerHTML =
        '<i class="fa-solid fa-trash"></i>';


      button.onclick =
        function(){

          deleteHistoryItem(
            item.id
          );
        };


      div.appendChild(
        left
      );

      div.appendChild(
        button
      );


      list.appendChild(
        div
      );
    }
  );
}


/* =========================================================
   CLOSE HISTORY
========================================================= */

function closeHistory(){

  document
    .getElementById(
      "historyDrawer"
    )
    .classList.remove(
      "open"
    );
}


/* =========================================================
   DELETE HISTORY ITEM
========================================================= */

function deleteHistoryItem(id){

  let history =
    JSON.parse(
      localStorage.getItem(
        "sh"
      ) || "[]"
    );


  history =
    history.filter(
      item =>
        String(item.id) !==
        String(id)
    );


  localStorage.setItem(
    "sh",
    JSON.stringify(history)
  );


  openHistory();
}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory(){

  if(
    !confirm(
      "Delete all learning history?"
    )
  ){

    return;
  }


  localStorage.removeItem(
    "sh"
  );


  openHistory();
}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(
    function(){

      chat.scrollTop =
        chat.scrollHeight;
    }
  );
}


/* =========================================================
   SEND
========================================================= */

async function sendMsg(){

  /*
   * Stop voice recording first.
   */

  if(
    recognition &&
    listening
  ){

    try{
      recognition.stop();
    }catch(e){}
  }


  const text =
    msg.value.trim();


  if(
    !text &&
    !uploadedPhoto
  ){

    return;
  }


  if(isThinking){

    return;
  }


  /*
   * Display user's message.
   */

  if(text){

    addUser(text);
  }


  if(uploadedPhoto){

    addUserPhoto(
      uploadedPhoto
    );
  }


  saveHistory(
    text ||
    uploadedDocName ||
    "Photo question"
  );


  const originalQuestion =
    text ||
    "Please explain this uploaded image.";


  /*
   * Keep attachment before clearing.
   */

  const keepPhoto =
    uploadedPhoto;


  const keepMime =
    uploadedMime ||
    "image/jpeg";


  const keepDoc =
    uploadedDocName;


  /*
   * Clear input immediately.
   */

  msg.value = "";

  msg.style.height =
    "auto";


  clearAttach();


  /*
   * Prepare language.
   */

  const language =
    detectLang(
      originalQuestion
    );


  /*
   * Tell the model how to structure
   * educational answers.
   *
   * This is sent along with the actual
   * question but the learner only sees
   * the original question above.
   */

  let modelQuestion =
    originalQuestion;


  modelQuestion +=
    `

Teaching response preference:
Answer naturally at the selected grade level.
When appropriate, clearly identify the Topic and Strand.
Give an Explanation followed by detailed text.
For multiple-choice questions, identify the correct answer and explain briefly why each of the other choices is wrong.
Do not use decorative brackets, box lines, or unnecessary separators.
Keep the answer clear and readable on a phone.
`;


  /*
   * Small status instead of a large
   * Thinking bubble.
   */

  addStatus();


  isThinking =
    true;


  /*
   * Abort very long network hangs.
   * Normal answers should return well
   * before this.
   */

  const controller =
    new AbortController();


  const timeout =
    setTimeout(
      function(){

        controller.abort();

      },
      60000
    );


  try{

    const payload = {

      question:
        modelQuestion,

      originalQuestion:
        originalQuestion,

      grade:
        grade,

      role:
        "Student",

      task:
        language,

      mode:
        "student",

      subject:
        "",

      topic:
        "",

      strand:
        "",

      history:
        chatHistory.slice(-8),

      photo:
        keepPhoto,

      mimeType:
        keepMime,

      provider:
        "auto",

      /*
       * Extra metadata for future
       * SomaHub frontend versions.
       */

      responseStyle:
        "topic-strand-explanation-detailed",

      explainWrongChoices:
        true,

      useSomaHubFiles:
        true,

      repository:
        "kevokevo426-cmd/Somahub-Kenya"
    };


    const response =
      await fetch(
        PROXY,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload),

          signal:
            controller.signal
        }
      );


    clearTimeout(
      timeout
    );


    const raw =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(raw);

    }catch{

      throw new Error(
        raw.slice(
          0,
          300
        ) ||
        "Invalid server response."
      );
    }


    removeStatus();


    if(!response.ok){

      throw new Error(
        data.error ||
        "SomaHub could not answer right now."
      );
    }


    const answer =
      data.answer ||
      data.reply ||
      "";


    if(!answer){

      throw new Error(
        "SomaHub returned an empty answer."
      );
    }


    addAI(answer);


  }catch(error){

    clearTimeout(
      timeout
    );


    removeStatus();


    let message =
      error?.message ||
      "Something went wrong.";


    if(
      error?.name ===
      "AbortError"
    ){

      message =
        "The response took too long. Please try again.";
    }


    showError(
      message
    );


    /*
     * Keep error response short.
     */

    addAI(
      language === "SW"
        ? "Samahani, kuna hitilafu wakati wa kupata jibu. Tafadhali jaribu tena."
        : "Sorry, I couldn't get the answer right now. Please try again."
    );

  }finally{

    isThinking =
      false;

    scrollBottom();
  }
}

   INITIAL SETUP
========================================================= */

(function(){

  /*
   * Make sure textarea starts compact.
   */

  msg.style.height =
    "auto";


  /*
   * Stop speech when leaving page.
   */

  window.addEventListener(
    "beforeunload",
    function(){

      try{
        speechSynthesis.cancel();
      }catch(e){}

    }
  );

})();

</script>
