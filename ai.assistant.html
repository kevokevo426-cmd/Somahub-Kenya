<body class="flex justify-center">

<script>
const PROXY_URL="/api/gemini";
let shke="SHKE", grade="Grade 7", gradeNum=7, currentLang="en";
let aiBrain=[], resources=[], allFiles={Notes:[], Design:[], Exam:[], Homework:[]}, uploadedPhoto='', isThinking=false, blindMode=false, recognition=null, isRecording=false, currentQs=[], voicesCache=[];

const SOMAHUB_SYSTEM = `You are SomaHub Smart Marker - Kenyan CBC teacher.
RULES:
1. Read ALL questions in photo (OCR).
2. For EACH question output EXACT format:
**Q{number}. {stem short}**
**Answer: {Correct letter}. {Correct text}**
**Reason: {Simple 1-2 sentence why, Grade 6 English}**
**Learner: {What learner ticked/wrote if visible, else "Not visible"} - {CORRECT ✅ or WRONG ❌ + why}**
**Score: {0 or 1}/1
3. After all: **Score Page 1: X/Y - Comment** and **Overall so far: X/Y - Z% - Comment**
4. Use simple English, emojis ✅ ❌, bold, friendly.
5. If composition: use bold (correction) format Strict/Fair/Medium.
NEVER say "As an AI". Be teacher Mwalimu from SomaHub.`;

function loadVoices(){ voicesCache = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; document.addEventListener('click', ()=>{ speechSynthesis.resume(); if(voicesCache.length===0) loadVoices(); }, {once:true}); }
function speakText(t){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); speechSynthesis.resume(); let clean=t.replace(/[*_`#<>]/g,'').replace(/<[^>]*>/g,' ').slice(0,700); if(!clean.trim()) return; let utt=new SpeechSynthesisUtterance(clean); let isSw=/Kiswahili|Nomino/i.test(clean)||currentLang==="sw"; let isFr=currentLang==="fr"; let isDe=currentLang==="de"; let isZh=currentLang==="zh"; let vs=speechSynthesis.getVoices(); if(vs.length===0){ setTimeout(()=>speakText(t),300); return; } let voice = vs.find(v=> isSw? v.lang.toLowerCase().includes('sw'):isFr? v.lang.toLowerCase().includes('fr'):isDe? v.lang.toLowerCase().includes('de'):isZh? v.lang.toLowerCase().includes('zh'):v.lang==='en-GB') || vs.find(v=>v.lang.startsWith('en')) || vs[0]; if(voice) utt.voice=voice; utt.lang=isSw?'sw-KE':isFr?'fr-FR':isDe?'de-DE':isZh?'zh-CN':'en-US'; utt.rate=blindMode?0.7:0.9; speechSynthesis.speak(utt); }
function toggleBlindMode(){blindMode=!blindMode; document.documentElement.style.fontSize=blindMode?"120%":"100%"; blindBtn.innerText=blindMode?"♿ BIG ON":"♿ BIG";}
function updateLang(){currentLang=langSel.value; speakText(currentLang==="fr"?"Bonjour! French ON":currentLang==="de"?"Hallo! German ON":currentLang==="zh"?"Ni hao! Chinese ON":currentLang==="sw"?"Habari! Kiswahili ON":"English ON");}
function quick(t){msg.value=t; sendMsg();}
function showError(m){ let e=document.getElementById('errorBox'); e.innerText=m; e.classList.remove('hidden'); setTimeout(()=>e.classList.add('hidden'),4000); }

// FIXED PHOTO HANDLER - COMPRESSES TO FIX Request Entity Too Large + Unexpected token R
function handlePhoto(input){
 let f=input.files[0]; if(!f) return;
 if(f.size > 8*1024*1024){ showError("Photo too big - take closer"); return; }
 let url=URL.createObjectURL(f);
 let img=new Image();
 img.onload=()=>{
   let canvas=document.createElement('canvas');
   let max=700; let w=img.width, h=img.height;
   if(w>h){ if(w>max){ h*=max/w; w=max; } } else { if(h>max){ w*=max/h; h=max; } }
   canvas.width=w; canvas.height=h;
   canvas.getContext('2d').drawImage(img,0,0,w,h);
   uploadedPhoto=canvas.toDataURL('image/jpeg',0.50);
   chat.innerHTML+=`<div class="flex justify-end"><div class="bg-[#dcf8c6] rounded-xl p-2 border-2 border-black max-w-[80%] shadow-[2px_2px_0_0_#000]"><img src="${uploadedPhoto}" class="rounded-lg max-h-[200px]"><p class="text-[8px] font-black mt-1">📸 Photo added - ${Math.round(uploadedPhoto.length/1024)}KB - tap SomaHub Mark</p></div></div>`;
   chat.scrollTop=chat.scrollHeight;
   URL.revokeObjectURL(url);
 };
 img.onerror=()=>{ showError("Use Gallery - photo failed"); URL.revokeObjectURL(url); };
 img.src=url;
}
function startVoiceAsk(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert("Use Chrome"); return;}
 if(isRecording&&recognition){recognition.stop(); return;}
 recognition=new SR(); recognition.lang=currentLang==="fr"?"fr-FR":currentLang==="de"?"de-DE":currentLang==="zh"?"zh-CN":currentLang==="sw"?"sw-KE":"en-KE";
 let btn=document.getElementById('micBtn'), stat=document.getElementById('micStatus');
 btn.classList.add('pulse'); btn.style.background="#ef4444"; btn.innerText="🔴"; stat.innerText="🎤 Listening - EDIT before Send"; stat.classList.remove('hidden'); isRecording=true;
 recognition.onresult=e=>{let tr=e.results[0][0].transcript.trim(); msg.value=tr; msg.focus(); stat.innerHTML=`✅ Heard: <b>${tr}</b> - EDIT then Send`; stat.className="text-[9px] font-black text-center bg-[#dcfce7] border-2 border-black rounded-full py-1 mb-1";};
 recognition.onend=()=>{btn.classList.remove('pulse'); btn.style.background="black"; btn.innerHTML="🎤"; isRecording=false;}; recognition.start();
}
async function loadAll(){ let FB=window.FB; try{ let snap=await FB.getDocs(FB.collection(FB.db,'ai_brain')); aiBrain=[]; snap.forEach(d=>aiBrain.push({id:d.id,...d.data()})); let snap2=await FB.getDocs(FB.collection(FB.db,'resources')); resources=[]; allFiles={Notes:[], Design:[], Exam:[], Homework:[]}; snap2.forEach(d=>{let r={id:d.id,...d.data()}; resources.push(r); if(allFiles[r.type]) allFiles[r.type].push(r);}); let num=parseInt((grade.match(/\d+/)||[7])[0]); gradeNum=isNaN(num)?7:num; gradeBadge.innerText=grade; currentInfo.innerText=`${grade} • ${resources.length} res • SomaHub • ${currentLang}`; resCount.innerText=`res ${resources.length}`; }catch(e){} }
async function askSuperAI(question){
 let filteredBrain=aiBrain.filter(b=>parseInt((b.grade||'').match(/\d+/)?.[0]||'6')==gradeNum).slice(-3); if(!filteredBrain.length) filteredBrain=aiBrain.slice(-3);
 let brainContext=`[AI_BRAIN ${grade}] ${filteredBrain.map(m=>`${m.title}:${(m.text||'').slice(0,600)}`).join("\n")}`;
 let photoData=uploadedPhoto? uploadedPhoto.split(',')[1] : null;
 if(photoData && photoData.length > 900000){ throw new Error("Photo still large - retake closer, crop paper only"); }
 let isSomaMark = photoData || /mark.*photo|exam|composition|score/i.test(question);
 let isHW=question.toLowerCase().includes('homework')||question.toLowerCase().includes('10 marks');
 let langInstruction=currentLang==="fr"?"French Foreign bonjour":currentLang==="de"?"German Foreign":currentLang==="zh"?"Chinese Foreign ni hao":currentLang==="sw"?"Kiswahili":"English";
 let promptQ;
 if(isSomaMark && photoData){ promptQ = SOMAHUB_SYSTEM + "\n\nUSER: " + question; }
 else if(isHW){ promptQ = `Generate HOMEWORK 10 marks ${grade} ${question} MUST return ONLY JSON array [{"q":"...","options":["A","B","C","D"],"answer":"A","marks":2,"strand":"Vocab","color":"#e0f2ff"}] 5 Qs, colorful, playground friendly. ONLY JSON.`; }
 else { promptQ = question + ` Answer in ${langInstruction} for ${grade}, short, no LEVEL LOCK header.`; }
 // SAFE FETCH - handles OLD Gemini text response (fixes Unexpected token R)
 let res=await fetch(PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:promptQ, grade, shke, brainContext, photo:photoData, lang:currentLang})});
 let rawText=await res.text();
 let data;
 try{ data=JSON.parse(rawText); }catch{ data={answer: rawText}; }
 if(data.error) throw new Error(data.error);
 return data;
}
function renderHomeworkCards(qs){ return qs.map((c,i)=>{ let isMCQ=c.options&&c.options.length>0; let bg=c.color|| (i%4===0?"#e0f2ff":i%4===1?"#ffe0f0":i%4===2?"#fff7e0":"#dcfce7"); let opts=isMCQ? `<div class="mt-3 space-y-2">${c.options.map((o,oi)=>`<label class="flex items-center gap-3 bg-white border-[2.5px] border-black rounded-full px-4 py-3 cursor-pointer shadow-[2px_2px_0_0_#000] fun-btn"><input type="radio" name="hw${i}" value="${o}" onchange="document.getElementById('hwans${i}').value=this.value; document.getElementById('hwtext${i}').value=this.value; speakText('${o.replace(/'/g,'')}')" class="w-5 h-5 accent-black"><span class="font-black text-[12px]">${String.fromCharCode(65+oi)}. ${o}</span></label>`).join('')}<div class="mt-2 flex gap-2"><input id="hwtext${i}" placeholder="EDITABLE" class="flex-1 border-2 border-black rounded-full p-2.5 text-[11px] font-bold bg-[#fff7e0]" oninput="document.getElementById('hwans${i}').value=this.value"><button id="hwmic${i}" onclick="startVoiceCard(${i})" class="bg-black text-white w-10 h-10 rounded-full border-2 border-black">🎤</button></div><input id="hwans${i}" type="hidden"></div>` : `<div class="mt-3 flex gap-2"><input id="hwtext${i}" placeholder="Type or 🎤 EDITABLE" class="flex-1 border-2 border-black rounded-full p-3 text-[11px] font-bold bg-white" oninput="document.getElementById('hwans${i}').value=this.value"><button id="hwmic${i}" onclick="startVoiceCard(${i})" class="bg-black text-white w-10 h-10 rounded-full border-2 border-black">🎤</button></div><input id="hwans${i}" type="hidden">`; return `<div class="border-[2.5px] border-black rounded-[1.2rem] p-3 shadow-[3px_3px_0_0_#000] mt-3" style="background:${bg}"><div class="flex justify-between"><span class="bg-black text-white px-2 py-1 rounded-full text-[8px] font-black">Q${i+1} • ${c.marks||2}mks</span><button onclick="speakQuestionCard(${i})" class="bg-[#4a86ff] text-white px-3 py-1 rounded-full text-[8px] font-black border-2 border-black fun-btn">🔊 Listen</button></div><p class="font-black text-[13px] mt-2">${c.q}</p>${opts}<p id="hwstat${i}" class="hidden mt-1 text-[8px] font-black text-center bg-[#ffcc1a] border-2 border-black rounded-full py-1"></p></div>`; }).join(''); }
function speakQuestionCard(i){ let c=currentQs[i]; if(!c) return; speakText(`Question ${i+1}. ${c.q}. ${c.options? 'Options: '+c.options.join(', '):''}`); }
function startVoiceCard(i){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; let rec=new SR(); rec.lang=currentLang==="fr"?"fr-FR":currentLang==="de"?"de-DE":currentLang==="zh"?"zh-CN":"en-KE"; let txt=document.getElementById('hwtext'+i), hid=document.getElementById('hwans'+i), stat=document.getElementById('hwstat'+i), btn=document.getElementById('hwmic'+i); btn.innerText="🔴"; stat.innerText="🎤 Listening..."; stat.classList.remove('hidden'); rec.onresult=e=>{ let tr=e.results[0][0].transcript.trim(); let match=currentQs[i].options?.find(o=> o.toLowerCase().includes(tr.toLowerCase())); if(match) tr=match; txt.value=tr; hid.value=tr; stat.innerHTML=`✅ Heard: <b>${tr}</b> - EDITABLE`; }; rec.onend=()=>{btn.innerText="🎤";}; rec.start();}
function checkHomework(){ let score=0,total=0; let html=`<p class="font-black text-[12px]">Result</p>`; currentQs.forEach((c,i)=>{ let user=(document.getElementById('hwans'+i)?.value||document.getElementById('hwtext'+i)?.value||"").trim(); let m=c.marks||2; total+=m; let ok=user&&c.answer.toLowerCase().includes(user.toLowerCase().slice(0,3)); let got=ok?m:0; score+=got; html+=`<div class="border-2 border-black rounded-xl p-2 mt-2 text-[9px] font-black ${ok?'bg-[#dcfce7]':'bg-[#ffeaea]'}">${ok?'✅':'❌'} Q${i+1}: ${got}/${m} - Your:${user||'empty'} ✔ ${c.answer}</div>`; }); html+=`<p class="font-black mt-3 text-center">${score}/${total}</p>`; return {score,total,html}; }
async function sendMsg(){
 if(isThinking) return; let txt=msg.value.trim(); if(!txt &&!uploadedPhoto) return;
 chat.innerHTML+=`<div class="flex justify-end"><div class="bg-[#dcf8c6] border-2 border-black rounded-xl p-2 max-w-[80%] shadow-[2px_2px_0_0_#000]"><p class="text-[11px] font-bold">${txt || '📸 Photo'}</p><p class="text-[7px] opacity-60">${grade} • ${currentLang}</p></div></div>`;
 msg.value=""; chat.scrollTop=chat.scrollHeight; isThinking=true; sendBtn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
 chat.innerHTML+=`<div id="thinking" class="bg-white border-2 border-black rounded-xl p-3 max-w-[85%] shadow-[2px_2px_0_0_#000]"><p class="text-[9px] font-black">🔊 ${uploadedPhoto?'SomaHub Marking...':'Thinking...'}</p></div>`; chat.scrollTop=chat.scrollHeight;
 try{
  let data=await askSuperAI(txt|| (uploadedPhoto?"Mark this photo SomaHub style":"Homework 10 marks"));
  document.getElementById('thinking')?.remove();
  let raw=data.answer||"";
  if(raw.includes("Request En")||raw.includes("Entity Too Large")){ throw new Error("Photo too large - retake closer, paper only, use Gallery"); }
  let jsonMatch=raw.match(/\[[\s\S]*\]/);
  if(jsonMatch &&!uploadedPhoto){
   try{
    let parsed=JSON.parse(jsonMatch[0]);
    if(parsed.length>0 && parsed[0].q){
     currentQs=parsed;
     let cards=renderHomeworkCards(parsed);
     let id='ans'+Date.now();
     chat.innerHTML+=`<div class="bg-white border-[2.5px] border-black rounded-[1.2rem] p-3 max-w-[95%] shadow-[3px_3px_0_0_#000]"><p class="font-black text-[12px]">📚 ${grade} Homework - 10 Marks</p><div id="${id}">${cards}</div><button onclick="let r=checkHomework(); document.getElementById('res_${id}').innerHTML=r.html; document.getElementById('res_${id}').classList.remove('hidden'); speakText('You scored '+r.score+' out of '+r.total);" class="w-full mt-3 bg-[#2ac5a0] border-2 border-black rounded-full py-3 font-black text-[11px] fun-btn">✅ Check + 🔊 Score</button><div id="res_${id}" class="hidden mt-3 p-2 bg-white border-2 border-black rounded-xl"></div><div class="mt-3 flex gap-2"><button onclick="speakText(document.getElementById('${id}').innerText.slice(0,600))" class="bg-[#4a86ff] text-white px-3 py-1.5 rounded-full text-[8px] font-black border-2 border-black fun-btn">🔊 Listen All</button><a href="${data.youtubeFiltered||'#'}" target="_blank" class="bg-red-600 text-white px-3 py-1.5 rounded-full text-[8px] font-black border-2 border-black">▶️ YouTube</a></div></div>`;
    }else throw "not hw";
   }catch{
    let clean=raw.replace(/\*\*LEVEL LOCK[\s\S]*?\*\*/gi,'').replace(/\*\*/g,'').trim();
    let id='ans'+Date.now();
    chat.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-3 max-w-[90%] shadow-[2px_2px_0_0_#000]"><p class="text-[11px] leading-6" id="${id}" style="white-space:pre-wrap">${clean}</p><div class="mt-2 flex gap-2"><button onclick="speakText(document.getElementById('${id}').innerText)" class="bg-[#4a86ff] text-white px-3 py-1.5 rounded-full text-[8px] font-black border-2 border-black fun-btn">🔊 Listen</button><a href="${data.youtubeFiltered||'#'}" target="_blank" class="bg-red-600 text-white px-3 py-1.5 rounded-full text-[8px] font-black border-2 border-black">▶️ YouTube</a></div></div>`;
   }
  }else{
   let clean=raw.replace(/\*\*LEVEL LOCK[\s\S]*?\*\*/gi,'').replace(/\*\*SYSTEM[\s\S]*?\*\*/gi,'').trim();
   let id='ans'+Date.now();
   let isMark = /Q\d+.*Answer:/i.test(raw);
   let bgClass = isMark? 'bg-[#fffde7] border-[#ffcc1a]' : 'bg-white';
   chat.innerHTML+=`<div class="${bgClass} border-2 border-black rounded-xl p-3 max-w-[95%] shadow-[2px_2px_0_0_#000]"><p class="text-[11px] leading-6" id="${id}" style="white-space:pre-wrap">${clean}</p><div class="mt-2 flex gap-2"><button onclick="speakText(document.getElementById('${id}').innerText)" class="bg-[#4a86ff] text-white px-3 py-1.5 rounded-full text-[8px] font-black border-2 border-black fun-btn">🔊 Listen</button><a href="${data.youtubeFiltered||'#'}" target="_blank" class="bg-red-600 text-white px-3 py-1.5 rounded-full text-[8px] font-black border-2 border-black">▶️ YouTube</a></div></div>`;
   speakText(clean.slice(0,500));
  }
  uploadedPhoto='';
 }catch(e){
  document.getElementById('thinking')?.remove();
  showError(e.message);
  chat.innerHTML+=`<div class="bg-[#ffeaea] border-2 border-black rounded-xl p-3 max-w-[90%] shadow-[2px_2px_0_0_#000]"><p class="text-[10px] font-bold">❌ ${e.message}<br>Fix: Gallery button, crop paper only, good light</p></div>`;
 }
 chat.scrollTop=chat.scrollHeight; isThinking=false; sendBtn.innerHTML='<i class="fa-solid fa-paper-plane text-[13px]"></i>';
}
FB.onAuthStateChanged(FB.auth, async(u)=>{
 if(!u){ shkeBadge.innerText="SHKE"; return; }
 try{
  let snap=await FB.getDoc(FB.doc(FB.db,"users", u.uid));
  if(snap.exists()){
   let d=snap.data();
   shke=d.indexNumber||u.uid.slice(0,8); grade=d.grade||"Grade 7";
   nameShow.innerText=d.firstName||d.name||"Learner"; shkeBadge.innerText=shke; gradeBadge.innerText=grade;
  }
 }catch(e){}
 loadAll();
});
</script>
