<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SomaHub Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;font-family:'Nunito',sans-serif;background:#f5f5f0}body{overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#chat::-webkit-scrollbar{width:0}
.ai-card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px 16px;line-height:1.65;font-size:13.5px;color:#111}
.ai-card h3{font-weight:800;font-size:12px;margin:12px 0 6px;color:#1a1a6c;text-transform:uppercase}
.ai-card p{margin:6px 0}.ai-card ul{margin:6px 0 6px 18px;list-style:disc}.ai-card ol{margin:6px 0 6px 18px;list-style:decimal}
.message-in{animation:in.18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">

<!-- HEADER - Proper size 56px -->
<header class="bg-white border-b border-gray-200 shrink-0 h-[56px] flex items-center justify-between px-3">
<div class="flex items-center gap-2.5">
<img src="/logo.png" onerror="this.src='https://i.pravatar.cc/100'" class="w-9 h-9 rounded-full bg-white border object-cover">
<div class="leading-tight">
<p class="font-black text-[14px] text-[#1a1a6c]">SomaHub Tutor</p>
<p class="text-[10px] text-green-600 font-bold flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full inline-block"></span>Online • Auto EN/SW</p>
</div>
</div>
<div class="flex items-center gap-2">
<select id="grade" class="h-8 bg-gray-100 rounded-full px-3 text-[12px] font-bold outline-none border-0"><option>Playground</option><option>PP1</option><option>PP2</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option selected>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option></select>
<button onclick="openHistory()" class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center text-[12px]"><i class="fa-regular fa-clock"></i></button>
</div>
</header>

<!-- CHAT AREA WITH WELCOME -->
<main id="chat">
<div class="max-w-3xl mx-auto px-3 py-4 pb-32">
<!-- WELCOME - Now visible -->
<div id="welcome" class="flex flex-col items-center text-center py-12">
<div class="w-20 h-20 rounded-full bg-black text-white flex items-center justify-center text-3xl">🎓</div>
<h2 class="text-[20px] font-extrabold mt-4 text-[#1a1a6c]">How can I help you learn?</h2>
<p class="text-gray-500 text-[13px] mt-2 max-w-[300px] leading-snug">Ask a question, upload homework photo, or say Habari. I auto-detect English / Kiswahili like Meta AI.</p>
<div class="grid grid-cols-2 gap-2 mt-6 w-full max-w-[320px]">
<button onclick="quickAsk('What is photosynthesis?')" class="bg-white border rounded-xl p-3 text-[11px] font-bold text-left">🌱 What is photosynthesis?</button>
<button onclick="quickAsk('Nisaidie hesabu darasa la 7')" class="bg-white border rounded-xl p-3 text-[11px] font-bold text-left">🔢 Nisaidie hesabu</button>
<button onclick="quickAsk('Explain matter for Grade 7')" class="bg-white border rounded-xl p-3 text-[11px] font-bold text-left">🧪 What is matter?</button>
<button onclick="quickAsk('Mark my work')" class="bg-white border rounded-xl p-3 text-[11px] font-bold text-left">✅ Mark my work</button>
</div>
</div>
<div id="messages"></div>
</div>
</main>

<!-- INPUT - Fixed, send button fully visible -->
<footer class="shrink-0 bg-[#efeae2] border-t border-[#e0d8cc] px-2 py-2" style="padding-bottom:max(8px,env(safe-area-inset-bottom))">
<div class="max-w-3xl mx-auto">
<div id="previewBox" class="hidden mb-2 bg-white rounded-xl p-2 flex items-center gap-2 border"><img id="previewImg" class="w-10 h-10 rounded object-cover hidden"><i id="previewDocIcon" class="fa-solid fa-file text-gray-400 hidden"></i><span id="previewName" class="text-[11px] flex-1 truncate"></span><button onclick="clearAttach()" class="w-6 h-6 bg-black text-white rounded-full text-[10px]">✕</button></div>
<div id="errorBox" class="hidden bg-red-50 text-red-600 text-[11px] px-3 py-1.5 rounded-full mb-2 text-center"></div>

<div class="flex items-end gap-2">
<div class="flex-1 bg-white rounded-[28px] px-2 py-1 flex items-end gap-1 shadow-sm border border-gray-200 min-h-[44px]">
<button onclick="document.getElementById('docInput').click()" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center shrink-0"><i class="fa-solid fa-paperclip text-gray-500"></i></button>
<button onclick="document.getElementById('imgInput').click()" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center shrink-0"><i class="fa-solid fa-image text-gray-500"></i></button>
<button onclick="document.getElementById('camInput').click()" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center shrink-0"><i class="fa-solid fa-camera text-gray-500"></i></button>
<textarea id="msg" rows="1" placeholder="Message..." class="flex-1 bg-transparent outline-none text-[14px] px-2 py-2.5 min-h-[20px] max-h-[100px] resize-none"></textarea>
</div>
<button id="voiceBtn" onclick="toggleVoice()" class="w-11 h-11 rounded-full bg-[#075e54] text-white flex items-center justify-center shrink-0 shadow-md"><i class="fa-solid fa-microphone"></i></button>
<button id="sendBtn" onclick="sendMsg()" class="w-11 h-11 rounded-full bg-[#25d366] text-white flex items-center justify-center shrink-0 shadow-md"><i class="fa-solid fa-paper-plane text-[14px]"></i></button>
</div>
<p id="listenTxt" class="hidden text-[10px] text-red-500 text-center mt-1 animate-pulse">● Listening SW/EN...</p>
</div>
</footer>
</div>

<div id="historyDrawer" class="fixed inset-0 z-50 bg-white hidden flex-col"><div class="h-14 border-b flex items-center justify-between px-3"><button onclick="closeHistory()" class="font-bold">← Back</button><b class="text-[13px]">History</b><button onclick="clearHistory()" class="text-[11px] text-gray-500">Delete All</button></div><div id="historyList" class="flex-1 overflow-auto p-3"></div></div>

<input id="docInput" type="file" class="hidden" accept=".pdf,.doc,.docx,.txt" onchange="handleDoc(this)">
<input id="imgInput" type="file" class="hidden" accept="image/*" onchange="handlePhoto(this)">
<input id="camInput" type="file" class="hidden" accept="image/*" capture="environment" onchange="handlePhoto(this)">

<script>
const PROXY="/api/gemini";
let grade="Grade 7", uploadedPhoto="", uploadedMime="", uploadedDocName="", isThinking=false, recognition=null, listening=false, chatHistory=[];
const chat=document.getElementById("chat"), messages=document.getElementById("messages"), msg=document.getElementById("msg"), welcome=document.getElementById("welcome");
const SW=["habari","mambo","nisaidie","hesabu","hisabati","sayansi","kiswahili","shule","mwalimu","asante","eleza","soma","darasa","mtihani"];

function detectLang(t){ if(!t) return "EN"; const l=t.toLowerCase(); return SW.some(k=>l.includes(k))?"SW":"EN"; }
document.getElementById("grade").addEventListener("change",e=>grade=e.target.value);
msg.addEventListener("input",()=>{ msg.style.height="auto"; msg.style.height=Math.min(msg.scrollHeight,100)+"px"; });
function quickAsk(t){ msg.value=t; sendMsg(); }

(function(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; recognition=new SR(); recognition.onstart=()=>{ listening=true; document.getElementById("listenTxt").classList.remove("hidden"); }; recognition.onend=()=>{ listening=false; document.getElementById("listenTxt").classList.add("hidden"); }; recognition.onresult=(e)=>{ msg.value=e.results[0][0].transcript; msg.dispatchEvent(new Event('input')); }; })();
function toggleVoice(){ if(!recognition){ alert("Use Chrome"); return; } if(listening){ recognition.stop(); return; } recognition.lang=detectLang(msg.value)==="SW"?"sw-KE":"en-KE"; recognition.start(); }

function handlePhoto(i){ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"); let w=img.width,h=img.height; const m=1000; if(w>m||h>m){ const sc=Math.min(m/w,m/h); w=Math.round(w*sc); h=Math.round(h*sc);} c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); uploadedPhoto=c.toDataURL("image/jpeg",0.7); uploadedMime="image/jpeg"; document.getElementById("previewImg").src=uploadedPhoto; document.getElementById("previewImg").classList.remove("hidden"); document.getElementById("previewDocIcon").classList.add("hidden"); document.getElementById("previewName").textContent=f.name; document.getElementById("previewBox").classList.remove("hidden"); }; img.src=r.result; }; r.readAsDataURL(f); i.value=""; }
function handleDoc(i){ const f=i.files[0]; if(!f) return; uploadedDocName=f.name; uploadedPhoto=""; document.getElementById("previewImg").classList.add("hidden"); document.getElementById("previewDocIcon").classList.remove("hidden"); document.getElementById("previewName").textContent=f.name; document.getElementById("previewBox").classList.remove("hidden"); i.value=""; }
function clearAttach(){ uploadedPhoto=""; uploadedMime=""; uploadedDocName=""; document.getElementById("previewBox").classList.add("hidden"); }
function showError(m){ const b=document.getElementById("errorBox"); b.textContent=m; b.classList.remove("hidden"); setTimeout(()=>b.classList.add("hidden"),4000); }
function formatResponse(t){
  let html=String(t).replace(/\$\$([\s\S]*?)\$\$/g,(m,c)=>`<div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:8px;text-align:center;margin:8px 0;font-family:monospace;font-size:12px">${c.trim()}</div>`).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/^### (.*)$/gm,'<h3>$1</h3>').split('\n').map(l=>{ l=l.trim(); if(!l) return ''; if(l.startsWith('<h3')||l.startsWith('<div')) return l; if(/^\d+\.\s/.test(l)) return `<p>${l}</p>`; if(l.startsWith('- ')||l.startsWith('* ')) return `<ul><li>${l.slice(2)}</li></ul>`; return `<p>${l}</p>`; }).join(''); html=html.replace(/<\/ul><ul>/g,''); html=html.replace(/<p><\/p>/g,''); return html;
}
function addUser(t){ welcome.classList.add("hidden"); const d=document.createElement("div"); d.className="flex justify-end mb-2 message-in"; d.innerHTML=`<div class="max-w-[78%] bg-[#dcf8c6] rounded-2xl rounded-br-sm px-4 py-2.5 text-[13px] shadow-sm">${t.replace(/</g,'&lt;')}</div>`; messages.appendChild(d); chatHistory.push({role:"user",content:t}); chat.scrollTop=chat.scrollHeight; }
function addUserPhoto(p){ welcome.classList.add("hidden"); const d=document.createElement("div"); d.className="flex justify-end mb-2"; d.innerHTML=`<div class="bg-[#dcf8c6] rounded-xl p-1"><img src="${p}" class="max-w-[180px] rounded-lg"></div>`; messages.appendChild(d); }
function addThinking(){ const d=document.createElement("div"); d.id="thinking"; d.className="flex gap-2 mb-2 items-center"; d.innerHTML=`<div class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[10px]">🎓</div><div class="bg-white border rounded-xl px-4 py-2 text-[12px] text-gray-500">Thinking...</div>`; messages.appendChild(d); chat.scrollTop=chat.scrollHeight; }
function addAI(t){
  welcome.classList.add("hidden");
  const id='ai_'+Date.now();
  const d=document.createElement("div"); d.className="flex gap-2 mb-3 message-in items-start";
  d.innerHTML=`<div class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[10px] shrink-0 mt-1">🎓</div>
  <div class="flex-1"><div id="${id}" class="ai-card">${formatResponse(t)}</div>
  <div class="flex flex-wrap gap-1.5 mt-2"><button onclick="copyCard('${id}')" class="h-7 px-3 bg-white border rounded-full text-[10px] font-bold"><i class="fa-regular fa-copy"></i> Copy</button><button onclick="listenCard('${id}')" class="h-7 px-3 bg-white border rounded-full text-[10px] font-bold"><i class="fa-solid fa-volume-high"></i> Listen</button><button onclick="downloadCard('${id}')" class="h-7 px-3 bg-white border rounded-full text-[10px] font-bold"><i class="fa-solid fa-download"></i> Download</button><button onclick="printCard('${id}')" class="h-7 px-3 bg-black text-white rounded-full text-[10px] font-bold"><i class="fa-solid fa-print"></i> Print</button></div></div>`;
  messages.appendChild(d); chatHistory.push({role:"assistant",content:t}); chat.scrollTop=chat.scrollHeight;
}
function copyCard(id){ navigator.clipboard.writeText(document.getElementById(id).innerText); }
function listenCard(id){ const txt=document.getElementById(id).innerText; const u=new SpeechSynthesisUtterance(txt.slice(0,800)); u.lang=detectLang(txt)==="SW"?"sw-KE":"en-KE"; speechSynthesis.speak(u); }
function downloadCard(id){ const txt=document.getElementById(id).innerText; const blob=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='SomaHub-'+Date.now()+'.txt'; a.click(); }
function printCard(id){ const content=document.getElementById(id).innerHTML; const w=window.open('','_blank'); w.document.write(`<html><head><title>SomaHub</title><style>body{font-family:Arial;padding:20px;line-height:1.7;font-size:13px} h3{color:#1a1a6c}</style></head><body>${content}<script>window.print()<\/script></body></html>`); w.document.close(); }
function saveH(t){ const h=JSON.parse(localStorage.getItem("sh")||"[]"); h.unshift({id:Date.now(),title:t.slice(0,50),time:new Date().toISOString(),grade}); localStorage.setItem("sh",JSON.stringify(h.slice(0,100))); }
function openHistory(){ document.getElementById("historyDrawer").classList.remove("hidden"); document.getElementById("historyDrawer").classList.add("flex"); const h=JSON.parse(localStorage.getItem("sh")||"[]"); const l=document.getElementById("historyList"); l.innerHTML=h.length?'':"<p class='text-center text-gray-400 mt-20 text-xs'>No history</p>"; h.forEach(it=>{ const div=document.createElement("div"); div.className="py-2.5 border-b flex justify-between"; div.innerHTML=`<div><p class="text-[12px] font-bold">${it.title}</p><p class="text-[9px] text-gray-500">${it.grade}</p></div><button onclick="delH('${it.id}')" class="text-[12px]">×</button>`; l.appendChild(div); }); }
function closeHistory(){ document.getElementById("historyDrawer").classList.add("hidden"); }
function delH(id){ let h=JSON.parse(localStorage.getItem("sh")||"[]"); h=h.filter(x=>x.id!=id); localStorage.setItem("sh",JSON.stringify(h)); openHistory(); }
function clearHistory(){ if(confirm("Delete all history?")){ localStorage.removeItem("sh"); openHistory(); } }

async function sendMsg(){
  const text=msg.value.trim(); if(!text &&!uploadedPhoto) return; if(isThinking) return;
  if(text) addUser(text); if(uploadedPhoto) addUserPhoto(uploadedPhoto);
  saveH(text||uploadedDocName||"Photo"); const q=text||"Explain this image";
  const lang=detectLang(text);
  msg.value=""; msg.style.height="20px"; const keepPhoto=uploadedPhoto; const keepMime=uploadedMime||"image/jpeg"; clearAttach();
  addThinking(); isThinking=true;
  const payload={question:q, originalQuestion:q, grade:grade, role:"Student", task:lang, mode:"student", history:chatHistory.slice(-6), photo:keepPhoto, mimeType:keepMime, provider:"auto"};
  try{
    const res=await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const textRes=await res.text(); let data; try{ data=JSON.parse(textRes); }catch{ throw new Error(textRes.slice(0,200)); }
    document.getElementById("thinking")?.remove();
    if(!res.ok) throw new Error(data.error||"Server error");
    const reply=data.answer||data.reply||""; if(!reply) throw new Error("Empty answer");
    addAI(reply);
  }catch(e){
    document.getElementById("thinking")?.remove();
    showError(e.message);
    addAI("Samahani, kuna hitilafu: "+e.message);
  }
  isThinking=false; chat.scrollTop=chat.scrollHeight;
}
msg.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMsg(); }});
</script>
</body>
</html>
