<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>SomaHub AI Teacher</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f8;
    }

    body {
      overflow: hidden;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #chat {
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #c7c7c7;
      border-radius: 20px;
    }

    .message-in {
      animation: messageIn 0.2s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: #555;
      border-radius: 50%;
      animation: typing 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.35;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    textarea {
      resize: none;
    }

    .photo-message {
      max-width: min(380px, 78vw);
      max-height: 430px;
      object-fit: contain;
    }

    .safe-bottom {
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    /* AI response formatting */

    .ai-response {
      font-size: 14px;
      line-height: 1.75;
      color: #171717;
    }

    .ai-response strong {
      font-weight: 800;
    }

    .ai-response .highlight {
      background: #fff1a8;
      padding: 1px 5px;
      border-radius: 5px;
      font-weight: 800;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .ai-response .answer-box {
      background: #ecfdf3;
      border: 1px solid #a7f3d0;
      border-radius: 14px;
      padding: 12px 14px;
      margin: 12px 0;
    }

    .ai-response .key-box {
      background: #fffbea;
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 12px 14px;
      margin: 12px 0;
    }

    .ai-response .wrong-box {
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 12px;
      padding: 10px 12px;
      margin: 7px 0;
    }

    .ai-response .choice-box {
      border: 1px solid #e5e7eb;
      background: #fafafa;
      border-radius: 12px;
      padding: 10px 12px;
      margin: 7px 0;
    }

    .ai-response .section-title {
      font-weight: 800;
      font-size: 15px;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .ai-response ul {
      padding-left: 20px;
      margin: 8px 0;
    }

    .ai-response li {
      margin: 4px 0;
    }

    .ai-response .numbered {
      margin: 6px 0;
      padding-left: 4px;
    }

    .ai-response .numbered div {
      margin: 4px 0;
    }

    .ai-response .step {
      display: flex;
      gap: 9px;
      margin: 8px 0;
      align-items: flex-start;
    }

    .ai-response .step-number {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #111;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      flex-shrink: 0;
    }

    @media (max-width: 500px) {
      .ai-response {
        font-size: 13.5px;
      }
    }
  </style>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <header class="bg-white border-b border-[#e5e5e5] shrink-0">

    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">

      <div class="flex items-center gap-3">

        <div
          class="w-10 h-10 rounded-full bg-black text-white flex items-center justify-center shadow-sm"
        >
          <i class="fa-solid fa-graduation-cap text-[17px]"></i>
        </div>

        <div>
          <h1 class="font-bold text-[15px] leading-tight">
            SomaHub AI Teacher
          </h1>

          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 bg-green-500 rounded-full"></span>

            <span class="text-[11px] text-gray-500">
              AI learning assistant
            </span>
          </div>
        </div>

      </div>

      <div class="hidden sm:flex items-center gap-1.5 bg-gray-100 rounded-full px-3 py-1.5">

        <i class="fa-solid fa-book-open text-[10px]"></i>

        <span
          id="gradeLabel"
          class="text-[10px] font-semibold"
        >
          Grade 7
        </span>

      </div>

    </div>

  </header>


  <!-- CHAT -->
  <main
    id="chat"
    class="flex-1 overflow-y-auto"
  >

    <div
      id="chatInner"
      class="max-w-4xl mx-auto px-4 py-6 pb-32"
    >

      <!-- WELCOME -->
      <div
        id="welcome"
        class="flex flex-col items-center text-center py-10"
      >

        <div
          class="w-16 h-16 rounded-full bg-black text-white flex items-center justify-center mb-5 shadow-lg"
        >
          <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>

        <h2 class="text-2xl sm:text-3xl font-bold tracking-tight">
          How can I help you learn?
        </h2>

        <p
          class="text-gray-500 text-sm mt-2 max-w-md leading-6"
        >
          Send a question, type a question, or take a photo of your work.
          I'll explain the concept and guide you through the answer.
        </p>

        <div
          class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-7 w-full max-w-xl"
        >

          <button
            onclick="quickPrompt('Explain this question step by step.')"
            class="quick-btn bg-white border border-[#e5e5e5] rounded-2xl p-3 text-left hover:bg-gray-50 transition shadow-sm"
          >
            <i class="fa-solid fa-lightbulb text-gray-600 text-sm mb-2"></i>
            <span class="block text-[11px] font-semibold">
              Explain
            </span>
          </button>

          <button
            onclick="quickPrompt('Solve this question and explain the method.')"
            class="quick-btn bg-white border border-[#e5e5e5] rounded-2xl p-3 text-left hover:bg-gray-50 transition shadow-sm"
          >
            <i class="fa-solid fa-calculator text-gray-600 text-sm mb-2"></i>
            <span class="block text-[11px] font-semibold">
              Solve
            </span>
          </button>

          <button
            onclick="quickPrompt('Teach me the concept in this question with an example.')"
            class="quick-btn bg-white border border-[#e5e5e5] rounded-2xl p-3 text-left hover:bg-gray-50 transition shadow-sm"
          >
            <i class="fa-solid fa-chalkboard-user text-gray-600 text-sm mb-2"></i>
            <span class="block text-[11px] font-semibold">
              Teach me
            </span>
          </button>

          <button
            onclick="document.getElementById('photoInput').click()"
            class="quick-btn bg-white border border-[#e5e5e5] rounded-2xl p-3 text-left hover:bg-gray-50 transition shadow-sm"
          >
            <i class="fa-solid fa-camera text-gray-600 text-sm mb-2"></i>
            <span class="block text-[11px] font-semibold">
              Photo
            </span>
          </button>

        </div>

      </div>


      <!-- MESSAGES -->
      <div id="messages"></div>

    </div>

  </main>


  <!-- INPUT -->
  <footer
    class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-[#e5e5e5] safe-bottom"
  >

    <div class="max-w-4xl mx-auto px-3 sm:px-4 pt-3 pb-2">

      <div
        id="errorBox"
        class="hidden mb-2 bg-red-50 border border-red-200 text-red-700 rounded-xl px-3 py-2 text-xs"
      ></div>


      <!-- TEMPORARY PHOTO PREVIEW -->
      <div
        id="photoPreviewBox"
        class="hidden mb-2"
      >

        <div
          class="relative inline-block rounded-2xl border border-gray-200 bg-gray-50 p-1"
        >

          <img
            id="photoPreview"
            class="w-24 h-24 object-cover rounded-xl"
            alt="Selected photo"
          >

          <button
            onclick="removeSelectedPhoto()"
            class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[10px]"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>

      </div>


      <!-- COMPOSER -->
      <div
        class="bg-[#f7f7f8] border border-[#d9d9e3] rounded-3xl shadow-sm"
      >

        <div class="flex items-end gap-2 p-2">

          <button
            onclick="document.getElementById('photoInput').click()"
            class="shrink-0 w-10 h-10 rounded-full hover:bg-gray-200 flex items-center justify-center text-gray-600 transition"
            title="Add photo"
          >
            <i class="fa-solid fa-paperclip"></i>
          </button>

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhoto(this)"
          >

          <textarea
            id="msg"
            rows="1"
            maxlength="8000"
            placeholder="Message SomaHub AI..."
            class="flex-1 bg-transparent border-0 outline-none focus:ring-0 text-[14px] leading-6 py-2 px-1 min-h-[40px] max-h-[140px]"
          ></textarea>

          <button
            id="sendBtn"
            onclick="sendMsg()"
            class="shrink-0 w-10 h-10 rounded-full bg-black text-white flex items-center justify-center hover:opacity-80 transition disabled:opacity-40"
          >
            <i class="fa-solid fa-arrow-up"></i>
          </button>

        </div>

        <div class="px-4 pb-2 flex items-center justify-between">

          <p class="text-[9px] text-gray-400">
            SomaHub AI can make mistakes. Check important answers.
          </p>

          <p
            id="photoStatus"
            class="text-[9px] text-gray-400 hidden"
          >
            Photo attached
          </p>

        </div>

      </div>

    </div>

  </footer>

</div>


<script>

const PROXY = "/api/gemini";

let shke = "SHKE";
let grade = "Grade 7";

let uploadedPhoto = "";
let uploadedMimeType = "image/jpeg";

let isThinking = false;

const chat = document.getElementById("chat");
const messages = document.getElementById("messages");
const msg = document.getElementById("msg");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");


/* ================================
   QUICK PROMPT
================================ */

function quickPrompt(text) {

  msg.value = text;

  autoResize();

  msg.focus();

}


/* ================================
   ERROR
================================ */

function showError(message) {

  const box =
    document.getElementById("errorBox");

  box.textContent = message;

  box.classList.remove("hidden");

  setTimeout(() => {

    box.classList.add("hidden");

  }, 7000);

}


/* ================================
   PHOTO
================================ */

function handlePhoto(input) {

  const file =
    input.files && input.files[0];

  if (!file) return;


  if (!file.type.startsWith("image/")) {

    showError(
      "Please select an image."
    );

    return;
  }


  const url =
    URL.createObjectURL(file);

  const img =
    new Image();


  img.onload = () => {

    try {

      let width = img.width;
      let height = img.height;

      const max = 1200;


      if (
        width > max ||
        height > max
      ) {

        const ratio =
          Math.min(
            max / width,
            max / height
          );

        width =
          Math.round(
            width * ratio
          );

        height =
          Math.round(
            height * ratio
          );

      }


      const canvas =
        document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;


      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      uploadedMimeType =
        "image/jpeg";


      uploadedPhoto =
        canvas.toDataURL(
          "image/jpeg",
          0.70
        );


      document
        .getElementById("photoPreview")
        .src =
        uploadedPhoto;


      document
        .getElementById("photoPreviewBox")
        .classList
        .remove("hidden");


      document
        .getElementById("photoStatus")
        .classList
        .remove("hidden");


      URL.revokeObjectURL(url);

      scrollToBottom();

    } catch (error) {

      URL.revokeObjectURL(url);

      showError(
        "Could not prepare the photo."
      );

    }

  };


  img.onerror = () => {

    URL.revokeObjectURL(url);

    showError(
      "The photo could not be opened."
    );

  };


  img.src = url;

  input.value = "";

}


/* ================================
   REMOVE COMPOSER PHOTO
================================ */

function removeSelectedPhoto() {

  uploadedPhoto = "";

  uploadedMimeType =
    "image/jpeg";


  document
    .getElementById("photoPreviewBox")
    .classList
    .add("hidden");


  document
    .getElementById("photoStatus")
    .classList
    .add("hidden");

}


/* ================================
   USER TEXT
================================ */

function addUserText(text) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "flex justify-end mb-5 message-in";


  const bubble =
    document.createElement("div");

  bubble.className =
    "max-w-[85%] sm:max-w-[75%] bg-black text-white rounded-3xl rounded-br-lg px-4 py-3";


  const p =
    document.createElement("p");

  p.className =
    "text-[14px] leading-6 whitespace-pre-wrap";

  p.textContent =
    text;


  bubble.appendChild(p);

  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

}


/* ================================
   USER PHOTO

   PHOTO REMAINS IN CHAT
================================ */

function addUserPhoto(photo) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "flex justify-end mb-5 message-in";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bg-black rounded-3xl rounded-br-lg p-2 max-w-[88%] sm:max-w-[70%]";


  const image =
    document.createElement("img");

  image.src =
    photo;

  image.alt =
    "Question uploaded by learner";

  image.className =
    "photo-message rounded-2xl block";


  bubble.appendChild(image);

  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

}


/* ================================
   THINKING
================================ */

function addThinking() {

  const wrapper =
    document.createElement("div");

  wrapper.id =
    "thinking";

  wrapper.className =
    "flex justify-start mb-5 message-in";


  wrapper.innerHTML = `
    <div class="flex items-start gap-3 max-w-[90%]">

      <div class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center shrink-0">
        <i class="fa-solid fa-graduation-cap text-[12px]"></i>
      </div>

      <div class="bg-white border border-[#e5e5e5] rounded-3xl rounded-tl-lg px-4 py-3 shadow-sm">

        <div class="flex items-center gap-1.5">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>

      </div>

    </div>
  `;


  messages.appendChild(wrapper);

  scrollToBottom();

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ================================
   FORMAT AI RESPONSE

   Supports:
   **bold**
   ==highlight==
   headings
   bullets
   numbered steps
================================ */

function formatAIResponse(raw) {

  let text =
    escapeHTML(raw);


  /* Highlight ==text== */

  text =
    text.replace(
      /==(.*?)==/g,
      '<span class="highlight">$1</span>'
    );


  /* Bold **text** */

  text =
    text.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  /* Headings */

  text =
    text.replace(
      /^### (.*?)$/gm,
      '<div class="section-title">$1</div>'
    );

  text =
    text.replace(
      /^## (.*?)$/gm,
      '<div class="section-title">$1</div>'
    );

  text =
    text.replace(
      /^# (.*?)$/gm,
      '<div class="section-title">$1</div>'
    );


  /* Final answer box */

  text =
    text.replace(
      /FINAL ANSWER:\s*(.*)/gi,
      '<div class="answer-box"><strong>🟨 Final Answer</strong><br>$1</div>'
    );


  /* Key point box */

  text =
    text.replace(
      /KEY POINT:\s*(.*)/gi,
      '<div class="key-box"><strong>⭐ Key Point</strong><br>$1</div>'
    );


  /* Correct choice */

  text =
    text.replace(
      /CORRECT CHOICE:\s*(.*)/gi,
      '<div class="answer-box"><strong>✅ Correct Choice</strong><br>$1</div>'
    );


  /* Wrong choice */

  text =
    text.replace(
      /WRONG CHOICE:\s*(.*)/gi,
      '<div class="wrong-box"><strong>❌</strong> $1</div>'
    );


  /* Choice lines */

  text =
    text.replace(
      /^(A\)|B\)|C\)|D\))\s*(.*)$/gm,
      '<div class="choice-box"><strong>$1</strong> $2</div>'
    );


  /* Bullet lists */

  text =
    text.replace(
      /^[-•]\s+(.*)$/gm,
      '<li>$1</li>'
    );


  /* Numbered lines */

  text =
    text.replace(
      /^(\d+)\.\s+(.*)$/gm,
      '<div class="numbered"><strong>$1.</strong> $2</div>'
    );


  /* Line breaks */

  text =
    text.replace(
      /\n/g,
      "<br>"
    );


  return text;

}


/* ================================
   AI MESSAGE
================================ */

function addAIMessage(text) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "flex justify-start mb-7 message-in";


  const row =
    document.createElement("div");

  row.className =
    "flex items-start gap-3 max-w-[94%]";


  const icon =
    document.createElement("div");

  icon.className =
    "w-8 h-8 rounded-full bg-black text-white flex items-center justify-center shrink-0 mt-1";


  icon.innerHTML =
    '<i class="fa-solid fa-graduation-cap text-[12px]"></i>';


  const area =
    document.createElement("div");

  area.className =
    "min-w-0";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bg-white border border-[#e5e5e5] rounded-3xl rounded-tl-lg px-4 py-3 shadow-sm";


  const content =
    document.createElement("div");

  content.className =
    "ai-response";


  content.innerHTML =
    formatAIResponse(text);


  bubble.appendChild(content);


  /* Copy */

  const actions =
    document.createElement("div");

  actions.className =
    "mt-2 flex items-center gap-2";


  const copyBtn =
    document.createElement("button");

  copyBtn.className =
    "text-[10px] text-gray-500 hover:text-black px-2 py-1";


  copyBtn.innerHTML =
    '<i class="fa-regular fa-copy mr-1"></i>Copy';


  copyBtn.onclick =
    async () => {

      try {

        await navigator.clipboard
          .writeText(text);


        copyBtn.innerHTML =
          '<i class="fa-solid fa-check mr-1"></i>Copied';


        setTimeout(() => {

          copyBtn.innerHTML =
            '<i class="fa-regular fa-copy mr-1"></i>Copy';

        }, 2000);


      } catch {

        showError(
          "Copy is not available."
        );

      }

    };


  actions.appendChild(copyBtn);


  area.appendChild(bubble);

  area.appendChild(actions);


  row.appendChild(icon);

  row.appendChild(area);

  wrapper.appendChild(row);

  messages.appendChild(wrapper);

}


/* ================================
   SEND
================================ */

async function sendMsg() {

  if (isThinking) return;


  const text =
    msg.value.trim();


  const hasPhoto =
    Boolean(uploadedPhoto);


  if (!text && !hasPhoto) return;


  welcome.classList.add("hidden");


  const photoToSend =
    uploadedPhoto;


  const mimeToSend =
    uploadedMimeType;


  if (text) {

    addUserText(text);

  }


  /*
   * PHOTO IS ADDED TO CHAT AND
   * WILL NOT DISAPPEAR.
   */

  if (photoToSend) {

    addUserPhoto(
      photoToSend
    );

  }


  msg.value = "";

  autoResize();


  /*
   * Remove only temporary
   * composer preview.
   */

  removeSelectedPhoto();


  scrollToBottom();


  isThinking = true;

  sendBtn.disabled = true;

  sendBtn.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i>';


  addThinking();


  try {

    let base64 = "";


    if (photoToSend) {

      if (
        photoToSend.includes(",")
      ) {

        base64 =
          photoToSend.split(",")[1];

      } else {

        base64 =
          photoToSend;

      }

    }


    if (
      base64.length >
      2500000
    ) {

      throw new Error(
        "Photo is too large. Please take a clearer photo closer to the paper."
      );

    }


    const question =
      text ||
      "Read the question in the photo, identify the subject and topic, explain the concept, solve it step by step, and explain all answer choices if they are provided.";


    const response =
      await fetch(
        PROXY,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              question:
                question,

              grade:
                grade,

              shke:
                shke,

              photo:
                base64,

              mimeType:
                mimeToSend

            })

        }
      );


    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch {

      data = {
        answer: raw
      };

    }


    document
      .getElementById("thinking")
      ?.remove();


    if (!response.ok) {

      throw new Error(
        data?.answer ||
        data?.error ||
        `Server error (${response.status})`
      );

    }


    let answer =
      String(
        data?.answer ||
        "I couldn't generate an answer."
      )
      .trim();


    if (!answer) {

      answer =
        "I couldn't generate an answer. Please try again.";

    }


    addAIMessage(
      answer.slice(
        0,
        10000
      )
    );


  } catch (error) {

    document
      .getElementById("thinking")
      ?.remove();


    addAIMessage(
      "I couldn't complete the request.\n\n" +
      "**Error:** " +
      error.message
    );


    showError(
      error.message
    );

  }


  isThinking = false;

  sendBtn.disabled = false;

  sendBtn.innerHTML =
    '<i class="fa-solid fa-arrow-up"></i>';


  scrollToBottom();

}


/* ================================
   ENTER TO SEND
================================ */

msg.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMsg();

    }

  }
);


/* ================================
   AUTO RESIZE
================================ */

msg.addEventListener(
  "input",
  autoResize
);


function autoResize() {

  msg.style.height =
    "auto";

  msg.style.height =
    Math.min(
      msg.scrollHeight,
      140
    ) + "px";

}


/* ================================
   SCROLL
================================ */

function scrollToBottom() {

  setTimeout(() => {

    chat.scrollTo({
      top:
        chat.scrollHeight,
      behavior:
        "smooth"
    });

  }, 50);

}

</script>

</body>
</html>
