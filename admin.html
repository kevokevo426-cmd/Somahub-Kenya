<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SomaHub SUPER ADMIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, collection, getDocs, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",
  authDomain: "somahubkenya-9e458.firebaseapp.com",
  projectId: "somahubkenya-9e458",
  storageBucket: "somahubkenya-9e458.firebasestorage.app",
  messagingSenderId: "615579085715",
  appId: "1:615579085715:web:28fca37ba498324bb49666"
};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
const provider=new GoogleAuthProvider();
window.FB={auth,db,provider,signInWithPopup,signInWithEmailAndPassword,onAuthStateChanged,signOut,collection,getDocs,doc,updateDoc,deleteDoc,addDoc,serverTimestamp};
</script>
</head>
<body class="bg-gray-100">
<header class="bg-black text-white p-4 flex justify-between"><h1 class="font-bold">👑 SUPER ADMIN - Till 0701305109</h1><button id="logoutBtn" class="hidden bg-white text-black px-3 py-1 rounded text-sm">Logout</button></header>

<div id="loginBox" class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-2xl shadow text-center">
<h2 class="font-bold text-xl">Admin Login</h2><p class="text-sm text-gray-500">Only kevokevo426@gmail.com</p>
<button id="gLogin" class="w-full border py-2 rounded-full mt-4 font-bold">Login with Google</button>
<input id="email" placeholder="Email" class="w-full border p-2 rounded mt-4">
<input id="pass" type="password" placeholder="Password" class="w-full border p-2 rounded mt-2">
<button id="eLogin" class="w-full bg-black text-white py-2 rounded mt-2">Login</button>
<p id="err" class="text-red-600 text-xs mt-2"></p>
</div>

<div id="main" class="hidden max-w-7xl mx-auto p-4">
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">Total Users</p><p id="sUsers" class="text-2xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">Pending</p><p id="sPend" class="text-2xl font-bold text-orange-600">0</p></div>
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">Premium</p><p id="sPrem" class="text-2xl font-bold text-green-600">0</p></div>
<div class="bg-white p-4 rounded-xl shadow"><p class="text-xs">Earnings</p><p id="sCash" class="text-2xl font-bold">0 KES</p></div>
</div>
<div class="bg-white rounded-xl shadow p-4 mb-6 overflow-auto">
<h3 class="font-bold mb-3">💰 Users - Approve/Reject - Till 0701305109</h3>
<table class="w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-2 text-left">Email</th><th>M-Pesa Code</th><th>Status</th><th>Action</th></tr></thead><tbody id="usersTable"></tbody></table>
</div>
<div class="grid md:grid-cols-2 gap-4">
<div class="bg-white p-4 rounded-xl shadow">
<h3 class="font-bold mb-3">➕ Add Resource</h3>
<select id="g" class="border p-2 rounded w-full mb-2"><option>PP1</option><option>PP2</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option></select>
<select id="sub" class="border p-2 rounded w-full mb-2"><option>Mathematics</option><option>English</option><option>Kiswahili</option><option>Science</option><option>SST</option><option>CRE</option><option>Agriculture</option></select>
<select id="type" class="border p-2 rounded w-full mb-2"><option>Notes</option><option>Exam</option><option>Scheme</option><option>Lesson Plan</option><option>Video</option></select>
<input id="title" placeholder="Title e.g Grade 5 Math Notes" class="w-full border p-2 rounded mb-2">
<input id="link" placeholder="Drive/YouTube Link" class="w-full border p-2 rounded mb-2">
<button onclick="addRes()" class="bg-black text-white w-full py-2 rounded">Add Now</button>
</div>
<div class="bg-white p-4 rounded-xl shadow"><h3 class="font-bold mb-3">📚 Resources</h3><div id="resList" class="space-y-2 max-h-96 overflow-auto"></div></div>
</div>
</div>
<script>
setTimeout(()=>{
const FB=window.FB;
document.getElementById('gLogin').onclick=async()=>{try{await FB.signInWithPopup(FB.auth,FB.provider)}catch(e){document.getElementById('err').innerText=e.message}};
document.getElementById('eLogin').onclick=async()=>{const em=document.getElementById('email').value, ps=document.getElementById('pass').value; try{await FB.signInWithEmailAndPassword(FB.auth,em,ps)}catch(e){document.getElementById('err').innerText=e.message}};
document.getElementById('logoutBtn').onclick=()=>FB.signOut(FB.auth);
FB.onAuthStateChanged(FB.auth, async(u)=>{
if(!u || u.email!=='kevokevo426@gmail.com'){document.getElementById('loginBox').classList.remove('hidden'); document.getElementById('main').classList.add('hidden'); document.getElementById('logoutBtn').classList.add('hidden'); return;}
document.getElementById('loginBox').classList.add('hidden'); document.getElementById('main').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden'); load();
});
},600);
async function load(){const FB=window.FB; const snap=await FB.getDocs(FB.collection(FB.db,"users")); let p=0,pr=0; const tb=document.getElementById('usersTable'); tb.innerHTML="";
snap.forEach(d=>{const u=d.data(); const id=d.id; if(u.mpesaCode && u.status!=='approved') p++; if(u.isPremium) pr++;
tb.innerHTML+=`<tr class="border-b"><td class="p-2 text-xs">${u.email}</td><td class="text-xs font-bold">${u.mpesaCode||'-'}</td><td><span class="text-xs px-2 py-1 rounded ${u.status==='approved'?'bg-green-100':'bg-orange-100'}">${u.status}</span> ${u.isPremium?'<span class="bg-green-600 text-white px-1 rounded text-[10px]">PREM</span>':''}</td><td class="flex gap-1 p-1"><button onclick="act('${id}',true)" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Approve</button><button onclick="act('${id}',false)" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Reject</button><button onclick="prem('${id}')" class="bg-black text-white px-2 py-1 rounded text-xs">Premium</button></td></tr>`;});
document.getElementById('sUsers').innerText=snap.size; document.getElementById('sPend').innerText=p; document.getElementById('sPrem').innerText=pr; document.getElementById('sCash').innerText=(pr*500)+" KES";
const rs=await FB.getDocs(FB.collection(FB.db,"resources")); const rl=document.getElementById('resList'); rl.innerHTML=""; rs.forEach(d=>{const r=d.data(); rl.innerHTML+=`<div class="flex justify-between text-xs bg-gray-50 p-2 rounded"><span>${r.grade} | ${r.title}</span><button onclick="delRes('${d.id}')" class="text-red-600">Del</button></div>`;});
}
window.act=async(id,isApp)=>{const FB=window.FB; await FB.updateDoc(FB.doc(FB.db,"users",id),{status:isApp?"approved":"rejected", isPremium:isApp}); load();};
window.prem=async(id)=>{const FB=window.FB; await FB.updateDoc(FB.doc(FB.db,"users",id),{isPremium:true,status:"approved"}); load();};
window.addRes=async()=>{const FB=window.FB; const data={grade:document.getElementById('g').value, subject:document.getElementById('sub').value, type:document.getElementById('type').value, title:document.getElementById('title').value, link:document.getElementById('link').value, createdAt:FB.serverTimestamp()}; if(!data.title||!data.link) return alert("Fill title/link"); await FB.addDoc(FB.collection(FB.db,"resources"),data); alert("Added!"); load();};
window.delRes=async(id)=>{const FB=window.FB; await FB.deleteDoc(FB.doc(FB.db,"resources",id)); load();};
</script>
</body>
</html>
