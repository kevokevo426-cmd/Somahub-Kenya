<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SomaHub - MASTER ADMIN SECURE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, updateDoc, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",
  authDomain: "somahubkenya-9e458.firebaseapp.com",
  projectId: "somahubkenya-9e458",
  storageBucket: "somahubkenya-9e458.firebasestorage.app",
  messagingSenderId: "615579085715",
  appId: "1:615579085715:web:28fca37ba498324bb49666"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.FB = {auth,db,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,doc,getDoc,setDoc,collection,getDocs,query,orderBy,updateDoc,deleteDoc,addDoc,serverTimestamp};
</script>
</head>
<body class="bg-gray-50">
<div id="loginDiv" class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full">
<h1 class="text-2xl font-black">🛠️ MASTER ADMIN SECURE</h1>
<div id="errorBox" class="hidden mt-3 bg-red-50 border p-3 rounded-xl text-xs text-red-700"></div>
<input id="email" placeholder="Admin Email" value="admin@somahub.co.ke" class="w-full border p-3 rounded-xl mt-4 text-sm">
<input id="pass" type="password" placeholder="Password" class="w-full border p-3 rounded-xl mt-2 text-sm">
<button id="loginBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold mt-4">Login</button>
<button id="createBtn" class="w-full bg-green-600 text-white py-2 rounded-xl text-xs mt-2">Create Admin First Time Only</button>
</div>
</div>
<div id="adminDiv" class="hidden">
<header class="bg-black text-white p-4 flex justify-between"><h1 class="font-black">MASTER ADMIN ✅ Secure Rules</h1><button id="logout" class="bg-red-600 px-4 py-1 rounded-full text-xs">Logout</button></header>
<!-- YOUR REST OF ADMIN UI HERE - keep your grids/tables -->
</div>
<script>
setTimeout(()=>{
const FB=window.FB;
function showErr(m){const b=document.getElementById('errorBox'); b.classList.remove('hidden'); b.innerText=m;}
document.getElementById('createBtn').onclick=async()=>{
 try{
  const e=document.getElementById('email').value, p=document.getElementById('pass').value;
  const cred=await FB.createUserWithEmailAndPassword(FB.auth,e,p);
  await FB.setDoc(FB.doc(FB.db,"users",cred.user.uid),{email:e, role:"admin", isPremium:true, status:"active", createdAt:FB.serverTimestamp()});
  showErr("✅ Created! Now Login");
 }catch(err){showErr(err.message)}
};
document.getElementById('loginBtn').onclick=async()=>{
 try{
  const e=document.getElementById('email').value, p=document.getElementById('pass').value;
  await FB.signInWithEmailAndPassword(FB.auth,e,p);
 }catch(err){showErr(err.message)}
};
document.getElementById('logout').onclick=()=>FB.signOut(FB.auth);
FB.onAuthStateChanged(FB.auth,(u)=>{
 if(u){document.getElementById('loginDiv').classList.add('hidden'); document.getElementById('adminDiv').classList.remove('hidden');}
 else{document.getElementById('loginDiv').classList.remove('hidden'); document.getElementById('adminDiv').classList.add('hidden');}
});
// keep your loadUsers, addResource functions here
},800);
</script>
</body>
</html>
