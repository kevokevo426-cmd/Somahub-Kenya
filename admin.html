<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - SomaHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Nunito',sans-serif;background:#f6f6f7}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); const auth=getAuth(app); const db=getFirestore(app);
window.FB={auth,db,doc,getDoc,updateDoc,collection,getDocs,query,where,orderBy,serverTimestamp,onAuthStateChanged};
</script>
</head>
<body class="flex justify-center"><div class="w-full max-w-[600px] bg-[#f6f6f7] min-h-screen pb-10">
<div class="h-2 flex"><div class="flex-1 bg-[#ff8a2a]"></div><div class="flex-1 bg-[#2ac5a0]"></div><div class="flex-1 bg-[#4a86ff]"></div><div class="flex-1 bg-[#ffcc1a]"></div></div>
<div class="bg-black text-white p-3 flex justify-between items-center sticky top-0 z-50 border-b-2 border-black"><p class="font-black text-[13px]">🛡️ Super Admin - SomaHub</p><span class="bg-[#ffcc1a] text-black px-2 py-1 rounded-full text-[8px] font-black">ADMIN ONLY</span></div>

<div class="p-3 space-y-3">
<div class="bg-white border-2 border-black rounded-xl p-2 flex gap-2 overflow-x-auto">
<button onclick="showTab('tuition')" id="tabTuition" class="bg-black text-white px-4 py-2 rounded-full font-black text-[10px] whitespace-nowrap">🏠 Tuition - Student+Parent+Teacher</button>
<button onclick="showTab('pending')" id="tabPending" class="bg-white border-2 border-black px-4 py-2 rounded-full font-black text-[10px] whitespace-nowrap">⏳ Pending Requests</button>
<button onclick="showTab('approved')" id="tabApproved" class="bg-white border-2 border-black px-4 py-2 rounded-full font-black text-[10px] whitespace-nowrap">✅ Approved</button>
<button onclick="showTab('teachers')" id="tabTeachers" class="bg-white border-2 border-black px-4 py-2 rounded-full font-black text-[10px] whitespace-nowrap">👩‍🏫 Teachers List</button>
</div>

<div id="tuitionBox" class="space-y-2 max-h-[800px] overflow-y-auto">Loading tuition - Teacher ↔ Learner Schooling...</div>
<div id="pendingBox" class="hidden space-y-2"></div>
<div id="approvedBox" class="hidden space-y-2"></div>
<div id="teachersBox" class="hidden space-y-2"></div>

<div class="bg-white border-2 border-black rounded-xl p-3">
<p class="font-black text-[11px]">Assign Teacher to Tuition - Enter IDs</p>
<div class="mt-2 grid grid-cols-2 gap-2">
<input id="assignDocId" placeholder="Doc ID of request" class="bg-[#f6f6f7] border-2 border-black rounded-full px-3 py-2 text-[10px] font-bold">
<input id="assignTeacherId" placeholder="Teacher UserId (from users)" class="bg-[#f6f6f7] border-2 border-black rounded-full px-3 py-2 text-[10px] font-bold">
<input id="assignTeacherName" placeholder="Teacher Name e.g Mr Kamau" class="bg-[#f6f6f7] border-2 border-black rounded-full px-3 py-2 text-[10px] font-bold col-span-2">
</div>
<button onclick="assignTeacher()" class="w-full mt-2 bg-[#4a86ff] text-white border-2 border-black rounded-full py-2.5 font-black text-[10px]">✅ Approve + Assign Teacher - Student+Parent+Teacher Connected via SHKE</button>
<p id="assignMsg" class="text-[9px] mt-2 font-bold text-green-600"></p>
</div>
</div>
</div>
<script>
let allRequests=[], teachersMap={};
function showTab(t){
 document.getElementById('tuitionBox').classList.toggle('hidden', t!=='tuition');
 document.getElementById('pendingBox').classList.toggle('hidden', t!=='pending');
 document.getElementById('approvedBox').classList.toggle('hidden', t!=='approved');
 document.getElementById('teachersBox').classList.toggle('hidden', t!=='teachers');
 ['tabTuition','tabPending','tabApproved','tabTeachers'].forEach(id=>{ document.getElementById(id).className=id==='tab'+t.charAt(0).toUpperCase()+t.slice(1)? "bg-black text-white px-4 py-2 rounded-full font-black text-[10px] whitespace-nowrap" : "bg-white border-2 border-black px-4 py-2 rounded-full font-black text-[10px] whitespace-nowrap"; });
}
async function loadTeachers(){
 let FB=window.FB; try{ let q=FB.query(FB.collection(FB.db,"users"), FB.where("role","==","teacher")); let snap=await FB.getDocs(q); let box=document.getElementById('teachersBox'); box.innerHTML=""; snap.forEach(d=>{ let t=d.data(); teachersMap[d.id]=t; box.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-3"><p class="font-black text-[11px]">👩‍🏫 ${t.firstName||t.name||''} ${t.lastName||''} • ${t.indexNumber||d.id.slice(0,8)}</p><p class="text-[9px]">UserId: ${d.id} • Email: ${t.email||''} • Phone: ${t.phone||''}</p><p class="text-[8px] mt-1 opacity-60">Use UserId to assign tuition - Teacher ↔ Learner</p><button onclick="assignTeacherId.value='${d.id}'; assignTeacherName.value='${t.firstName||t.name||''}'; window.scrollTo(0,9999)" class="mt-2 bg-black text-white px-3 py-1 rounded-full text-[8px] font-black">Use This Teacher</button></div>`; }); }catch(e){ document.getElementById('teachersBox').innerHTML=`<p class="text-[9px]">${e.message}</p>`; }
}
async function loadTuition(){
 let FB=window.FB; let box=document.getElementById('tuitionBox'); let pendingBox=document.getElementById('pendingBox'); let approvedBox=document.getElementById('approvedBox'); box.innerHTML="Loading Teacher ↔ Learner Schooling - Student+Parent+Teacher via SHKE...";
 try{
  let q=FB.query(FB.collection(FB.db,"homeschooling_requests"), FB.orderBy("timestamp","desc"));
  let snap=await FB.getDocs(q); allRequests=[]; snap.forEach(d=>allRequests.push({id:d.id,...d.data()}));
  box.innerHTML=""; pendingBox.innerHTML=""; approvedBox.innerHTML="";
  if(allRequests.length===0){ box.innerHTML=`<div class="bg-white border-2 border-black rounded-xl p-3 text-center"><p class="font-black text-[10px]">No tuition requests yet</p><p class="text-[8px]">Parent requests from parent.html → SHKE + Subject + Parent Phone + Location + Days + Reason</p></div>`; return; }
  allRequests.forEach(r=>{
   let teacherInfo = r.teacherId? (teachersMap[r.teacherId]? `${teachersMap[r.teacherId].firstName||''} ${teachersMap[r.teacherId].email||''}` : r.teacherName||r.teacherId) : "Not assigned yet";
   let card=`<div class="bg-white border-2 border-black rounded-xl p-3 shadow-[2px_2px_0_0_#000]">
   <div class="flex justify-between items-start"><div><p class="font-black text-[11px]">🔗 SHKE ${r.shke} • ${r.childName||''} • ${r.grade||''} • ${r.subject||''}</p><p class="text-[8px] opacity-60">DocId: ${r.id} • UserId: ${r.userId||''} • SHKE ${r.shke} - Student+Parent+Teacher connected</p></div><span class="${r.status==='approved'?'bg-green-500':'bg-yellow-400 text-black'} text-white px-2 py-0.5 rounded-full text-[7px] font-black">${r.status?.toUpperCase()}</span></div>
   <div class="mt-2 bg-[#f6f6f7] border border-black rounded-xl p-2 text-[9px] leading-4"><p><b>Student:</b> ${r.childName||''} SHKE ${r.shke} Grade ${r.grade||''} UserId ${r.userId||''}</p><p><b>Parent Phone:</b> ${r.parentPhone||''} • <b>Location:</b> ${r.location||''} • <b>Days:</b> ${r.days||''}</p><p><b>Subject:</b> ${r.subject||''} • <b>Reason:</b> ${r.reason||''}</p><p class="mt-1"><b>Teacher Assigned:</b> ${teacherInfo} • ID ${r.teacherId||''} • Name ${r.teacherName||''}</p></div>
   <div class="mt-2 flex gap-2"><button onclick="assignDocId.value='${r.id}'; window.scrollTo(0,9999)" class="flex-1 bg-black text-white rounded-full py-2 text-[8px] font-black">📌 Select to Assign Teacher</button><button onclick="approveOnly('${r.id}')" class="flex-1 bg-[#ffcc1a] text-black border-2 border-black rounded-full py-2 text-[8px] font-black">✅ Approve Only (No Teacher Yet)</button></div>
   <p class="text-[7px] mt-2 opacity-60">Teacher ↔ Learner Schooling - Seen in Super Admin Student+Parent+Teacher via SHKE ${r.shke} - Student NO contact, Teacher HAS parent phone, Admin manages all</p>
   </div>`;
   box.innerHTML+=card;
   if(r.status==='pending') pendingBox.innerHTML+=card;
   if(r.status==='approved') approvedBox.innerHTML+=card;
  });
  if(!pendingBox.innerHTML) pendingBox.innerHTML=`<p class="bg-white border-2 border-black rounded-xl p-3 text-[9px] text-center">No pending</p>`;
  if(!approvedBox.innerHTML) approvedBox.innerHTML=`<p class="bg-white border-2 border-black rounded-xl p-3 text-[9px] text-center">No approved yet</p>`;
 }catch(e){ box.innerHTML=`<p class="bg-[#ffeaea] border-2 border-black rounded-xl p-3 text-[9px]">${e.message}<br>Create index: homeschooling_requests timestamp DESC</p>`; }
}
async function approveOnly(docId){ let FB=window.FB; try{ await FB.updateDoc(FB.doc(FB.db,"homeschooling_requests", docId), {status:'approved', approvedAt:FB.serverTimestamp()}); document.getElementById('assignMsg').innerText=`✅ Approved ${docId} - Now assign teacher`; loadTuition(); }catch(e){ alert(e.message); } }
async function assignTeacher(){
 let FB=window.FB; let docId=document.getElementById('assignDocId').value.trim(); let tId=document.getElementById('assignTeacherId').value.trim(); let tName=document.getElementById('assignTeacherName').value.trim(); if(!docId||!tId) return alert("Enter Doc ID + Teacher UserId");
 try{
  let tDoc=await FB.getDoc(FB.doc(FB.db,"users", tId)); let tEmail=tDoc.exists()? (tDoc.data().email||'') : '';
  await FB.updateDoc(FB.doc(FB.db,"homeschooling_requests", docId), {status:'approved', teacherId:tId, teacherName:tName, teacherEmail:tEmail, approvedAt:FB.serverTimestamp(), assignedBy:'admin', type:'home_tuition'});
  document.getElementById('assignMsg').innerText=`✅ Assigned Teacher ${tName} (${tId}) to SHKE request ${docId} - Teacher ↔ Learner Schooling Student+Parent+Teacher connected via SHKE - Student sees NO phone, Teacher sees parent phone, Admin sees all`;
  loadTuition();
 }catch(e){ alert(e.message); }
}
setTimeout(()=>{ let FB=window.FB; FB.onAuthStateChanged(FB.auth, async(u)=>{ if(!u) return; loadTeachers().then(()=>loadTuition()); }); },700);
</script>
</body></html>
