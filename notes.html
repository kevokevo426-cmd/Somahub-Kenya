<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes - PP1 to G9 - KICD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:'Nunito',sans-serif;background:#f6f6f7}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),doc,getDoc,collection,getDocs,query,where,onAuthStateChanged};
</script>
</head>
<body class="flex justify-center"><div class="w-full max-w-[460px] bg-[#f6f6f7] min-h-screen pb-10">
<div class="h-2 flex"><div class="flex-1 bg-[#ff8a2a]"></div><div class="flex-1 bg-[#2ac5a0]"></div><div class="flex-1 bg-[#4a86ff]"></div><div class="flex-1 bg-[#ffcc1a]"></div></div>
<div class="bg-white border-b-2 border-black p-3 flex justify-between items-center sticky top-0 z-40">
<a href="student.html" class="bg-black text-white px-4 py-2 rounded-full font-black text-[11px]">← Back</a>
<p class="font-black text-[13px]">📚 Notes - KICD</p>
<span id="indexB" class="bg-blue-600 text-white px-2 py-1 rounded-full text-[9px] font-black">SHKE...</span>
</div>
<div class="p-3 space-y-3">
<div class="flex gap-2 overflow-x-auto">
<a href="ict.html" class="bg-[#4a86ff] text-white px-4 py-2 rounded-full text-[10px] font-black border-2 border-black whitespace-nowrap">💻 ICT & Coding Page →</a>
<a href="foreign-language.html" class="bg-pink-500 text-white px-4 py-2 rounded-full text-[10px] font-black border-2 border-black whitespace-nowrap">🌐 Foreign Language Page →</a>
</div>
<div class="bg-white rounded-xl p-3 border-2 border-black shadow-[2px_2px_0_0_#000] space-y-2">
<input id="searchIn" placeholder="Search notes... e.g. Photosynthesis, ICT, French" class="w-full bg-[#f6f6f7] border-2 border-black rounded-full p-3 text-[11px] font-bold">
<div class="grid grid-cols-2 gap-2">
<select id="gradeSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>All Grades</option><option>PP1</option><option>PP2</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option selected>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option></select>
<select id="subSel" class="bg-[#f6f6f7] border-2 border-black rounded-full p-2.5 font-black text-[11px]"><option>All Subjects</option><option>Mathematics</option><option>English</option><option>Kiswahili</option><option>Science</option><option>SST</option><option>CRE</option><option>ICT & Coding</option><option>Foreign Language - French</option><option>Foreign Language - German</option><option>Foreign Language - Chinese</option></select>
</div>
<button onclick="loadNotes()" class="w-full bg-black text-white border-2 border-black rounded-full py-3 font-black text-[11px]">🔍 Search Notes - KICD + ICT + Foreign</button>
</div>
<div id="notesList" class="space-y-3"></div>
</div>
</div>
<script>
let currentSHKE="SHKE";
async function loadNotes(){let FB=window.FB,grade=gradeSel.value,sub=subSel.value,search=searchIn.value.toLowerCase(),list=document.getElementById('notesList'); list.innerHTML="<p class='text-center py-4 text-[11px]'>Loading KICD Notes...</p>"; try{let q; if(grade==="All Grades"&&sub==="All Subjects") q=FB.query(FB.collection(FB.db,"resources"),FB.where("type","==","Notes")); else if(grade==="All Grades") q=FB.query(FB.collection(FB.db,"resources"),FB.where("subject","==",sub),FB.where("type","==","Notes")); else if(sub==="All Subjects") q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("type","==","Notes")); else q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",grade),FB.where("subject","==",sub),FB.where("type","==","Notes")); let snap=await FB.getDocs(q); list.innerHTML=""; let filtered=[]; snap.forEach(d=>{let n=d.data(); if(!search|| (n.title&&n.title.toLowerCase().includes(search)) || (n.subject&&n.subject.toLowerCase().includes(search))) filtered.push({id:d.id,...n});}); if(filtered.length===0){list.innerHTML=`<div class="bg-white border-2 border-dashed border-black rounded-xl p-4 text-center"><p class="font-black text-[11px]">No Notes Yet for ${grade} ${sub}</p><p class="text-[9px] text-gray-500 mt-1">Try ICT or Foreign Language pages</p><div class="mt-3 flex gap-2 justify-center"><a href="ict.html" class="bg-[#4a86ff] text-white px-3 py-2 rounded-full text-[9px] font-black border-2 border-black">💻 ICT</a><a href="foreign-language.html" class="bg-pink-500 text-white px-3 py-2 rounded-full text-[9px] font-black border-2 border-black">🌐 Foreign</a><a href="ai.assistant.html?subject=${encodeURIComponent(sub)}&grade=${grade}" class="bg-black text-white px-3 py-2 rounded-full text-[9px] font-black">Ask AI Tutor</a></div></div>`;return;} filtered.forEach(n=>{list.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-3 shadow-[2px_2px_0_0_#000]"><div class="flex justify-between"><p class="font-black text-[12px]">${n.title||n.subject||sub}</p><span class="bg-[#e0f2ff] px-2 py-0.5 rounded-full text-[8px] font-black border border-black">${n.grade||grade}</span></div><p class="text-[10px] text-gray-600 mt-1 line-clamp-2">${n.description||n.content||'KICD aligned notes...'}</p><div class="mt-2 flex gap-2"><button class="flex-1 bg-black text-white rounded-full py-2 font-black text-[9px]">Read Notes →</button><button onclick="location.href='ai.assistant.html?q=${encodeURIComponent(n.title||sub)}'" class="bg-[#ffcc1a] border-2 border-black rounded-full px-3 py-2 font-black text-[9px]">Ask AI</button></div></div>`;});}catch(e){list.innerHTML="<p class='text-center text-[10px] text-red-500'>Error loading notes - check Firebase</p>";}}
setTimeout(()=>{let FB=window.FB; FB.onAuthStateChanged(FB.auth, async(u)=>{if(u){let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){currentSHKE=s.data().indexNumber||"SHKE"; indexB.innerText=currentSHKE; gradeSel.value=s.data().grade||"Grade 6";} loadNotes();}});},600);
document.getElementById('searchIn').addEventListener('keypress',e=>{if(e.key==='Enter') loadNotes();});
</script>
</body></html>
