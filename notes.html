<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes - SomaHub KICD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{font-family:'Nunito',sans-serif;background:#f6f6f7}.no-scrollbar::-webkit-scrollbar{display:none}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8",authDomain:"somahubkenya-9e458.firebaseapp.com",projectId:"somahubkenya-9e458",storageBucket:"somahubkenya-9e458.firebasestorage.app",messagingSenderId:"615579085715",appId:"1:615579085715:web:28fca37ba498324bb49666"};
const app=initializeApp(cfg); window.FB={auth:getAuth(app),db:getFirestore(app),doc,getDoc,collection,getDocs,query,where,onAuthStateChanged};
</script>
</head>
<body class="flex justify-center">
<div class="w-full max-w-[420px] bg-[#f6f6f7] min-h-screen pb-10">
<div class="h-2 flex"><div class="flex-1 bg-[#ff8a2a]"></div><div class="flex-1 bg-[#2ac5a0]"></div><div class="flex-1 bg-[#4a86ff]"></div><div class="flex-1 bg-[#ffcc1a]"></div></div>

<div class="bg-white border-b-2 border-black p-3 flex justify-between items-center sticky top-0 z-40">
<a href="student.html" class="bg-black text-white px-4 py-2 rounded-full font-black text-[11px]">← Home</a>
<div class="text-center"><p class="font-black text-[14px]">📚 SomaHub Notes</p><p class="text-[8px] text-gray-500 font-bold">AI from KICD Design + Schemes + FAQs</p></div>
<span id="shkeB" class="bg-[#4a86ff] text-white px-2.5 py-1 rounded-full text-[9px] font-black">SHKE...</span>
</div>

<div class="p-3 space-y-3">
<div class="bg-white rounded-[1.2rem] p-3 border-2 border-black shadow-[2px_2px_0_0_#000]">
<div class="flex gap-2">
<input id="searchIn" placeholder="🔍 Search e.g. Nouns, Photosynthesis..." class="flex-1 bg-[#f6f6f7] border-2 border-black rounded-full px-4 py-3 text-[11px] font-bold outline-none">
<button onclick="loadNotes()" class="bg-black text-white px-5 rounded-full font-black text-[11px]">Go</button>
</div>

<p class="font-black text-[10px] mt-3 mb-1">Grade:</p>
<div class="grid grid-cols-4 gap-1.5">
<button onclick="setGrade('Playgroup',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">Playgroup</button>
<button onclick="setGrade('PP1',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">PP1</button>
<button onclick="setGrade('PP2',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">PP2</button>
<button onclick="setGrade('Grade 1',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G1</button>
<button onclick="setGrade('Grade 2',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G2</button>
<button onclick="setGrade('Grade 3',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G3</button>
<button onclick="setGrade('Grade 4',this)" class="gChip bg-[#ffcc1a] py-2 rounded-full text-[9px] font-black border-2 border-black">G4</button>
<button onclick="setGrade('Grade 5',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G5</button>
<button onclick="setGrade('Grade 6',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G6</button>
<button onclick="setGrade('Grade 7',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G7</button>
<button onclick="setGrade('Grade 8',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G8</button>
<button onclick="setGrade('Grade 9',this)" class="gChip bg-white py-2 rounded-full text-[9px] font-black border-2 border-black">G9</button>
<button onclick="setGrade('Grade 10',this)" class="gChip bg-[#4a86ff] text-white py-2 rounded-full text-[9px] font-black border-2 border-black">G10</button>
</div>

<p class="font-black text-[10px] mt-3 mb-1">Learning Area:</p>
<div class="grid grid-cols-2 gap-1.5">
<button onclick="setSub('Language Activities',this)" class="sChip bg-[#fef9e7] py-2.5 rounded-full text-[9px] font-black border-2 border-black">Language Activities</button>
<button onclick="setSub('Mathematical Activities',this)" class="sChip bg-[#eaf2ff] py-2.5 rounded-full text-[9px] font-black border-2 border-black">Mathematical Activities</button>
<button onclick="setSub('Environmental Activities',this)" class="sChip bg-[#e8f5e9] py-2.5 rounded-full text-[9px] font-black border-2 border-black">Environmental Act.</button>
<button onclick="setSub('Psychomotor and Creative Activities',this)" class="sChip bg-[#fce4ec] py-2.5 rounded-full text-[9px] font-black border-2 border-black">Psychomotor & Creative</button>
<button onclick="setSub('English',this)" class="sChip bg-black text-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">English</button>
<button onclick="setSub('Kiswahili',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Kiswahili</button>
<button onclick="setSub('Mathematics',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Mathematics</button>
<button onclick="setSub('Science and Technology',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Science & Technology</button>
<button onclick="setSub('Agriculture and Nutrition',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Agric & Nutrition</button>
<button onclick="setSub('Social Studies',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Social Studies</button>
<button onclick="setSub('CRE',this)" class="sChip bg-[#fff3e0] py-2.5 rounded-full text-[9px] font-black border-2 border-black">CRE</button>
<button onclick="setSub('IRE',this)" class="sChip bg-[#e0f2f1] py-2.5 rounded-full text-[9px] font-black border-2 border-black">IRE</button>
<button onclick="setSub('HRE',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">HRE</button>
<button onclick="setSub('Creative Arts',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Creative Arts</button>
<button onclick="setSub('Pre-Technical Studies',this)" class="sChip bg-[#f3e5f5] py-2.5 rounded-full text-[9px] font-black border-2 border-black">Pre-Technical</button>
<button onclick="setSub('Computer Science',this)" class="sChip bg-[#e0f2ff] py-2.5 rounded-full text-[9px] font-black border-2 border-black">💻 ICT / Computer</button>
<button onclick="setSub('Foreign Language',this)" class="sChip bg-[#ffe8f0] py-2.5 rounded-full text-[9px] font-black border-2 border-black">🌐 Foreign Language</button>
<button onclick="setSub('Life Skills',this)" class="sChip bg-white py-2.5 rounded-full text-[9px] font-black border-2 border-black">Life Skills</button>
</div>
</div>

<div id="notesList" class="space-y-2.5"></div>
</div>
</div>

<script>
let curGrade="Grade 4", curSub="English";
function setGrade(g,el){curGrade=g; document.querySelectorAll('.gChip').forEach(b=>{b.classList.remove('bg-black','text-white'); b.classList.add('bg-white','text-black');}); el.classList.remove('bg-white','text-black'); el.classList.add('bg-black','text-white'); loadNotes();}
function setSub(s,el){curSub=s; document.querySelectorAll('.sChip').forEach(b=>{b.classList.remove('bg-black','text-white');}); el.classList.add('bg-black','text-white'); loadNotes();}
function goAI(title){let q=encodeURIComponent(`${title} ${curGrade} ${curSub} KICD notes explained`); location.href=`ai.assistant.html?q=${q}&grade=${encodeURIComponent(curGrade)}&subject=${encodeURIComponent(curSub)}`;}
function openTab(id, tab){ document.querySelectorAll(`#${id}.tab`).forEach(t=>t.classList.add('hidden')); document.getElementById(`${id}-${tab}`).classList.remove('hidden'); }

async function loadNotes(){
 let FB=window.FB, search=searchIn.value.toLowerCase(), list=document.getElementById('notesList');
 list.innerHTML=`<div class="bg-white border-2 border-black rounded-xl p-4 text-center"><p class="font-black text-[11px]">📚 Loading ${curGrade} - ${curSub}...</p></div>`;
 try{
  let q=FB.query(FB.collection(FB.db,"resources"),FB.where("grade","==",curGrade),FB.where("subject","==",curSub),FB.where("type","==","Notes"));
  let snap=await FB.getDocs(q); let filtered=[];
  snap.forEach(d=>{let n=d.data(); let txt=((n.title||'')+(n.subject||'')+(n.description||'')).toLowerCase(); if(!search||txt.includes(search)) filtered.push({id:d.id,...n});});
  if(filtered.length===0){
   list.innerHTML=`<div class="bg-[#ffcc1a] border-2 border-black rounded-xl p-2.5"><p class="font-black text-[11px]">✨ SomaHub AI Notes - ${curGrade} ${curSub}</p><p class="text-[9px]">Source: Design + Schemes + Notes + FAQs + Gemini</p></div>
   <div class="bg-white border-2 border-black rounded-xl p-4"><p class="font-black text-[11px] text-center">AI generating from KICD Foundation...</p><div class="flex gap-1.5 mt-3"><button class="flex-1 bg-white border-2 border-black rounded-full py-2 text-[9px] font-black">📥 Download</button><button class="flex-1 bg-orange-500 text-white border-2 border-black rounded-full py-2 text-[9px] font-black">▶️ Listen</button><button class="flex-1 bg-red-600 text-white border-2 border-black rounded-full py-2 text-[9px] font-black">📺 Video</button></div><button onclick="goAI('${curSub}')" class="mt-3 w-full bg-black text-white rounded-full py-3 font-black text-[11px]">🤖 Ask AI Tutor - ${curSub} →</button></div>`;
   return;
  }
  list.innerHTML=`<div class="bg-[#ffcc1a] border-2 border-black rounded-xl p-2.5"><p class="font-black text-[11px]">✨ ${filtered.length} SomaHub Notes • ${curGrade} • ${curSub}</p></div>`;
  filtered.forEach(n=>{
   const originalBlob=n.originalBlobUrl||n.fileUrl||'#'; const somaBlob=n.somaHubBlobUrl||'#'; const diagram=n.diagramUrl||''; const audio=n.audioUrl||''; const video=n.videoUrl||'#';
   list.innerHTML+=`<div class="bg-white border-2 border-black rounded-xl p-3 shadow-[2px_2px_0_0_#000]">
   <p class="font-black text-[12px]">${n.title}</p><p class="text-[9px] text-gray-500 mt-1">${n.grade} • ${n.subject} - Learning Area</p>
   <p class="text-[10px] text-gray-600 mt-1 line-clamp-2">${n.description||''}</p>
   <div class="mt-3 flex gap-2"><button onclick="document.getElementById('d-${n.id}').classList.toggle('hidden')" class="flex-1 bg-black text-white rounded-full py-2.5 font-black text-[10px]">📖 Read SomaHub Notes</button><button onclick="goAI('${(n.title||'').replace(/'/g,'')}')" class="bg-[#4a86ff] text-white border-2 border-black rounded-full px-4 py-2.5 font-black text-[10px]">🤖 Ask AI</button></div>
   <div id="d-${n.id}" class="hidden mt-3">
     <!-- TABS: Download / Listen / Video - WELL ORGANIZED AS BEFORE -->
     <div class="flex gap-1.5 mb-2">
       <button onclick="openTab('d-${n.id}','download')" class="flex-1 bg-black text-white border-2 border-black rounded-full py-2 font-black text-[9px]">📥 Download</button>
       <button onclick="openTab('d-${n.id}','listen')" class="flex-1 bg-orange-500 text-white border-2 border-black rounded-full py-2 font-black text-[9px]">▶️ Listen</button>
       <button onclick="openTab('d-${n.id}','video')" class="flex-1 bg-red-600 text-white border-2 border-black rounded-full py-2 font-black text-[9px]">📺 Video</button>
     </div>
     <div id="d-${n.id}-download" class="tab bg-[#f6f6f7] border-2 border-black rounded-xl p-2.5 space-y-2">
       <div class="flex gap-1.5"><a href="${originalBlob}" target="_blank" class="flex-1 bg-white border-2 border-black rounded-full py-2.5 text-center font-black text-[9px]">📄 Original PDF</a><a href="${somaBlob}" target="_blank" class="flex-1 bg-[#0ea5e9] text-white border-2 border-black rounded-full py-2.5 text-center font-black text-[9px]">✨ SomaHub PDF + Diagrams</a></div>
       <div class="bg-white border border-black rounded-lg p-2 text-[11px] whitespace-pre-wrap max-h-[180px] overflow-auto">${n.content||n.description||''}</div>
       ${diagram?`<img src="${diagram}" class="w-full rounded-xl border-2 border-black"/>`:''}
       <div class="bg-[#e0f2ff] border border-black rounded-lg p-2 text-[11px]"><b>✨ SomaHub Modern (International > Cambridge):</b><br/>${n.somahubContent||'Enriched from KICD Design + Schemes + FAQs - colored, audio-visual.'}</div>
     </div>
     <div id="d-${n.id}-listen" class="tab hidden bg-[#fff7ed] border-2 border-black rounded-xl p-3 text-center">
       ${audio?`<audio controls src="${audio}" class="w-full"></audio>`:`<p class="text-[10px]">🎧 Audio not yet generated - Ask AI to generate</p>`}
       <div class="flex gap-1.5 mt-2"><button class="flex-1 bg-orange-500 text-white border-2 border-black rounded-full py-2 font-black text-[9px]">▶️ Listen EN</button><button class="flex-1 bg-green-600 text-white border-2 border-black rounded-full py-2 font-black text-[9px]">▶️ Sikiliza SW</button></div>
       <p class="text-[9px] text-gray-600 mt-2">Reads SomaHub notes with expression - English + Swahili</p>
     </div>
     <div id="d-${n.id}-video" class="tab hidden bg-[#fef2f2] border-2 border-black rounded-xl p-3 text-center">
       ${video && video!=='#'?`<iframe src="${video}" class="w-full h-[180px] rounded-xl border-2 border-black"></iframe>`:`<p class="text-[10px]">📺 Video demo not yet uploaded</p>`}
       <a href="${video}" target="_blank" class="mt-2 block bg-red-600 text-white border-2 border-black rounded-full py-2 font-black text-[9px]">▶️ Watch Full Video</a>
     </div>
   </div></div>`;
  });
 }catch(e){console.error(e); list.innerHTML=`<p class="text-center text-[10px] bg-white border-2 border-black rounded-xl p-3">Error - check internet</p>`;}
}
setTimeout(()=>{let FB=window.FB; let p=new URLSearchParams(location.search); if(p.get('search')) searchIn.value=p.get('search'); FB.onAuthStateChanged(FB.auth, async(u)=>{if(u){let s=await FB.getDoc(FB.doc(FB.db,"users",u.uid)); if(s.exists()){let d=s.data(); shkeB.innerText=d.indexNumber||"SHKE"; curGrade=d.grade||"Grade 4";}} loadNotes();});},500);
searchIn.addEventListener('keypress',e=>{if(e.key==='Enter') loadNotes();});
</script>
</body></html>
