function safeTitle(r){
  let t = (r.title||"").trim();
  if(!t || t.includes("uc?export") || t.includes("drive.google.com") || t.includes("http") || t.includes("id=")) return (r.grade||"") + " " + (r.subject||"");
  return t;
}
function safeDesc(r){
  let d = (r.description||"");
  if(d.includes("uc?export") || d.includes("drive.google.com") || d.startsWith("http")) return safeTitle(r) + " - Original Design";
  return d;
}
function isJunkText(t){
  if(!t) return true;
  t = t.trim();
  if(t.length < 300) return true;
  if(t.includes("uc?export") || t.includes("drive.google.com") || t.includes("export=download") || t.includes("id=1ZV")) return true;
  if(t.split("\n").length <= 4 && t.length < 800) return true;
  return false;
}
function getBrainTextFor(r){
  if(!r) return "";
  if(r.fullText && !isJunkText(r.fullText)) return r.fullText;
  if(AI_BRAIN.length){
    let m = AI_BRAIN.find(x=>x.resourceId===r.id);
    if(m && m.text && !isJunkText(m.text)) return m.text;
    let m2 = AI_BRAIN.find(x=>safeTitle(x)===safeTitle(r) && x.grade===r.grade && (x.subject===r.subject || !x.subject));
    if(m2 && m2.text && !isJunkText(m2.text)) return m2.text;
  }
  return "";
}
async function loadResources(){
  try{ let FB=window.FB; let s=await FB.getDocs(FB.collection(FB.db,'resources')); ALL=[]; s.forEach(d=>ALL.push({id:d.id,...d.data()})); }catch(e){ ALL=[]; }
  try{
    let FB=window.FB; let b=await FB.getDocs(FB.collection(FB.db,'ai_brain'));
    AI_BRAIN=[]; b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()}));
    ALL.forEach(r=>{
      if(!r.fullText || isJunkText(r.fullText)){
        let bt = getBrainTextFor(r);
        if(bt) r.fullText = bt; else r.fullText = "";
      }
    });
  }catch(e){ AI_BRAIN=[]; }
  loadDesigns();
}
async function callAI(prompt, question){
  let res = await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt: prompt, question: prompt, grade: currentGrade, task:"EN", history:[]})});
  let data={}; try{data=await res.json();}catch(e){}
  let txt = data.answer || data.text || data.reply || "";
  if(!txt) throw new Error(data.error||"AI busy - tap again");
  return txt;
}
function formatAI(text){
  let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc = esc.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>"); esc = esc.replace(/\*(.*?)\*/g,"<i>$1</i>");
  esc = esc.replace(/^### (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  esc = esc.replace(/^## (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  let lines=esc.split("\n"); let out=""; let inList=false;
  lines.forEach(l=>{ let t=l.trim();
    if(/^(Key Point|Important|Note|Answer|Final Answer|Solution)[:：]/i.test(t)){ if(inList){out+="</ul>";inList=false;} out+=`<p><span style="color:#4ade80;font-weight:900">${l}</span></p>`; }
    else if(/^\d+\.\s/.test(l)){ out+=`<p><b>${l}</b></p>`; }
    else if(/^[-*]\s/.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${l.replace(/^[-*]\s/,"")}</li>`; }
    else { if(inList){out+="</ul>";inList=false;} if(t) out+=`<p>${l}</p>`; }
  }); if(inList) out+="</ul>"; return out;
}
function escAttr(s){ return String(s||"").replace(/'/g,"").replace(/"/g,""); }

function getAreasForGrade(grade){
  if(KICD_MAP[grade]) return KICD_MAP[grade];
  return [
    {area:"English", strands:["Listening","Speaking","Reading","Writing","Grammar"]},
    {area:"Kiswahili", strands:["Kusikiliza","Kuzungumza","Kusoma","Kuandika"]},
    {area:"Mathematics", strands:["Numbers","Measurement","Geometry","Algebra","Data"]},
    {area:"Integrated Science", strands:["Living Things","Matter","Energy","Earth and Space"]},
    {area:"Social Studies", strands:["People and Population","Culture","Resources","Citizenship"]},
    {area:"Agriculture and Nutrition", strands:["Soil","Crops","Animals","Nutrition","Hygiene"]},
    {area:"Creative Arts", strands:["Art","Music","Drama"]},
    {area:"Physical Education", strands:["Movement","Games","Sports"]},
    {area:"Pre-Technical Studies", strands:["Tools","Materials","Safety"]},
    {area:"CRE", strands:["Creation","Bible","Christian Living"]},
    {area:"IRE", strands:["Quran","Hadith","Islamic Living"]}
  ];
}
function getWholeBookContext(question, maxChars){
  if(!CURRENT_FILE_TEXT || isJunkText(CURRENT_FILE_TEXT)) return "";
  let max = maxChars || 8000;
  let stop = new Set(["pp1","pp2","grade","language","activities","curriculum","design","kenya","cbc","learning","area","topic","full","book"]);
  let qWords = (question+" "+(CURRENT_AREA||"")).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3 && !stop.has(w));
  if(!qWords.length) qWords = (question||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let text = CURRENT_FILE_TEXT;
  let chunks=[];
  for(let i=0;i<text.length;i+=1200) chunks.push(text.slice(i,i+1200));
  let scored = chunks.map((c,idx)=>{
    let low=c.toLowerCase(); let s=0;
    qWords.forEach(w=>{ if(low.includes(w)) s++; });
    if(low.includes("specific learning outcomes")||low.includes("suggested learning experiences")) s+=2;
    return {c, s, idx};
  }).sort((a,b)=>b.s-a.s);
  let picked = scored.slice(0, Math.ceil(max/1200)).sort((a,b)=>a.idx-b.idx);
  return picked.map(x=>x.c).join("\n---\n");
}
function buildCBCPrompt(r, topicText){
  return `You are SomaHub CBC Tutor Kenya. Use ONLY the document below. Do NOT invent. Do NOT mix subjects.
GRADE: ${r.grade}

STRAND: ${topicText}
DOCUMENT (from KICD book, for this Area + Strand):
${getWholeBookContext(topicText, 8000)}
RULES: Explain ONLY ${CURRENT_AREA} - ${topicText}. Copy Outcomes, Key Inquiry, Learning Experiences from DOCUMENT. If not in DOCUMENT, say "Not in this design". Do NOT invent "Explanation".
PART 1 - TEACHER / PARENT:
1. Learning Area: ${CURRENT_AREA}
2. Strand: ${topicText}
3. Specific Learning Outcomes:
4. Key Inquiry Questions:
5. Core Competencies:
6. Values:
7. PCIs:
8. Suggested Learning Experiences:
9. Lesson Allocation:
PART 2 - FOR LEARNER: Teach same strand to ${r.grade} child. Very simple words. 1 short sentence per idea. Kenya examples: Ruiru, shamba, mama mboga, matatu, ugali. Analogy. Emojis. End "**In simple words:** ..." one line.
PART 3: Quick Quiz: 5 questions + answers, ONLY from DOCUMENT. Remember This: 3 points. Use **bold**.`;
}

function closeReader(){ document.getElementById("reader").classList.add("hidden"); document.getElementById("readerPage").innerHTML=""; }
function closeDetail(){ document.getElementById("detailBox").innerHTML=""; }
function getDriveId(url){
  if(!url) return null;
  if(url.includes("/file/d/")) return url.split("/file/d/")[1].split("/")[0].split("?")[0];
  if(url.includes("id=")) return url.split("id=")[1].split("&")[0];
  if(url.includes("docs.google.com") && url.includes("/d/")) return url.split("/d/")[1].split("/")[0];
  return null;
}
function getDriveViewLink(url){
  let id = getDriveId(url);
  if(id) return "https://drive.google.com/file/d/" + id + "/view";
  return url;
}
function isDriveLink(url){ return !!getDriveId(url) && url.includes("drive.google.com") || (url && url.includes("docs.google.com")); }
function downloadOriginal(){
  if(CURRENT_FILE_URL){ window.open(CURRENT_FILE_URL, "_blank"); return; }
}
async function searchNotes(){
  let q=document.getElementById("searchInput").value.trim(); if(!q) return;
  currentGrade=document.getElementById("gradeSel").value; CURRENT_TOPIC=q; CURRENT_STRAND=q; CURRENT_AREA="";
  let box=document.getElementById("searchResult");
  let words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let hayAll = ALL.map(r=>({...r, _text: getBrainTextFor(r)}));
  let matched=hayAll.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r._text||"")).toLowerCase(); return r.grade==currentGrade && words.some(w=>hay.includes(w));});
  if(!matched.length){
    matched=hayAll.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r._text||"")).toLowerCase(); return words.some(w=>hay.includes(w));}).slice(0,3);
  }
  if(matched.length && matched[0]._text && !isJunkText(matched[0]._text)){ CURRENT_FILE_TEXT = matched[0]._text; }
  else if(matched.length && matched[0].fullText && !isJunkText(matched[0].fullText)){ CURRENT_FILE_TEXT = matched[0].fullText; }
  else CURRENT_FILE_TEXT = "";
  box.innerHTML=`<p class="font-black">🔍 "${q}"</p><div class="ai-box mt-2">⏳ Thinking...</div>`;
  let designCtx=matched.length?matched.map((r,i)=>{
    let full = (r._text||r.fullText||'');
    let ctx = "";
    if(full && !isJunkText(full)){
      let old = CURRENT_FILE_TEXT; CURRENT_FILE_TEXT = full; CURRENT_TOPIC = q;
      ctx = getWholeBookContext(q, 3000);
      CURRENT_FILE_TEXT = old;
    } else ctx = 'NO FILE TEXT YET';
    return `${i+1}. ${safeTitle(r)} | ${r.grade} | ${ctx}`;
  }).join("\n"):"No exact design.";
  let prompt=`You are SomaHub CBC Tutor for ${currentGrade}. Strand to find: ${q}\nDocument:\n${designCtx}\nRULE: First say which LEARNING AREA this belongs to. Use ONLY document. If not verbatim, say "Not in this design". Do NOT invent "Explanation". TASK: Give CBC structure for THIS strand only. Use **bold**.`;
  try{ let ai=await callAI(prompt,q); let videoQ=encodeURIComponent(q+" "+currentGrade+" CBC Kenya lesson"); box.innerHTML=`<p class="font-black">🔍 "${q}"</p>${matched.map(r=>`<div class="mt-2 text-[13px]"><b>${safeTitle(r)}</b> • ${r.grade} <button class="action-btn bg-[#263b99] ml-1" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div>`).join("")}<div class="ai-box mt-3">${formatAI(ai)}</div><div class="flex gap-2 mt-3 flex-wrap"><a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a><button class="action-btn bg-orange-500" onclick="makeHomework('${escAttr(q)}')">Set Homework</button><button class="action-btn bg-[#263b99]" onclick="makeExam('${escAttr(q)}')">Set Exam</button></div>`; }catch(e){ box.innerHTML=`<div class="ai-box">AI busy: ${e.message}</div>`; }
}
function loadDesigns(){
  currentGrade=document.getElementById("gradeSel").value;
  let subj=document.getElementById("subjectSel").value;
  let list=ALL.filter(r=>r.grade==currentGrade && (r.type=="Curriculum Design" || r.type=="Design") && (!subj || r.subject==subj || (getBrainTextFor(r)||"").toUpperCase().includes(subj.toUpperCase())));
  let box=document.getElementById("designsList");
  if(!list.length){ box.innerHTML=`<div class="card text-center text-gray-500 text-[13px]">No saved designs for ${currentGrade} ${subj||''} yet.</div>`; return; }
  box.innerHTML=list.map(r=>{
    let bt = getBrainTextFor(r);
    let badge = bt && !isJunkText(bt) ? `🧠 Brain: ${Math.round(bt.length/1000)}k chars • Full Book` : `🔗 Link only`;
    return `<div class="card"><p class="font-black text-[15px]">${safeTitle(r)}</p><p class="text-[12px] text-gray-500">${r.grade} • Full Book • ${r.type||'Design'} • ${badge}</p><p class="text-[13px] mt-1">${safeDesc(r).slice(0,180)}</p><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#263b99]" onclick="openOriginalDesign('${r.id}')">📖 Read Original</button><button class="action-btn bg-[#0d9488]" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div></div>`;
  }).join("");
}

async function openOriginalDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  CURRENT_FILE_TEXT = getBrainTextFor(r);
  CURRENT_TOPIC = safeTitle(r);
  let fileUrl = r.fileUrl || r.url || r.pdfUrl || r.link || "";
  CURRENT_FILE_URL = fileUrl;
  let title = safeTitle(r);
  READER_TITLE = title; READER_META = `${r.grade} • Full Book • Original PDF`;
  document.getElementById("readerTitle").innerText=title;
  document.getElementById("readerMeta").innerText=READER_META;
  let page = document.getElementById("readerPage");
  page.classList.remove("text-mode");
  page.innerHTML = `<div style="padding:30px 16px;text-align:center;background:#fff;border-radius:12px;margin:12px">⏳ Loading REAL PDF pages...<br><small>This shows the original PDF exactly as KICD printed it - not AI text.</small></div>`;
  document.getElementById("reader").classList.remove("hidden");
  // Drive link: use Drive preview iframe - also real PDF
  if(fileUrl && isDriveLink(fileUrl)){
    let did = getDriveId(fileUrl);
    page.innerHTML = `<iframe src="https://drive.google.com/file/d/${did}/preview" allow="autoplay"></iframe>`;
    return;
  }
  if(!fileUrl){
    page.classList.add("text-mode");
    page.innerHTML = `<div style="padding:20px;text-align:center">No PDF file saved for this design.</div>`;
    return;
  }
  // Cloudinary / direct PDF: render each page to canvas image via PDF.js
  try{
    if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    // Use fetch -> arrayBuffer to avoid CORS / redirect issues with Cloudinary
    let buf;
    try{
      let resp = await fetch(fileUrl);
      buf = await resp.arrayBuffer();
    }catch(e){
      // Fallback: let PDF.js fetch it directly
      buf = null;
    }
    let pdf = buf ? await window.pdfjsLib.getDocument({data:buf}).promise : await window.pdfjsLib.getDocument({url: fileUrl}).promise;
    document.getElementById("readerMeta").innerText = `${r.grade} • Full Book • Original PDF - ${pdf.numPages} pages`;
    page.innerHTML = "";
    // Render pages one by one, lazy - first 5 now, rest on scroll
    let rendered = 0;
    async function renderNext(batch){
      for(let i=0;i<batch && rendered<pdf.numPages;i++){
        rendered++;
        let pg = await pdf.getPage(rendered);
        let vp = pg.getViewport({scale: 1.5});
        let canvas = document.createElement("canvas");
        canvas.className = "pdf-page";
        canvas.width = vp.width; canvas.height = vp.height;
        await pg.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
        page.appendChild(canvas);
      }
      if(rendered < pdf.numPages){
        let more = document.createElement("div");
        more.style.cssText="text-align:center;padding:16px;background:#fff;border-radius:12px;margin:12px";
        more.innerHTML = `<button onclick="window.__loadMorePdf()" style="background:#0f766e;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:800">Load next pages (${rendered}/${pdf.numPages}) →</button>`;
        more.id = "pdfMoreBtn";
        page.appendChild(more);
        window.__loadMorePdf = async ()=>{
          let b = document.getElementById("pdfMoreBtn"); if(b) b.remove();
          await renderNext(5);
        };
      }
    }
    await renderNext(5);
    return;
  }catch(e){
    // NEVER fall back to broken extracted text. Show real PDF via Google Viewer / Download.
    page.classList.add("text-mode");
    page.innerHTML = `<div style="padding:20px;text-align:center;background:#fff;border-radius:12px">
      <p style="font-weight:800">⚠️ PDF preview could not load inside the app.</p>
      <p style="font-size:13px;color:#666">This is a viewer issue, not the book. The original PDF is perfect.</p>
      <a href="${fileUrl}" target="_blank" style="display:block;background:#0f766e;color:#fff;padding:14px;border-radius:12px;font-weight:800;text-decoration:none;margin-top:12px">📖 Open Original PDF in Browser →</a>
      <a href="https://docs.google.com/viewer?url=${encodeURIComponent(fileUrl)}&embedded=true" target="_blank" style="display:block;background:#ffcc1a;color:#000;padding:14px;border-radius:12px;font-weight:800;text-decoration:none;margin-top:8px">👀 Open in Google Viewer →</a>
      <p style="font-size:12px;color:#999;margin-top:12px">Do NOT use extracted text for Original - it loses spaces (potentialof, partof).</p>
    </div>`;
    return;
  }
}
async function openDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  currentGrade=r.grade||currentGrade;
  CURRENT_FILE_TEXT = getBrainTextFor(r);
  CURRENT_TOPIC = safeTitle(r);

  CURRENT_AREA = "";
  let areas = getAreasForGrade(currentGrade);

  let areaHtml = areas.map(a=>`<button class="area-btn" onclick="openArea('${escAttr(a.area)}')">📚 ${a.area} →</button>`).join("");
  box.innerHTML=`<div class="card"><p class="font-black text-[15px]">${safeTitle(r)}</p><p class="text-[12px] text-gray-500">${r.grade} • Full Book • ${Math.round(CURRENT_FILE_TEXT.length/1000)}k chars</p><p class="font-black text-[14px] mt-3">👇 Step 1 - Tap a Learning Area:</p>${areaHtml}<div id="areaBox"></div><div id="strandAI"></div><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#263b99]" onclick="openOriginalDesign('${r.id}')">📖 Read Original</button><a target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(safeTitle(r)+" "+r.grade+" CBC Kenya lesson")}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a></div></div>`;
  box.scrollIntoView({behavior:"smooth"});
}
function openArea(areaName){
  CURRENT_AREA = areaName;
  let areas = getAreasForGrade(currentGrade);
  let area = areas.find(a=>a.area===areaName);
  let box = document.getElementById("areaBox");
  if(!box) return;
  let strandHtml = area ? area.strands.map(s=>{
    let num = s.split(" ")[0];
    return `<button class="strand-btn" onclick="explainStrand('${escAttr(s)}')">▶ ${s}<small>Strand ${num} • ${areaName}</small></button>`;
  }).join("") : `<p class="text-[13px] text-gray-500">No strands for ${areaName}.</p>`;
  box.innerHTML = `<div class="mt-3"><p class="font-black text-[14px]">📚 ${areaName}</p><p class="text-[12px] text-gray-500">👇 Step 2 - Tap ONE Strand:</p>${strandHtml}</div>`;
  box.scrollIntoView({behavior:"smooth"});
}
async function explainStrand(strand){
  CURRENT_STRAND = strand;
  let r = ALL.find(x=>x.id===CURRENT_DESIGN_ID);
  if(!r) return;
  let out = document.getElementById("strandAI");
  if(!out) return;
  out.innerHTML = `<div class="ai-box mt-3">⏳ AI Explains - ${CURRENT_AREA} • ${strand}...</div>`;
  out.scrollIntoView({behavior:"smooth"});
  try{
    let prompt = buildCBCPrompt(r, strand);
    let ai = await callAI(prompt, strand);
    let videoQ = encodeURIComponent(strand+" "+CURRENT_AREA+" "+r.grade+" CBC Kenya lesson");
    out.innerHTML = `<div class="ai-box mt-3">${formatAI(ai)}</div><div class="flex gap-2 mt-3 flex-wrap"><a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a><button class="action-btn bg-orange-500" onclick="makeHomework('${escAttr(strand)}')">Set Homework</button><button class="action-btn bg-[#263b99]" onclick="makeExam('${escAttr(strand)}')">Set Exam</button><button class="action-btn bg-[#0d9488]" onclick="makeScheme('${escAttr(strand)}')">Scheme</button><button class="action-btn bg-[#0d9488]" onclick="makeLessonPlan('${escAttr(strand)}')">Lesson Plan</button><button class="action-btn bg-[#0d9488]" onclick="makeNotes('${escAttr(strand)}')">Notes</button></div>`;
  }catch(e){
    out.innerHTML = `<div class="ai-box">AI busy: ${e.message}</div>`;
  }
}
