<script>
const PROXY = "/api/gemini";
let ALL = [];
let AI_BRAIN = [];
let currentGrade = "Grade 8";
let CURRENT_FILE_TEXT = "";
let CURRENT_TOPIC = "";
let READER_TITLE = ""; let READER_META = "";
let CURRENT_FILE_URL = "";

function safeTitle(r){
  let t = (r.title||"").trim();
  if(!t || t.includes("uc?export") || t.includes("drive.google.com") || t.includes("http") || t.includes("id=")) return (r.grade||"") + " " + (r.subject||"");
  return t;
}
function safeDesc(r){
  let d = (r.description||"");
  if(d.includes("uc?export") || d.includes("drive.google.com") || d.startsWith("http")) return safeTitle(r) + " - Original Design";
  return d;
}
function isJunkText(t){
  if(!t) return true;
  t = t.trim();
  if(t.length < 300) return true;
  if(t.includes("uc?export") || t.includes("drive.google.com") || t.includes("export=download") || t.includes("id=1ZV")) return true;
  if(t.split("\n").length <= 4 && t.length < 800) return true;
  return false;
}
function getBrainTextFor(r){
  if(!r) return "";
  if(r.fullText && !isJunkText(r.fullText)) return r.fullText;
  if(AI_BRAIN.length){
    let m = AI_BRAIN.find(x=>x.resourceId===r.id);
    if(m && m.text && !isJunkText(m.text)) return m.text;
    let m2 = AI_BRAIN.find(x=>safeTitle(x)===safeTitle(r) && x.grade===r.grade && (x.subject===r.subject || !x.subject));
    if(m2 && m2.text && !isJunkText(m2.text)) return m2.text;
  }
  return "";
}
async function loadResources(){
  try{ let FB=window.FB; let s=await FB.getDocs(FB.collection(FB.db,'resources')); ALL=[]; s.forEach(d=>ALL.push({id:d.id,...d.data()})); }catch(e){ ALL=[]; }
  try{
    let FB=window.FB; let b=await FB.getDocs(FB.collection(FB.db,'ai_brain'));
    AI_BRAIN=[]; b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()}));
    ALL.forEach(r=>{
      if(!r.fullText || isJunkText(r.fullText)){
        let bt = getBrainTextFor(r);
        if(bt) r.fullText = bt; else r.fullText = "";
      }
    });
  }catch(e){ AI_BRAIN=[]; }
  loadDesigns();
}
async function callAI(prompt, question){
  let res = await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, question: question||prompt, grade: currentGrade, task:"EN", history:[]})});
  let data={}; try{data=await res.json();}catch(e){}
  let txt = data.answer || data.text || data.reply || "";
  if(!txt) throw new Error(data.error||"AI busy");
  return txt;
}
function formatAI(text){
  let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc = esc.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>"); esc = esc.replace(/\*(.*?)\*/g,"<i>$1</i>");
  esc = esc.replace(/^### (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  esc = esc.replace(/^## (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  let lines=esc.split("\n"); let out=""; let inList=false;
  lines.forEach(l=>{ let t=l.trim();
    if(/^(Key Point|Important|Note|Answer|Final Answer|Solution)[:：]/i.test(t)){ if(inList){out+="</ul>";inList=false;} let cls=/^(Answer|Final Answer|Solution)/i.test(t)?"ai-answer":/^(Note|Important)/i.test(t)?"ai-note":"ai-key"; out+=`<p><span class="${cls}">${l}</span></p>`; }
    else if(/^\d+\.\s/.test(l)){ out+=`<p><b>${l}</b></p>`; }
    else if(/^[-*]\s/.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${l.replace(/^[-*]\s/,"")}</li>`; }
    else { if(inList){out+="</ul>";inList=false;} if(t) out+=`<p>${l}</p>`; }
  }); if(inList) out+="</ul>"; return out;
}
function getAdminFileContext(question){
  if(!CURRENT_FILE_TEXT || isJunkText(CURRENT_FILE_TEXT)) return "";
  let qWords=(question||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let chunks=[]; for(let i=0;i<CURRENT_FILE_TEXT.length;i+=1200) chunks.push(CURRENT_FILE_TEXT.slice(i,i+1200));
  let scored=chunks.map(c=>{let low=c.toLowerCase(); let s=0; qWords.forEach(w=>{if(low.includes(w)) s++;}); return {c,s};}).sort((a,b)=>b.s-a.s);
  return `\n\nADMIN FILE (Original Design): ${CURRENT_TOPIC}\nMost relevant pages:\n${scored.slice(0,8).map(x=>x.c).join("\n---\n")}\n`;
}
function buildCBCPrompt(r, topicText){
  return `You are SomaHub CBC Tutor Kenya. You MUST use ONLY the content from this KICD Curriculum Design below. Do NOT invent. Do NOT use big grammar without explaining it.

GRADE: ${r.grade}
LEARNING AREA: ${r.subject}
TOPIC / DESIGN: ${topicText}

DOCUMENT (KICD Design - up to 25000 chars):
${CURRENT_FILE_TEXT.slice(0,25000)}

Answer in this EXACT structure. Do NOT skip any section. If a section is not in the document, say "Not in this design" - do NOT invent.

PART 1 - FOR TEACHER / PARENT (Full CBC - copy from document):
1. **Topic:**
2. **Strand / Sub-Strand:**
3. **General Learning Outcomes:** (from design)
4. **Specific Learning Outcomes:** (bullet list - By end of sub-strand, learner should...)
5. **Key Inquiry Questions:**
6. **Core Competencies Developed:** (e.g. Communication & Collaboration, Critical Thinking, Digital Literacy, Creativity, Self-Efficacy, Citizenship - explain each in 5 words)
7. **Values:** (e.g. Love, Respect, Responsibility, Unity, Patriotism - explain each in 5 words)
8. **Pertinent & Contemporary Issues (PCIs):**
9. **Suggested Learning Experiences:** (what learners actually DO in class)
10. **Lesson Allocation / Strand Totals:** (from LESSON ALLOCATION table in document - e.g. Strand X = 12 lessons, Total = 72 lessons. If table not in text, say "Not in this design")

PART 2 - FOR LEARNER - CLARIFY & SIMPLIFY (Most important):
Now teach the SAME topic again to a ${r.grade} child.
Rules:
- Use VERY simple words. 1 short sentence per idea. No long paragraphs.
- If you must use a big word, say it then explain in brackets. Example: "Atmosphere (the air around us)"
- Use Kenya examples: Ruiru, Nairobi, shamba, mama mboga, matatu, rain in April, sun in January, ugali, sukuma.
- Use an analogy: "Weather is like clothes for the sky..."
- Use emojis to make it fun.
- Break into small steps: What is it? Why does it happen? What do we see? What do we do?
- End with: "**In simple words:** ..." - one line a child can remember.

PART 3 - CHECK UNDERSTANDING:
- **Quick Quiz:** 5 easy questions with answers at end.
- **Remember This:** 3 bullet points to remember for exam.
Tone: Warm, friendly, patient teacher, not a textbook. Use **bold** for headings.`;
}

// === ORGANIZE ORIGINAL - same wording, clean layout ===
function organizeOriginalHTML(raw){
  if(!raw) return "<p>No original text saved.</p>";
  let t = String(raw);
  t = t.replace(/\.[\s\.]{4,}/g, " — ");
  t = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let lines = t.split("\n").map(s=>s.trim()).filter(s=>s.length>0);
  let html = `<div class="org-note">📖 <b>Original KICD Design</b> - Same wording as the PDF, only organized into headings & paragraphs. Not rewritten by AI.</div>`;
  let inTOC = false;
  lines.forEach((line, idx)=>{
    let isMarked = line.startsWith("##");
    let clean = line.replace(/^##\s*/,"");
    let u = clean.toUpperCase();
    if(idx===0 && u.includes("KENYA INSTITUTE")){
      html += `<div class="org-cover"><b>${clean}</b></div>`;
      return;
    }
    if(u.includes("TABLE OF CONTENTS")) inTOC = true;
    if(u.includes("NATIONAL GOALS") || u.includes("LEARNING OUTCOMES") || u.includes("FOREWORD") || u.includes("ACKNOWLEDGEMENT") || u.includes("INTRODUCTION")) inTOC = false;
    let isHead = isMarked ||
      u.includes("TABLE OF CONTENTS") ||
      u.includes("NATIONAL GOALS OF EDUCATION") ||
      u.includes("LEVEL LEARNING OUTCOMES") ||
      u.includes("GENERAL LEARNING OUTCOMES") ||
      u.includes("LESSON ALLOCATION") ||
      u.includes("SUGGESTED LEARNING EXPERIENCES") ||
      u.includes("KEY INQUIRY") ||
      u.includes("CORE COMPETENCIES") ||
      (u.includes("STRAND") && clean.length < 120) ||
      (u.includes("SUB-STRAND") && clean.length < 120) ||
      (clean === clean.toUpperCase() && clean.length>5 && clean.length<120 && !clean.includes("."));
    if(isHead){
      if(inTOC && !u.includes("TABLE OF CONTENTS")){
        html += `<div class="org-toc">• ${clean}</div>`;
      } else {
        html += `<div class="org-head">${clean}</div>`;
      }
    } else if(inTOC){
      html += `<div class="org-toc">• ${clean}</div>`;
    } else {
      html += `<p class="org-p">${clean}</p>`;
    }
  });
  return html;
}

function openReader(title, meta, text){
  READER_TITLE=title; READER_META=meta;
  document.getElementById("readerTitle").innerText=title;
  document.getElementById("readerMeta").innerText=meta;
  let page = document.getElementById("readerPage");
  page.classList.add("text-mode");
  page.innerHTML = organizeOriginalHTML(text||"");
  page.scrollTop=0;
  document.getElementById("reader").classList.remove("hidden");
  window.scrollTo(0,0);
}
function closeReader(){ document.getElementById("reader").classList.add("hidden"); document.getElementById("readerPage").innerHTML=""; }
function closeDetail(){ document.getElementById("detailBox").innerHTML=""; document.getElementById("detailBox").scrollIntoView({behavior:"smooth"}); }
function getDriveId(url){
  if(!url) return null;
  if(url.includes("/file/d/")) return url.split("/file/d/")[1].split("/")[0].split("?")[0];
  if(url.includes("id=")) return url.split("id=")[1].split("&")[0];
  if(url.includes("docs.google.com") && url.includes("/d/")) return url.split("/d/")[1].split("/")[0];
  return null;
}
function getDriveViewLink(url){
  let id = getDriveId(url);
  if(id) return "https://drive.google.com/file/d/" + id + "/view";
  return url;
}
function isDriveLink(url){ return !!getDriveId(url) && url.includes("drive.google.com") || (url && url.includes("docs.google.com")); }
function downloadOriginal(){
  if(CURRENT_FILE_URL){ window.open(CURRENT_FILE_URL, "_blank"); return; }
  let r = ALL.find(x=>safeTitle(x)===READER_TITLE || x.title===READER_TITLE);
  if(r && (r.fileUrl || r.url || r.pdfUrl)){
    let link = r.fileUrl || r.url || r.pdfUrl;
    if(isDriveLink(link)){ window.open(getDriveViewLink(link), "_blank"); return; }
    window.open(link, "_blank"); return;
  }
}
async function searchNotes(){
  let q=document.getElementById("searchInput").value.trim(); if(!q) return;
  currentGrade=document.getElementById("gradeSel").value; CURRENT_TOPIC=q;
  let box=document.getElementById("searchResult");
  let words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let hayAll = ALL.map(r=>({...r, _text: getBrainTextFor(r)}));
  let matched=hayAll.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r._text||"")).toLowerCase(); return r.grade==currentGrade && words.some(w=>hay.includes(w));});
  if(!matched.length){
    matched=hayAll.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r._text||"")).toLowerCase(); return words.some(w=>hay.includes(w));}).slice(0,3);
    if(!matched.length && AI_BRAIN.length){
      let bm = AI_BRAIN.filter(b=>{let hay=((b.title||"")+" "+(b.subject||"")+" "+(b.text||"")).toLowerCase(); return b.grade==currentGrade && words.some(w=>hay.includes(w)) && !isJunkText(b.text);}).slice(0,3);
      matched = bm.map(b=>({id:b.resourceId||b.id, title:b.title, grade:b.grade, subject:b.subject, description:b.title, fullText:b.text, _text:b.text}));
    }
  }
  if(matched.length && matched[0]._text && !isJunkText(matched[0]._text)){ CURRENT_FILE_TEXT = matched[0]._text; }
  else if(matched.length && matched[0].fullText && !isJunkText(matched[0].fullText)){ CURRENT_FILE_TEXT = matched[0].fullText; }
  else CURRENT_FILE_TEXT = "";
  box.innerHTML=`<p class="font-black">🔍 "${q}" - ${matched.length} designs + AI meaning for ${currentGrade}</p><div class="ai-box mt-2">⏳ Thinking...</div>`;
  let designCtx=matched.length?matched.map((r,i)=>`${i+1}. ${safeTitle(r)} | ${r.grade} ${r.subject} | ${(r._text||r.fullText||'').length>300 && !isJunkText(r._text||r.fullText) ? (r._text||r.fullText).slice(0,2000) : 'NO FILE TEXT YET - Link only'}`).join("\n"):"No exact design - use CBC/KICD.";
  let fileCtx=getAdminFileContext(q);
  let prompt=`You are SomaHub CBC Tutor for ${currentGrade}. Topic: ${q}\nDesigns (Admin files + AI Brain):\n${designCtx}\n${fileCtx}\nTASK: Give FULL CBC structure: Strand, Specific Outcomes, Key Inquiry Questions, Core Competencies, Values, PCIs, Lesson Totals, then CLARIFY & SIMPLIFY for a ${currentGrade} child - simple words, Kenya examples, analogy, "In simple words:" summary. Use **bold**. Never mention missing resources. Never mention links.`;
  try{ let ai=await callAI(prompt,q); let videoQ=encodeURIComponent(q+" "+currentGrade+" CBC Kenya lesson"); box.innerHTML=`<p class="font-black">🔍 "${q}" - ${matched.length} designs</p>${matched.map(r=>`<div class="mt-2 text-[13px]"><b>${safeTitle(r)}</b> • ${r.grade} ${r.subject} <button class="action-btn bg-[#263b99] ml-1" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div>`).join("")}<div class="ai-box mt-3">${formatAI(ai)}</div><div class="flex gap-2 mt-3 flex-wrap"><a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a><button class="action-btn bg-orange-500" onclick="makeHomework('${q.replace(/'/g,"")}')">Set Homework</button><button class="action-btn bg-[#263b99]" onclick="makeExam('${q.replace(/'/g,"")}')">Set Exam</button></div>`; }catch(e){ box.innerHTML=`<div class="ai-box">AI busy: ${e.message}</div>`; }
}
function loadDesigns(){
  currentGrade=document.getElementById("gradeSel").value;
  let subj=document.getElementById("subjectSel").value;
  let list=ALL.filter(r=>r.grade==currentGrade && (!subj || r.subject==subj) && (r.type=="Curriculum Design" || r.type=="Design"));
  let box=document.getElementById("designsList");
  if(!list.length){ box.innerHTML=`<div class="card text-center text-gray-500 text-[13px]">No saved designs for ${currentGrade} ${subj||''} yet.<br>Use Search Notes above - AI will generate from CBC / KICD.</div>`; return; }
  box.innerHTML=list.map(r=>{
    let bt = getBrainTextFor(r);
    let badge = bt && !isJunkText(bt) ? `🧠 Brain: ${Math.round(bt.length/1000)}k chars` : `🔗 Link only - Tap Read Original to see PDF`;
    return `<div class="card"><p class="font-black text-[15px]">${safeTitle(r)}</p><p class="text-[12px] text-gray-500">${r.grade} • ${r.subject} • ${r.type||'Design'} • ${badge}</p><p class="text-[13px] mt-1">${safeDesc(r).slice(0,180)}</p><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#263b99]" onclick="openOriginalDesign('${r.id}')">📖 Read Original</button><button class="action-btn bg-[#0d9488]" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div></div>`;
  }).join("");
}
async function openOriginalDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  CURRENT_FILE_TEXT = getBrainTextFor(r);
  CURRENT_TOPIC = safeTitle(r);
  let fileUrl = r.fileUrl || r.url || r.pdfUrl || r.link || "";
  CURRENT_FILE_URL = fileUrl;
  let title = safeTitle(r);
  if(fileUrl && isDriveLink(fileUrl)){
    let did = getDriveId(fileUrl);
    let preview = "https://drive.google.com/file/d/" + did + "/preview";
    READER_TITLE = title; READER_META = `${r.grade} • ${r.subject} • Original PDF`;
    document.getElementById("readerTitle").innerText=title;
    document.getElementById("readerMeta").innerText=READER_META;
    let page = document.getElementById("readerPage");
    page.classList.remove("text-mode");
    page.innerHTML = `<iframe src="${preview}" allow="autoplay"></iframe>`;
    document.getElementById("reader").classList.remove("hidden");
    return;
  }
  if(fileUrl){
    READER_TITLE = title; READER_META = `${r.grade} • ${r.subject} • Original PDF - Loading...`;
    document.getElementById("readerTitle").innerText=title;
    document.getElementById("readerMeta").innerText=READER_META;
    let page = document.getElementById("readerPage");
    page.classList.remove("text-mode");
    page.innerHTML = `<div style="padding:20px;text-align:center">⏳ Loading real PDF...<br><small>If PDF does not load, organized text below will show.</small></div>`;
    document.getElementById("reader").classList.remove("hidden");
    try{
      if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      let pdf = await window.pdfjsLib.getDocument({url: fileUrl}).promise;
      let html = "";
      for(let i=1;i<=Math.min(pdf.numPages, 60);i++){
        let pg = await pdf.getPage(i);
        let vp = pg.getViewport({scale: 1.2});
        let canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        await pg.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
        html += `<img src="${canvas.toDataURL()}" style="width:100%;height:auto;display:block;margin:0 auto 8px;border-bottom:1px solid #e2e8f0">`;
      }
      document.getElementById("readerMeta").innerText = `${r.grade} • ${r.subject} • Original PDF - ${pdf.numPages} pages`;
      page.innerHTML = html;
      return;
    }catch(e){
      // Fallback: organized original text (not raw dump)
      page.classList.add("text-mode");
      page.innerHTML = organizeOriginalHTML(CURRENT_FILE_TEXT || "Original PDF could not load. Tap Download to open it. " + fileUrl);
      document.getElementById("readerMeta").innerText = `${r.grade} • ${r.subject} • Organized Original Text`;
      return;
    }
  }
  // No fileUrl - show organized text only
  openReader(title, `${r.grade} • ${r.subject} • Organized Original Text`, CURRENT_FILE_TEXT);
}
async function openDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  currentGrade=r.grade||currentGrade;
  CURRENT_FILE_TEXT = getBrainTextFor(r);
  CURRENT_TOPIC = safeTitle(r);
  let box=document.getElementById("detailBox");
  box.innerHTML=`<div class="card"><p class="font-black text-[15px]">${safeTitle(r)}</p><p class="text-[12px] text-gray-500">${r.grade} • ${r.subject}</p><div class="ai-box mt-3">⏳ AI Explains - reading original design...</div><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#263b99]" onclick="openOriginalDesign('${r.id}')">📖 Read Original</button><a target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(safeTitle(r)+" "+r.grade+" CBC Kenya lesson")}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a></div></div>`;
  box.scrollIntoView({behavior:"smooth"});
  try{
    let prompt = buildCBCPrompt(r, safeTitle(r));
    let ai = await callAI(prompt, safeTitle(r));
    box.querySelector(".ai-box").innerHTML = formatAI(ai);
  }catch(e){
    box.querySelector(".ai-box").innerHTML = `AI busy: ${e.message}<br><br>Tap 📖 Read Original to see the organized original design.`;
  }
}
async function makeHomework(topic){
  let q = topic || CURRENT_TOPIC || "this topic";
  let box=document.getElementById("searchResult") || document.getElementById("detailBox");
  let prompt=`You are SomaHub CBC Tutor for ${currentGrade}. Topic: ${q}\nDOCUMENT:\n${CURRENT_FILE_TEXT.slice(0,12000)}\nTASK: Create HOMEWORK for ${currentGrade} from ONLY this document. 10 questions: 5 short answer, 3 multiple choice, 2 activity (draw / talk to parent). Simple words, Kenya examples. Include answers for teacher at end. Use **bold**.`;
  try{ let ai=await callAI(prompt,q); box.innerHTML += `<div class="ai-box mt-3"><b>📝 HOMEWORK - ${q}</b><br><br>${formatAI(ai)}</div>`; }catch(e){ alert("AI busy: "+e.message); }
}

}
