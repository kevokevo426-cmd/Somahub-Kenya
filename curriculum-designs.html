<script>
const PROXY = "/api/gemini";
let ALL = [];
let AI_BRAIN = [];
let currentGrade = "Grade 8";
let CURRENT_FILE_TEXT = "";
let CURRENT_TOPIC = "";
let CURRENT_AREA = "";
let CURRENT_STRAND = "";
let CURRENT_DESIGN_ID = "";
let READER_TITLE = ""; let READER_META = "";
let CURRENT_FILE_URL = "";

function safeTitle(r){
  let t = (r.title||"").trim();
  if(!t || t.includes("uc?export") || t.includes("drive.google.com") || t.includes("http") || t.includes("id=")) return (r.grade||"") + " " + (r.subject||"");
  return t;
}
function safeDesc(r){
  let d = (r.description||"");
  if(d.includes("uc?export") || d.includes("drive.google.com") || d.startsWith("http")) return safeTitle(r) + " - Original Design";
  return d;
}
function isJunkText(t){
  if(!t) return true;
  t = t.trim();
  if(t.length < 300) return true;
  if(t.includes("uc?export") || t.includes("drive.google.com") || t.includes("export=download") || t.includes("id=1ZV")) return true;
  if(t.split("\n").length <= 4 && t.length < 800) return true;
  return false;
}
function getBrainTextFor(r){
  if(!r) return "";
  if(r.fullText && !isJunkText(r.fullText)) return r.fullText;
  if(AI_BRAIN.length){
    let m = AI_BRAIN.find(x=>x.resourceId===r.id);
    if(m && m.text && !isJunkText(m.text)) return m.text;
    let m2 = AI_BRAIN.find(x=>safeTitle(x)===safeTitle(r) && x.grade===r.grade && (x.subject===r.subject || !x.subject));
    if(m2 && m2.text && !isJunkText(m2.text)) return m2.text;
  }
  return "";
}
async function loadResources(){
  try{ let FB=window.FB; let s=await FB.getDocs(FB.collection(FB.db,'resources')); ALL=[]; s.forEach(d=>ALL.push({id:d.id,...d.data()})); }catch(e){ ALL=[]; }
  try{
    let FB=window.FB; let b=await FB.getDocs(FB.collection(FB.db,'ai_brain'));
    AI_BRAIN=[]; b.forEach(d=>AI_BRAIN.push({id:d.id,...d.data()}));
    ALL.forEach(r=>{
      if(!r.fullText || isJunkText(r.fullText)){
        let bt = getBrainTextFor(r);
        if(bt) r.fullText = bt; else r.fullText = "";
      }
    });
  }catch(e){ AI_BRAIN=[]; }
  loadDesigns();
}
async function callAI(prompt, question){
  let res = await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt: prompt, question: prompt, grade: currentGrade, task:"EN", history:[]})});
  let data={}; try{data=await res.json();}catch(e){}
  let txt = data.answer || data.text || data.reply || "";
  if(!txt) throw new Error(data.error||"AI busy");
  return txt;
}
function formatAI(text){
  let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc = esc.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>"); esc = esc.replace(/\*(.*?)\*/g,"<i>$1</i>");
  esc = esc.replace(/^### (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  esc = esc.replace(/^## (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  esc = esc.replace(/^#### (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  let lines=esc.split("\n"); let out=""; let inList=false;
  lines.forEach(l=>{ let t=l.trim();
    if(/^(Key Point|Important|Note|Answer|Final Answer|Solution)[:：]/i.test(t)){ if(inList){out+="</ul>";inList=false;} let cls=/^(Answer|Final Answer|Solution)/i.test(t)?"ai-answer":/^(Note|Important)/i.test(t)?"ai-note":"ai-key"; out+=`<p><span class="${cls}">${l}</span></p>`; }
    else if(/^\d+\.\s/.test(l)){ out+=`<p><b>${l}</b></p>`; }
    else if(/^[-*]\s/.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${l.replace(/^[-*]\s/,"")}</li>`; }
    else { if(inList){out+="</ul>";inList=false;} if(t) out+=`<p>${l}</p>`; }
  }); if(inList) out+="</ul>"; return out;
}
function escAttr(s){ return String(s||"").replace(/'/g,"").replace(/"/g,""); }

// === FULL BOOK: Learning Areas + Strands inside each Area ===
// PP1/PP2 + Grades 1-9 - all areas that can appear in a combined KICD book
const ALL_AREAS = [
  "LANGUAGE ACTIVITIES","ENGLISH","KISWAHILI","INDIGENOUS LANGUAGE",
  "MATHEMATICAL ACTIVITIES","MATHEMATICS",
  "ENVIRONMENTAL ACTIVITIES","ENVIRONMENTAL",
  "CREATIVE ACTIVITIES","CREATIVE ARTS","CREATIVE ARTS AND SPORTS",
  "RELIGIOUS EDUCATION","CHRISTIAN RELIGIOUS EDUCATION","CRE","ISLAMIC RELIGIOUS EDUCATION","IRE","HINDU RELIGIOUS EDUCATION","HRE",
  "MOVEMENT ACTIVITIES","MOVEMENT AND PHYSICAL ACTIVITIES","PHYSICAL EDUCATION","PHYSICAL EDUCATION AND SPORTS",
  "MUSIC","HEALTH EDUCATION","LIFE SKILLS","COMPUTER SCIENCE",
  "INTEGRATED SCIENCE","SCIENCE AND TECHNOLOGY","SOCIAL STUDIES",
  "AGRICULTURE","AGRICULTURE AND NUTRITION","HOME SCIENCE","PRE-TECHNICAL STUDIES","BUSINESS STUDIES"
];
function extractAreasAndStrands(fullText){
  if(!fullText) return {areas:[]};
  let lines = fullText.split("\n").map(s=>s.trim()).filter(s=>s.length>0);
  let areas = [];
  let areaMap = {}; // areaName -> {index, strands:[]}
  // 1. Find area headings + their line index
  lines.forEach((line, idx)=>{
    let clean = line.replace(/^##\s*/,"").trim();
    let u = clean.toUpperCase();
    // Area heading = line that IS an area name, or contains it and is short + heading-like
    let found = ALL_AREAS.find(a=>{
      if(u===a) return true;
      if(u.startsWith(a+" ") && clean.length<60) return true;
      if(u.includes("LEARNING AREA") && u.includes(a)) return true;
      return false;
    });
    if(found && clean.length<80){
      if(!areaMap[found]){ areaMap[found]={index:idx, strands:[]}; areas.push(found); }
    }
  });
  // If no areas found, treat whole book as ONE area = the saved subject
  if(!areas.length){
    return {areas:[{name: CURRENT_TOPIC || "Full Book", strands: extractStrandsInRange(lines, 0, lines.length)}]};
  }
  // 2. Find strands + assign to nearest preceding area
  lines.forEach((line, idx)=>{
    let clean = line.replace(/^##\s*/,"").trim();
    let m = clean.match(/^(\d+\.\d+)\s+(.+)$/);
    if(m && m[2].length>=3 && m[2].length<90 && !m[2].includes(".")){
      // Find area before this line
      let area = null;
      for(let a of areas){ if(areaMap[a].index < idx) area = a; }
      if(!area) area = areas[0];
      let key = clean.toLowerCase();
      if(!areaMap[area].strands.some(s=>s.toLowerCase()===key)) areaMap[area].strands.push(clean);
    }
  });
  // 3. Also add SUB-STRAND lines as strands if no 1.0 strands in that area
  areas.forEach(a=>{
    if(areaMap[a].strands.length===0){
      lines.forEach((line, idx)=>{
        let clean = line.replace(/^##\s*/,"").trim();
        let u = clean.toUpperCase();
        if(u.includes("SUB-STRAND") && clean.length<120){
          let before = null;
          for(let x of areas){ if(areaMap[x].index < idx) before = x; }
          if(before===a && !areaMap[a].strands.includes(clean)) areaMap[a].strands.push(clean);
        }
      });
    }
  });
  return {areas: areas.map(a=>({name:a, strands: areaMap[a].strands.slice(0,30)}))};
}
function extractStrandsInRange(lines, from, to){
  let out=[]; let seen=new Set();
  for(let i=from;i<to && i<lines.length;i++){
    let clean = lines[i].replace(/^##\s*/,"").trim();
    let m = clean.match(/^(\d+\.\d+)\s+(.+)$/);
    if(m && m[2].length>=3 && m[2].length<90 && !m[2].includes(".")){
      let k=clean.toLowerCase(); if(!seen.has(k)){seen.add(k); out.push(clean);}
    }
  }
  return out.slice(0,30);
}
// Get text for ONE Learning Area only - so Maths chunks don't leak into Language
function getAreaText(areaName){
  if(!CURRENT_FILE_TEXT) return "";
  let lines = CURRENT_FILE_TEXT.split("\n");
  let parsed = extractAreasAndStrands(CURRENT_FILE_TEXT);
  if(parsed.areas.length<=1) return CURRENT_FILE_TEXT;
  let idx = parsed.areas.findIndex(a=>a.name===areaName);
  if(idx===-1) return CURRENT_FILE_TEXT;
  // Find start / end line index for this area in original text
  let start=-1, end=lines.length;
  let uArea = areaName.toUpperCase();
  lines.forEach((l,i)=>{ let u=l.replace(/^##\s*/,"").trim().toUpperCase(); if(start===-1 && (u===uArea || u.startsWith(uArea+" "))) start=i; });
  if(start===-1) return CURRENT_FILE_TEXT;
  for(let i=start+1;i<lines.length;i++){
    let u=lines[i].replace(/^##\s*/,"").trim().toUpperCase();
    let isOtherArea = ALL_AREAS.some(a=>a!==areaName && (u===a || u.startsWith(a+" ")));
    if(isOtherArea){ end=i; break; }
  }
  return lines.slice(start, end).join("\n");
}

// === WHOLE BOOK: chunks for ONE Area + ONE Strand ===
function getWholeBookContext(question, maxChars){
  if(!CURRENT_FILE_TEXT || isJunkText(CURRENT_FILE_TEXT)) return "";
  // Use Area-only text if an Area is selected - stops cross-subject mixing
  let sourceText = CURRENT_AREA ? getAreaText(CURRENT_AREA) : CURRENT_FILE_TEXT;
  if(!sourceText || sourceText.length<300) sourceText = CURRENT_FILE_TEXT;
  let max = maxChars || 20000;
  let stop = new Set(["pp1","pp2","grade","language","activities","curriculum","design","kenya","cbc","learning","area","topic","full","book"]);
  let qWords = (question+" "+(CURRENT_AREA||"")).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3 && !stop.has(w));
  if(!qWords.length) qWords = (question||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let chunks=[];
  for(let i=0;i<sourceText.length;i+=1500) chunks.push(sourceText.slice(i,i+1500));
  let scored = chunks.map((c,idx)=>{
    let low=c.toLowerCase(); let s=0;
    qWords.forEach(w=>{ if(low.includes(w)) s++; });
    if(question && low.includes(question.toLowerCase())) s+=10;
    if(low.includes("specific learning outcomes")||low.includes("suggested learning experiences")||low.includes("key inquiry")) s+=2;
    return {c, s, idx};
  }).sort((a,b)=>b.s-a.s);
  let picked = scored.slice(0, Math.ceil(max/1500)).sort((a,b)=>a.idx-b.idx);
  return picked.map(x=>x.c).join("\n--- PAGE ---\n");
}
function buildCBCPrompt(r, topicText){
  let parsed = extractAreasAndStrands(CURRENT_FILE_TEXT);
  let areaList = parsed.areas.map(a=>a.name).join(", ");
  let strandList = parsed.areas.map(a=>a.name+": "+(a.strands.join(" | ")||"(no strands)")).join("\n");
  return `You are SomaHub CBC Tutor Kenya. You MUST use ONLY the content from this KICD Curriculum Design below. Do NOT invent. Do NOT use general knowledge. Do NOT mix subjects.

GRADE: ${r.grade}
BOOK TITLE: ${safeTitle(r)} - THIS IS A FULL COMBINED BOOK WITH ALL SUBJECTS
LEARNING AREA TO EXPLAIN (ONLY THIS ONE): ${CURRENT_AREA || r.subject}
EXACT STRAND TO EXPLAIN (ONLY THIS ONE): ${topicText}
REAL LEARNING AREAS FOUND IN THIS BOOK: ${areaList}
REAL STRANDS FOUND IN THIS BOOK (use only these):
${strandList}

DOCUMENT (KICD Design - RELEVANT PARTS FOR THIS LEARNING AREA + THIS STRAND ONLY, in book order):
${getWholeBookContext(topicText, 20000)}

CRITICAL RULES:
- Explain ONLY Learning Area "${CURRENT_AREA}" + Strand "${topicText}". Do NOT bring in strands from other Learning Areas (e.g. do NOT bring Maths into Language, do NOT bring Environmental into Language).
- If the EXACT STRAND is not found verbatim in DOCUMENT, say: "Not in this design - here are the real strands in ${CURRENT_AREA}:" and list them. Do NOT invent "Explanation" or any other strand.
- Copy Specific Learning Outcomes, Key Inquiry Questions, Suggested Learning Experiences word-for-word from DOCUMENT. If not in DOCUMENT, say "Not in this design".
- Do NOT invent outcomes like "Name familiar objects" unless they are in DOCUMENT.

Answer in this EXACT structure:
PART 1 - FOR TEACHER / PARENT (copy from document):
1. **Learning Area:** ${CURRENT_AREA}
2. **Strand / Sub-Strand:** (exact wording from document)
3. **Specific Learning Outcomes:** (bullet list)
4. **Key Inquiry Questions:**
5. **Core Competencies Developed:**
6. **Values:**
7. **Pertinent & Contemporary Issues (PCIs):**
8. **Suggested Learning Experiences:**
9. **Lesson Allocation:**

PART 2 - FOR LEARNER - CLARIFY & SIMPLIFY:
Teach the SAME strand again to a ${r.grade} child in ${CURRENT_AREA}. Very simple words. 1 short sentence per idea. Kenya examples: Ruiru, Nairobi, shamba, mama mboga, matatu, ugali, sukuma. Analogy. Emojis. End with: "**In simple words:** ..." - one line.

PART 3 - CHECK UNDERSTANDING:
- **Quick Quiz:** 5 easy questions with answers at end, ONLY from DOCUMENT.
- **Remember This:** 3 bullet points to remember for exam.
Tone: Warm, friendly, patient teacher. Use **bold** for headings.`;
}

// === ORGANIZE ORIGINAL ===
function organizeOriginalHTML(raw){
  if(!raw) return "<p>No original text saved.</p>";
  let t = String(raw);
  t = t.replace(/\.[\s\.]{4,}/g, " — ");
  t = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let lines = t.split("\n").map(s=>s.trim()).filter(s=>s.length>0);
  let html = `<div class="org-note">📖 <b>Original KICD Design - Full Book (All Subjects)</b> - Same wording as the PDF, only organized. Not rewritten by AI.</div>`;
  let inTOC = false;
  lines.forEach((line, idx)=>{
    let isMarked = line.startsWith("##");
    let clean = line.replace(/^##\s*/,"");
    let u = clean.toUpperCase();
    if(idx===0 && u.includes("KENYA INSTITUTE")){
      html += `<div class="org-cover"><b>${clean}</b></div>`;
      return;
    }
    if(u.includes("TABLE OF CONTENTS")) inTOC = true;
    if(u.includes("NATIONAL GOALS") || u.includes("LEARNING OUTCOMES") || u.includes("FOREWORD") || u.includes("ACKNOWLEDGEMENT") || u.includes("INTRODUCTION")) inTOC = false;
    let isHead = isMarked ||
      ALL_AREAS.some(a=>u===a && clean.length<80) ||
      u.includes("TABLE OF CONTENTS") ||
      u.includes("NATIONAL GOALS OF EDUCATION") ||
      u.includes("LEVEL LEARNING OUTCOMES") ||
      u.includes("GENERAL LEARNING OUTCOMES") ||
      u.includes("LESSON ALLOCATION") ||
      u.includes("SUGGESTED LEARNING EXPERIENCES") ||
      u.includes("KEY INQUIRY") ||
      u.includes("CORE COMPETENCIES") ||
      (u.includes("STRAND") && clean.length < 120) ||
      (u.includes("SUB-STRAND") && clean.length < 120) ||
      (clean === clean.toUpperCase() && clean.length>5 && clean.length<120 && !clean.includes("."));
    if(isHead){
      if(inTOC && !u.includes("TABLE OF CONTENTS")){
        html += `<div class="org-toc">• ${clean}</div>`;
      } else {
        html += `<div class="org-head">${clean}</div>`;
      }
    } else if(inTOC){
      html += `<div class="org-toc">• ${clean}</div>`;
    } else {
      html += `<p class="org-p">${clean}</p>`;
    }
  });
  return html;
}

function openReader(title, meta, text){
  READER_TITLE=title; READER_META=meta;
  document.getElementById("readerTitle").innerText=title;
  document.getElementById("readerMeta").innerText=meta;
  let page = document.getElementById("readerPage");
  page.classList.add("text-mode");
  page.innerHTML = organizeOriginalHTML(text||"");
  page.scrollTop=0;
  document.getElementById("reader").classList.remove("hidden");
  window.scrollTo(0,0);
}
function closeReader(){ document.getElementById("reader").classList.add("hidden"); document.getElementById("readerPage").innerHTML=""; }
function closeDetail(){ document.getElementById("detailBox").innerHTML=""; document.getElementById("detailBox").scrollIntoView({behavior:"smooth"}); }
function getDriveId(url){
  if(!url) return null;
  if(url.includes("/file/d/")) return url.split("/file/d/")[1].split("/")[0].split("?")[0];
  if(url.includes("id=")) return url.split("id=")[1].split("&")[0];
  if(url.includes("docs.google.com") && url.includes("/d/")) return url.split("/d/")[1].split("/")[0];
  return null;
}
function getDriveViewLink(url){
  let id = getDriveId(url);
  if(id) return "https://drive.google.com/file/d/" + id + "/view";
  return url;
}
function isDriveLink(url){ return !!getDriveId(url) && url.includes("drive.google.com") || (url && url.includes("docs.google.com")); }
function downloadOriginal(){
  if(CURRENT_FILE_URL){ window.open(CURRENT_FILE_URL, "_blank"); return; }
  let r = ALL.find(x=>safeTitle(x)===READER_TITLE || x.title===READER_TITLE);
  if(r && (r.fileUrl || r.url || r.pdfUrl)){
    let link = r.fileUrl || r.url || r.pdfUrl;
    if(isDriveLink(link)){ window.open(getDriveViewLink(link), "_blank"); return; }
    window.open(link, "_blank"); return;
  }
}
async function searchNotes(){
  let q=document.getElementById("searchInput").value.trim(); if(!q) return;
  currentGrade=document.getElementById("gradeSel").value; CURRENT_TOPIC=q; CURRENT_STRAND=q;
  // Search: try to guess Area from query - if user types "Counting", it's Maths, not Language
  let box=document.getElementById("searchResult");
  let words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let hayAll = ALL.map(r=>({...r, _text: getBrainTextFor(r)}));
  let matched=hayAll.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r._text||"")).toLowerCase(); return r.grade==currentGrade && words.some(w=>hay.includes(w));});
  if(!matched.length){
    matched=hayAll.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r._text||"")).toLowerCase(); return words.some(w=>hay.includes(w));}).slice(0,3);
  }
  if(matched.length && matched[0]._text && !isJunkText(matched[0]._text)){ CURRENT_FILE_TEXT = matched[0]._text; }
  else if(matched.length && matched[0].fullText && !isJunkText(matched[0].fullText)){ CURRENT_FILE_TEXT = matched[0].fullText; }
  else CURRENT_FILE_TEXT = "";
  // For search, clear Area so it searches whole full book, then AI will tell which Area it found it in
  CURRENT_AREA = "";
  box.innerHTML=`<p class="font-black">🔍 "${q}" - ${matched.length} designs</p><div class="ai-box mt-2">⏳ Thinking - searching WHOLE FULL BOOK (all subjects) for "${q}"...</div>`;
  let designCtx=matched.length?matched.map((r,i)=>{
    let full = (r._text||r.fullText||'');
    let ctx = "";
    if(full && !isJunkText(full)){
      let old = CURRENT_FILE_TEXT; CURRENT_FILE_TEXT = full; CURRENT_TOPIC = q;
      ctx = getWholeBookContext(q, 4000);
      CURRENT_FILE_TEXT = old;
    } else ctx = 'NO FILE TEXT YET - Link only';
    return `${i+1}. ${safeTitle(r)} | ${r.grade} | ${ctx}`;
  }).join("\n"):"No exact design.";
  let prompt=`You are SomaHub CBC Tutor for ${currentGrade}. Topic / Strand to find in FULL COMBINED BOOK (all subjects): ${q}\nDesigns (WHOLE BOOK parts):\n${designCtx}\nRULE: First say which LEARNING AREA this belongs to (e.g. LANGUAGE ACTIVITIES, MATHEMATICAL ACTIVITIES). Use ONLY document. If "${q}" is not verbatim in document, say "Not in this design" and list real strands. Do NOT invent "Explanation". TASK: Give FULL CBC structure for THIS strand only in ITS Learning Area: Strand, Specific Outcomes, Key Inquiry, Core Competencies, Values, PCIs, Lesson Totals, then CLARIFY & SIMPLIFY for a ${currentGrade} child - simple words, Kenya examples, analogy, "In simple words:" summary. Use **bold**.`;
  try{ let ai=await callAI(prompt,q); let videoQ=encodeURIComponent(q+" "+currentGrade+" CBC Kenya lesson"); box.innerHTML=`<p class="font-black">🔍 "${q}" - ${matched.length} designs</p>${matched.map(r=>`<div class="mt-2 text-[13px]"><b>${safeTitle(r)}</b> • ${r.grade} <button class="action-btn bg-[#263b99] ml-1" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div>`).join("")}<div class="ai-box mt-3">${formatAI(ai)}</div><div class="flex gap-2 mt-3 flex-wrap"><a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a><button class="action-btn bg-orange-500" onclick="makeHomework('${escAttr(q)}')">Set Homework</button><button class="action-btn bg-[#263b99]" onclick="makeExam('${escAttr(q)}')">Set Exam</button></div>`; }catch(e){ box.innerHTML=`<div class="ai-box">AI busy: ${e.message}</div>`; }
}
function loadDesigns(){
  currentGrade=document.getElementById("gradeSel").value;
  let subj=document.getElementById("subjectSel").value;
  // Full books: don't filter out a full book just because its saved subject != filter - if no filter, show all. If filter set, show books whose text contains that area OR saved subject matches.
  let list=ALL.filter(r=>r.grade==currentGrade && (r.type=="Curriculum Design" || r.type=="Design") && (!subj || r.subject==subj || (getBrainTextFor(r)||"").toUpperCase().includes(subj.toUpperCase())));
  let box=document.getElementById("designsList");
  if(!list.length){ box.innerHTML=`<div class="card text-center text-gray-500 text-[13px]">No saved designs for ${currentGrade} ${subj||''} yet.<br>Use Search Notes above.</div>`; return; }
  box.innerHTML=list.map(r=>{
    let bt = getBrainTextFor(r);
    let badge = bt && !isJunkText(bt) ? `🧠 Brain: ${Math.round(bt.length/1000)}k chars • Full Book (All Subjects)` : `🔗 Link only - Tap Read Original`;
    return `<div class="card"><p class="font-black text-[15px]">${safeTitle(r)}</p><p class="text-[12px] text-gray-500">${r.grade} • Full Book • ${r.type||'Design'} • ${badge}</p><p class="text-[13px] mt-1">${safeDesc(r).slice(0,180)}</p><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#263b99]" onclick="openOriginalDesign('${r.id}')">📖 Read Original</button><button class="action-btn bg-[#0d9488]" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div></div>`;
  }).join("");
}
async function openOriginalDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  CURRENT_FILE_TEXT = getBrainTextFor(r);
  CURRENT_TOPIC = safeTitle(r);
  let fileUrl = r.fileUrl || r.url || r.pdfUrl || r.link || "";
  CURRENT_FILE_URL = fileUrl;
  let title = safeTitle(r);
  if(fileUrl && isDriveLink(fileUrl)){
    let did = getDriveId(fileUrl);
    let preview = "https://drive.google.com/file/d/" + did + "/preview";
    READER_TITLE = title; READER_META = `${r.grade} • Full Book • Original PDF`;
    document.getElementById("readerTitle").innerText=title;
    document.getElementById("readerMeta").innerText=READER_META;
    let page = document.getElementById("readerPage");
    page.classList.remove("text-mode");
    page.innerHTML = `<iframe src="${preview}" allow="autoplay"></iframe>`;
    document.getElementById("reader").classList.remove("hidden");
    return;
  }
  if(fileUrl){
    READER_TITLE = title; READER_META = `${r.grade} • Full Book • Original PDF - Loading...`;
    document.getElementById("readerTitle").innerText=title;
    document.getElementById("readerMeta").innerText=READER_META;
    let page = document.getElementById("readerPage");
    page.classList.remove("text-mode");
    page.innerHTML = `<div style="padding:20px;text-align:center">⏳ Loading real PDF...<br><small>If PDF does not load, organized text below will show.</small></div>`;
    document.getElementById("reader").classList.remove("hidden");
    try{
      if(window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      let pdf = await window.pdfjsLib.getDocument({url: fileUrl}).promise;
      let html = "";
      for(let i=1;i<=Math.min(pdf.numPages, 60);i++){
        let pg = await pdf.getPage(i);
        let vp = pg.getViewport({scale: 1.2});
        let canvas = document.createElement("canvas");
        canvas.width = vp.width; canvas.height = vp.height;
        await pg.render({canvasContext: canvas.getContext("2d"), viewport: vp}).promise;
        html += `<img src="${canvas.toDataURL()}" style="width:100%;height:auto;display:block;margin:0 auto 8px;border-bottom:1px solid #e2e8f0">`;
      }
      document.getElementById("readerMeta").innerText = `${r.grade} • Full Book • Original PDF - ${pdf.numPages} pages`;
      page.innerHTML = html;
      return;
    }catch(e){
      page.classList.add("text-mode");
      page.innerHTML = organizeOriginalHTML(CURRENT_FILE_TEXT || "Original PDF could not load. Tap Download to open it. " + fileUrl);
      document.getElementById("readerMeta").innerText = `${r.grade} • Full Book • Organized Original Text`;
      return;
    }
  }
  openReader(title, `${r.grade} • Full Book • Organized Original Text`, CURRENT_FILE_TEXT);
}

async function explainStrand(strand){
  CURRENT_STRAND = strand;

  if(!out) return;

  out.scrollIntoView({behavior:"smooth"});

    let prompt = buildCBCPrompt(r, strand);

    out.innerHTML = `<div class="ai-box mt-3">${formatAI(ai)}</div><div class="flex gap-2 mt-3 flex-wrap"><a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video: ${strand}</a><button class="action-btn bg-orange-500" onclick="makeHomework('${escAttr(strand)}')">Set Homework</button><button class="action-btn bg-[#263b99]" onclick="makeExam('${escAttr(strand)}')">Set Exam</button><button class="action-btn bg-[#0d9488]" onclick="makeScheme('${escAttr(strand)}')">Scheme</button><button class="action-btn bg-[#0d9488]" onclick="makeLessonPlan('${escAttr(strand)}')">Lesson Plan</button><button class="action-btn bg-[#0d9488]" onclick="makeNotes('${escAttr(strand)}')">Notes</button></div>`;
  }catch(e){
    out.innerHTML = `<div class="ai-box">AI busy: ${e.message}<br><br>Tap 📖 Read Original to see the organized original design.</div>`;
  }
}
