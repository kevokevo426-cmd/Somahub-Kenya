<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SomaHub Curriculum Designs - REAL AI + Notes + Video</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8", authDomain: "somahubkenya-9e458.firebaseapp.com", projectId: "somahubkenya-9e458", storageBucket: "somahubkenya-9e458.firebasestorage.app", messagingSenderId: "615579085715", appId: "1:615579085715:web:28fca37ba498324bb49666" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.FB = { db, doc, getDoc, setDoc, collection, getDocs, query, where, updateDoc, serverTimestamp, auth };
</script>
<style>
*{box-sizing:border-box} body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;margin:0}
.hero{background:linear-gradient(135deg,#0f766e,#0d9488 45%,#000 100%);border-radius:24px;color:#fff;padding:22px}
.search-box{background:#fff;border-radius:16px;display:flex;gap:8px;padding:8px;align-items:center}
.search-box input{flex:1;border:0;outline:none;font-size:17px;padding:10px 6px}
.btn-search{background:#0d9488;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;white-space:nowrap}
.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0}
.ai-box{background:#000;color:#fff;border-radius:12px;padding:14px;line-height:1.6;font-size:14px}
.ai-box b{color:#5eead4}
.ai-key{color:#f87171;font-weight:900}
.ai-answer{color:#4ade80;font-weight:900}
.ai-note{color:#fb923c;font-weight:900}
select,input{font-family:inherit}
.action-btn{border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:12px;color:#fff;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body class="p-3 max-w-3xl mx-auto pb-24">

<!-- HERO - SAME DESIGN AS SCREENSHOT -->
<div class="hero">
  <h1 class="text-[26px] leading-tight font-black">📘 CBC Curriculum Designs<br>PP1-G9 - REAL AI Explains + Video</h1>
  <p class="text-[14px] opacity-90 mt-2 leading-relaxed">AI summarizes KICD design, searches word meaning by level PP1-G9 + comparison, YouTube video of strand, sets homework/exam FROM design</p>
  <div class="search-box mt-4">
    <input id="searchInput" placeholder="e.g. Crop production" value="Crop production">
    <button class="btn-search" onclick="searchNotes()">Search<br>Notes</button>
  </div>
  <div id="searchResult" class="card mt-4 text-gray-800"></div>
</div>

<!-- FILTERS -->
<div class="mt-4 space-y-3">
  <select id="gradeSel" class="w-full bg-white border rounded-xl p-3.5 text-[16px] outline-none" onchange="loadDesigns()">
    <option>PP1</option><option>PP2</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option selected>Grade 8</option><option>Grade 9</option>
  </select>
  <select id="subjectSel" class="w-full bg-white border rounded-xl p-3.5 text-[16px] outline-none" onchange="loadDesigns()">
    <option value="">All Subjects</option>
    <option>Agriculture and Nutrition</option><option>English</option><option>Kiswahili</option><option>Mathematics</option><option>Integrated Science</option><option>Social Studies</option><option>CRE</option><option>IRE</option><option>Creative Arts</option><option>Physical Education</option><option>Pre-Technical Studies</option>
  </select>
  <button class="w-full bg-[#0d9488] text-white font-black py-3.5 rounded-xl text-[16px]" onclick="loadDesigns()">📘 Show Designs</button>
</div>

<div id="designsList" class="mt-4 space-y-3"></div>
<div id="detailBox" class="mt-4"></div>

<script>
const PROXY = "/api/gemini";
let ALL = [];
let currentGrade = "Grade 8";

// --- LOAD DESIGNS FROM FIRESTORE - NO KEY NEEDED ---
async function loadResources(){
  try{
    let FB = window.FB;
    let s = await FB.getDocs(FB.collection(FB.db,'resources'));
    ALL = []; s.forEach(d=>ALL.push({id:d.id,...d.data()}));
  }catch(e){ ALL = []; }
  loadDesigns();
}
async function callAI(prompt, question){
  // FIX: Uses Vercel /api/gemini - GEMINI -> OPENROUTER -> OPENAI. No admin.html key needed.
  let res = await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    prompt: prompt,
    question: question || prompt,
    grade: currentGrade,
    task: "EN",
    history: []
  })});
  let data = {};
  try{ data = await res.json(); }catch(e){}
  let txt = data.answer || data.text || data.reply || "";
  if(!txt) throw new Error(data.error || data.details || "AI busy, try again");
  return txt;
}
function formatAI(text){
  let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc = esc.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>");
  esc = esc.replace(/\*(.*?)\*/g,"<i>$1</i>");
  esc = esc.replace(/^### (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  esc = esc.replace(/^## (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  let lines = esc.split("\n"); let out=""; let inList=false;
  lines.forEach(l=>{
    let t=l.trim();
    if(/^(Key Point|Important|Note|Answer|Final Answer|Solution)[:：]/i.test(t)){
      if(inList){out+="</ul>";inList=false;}
      let cls=/^(Answer|Final Answer|Solution)/i.test(t)?"ai-answer":/^(Note|Important)/i.test(t)?"ai-note":"ai-key";
      out+=`<p><span class="${cls}">${l}</span></p>`;
    }
    else if(/^\d+\.\s/.test(l)){ out+=`<p><b>${l}</b></p>`; }
    else if(/^[-*]\s/.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${l.replace(/^[-*]\s/,"")}</li>`; }
    else { if(inList){out+="</ul>";inList=false;} if(t) out+=`<p>${l}</p>`; }
  });
  if(inList) out+="</ul>";
  return out;
}

// --- SEARCH NOTES - FIXED: Never says "Add Gemini key", always gives AI answer ---
async function searchNotes(){
  let q = document.getElementById("searchInput").value.trim();
  if(!q) return;
  currentGrade = document.getElementById("gradeSel").value;
  let box = document.getElementById("searchResult");
  // Find designs - fuzzy: match any word >3 letters, not exact title only
  let words = q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let matched = ALL.filter(r=>{
    let hay = ((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r.strand||"")).toLowerCase();
    return r.grade==currentGrade && words.some(w=>hay.includes(w));
  });
  // Also try any grade if none in this grade - so "0 designs" never blocks learning
  if(!matched.length) matched = ALL.filter(r=>{
    let hay = ((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")).toLowerCase();
    return words.some(w=>hay.includes(w));
  }).slice(0,3);

  box.innerHTML = `<p class="font-black">🔍 "${q}" - ${matched.length} designs + AI meaning for ${currentGrade}</p><div class="ai-box mt-2">⏳ Thinking... using Vercel AI (Gemini → OpenRouter → OpenAI)</div>`;
  let designCtx = matched.length ? matched.map((r,i)=>`${i+1}. [${r.type||'Design'}] ${r.title} | ${r.grade} ${r.subject} | ${r.description||''}`).join("\n") : "No exact design in Firestore - use CBC / KICD knowledge.";
  let prompt = `You are SomaHub CBC Tutor for ${currentGrade}. Topic: ${q}\nDesigns found:\n${designCtx}\n\nTASK: 1. Give clear meaning of "${q}" for ${currentGrade} in simple English + Kiswahili word if needed. 2. Compare how this topic is taught in PP1, Grade 4, Grade 7, Grade 9 - what is different? 3. Give 3 Key Points. 4. Give 1 Kenya real-life example. Use **bold** for key points. Start key lines with Key Point:, Answer:, Note:. Never mention Admin, Designs missing, or keys. Just give answer.`;
  try{
    let ai = await callAI(prompt, q);
    let videoQ = encodeURIComponent(q + " " + currentGrade + " CBC Kenya lesson");
    box.innerHTML = `<p class="font-black">🔍 "${q}" - ${matched.length} designs + AI meaning for ${currentGrade}</p>
      ${matched.map(r=>`<div class="mt-2 text-[13px]"><b>${r.title}</b> • ${r.grade} ${r.subject} <button class="action-btn bg-[#0d9488] ml-1" onclick="openDesign('${r.id}')">Open</button></div>`).join("")}
      <div class="ai-box mt-3">${formatAI(ai)}</div>
      <div class="flex gap-2 mt-3 flex-wrap">
        <a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a>
        <button class="action-btn bg-orange-500" onclick="makeHomework('${q.replace(/'/g,"")}')">Set Homework</button>
        <button class="action-btn bg-[#263b99]" onclick="makeExam('${q.replace(/'/g,"")}')">Set Exam</button>
      </div>`;
  }catch(e){
    box.innerHTML = `<p class="font-black">🔍 "${q}" - ${matched.length} designs</p><div class="ai-box mt-2">AI is busy. Try again in a few seconds. (${e.message})</div>`;
  }
}

function loadDesigns(){
  currentGrade = document.getElementById("gradeSel").value;
  let subj = document.getElementById("subjectSel").value;
  let list = ALL.filter(r=>r.grade==currentGrade && (!subj || r.subject==subj));
  let box = document.getElementById("designsList");
  if(!list.length){
    box.innerHTML = `<div class="card text-center text-gray-500 text-[13px]">No saved designs for ${currentGrade} ${subj||''} yet.<br>Use Search Notes above - AI will generate from CBC / KICD.</div>`;
    return;
  }
  box.innerHTML = list.map(r=>`<div class="card"><p class="font-black text-[14px]">${r.title}</p><p class="text-[12px] text-gray-500">${r.grade} • ${r.subject} • ${r.type||'Design'}</p><p class="text-[13px] mt-1">${(r.description||'').slice(0,180)}</p><div class="flex gap-2 mt-2"><button class="action-btn bg-[#0d9488]" onclick="openDesign('${r.id}')">Open + AI Explains</button></div></div>`).join("");
}
async function openDesign(id){
  let r = ALL.find(x=>x.id==id); if(!r) return;
  currentGrade = r.grade || currentGrade;
  let box = document.getElementById("detailBox");
  box.innerHTML = `<div class="card"><h3 class="font-black">${r.title}</h3><p class="text-[12px] text-gray-500">${r.grade} • ${r.subject}</p><p class="text-[14px] mt-2">${r.description||''}</p><div class="ai-box mt-3">⏳ AI Explains...</div></div>`;
  box.scrollIntoView({behavior:"smooth"});
  try{
    let prompt = `You are SomaHub CBC Tutor for ${r.grade}. Design: Title: ${r.title}, Subject: ${r.subject}, Description: ${r.description||''}, Strand: ${r.strand||''}\nTASK: Summarize this KICD design in simple steps for learner + teacher. Give: 1. Meaning, 2. Key Points, 3. Activities, 4. Assessment. Use **bold** for key points. Never mention missing resources or keys.`;
    let ai = await callAI(prompt, r.title);
    box.querySelector(".ai-box").innerHTML = formatAI(ai);
  }catch(e){ box.querySelector(".ai-box").innerHTML = "AI busy, try again."; }
}
async function makeHomework(topic){
  let box = document.getElementById("searchResult");
  box.innerHTML += `<div class="ai-box mt-3">⏳ Setting homework...</div>`;
  try{
    let ai = await callAI(`Set Homework for ${currentGrade} on ${topic}. 5 questions easy to hard, 1 real-life Kenya example, Answers at end. Use **bold**.`, topic);
    box.innerHTML += `<div class="ai-box mt-2">${formatAI(ai)}</div>`;
  }catch(e){}
}
async function makeExam(topic){
  let box = document.getElementById("searchResult");
  box.innerHTML += `<div class="ai-box mt-3">⏳ Setting exam...</div>`;
  try{
    let ai = await callAI(`Set Exam for ${currentGrade} on ${topic}. 10 questions: 5 MCQ, 3 Short Answer, 2 Structured. Give Marking Scheme at end. Use **bold**.`, topic);
    box.innerHTML += `<div class="ai-box mt-2">${formatAI(ai)}</div>`;
  }catch(e){}
}
setTimeout(loadResources, 800);
</script>
</body>
</html>
