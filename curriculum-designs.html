<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SomaHub Curriculum Designs - REAL AI + Notes + Video</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA93BNes3AmFyxIEgjSbvbIWqLyorLsuj8", authDomain: "somahubkenya-9e458.firebaseapp.com", projectId: "somahubkenya-9e458", storageBucket: "somahubkenya-9e458.firebasestorage.app", messagingSenderId: "615579085715", appId: "1:615579085715:web:28fca37ba498324bb49666" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.FB = { db, collection, getDocs };
</script>
<style>
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9}
.page{width:100%;max-width:480px;margin:0 auto;padding:10px;padding-bottom:100px;overflow-x:hidden}
.hero{width:100%;max-width:100%;overflow:hidden;background:linear-gradient(135deg,#0f766e,#0d9488 45%,#000 100%);border-radius:20px;color:#fff;padding:18px 14px}
.hero h1{font-size:23px;line-height:1.25;word-wrap:break-word}
.hero p{font-size:13.5px;line-height:1.5;word-wrap:break-word}
.search-box{width:100%;max-width:100%;background:#fff;border-radius:14px;display:flex;gap:6px;padding:6px;align-items:center;overflow:hidden}
.search-box input{flex:1 1 auto;min-width:0;width:0;border:0;outline:none;font-size:16px;padding:10px 6px}
.btn-search{flex:0 0 auto;background:#0d9488;color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;font-size:13px;line-height:1.2;white-space:nowrap}
.card{background:#fff;border-radius:14px;padding:13px;border:1px solid #e2e8f0;width:100%;overflow-wrap:anywhere}
.ai-box{background:#000;color:#fff;border-radius:12px;padding:13px;line-height:1.6;font-size:13.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.ai-box b{color:#5eead4}
.ai-key{color:#f87171;font-weight:900}
.ai-answer{color:#4ade80;font-weight:900}
.ai-note{color:#fb923c;font-weight:900}
select,input{font-family:inherit;max-width:100%}
.action-btn{border:0;border-radius:999px;padding:8px 13px;font-weight:800;font-size:12px;color:#fff;cursor:pointer;white-space:nowrap}
#reader{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.reader-top{flex:0 0 auto;background:#0f766e;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.reader-top b{font-size:14px;line-height:1.3}
.reader-page{flex:1;overflow-y:auto;padding:18px 16px;line-height:1.75;font-size:15px;color:#111;white-space:pre-wrap;overflow-wrap:anywhere}
.reader-bar{flex:0 0 auto;border-top:1px solid #e2e8f0;padding:10px;display:flex;gap:6px;align-items:center;background:#f8fafc}
.reader-bar button{flex:1;border:0;border-radius:999px;padding:11px 6px;font-weight:800;font-size:12px;color:#fff;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="page">
<div class="hero">
  <h1>📘 CBC Curriculum Designs<br>PP1-G9 - REAL AI Explains + Video</h1>
  <p>AI summarizes KICD design, searches word meaning by level PP1-G9 + comparison, YouTube video of strand, sets homework/exam FROM design</p>
  <div class="search-box mt-3">
    <input id="searchInput" placeholder="Search word or strand...">
    <button class="btn-search" onclick="searchNotes()">Search<br>Notes</button>
  </div>
  <div id="searchResult" class="card mt-3 text-gray-800"></div>
</div>

<!-- NO UPLOAD HERE - ONLY ADMIN UPLOADS IN admin.html -->

<div class="mt-3 space-y-3">
  <select id="gradeSel" class="w-full bg-white border rounded-xl p-3 text-[15px] outline-none" onchange="loadDesigns()">
    <option>PP1</option><option>PP2</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option selected>Grade 8</option><option>Grade 9</option>
  </select>
  <select id="subjectSel" class="w-full bg-white border rounded-xl p-3 text-[15px] outline-none" onchange="loadDesigns()">
    <option value="">All Subjects</option>
    <option>Agriculture and Nutrition</option><option>English</option><option>Kiswahili</option><option>Mathematics</option><option>Integrated Science</option><option>Social Studies</option><option>CRE</option><option>IRE</option><option>Creative Arts</option><option>Physical Education</option><option>Pre-Technical Studies</option>
  </select>
  <button class="w-full bg-[#0d9488] text-white font-black py-3 rounded-xl text-[15px]" onclick="loadDesigns()">📘 Show Designs</button>
</div>
<div id="designsList" class="mt-3 space-y-3"></div>
<div id="detailBox" class="mt-3"></div>
</div>

<!-- ORIGINAL READER - PAGE BY PAGE -->
<div id="reader" class="hidden">
  <div class="reader-top">
    <button onclick="closeReader()" style="background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:8px 12px;font-weight:800">← Back</button>
    <div style="flex:1;text-align:center"><b id="readerTitle">Grade 8 Agriculture</b><div id="readerMeta" style="font-size:11px;opacity:.85"></div></div>
    <button onclick="downloadOriginal()" style="background:#fff;color:#0f766e;border:0;border-radius:999px;padding:8px 12px;font-weight:800">⬇ Download</button>
  </div>
  <div id="readerPage" class="reader-page"></div>
  <div class="reader-bar">
    <button style="background:#64748b" onclick="prevPage()">← Prev</button>
    <span id="pageLabel" style="font-weight:900;font-size:12px;white-space:nowrap;padding:0 6px">Page 1 / 1</span>
    <button style="background:#0d9488" onclick="nextPage()">Next →</button>
    <button style="background:#263b99" onclick="printOriginal()">🖨 Print</button>
  </div>
  <div style="padding:10px;background:#f8fafc;border-top:1px solid #e2e8f0">
    <button onclick="closeReader()" style="width:100%;background:#dc2626;color:#fff;border:0;border-radius:999px;padding:12px;font-weight:900;font-size:14px">✕ Exit Reader</button>
  </div>
</div>

<script>
const PROXY = "/api/gemini";
let ALL = [];
let currentGrade = "Grade 8";
let CURRENT_FILE_TEXT = "";
let CURRENT_TOPIC = "";
let READER_PAGES = []; let READER_IDX = 0; let READER_TITLE = ""; let READER_META = "";

async function loadResources(){
  try{ let FB=window.FB; let s=await FB.getDocs(FB.collection(FB.db,'resources')); ALL=[]; s.forEach(d=>ALL.push({id:d.id,...d.data()})); }catch(e){ ALL=[]; }
  loadDesigns();
}
async function callAI(prompt, question){
  let res = await fetch(PROXY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, question: question||prompt, grade: currentGrade, task:"EN", history:[]})});
  let data={}; try{data=await res.json();}catch(e){}
  let txt = data.answer || data.text || data.reply || "";
  if(!txt) throw new Error(data.error||"AI busy");
  return txt;
}
function formatAI(text){
  let esc = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc = esc.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>"); esc = esc.replace(/\*(.*?)\*/g,"<i>$1</i>");
  esc = esc.replace(/^### (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  esc = esc.replace(/^## (.*)$/gm,"<div style='color:#5eead4;font-weight:900;margin:10px 0 4px'>$1</div>");
  let lines=esc.split("\n"); let out=""; let inList=false;
  lines.forEach(l=>{ let t=l.trim();
    if(/^(Key Point|Important|Note|Answer|Final Answer|Solution)[:：]/i.test(t)){ if(inList){out+="</ul>";inList=false;} let cls=/^(Answer|Final Answer|Solution)/i.test(t)?"ai-answer":/^(Note|Important)/i.test(t)?"ai-note":"ai-key"; out+=`<p><span class="${cls}">${l}</span></p>`; }
    else if(/^\d+\.\s/.test(l)){ out+=`<p><b>${l}</b></p>`; }
    else if(/^[-*]\s/.test(l)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${l.replace(/^[-*]\s/,"")}</li>`; }
    else { if(inList){out+="</ul>";inList=false;} if(t) out+=`<p>${l}</p>`; }
  }); if(inList) out+="</ul>"; return out;
}
function getAdminFileContext(question){
  if(!CURRENT_FILE_TEXT) return "";
  let qWords=(question||"").toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let chunks=[]; for(let i=0;i<CURRENT_FILE_TEXT.length;i+=1200) chunks.push(CURRENT_FILE_TEXT.slice(i,i+1200));
  let scored=chunks.map(c=>{let low=c.toLowerCase(); let s=0; qWords.forEach(w=>{if(low.includes(w)) s++;}); return {c,s};}).sort((a,b)=>b.s-a.s);
  return `\n\nADMIN FILE (Original Design): ${CURRENT_TOPIC}\nMost relevant pages:\n${scored.slice(0,4).map(x=>x.c).join("\n---\n")}\n`;
}
function splitIntoPages(text){
  if(!text) return ["No original file text saved for this design. Ask Admin to re-upload this design with full file."];
  if(text.includes("[PAGE ")){ let parts=text.split(/\[PAGE \d+\]/).map(s=>s.trim()).filter(Boolean); if(parts.length) return parts; }
  let pages=[]; for(let i=0;i<text.length;i+=1800) pages.push(text.slice(i,i+1800));
  return pages;
}
function openReader(title, meta, text){
  READER_TITLE=title; READER_META=meta; READER_PAGES=splitIntoPages(text||""); READER_IDX=0;
  document.getElementById("readerTitle").innerText=title;
  document.getElementById("readerMeta").innerText=meta;
  document.getElementById("reader").classList.remove("hidden");
  renderReaderPage(); window.scrollTo(0,0);
}
function renderReaderPage(){
  // If this is a Drive embed, don't overwrite it
  if(READER_META && READER_META.includes("Drive")) return;
  document.getElementById("readerPage").innerText=READER_PAGES[READER_IDX]||"";
  document.getElementById("pageLabel").innerText=`Page ${READER_IDX+1} / ${READER_PAGES.length}`;
  document.getElementById("readerPage").scrollTop=0;
}
function nextPage(){ if(READER_IDX<READER_PAGES.length-1){READER_IDX++; renderReaderPage();} }
function prevPage(){ if(READER_IDX>0){READER_IDX--; renderReaderPage();} }
function closeReader(){ document.getElementById("reader").classList.add("hidden"); document.getElementById("readerPage").innerHTML=""; }
function closeDetail(){ document.getElementById("detailBox").innerHTML=""; document.getElementById("detailBox").scrollIntoView({behavior:"smooth"}); }

// FIXED: Drive helpers - never treat Drive view page as PDF
function getDriveId(url){
  if(!url) return null;
  if(url.includes("/file/d/")) return url.split("/file/d/")[1].split("/")[0].split("?")[0];
  if(url.includes("id=")) return url.split("id=")[1].split("&")[0];
  if(url.includes("docs.google.com") && url.includes("/d/")) return url.split("/d/")[1].split("/")[0];
  return null;
}
function getDriveViewLink(url){
  let id = getDriveId(url);
  if(id) return "https://drive.google.com/file/d/" + id + "/view";
  return url;
}
function isDriveLink(url){ return !!getDriveId(url) && url.includes("drive.google.com") || (url && url.includes("docs.google.com")); }

function downloadOriginal(){
  let r = ALL.find(x=>x.title===READER_TITLE);
  if(r && (r.fileUrl || r.url || r.pdfUrl)){
    let link = r.fileUrl || r.url || r.pdfUrl;
    if(isDriveLink(link)){
      window.open(getDriveViewLink(link), "_blank");
      return;
    }
    window.open(link, "_blank");
    return;
  }
  let full=READER_PAGES.join("\n\n--- PAGE BREAK ---\n\n");
  let blob=new Blob([READER_TITLE+"\n"+READER_META+"\n\n"+full],{type:"text/plain"});
  let a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=READER_TITLE.replace(/[^a-z0-9]+/gi,"_")+".txt"; a.click();
}
function printOriginal(){
  let full=READER_PAGES.join("\n\n--- PAGE BREAK ---\n\n");
  let w=window.open("","_blank");
  w.document.write("<html><head><title>"+READER_TITLE+"</title></head><body style='font-family:sans-serif;padding:20px;line-height:1.7;white-space:pre-wrap'><h2>"+READER_TITLE+"</h2><p>"+READER_META+"</p><pre style='white-space:pre-wrap;font-family:sans-serif'>"+full.replace(/</g,"&lt;")+"</pre></body></html>");
  w.document.close(); w.print();
}
async function searchNotes(){
  let q=document.getElementById("searchInput").value.trim(); if(!q) return;
  currentGrade=document.getElementById("gradeSel").value; CURRENT_TOPIC=q;
  let box=document.getElementById("searchResult");
  let words=q.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  let matched=ALL.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")+" "+(r.fullText||"")).toLowerCase(); return r.grade==currentGrade && words.some(w=>hay.includes(w));});
  if(!matched.length) matched=ALL.filter(r=>{let hay=((r.title||"")+" "+(r.subject||"")+" "+(r.description||"")).toLowerCase(); return words.some(w=>hay.includes(w));}).slice(0,3);
  if(matched.length && matched[0].fullText){ CURRENT_FILE_TEXT = matched[0].fullText; }
  box.innerHTML=`<p class="font-black">🔍 "${q}" - ${matched.length} designs + AI meaning for ${currentGrade}</p><div class="ai-box mt-2">⏳ Thinking...</div>`;
  let designCtx=matched.length?matched.map((r,i)=>`${i+1}. ${r.title} | ${r.grade} ${r.subject} | ${(r.fullText||r.description||'').slice(0,1500)}`).join("\n"):"No exact design - use CBC/KICD.";
  let fileCtx=getAdminFileContext(q);
  let prompt=`You are SomaHub CBC Tutor for ${currentGrade}. Topic: ${q}\nDesigns (Admin files):\n${designCtx}\n${fileCtx}\nTASK: 1. Meaning, 2. Compare PP1, Grade 4, Grade 7, Grade 9, 3. 3 Key Points, 4. 1 Kenya example. Use **bold**. Never mention missing resources.`;
  try{ let ai=await callAI(prompt,q); let videoQ=encodeURIComponent(q+" "+currentGrade+" CBC Kenya lesson"); box.innerHTML=`<p class="font-black">🔍 "${q}" - ${matched.length} designs</p>${matched.map(r=>`<div class="mt-2 text-[13px]"><b>${r.title}</b> • ${r.grade} ${r.subject} <button class="action-btn bg-[#0d9488] ml-1" onclick="openDesign('${r.id}')">Open</button></div>`).join("")}<div class="ai-box mt-3">${formatAI(ai)}</div><div class="flex gap-2 mt-3 flex-wrap"><a target="_blank" href="https://www.youtube.com/results?search_query=${videoQ}" class="action-btn bg-red-600 no-underline">▶ Watch Video</a><button class="action-btn bg-orange-500" onclick="makeHomework('${q.replace(/'/g,"")}')">Set Homework</button><button class="action-btn bg-[#263b99]" onclick="makeExam('${q.replace(/'/g,"")}')">Set Exam</button></div>`; }catch(e){ box.innerHTML=`<div class="ai-box">AI busy: ${e.message}</div>`; }
}
function loadDesigns(){
  currentGrade=document.getElementById("gradeSel").value;
  let subj=document.getElementById("subjectSel").value;
  let list=ALL.filter(r=>r.grade==currentGrade && (!subj || r.subject==subj));
  let box=document.getElementById("designsList");
  if(!list.length){ box.innerHTML=`<div class="card text-center text-gray-500 text-[13px]">No saved designs for ${currentGrade} ${subj||''} yet.<br>Use Search Notes above - AI will generate from CBC / KICD.</div>`; return; }
  box.innerHTML=list.map(r=>`<div class="card"><p class="font-black text-[15px]">${r.title}</p><p class="text-[12px] text-gray-500">${r.grade} • ${r.subject} • ${r.type||'Design'}</p><p class="text-[13px] mt-1">${(r.description||'').slice(0,180)}</p><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#0d9488]" onclick="openOriginalDesign('${r.id}')">📖 Read Original</button><button class="action-btn bg-[#263b99]" onclick="openDesign('${r.id}')">🤖 AI Explains</button></div></div>`).join("");
}
async function openOriginalDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  CURRENT_FILE_TEXT = r.fullText || r.text || r.content || "";
  CURRENT_TOPIC = r.title;
  let fileUrl = r.fileUrl || r.url || r.pdfUrl || r.link || "";

  // 1. FILE uploaded in Admin - show pages inside SomaHub
  if(CURRENT_FILE_TEXT && CURRENT_FILE_TEXT.length > 100){
    openReader(r.title, `${r.grade} • ${r.subject} • Original Design (Not AI)`, CURRENT_FILE_TEXT);
    return;
  }

  // 2. DRIVE LINK ONLY - Show Drive PDF INSIDE SomaHub with iframe, do NOT fetch as PDF
  if(fileUrl && isDriveLink(fileUrl)){
    let id = getDriveId(fileUrl);
    let view = getDriveViewLink(fileUrl);
    let preview = "https://drive.google.com/file/d/" + id + "/preview";
    openReader(r.title, `${r.grade} • ${r.subject} • Original PDF from Drive`, `Loading Drive PDF inside SomaHub... If it does not load, tap Download at top.\n\nLink: ${view}`);
    setTimeout(()=>{
      document.getElementById("readerPage").innerHTML = `
        <div style="text-align:center;margin-bottom:10px">
          <a href="${view}" target="_blank" style="display:inline-block;background:#0d9488;color:#fff;padding:12px 20px;border-radius:999px;font-weight:900;text-decoration:none">📖 Open in Drive / Download</a>
          <p style="font-size:12px;color:#666;margin-top:8px">If PDF is private, make it: Drive > Share > Anyone with link can view</p>
        </div>
        <iframe src="${preview}" style="width:100%;height:70vh;border:1px solid #e2e8f0;border-radius:12px" allow="autoplay"></iframe>
      `;
      document.getElementById("pageLabel").innerText = `Drive PDF • Tap Download to open full`;
    }, 100);
    return;
  }

  // 3. DIRECT PDF link (ends with .pdf or not Drive) - try to fetch, check it is really PDF
  if(fileUrl && (fileUrl.toLowerCase().endsWith(".pdf") || fileUrl.includes(".pdf") || fileUrl.includes("uc?export"))){
    openReader(r.title, `${r.grade} • ${r.subject} • Loading original PDF...`, "⏳ Loading original PDF from Admin file... Please wait...");
    try{
      let buf = await fetch(fileUrl).then(res=>res.arrayBuffer());
      let head = new TextDecoder().decode(buf.slice(0,5));
      if(head !== "%PDF-"){
        throw new Error("This link is not a direct PDF. It is a Drive view page. Tap Download to open in Drive instead.");
      }
      let pdf = await pdfjsLib.getDocument({data:buf}).promise;
      let all = "";
      for(let i=1;i<=pdf.numPages;i++){
        let page = await pdf.getPage(i);
        let tc = await page.getTextContent();
        all += `\n[PAGE ${i}]\n` + tc.items.map(it=>it.str).join(" ");
      }
      CURRENT_FILE_TEXT = all;
      openReader(r.title, `${r.grade} • ${r.subject} • Original Design - ${pdf.numPages} pages (Not AI)`, all);
      return;
    }catch(e){
      openReader(r.title, `${r.grade} • ${r.subject}`, `Could not read PDF inside SomaHub.\n\nReason: ${e.message}\n\n✅ SOLUTION: Tap ⬇ Download at top - it will open the PDF in Drive / Browser.\n\nFile link: ${fileUrl}`);
      return;
    }
  }

  // 4. YouTube or other link
  if(fileUrl){
    openReader(r.title, `${r.grade} • ${r.subject} • Link`, `This design is saved as a link.\n\n✅ Tap ⬇ Download at top to open it.\n\nLink: ${fileUrl}`);
    return;
  }

  // 5. Truly blank
  openReader(r.title, `${r.grade} • ${r.subject} • Original Design (Not AI)`, `⚠️ This design is BLANK in the database.\n\nAdmin only saved:\nTitle: ${r.title}\nDescription: ${r.description||''}\n\nNo file text, no PDF link was saved.\n\nFIX: Admin must re-upload ${r.title} PDF in admin.html with fullText code. After re-upload, this page will show all pages.`);
}
async function openDesign(id){
  let r=ALL.find(x=>x.id==id); if(!r) return;
  currentGrade=r.grade||currentGrade; CURRENT_FILE_TEXT=r.fullText||""; CURRENT_TOPIC=r.title;
  let box=document.getElementById("detailBox");
  box.innerHTML=`<div class="card"><h3 class="font-black">${r.title}</h3><p class="text-[12px] text-gray-500">${r.grade} • ${r.subject}</p><p class="text-[14px] mt-2">${r.description||''}</p><div class="ai-box mt-3">⏳ AI Explains...</div><div class="flex gap-2 mt-3 flex-wrap"><button class="action-btn bg-[#0d9488]" onclick="openOriginalDesign('${r.id}')">📖 Read Original Instead</button><button class="action-btn bg-red-600" onclick="closeDetail()">✕ Exit</button></div></div>`;
  box.scrollIntoView({behavior:"smooth"});
  try{ let prompt=`You are SomaHub CBC Tutor for ${r.grade}. Design: ${r.title}, ${r.subject}, ${(r.fullText||r.description||'').slice(0,4000)}\nTASK: Summarize. Give Meaning, Key Points, Activities, Assessment. Use **bold**.`; let ai=await callAI(prompt,r.title); box.querySelector(".ai-box").innerHTML=formatAI(ai); }catch(e){ box.querySelector(".ai-box").innerHTML="AI busy, try again."; }
}
async function makeHomework(topic){ let box=document.getElementById("searchResult"); box.innerHTML+=`<div class="ai-box mt-2">⏳ Setting homework...</div>`; try{ let ai=await callAI(`Set Homework for ${currentGrade} on ${topic}. ${getAdminFileContext(topic)} 5 questions easy to hard, 1 Kenya example, Answers at end. Use **bold**.`,topic); box.innerHTML+=`<div class="ai-box mt-2">${formatAI(ai)}</div>`; }catch(e){} }
async function makeExam(topic){ let box=document.getElementById("searchResult"); box.innerHTML+=`<div class="ai-box mt-2">⏳ Setting exam...</div>`; try{ let ai=await callAI(`Set Exam for ${currentGrade} on ${topic}. ${getAdminFileContext(topic)} 10 questions: 5 MCQ, 3 Short, 2 Structured. Marking Scheme at end. Use **bold**.`,topic); box.innerHTML+=`<div class="ai-box mt-2">${formatAI(ai)}</div>`; }catch(e){} }
setTimeout(loadResources, 800);
</script>
</body>
</html>
